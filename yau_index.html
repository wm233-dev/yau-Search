xj, t) at the grid point x = xj = j∆x, with ∆x = 1\nN .\n(a) Prove the following L2 stability of the scheme\n(4)\nd\ndtE(t) ≤0\nwhere E(t) = PN\nj=1 |uj|2∆x.\n(b) Do you believe (4) is true for E(t) = PN\nj=1 |uj|2p∆x for arbitrary integer p ≥1?\nIf yes, prove the result. If not, give a counterexample."}, {"year": "2017", "subject": "Geometry & Topology", "paper": "2017_geometry2017_individual", "kind": "individual", "n": 1, "chars": 165, "tags": ["代数拓扑", "微分流形/形式"], "d": 1.43, "text": "Let M be a smooth, compact, oriented n-dimensional manifold. Suppose that the\nEuler characteristic of M is zero. Show that M admits a nowhere vanishing vector\nfield."}, {"year": "2017", "subject": "Geometry & Topology", "paper": "2017_geometry2017_individual", "kind": "individual", "n": 2, "chars": 259, "tags": ["范畴/同调代数", "代数拓扑"], "d": 1.69, "text": "Let S2\nq1\n←−S2 ∨S2\nq2\n−→S2 be the maps that crush out one of the two summands. Let\nf : S2 →S2 ∨S2 be a map such that qi ◦f : S2 →S2 is a map of degree di. Compute\nthe integral homology groups of (S2 ∨S2) ∪f D3. Here D3 is the unit solid ball with\nboundary S2."}, {"year": "2017", "subject": "Geometry & Topology", "paper": "2017_geometry2017_individual", "kind": "individual", "n": 3, "chars": 125, "tags": ["微分流形/形式"], "d": 1.14, "text": "Let X and Y be smooth vector fields on a smooth manifold. Prove that the Lie\nderivative satisfies the identity\nLXY = [X, Y ]."}, {"year": "2017", "subject": "Geometry & Topology", "paper": "2017_geometry2017_individual", "kind": "individual", "n": 4, "chars": 116, "tags": ["微分几何", "辛几何/力学"], "d": 1.38, "text": "State and prove the Liouville formula for the geodesic curvature κg along a regular\ncurve on a smooth surface in R3."}, {"year": "2017", "subject": "Geometry & Topology", "paper": "2017_geometry2017_individual", "kind": "individual", "n": 5, "chars": 162, "tags": ["微分几何", "微分流形/形式"], "d": 1.53, "text": "On a Riemannian manifold, let F be the set of smooth functions f on M with\n|gradf| ≤1. For any x, y in the manifold, show that\nd(x, y) = sup{|f(x) −f(y)| : f ∈F}."}, {"year": "2017", "subject": "Geometry & Topology", "paper": "2017_geometry2017_individual", "kind": "individual", "n": 6, "chars": 214, "tags": ["微分几何", "微分流形/形式"], "d": 1.5, "text": "Let M be an n-dimensional oriented closed minimal submanifold in an (n + p)-\ndimensional unit sphere Sn+p. Denote by KM the sectional curvature of M. Prove\nthat if KM > p −1\n2p −1 , then M is the great sphere Sn.\n1"}, {"year": "2017", "subject": "Probability & Statistics", "paper": "2017_probability2017_individual", "kind": "individual", "n": 1, "chars": 301, "tags": [], "d": 1.34, "text": ". A box contains 750 red balls and 250 blue balls. Repeatedly pick a ball\nuniformly at random from the box and remove it until all remaining balls have a single\ncolor. (Note: no replacement).\nPlease find integer m such that the expectation value for the total number of the\nremaining balls ∈[m, m + 1]"}, {"year": "2017", "subject": "Probability & Statistics", "paper": "2017_probability2017_individual", "kind": "individual", "n": 2, "chars": 634, "tags": [], "d": 1.87, "text": ". Suppose a number X0 ∈{1, −1} at the root of a binary tree\nis propagated away from the root as follows. The root is the node at level 0. After\nobtaining the 2h numbers at the nodes at level h, each number at level h+1 is obtained\nfrom the number adjacent to it (at level h) by flipping its sign with probability p ∈\n(0, 1/2) independently.\nLet Xh be the average of the 2h values received at the nodes at level h. Define the\nsignal-to-noise ratio at level h to be\nRh :=\n E[Xh | X0 = 1] −E[Xh | X0 = −1]\n\u00012\nV ar[Xh|X0 = 1]\n.\nFind the threshold number pc such that Rh converges to 0 if p ∈(pc , 1/2) and diverges\nif p ∈(0, pc), as h →∞."}, {"year": "2017", "subject": "Probability & Statistics", "paper": "2017_probability2017_individual", "kind": "individual", "n": 3, "chars": 503, "tags": [], "d": 1.62, "text": ". Consider the space representing an infinite sequence of coin flips, namely\nΩ:= {H, T}∞, (H: head, T: tail) with the associated σ-field F generated by finite\ndimensional rectangles. For 0 ≤p ≤1, denote by Pp the probability measure on (Ω, F)\ncorresponding to flipping a coin an infinite number of times with probability of H being\np and probability of T being q = 1 −p at each flip.\nShow that for each p ∈[0, 1], there exists Ap such that\nPp(Ap) > 1/2\n1\n\n \nand for any p′ ̸= p, p′ ∈[0, 1]\nPp′(Ap) < 1/2"}, {"year": "2017", "subject": "Probability & Statistics", "paper": "2017_probability2017_individual", "kind": "individual", "n": 4, "chars": 597, "tags": [], "d": 1.96, "text": ". Let G := G(n, p) be a random graph with n vertices where each possible\nedge has probability p of existing. The existence of the edges are independent to each\nother. With G, we say A ⊂{1, 2, · · · , n} is a fully connected set if and only if\ni, j ∈A =⇒i −th and j −th vertices are (directly) connected with an edge in G\nDefine T as the size of the largest fully connected set\nT := max{|A| : A is a fully connected set}\nLet's fix p ∈(0, 1), please prove that\nlim\nn→∞P\n \nT\n2 log 1\np n ≤1 + ϵ\n!\n= 1,\n∀ϵ > 0,\nand\nlim\nn→∞P\n\n\nT\nq\n2 log 1\np n\n≥1 −ϵ\n\n= 1,\n∀ϵ > 0,\nHint:\nP (T = n) = p(n\n2) = pn(n−1)/2"}, {"year": "2017", "subject": "Probability & Statistics", "paper": "2017_probability2017_individual", "kind": "individual", "n": 5, "chars": 451, "tags": [], "d": 2.16, "text": ". Consider a population of constant size N + 1 that is suffering from an\ninfectious disease. We can model that spread of the disease as Markov process. Let\nX(t) be the number of healthy individuals at time t and suppose that X(0) = N. We\nassume that if X(t)\nlim\nh→0\n1\nhP (X(t + h) = n −1|X(t) = n)) = λn (N + 1 −n)\nFor 0 ≤s ≤1, 0 ≤t, define\nG(s, t) := E(sX(t))\nPlease find a non-trivial partial differential equation for G(s, t), which involves ∂tG.\n2"}, {"year": "2018", "subject": "Analysis & PDE", "paper": "2018_2018_team", "kind": "team", "n": 1, "chars": 155, "tags": ["实分析/测度"], "d": 1.22, "text": "Suppose {fn}∞\nn=1 ∈L2(R) is a sequence that converges to 0 in the L2 norm .\nProve that there exists a subsequence {fnk} such that fnk →0 almost everywhere."}, {"year": "2018", "subject": "Analysis & PDE", "paper": "2018_2018_team", "kind": "team", "n": 2, "chars": 169, "tags": ["Fourier/变换"], "d": 1.27, "text": "Let ˆf(ξ) =\nR\ne−ixξf(x)dx be the Fourier transform on Schwartz function f ∈S(R).\nSuppose f ∈S(R) satisfies f(2πn) = 0 and ˆf(n) = 0 for all integers n. Prove that\nf = 0."}, {"year": "2018", "subject": "Analysis & PDE", "paper": "2018_2018_team", "kind": "team", "n": 3, "chars": 116, "tags": [], "d": 1.26, "text": "If f is integrable on Rd, then\nlim\nm(B)→0,x∈B\n1\nm(B)\nZ\nB\nf(y)dy = f(x),\nfor a.e. x, B is an open ball centered at x."}, {"year": "2018", "subject": "Analysis & PDE", "paper": "2018_2018_team", "kind": "team", "n": 4, "chars": 363, "tags": ["经典场论/相对论"], "d": 1.43, "text": "Let C[0, 1] = {f : [0, 1] →R| f is continuous} be the space of continuous function\non [0, 1]. Let ρ(f, g) =\nR 1\n0 |f(x) −g(x)|dx be a metric on [0, 1].\nShow that (C[0, 1], ρ) is not a complete metric vector space.\nConstruct a complete metric vector space (W, eρ) such that i : (C[0, 1], ρ) ,→(W, eρ)\nis an isometric embedding such that eρ|C[0,1] = ρ, C[0, 1] = W."}, {"year": "2018", "subject": "Analysis & PDE", "paper": "2018_2018_team", "kind": "team", "n": 5, "chars": 619, "tags": ["复分析", "调和/位势"], "d": 2.07, "text": "Let Ωbe a simply connected domain in C. Consider a point z0 ∈Ωand solve the\nDirichlet problem in Ωwith the boundary values log |ζ−z0|. The solution is denoted by\nG(z, z0) and let g(z, z0) = G(z, z0) −log |z −z0|. Let w = f(z) : Ω→D1 = {z||z| < 1}\nbe the one to one surjective conformal mapping with f(z0) = 0. Show that\n1) g(z, z0) = −log |f(z)|.\n2) g(z, z0) = g(z0, z). (Hint: Let g(z, z1) = g1, g(z, z2) = g2, calculate the integral\ng1 ∗dg2 −g2 ∗dg1 over the cycle ∂Ω−c1 −c2, where c1, c2 are small circles around\nz1, z2, du = uxdx + uydy, ∗du = −uydx + uxdy.)\n1\n\n \nS.-T. Yau College Student Mathematics Contests 2018"}, {"year": "2018", "subject": "Probability & Statistics", "paper": "2018_2018_team", "kind": "team", "n": 1, "chars": 414, "tags": ["概率论"], "d": 2.62, "text": ". Let Xi, 1 ≤i ≤N be i.i.d. random variables. Here X1 is uniformly\ndistributed on [0, 1]. We reorder them as\ne\nX1 ≤e\nX2 ≤· · · e\nXN\na) Let N = 2m −1, and Y = e\nXm, please find the A and B such that\nY −A\nN B\nhas nontrivial distribution, and please find this distribution.\nb) Let N = 2m, and Y = e\nXm −e\nXm−1, please find the A and B such that\nY −A\nN B\nhas nontrivial distribution, and please find this distribution."}, {"year": "2018", "subject": "Probability & Statistics", "paper": "2018_2018_team", "kind": "team", "n": 2, "chars": 502, "tags": ["概率论", "经典场论/相对论"], "d": 1.88, "text": ". Let X = (Z2)N, i.e., X = (X1, X2 · · · , XN · · · ), Xi ∈(0, 1). It can be\nconsidered as countable lightbulbs. 0 means off, 1 means on. We start with X0 =\n0. Keep generating independent geometric random variables, whose distribution are\ngeom(1/2). Denote them as K1, K2 · · · . Now let Xm (for m ≥1) be as follows\n(Xm −Xm−1)k = 1(k = Km),\nZ2\ni.e, in the m −th turn, we only change the status of the Km−th light bulb. Then what\nis the probability of all lights being offagain, i.e.,\nP (∃m > 1,\nXm = 0)"}, {"year": "2018", "subject": "Probability & Statistics", "paper": "2018_2018_team", "kind": "team", "n": 3, "chars": 513, "tags": [], "d": 2.62, "text": ". Let x1, x2, . . . , xn be d-dimensional vectors of real numbers with n suffi-\nciently large but the exact value is not of importance.\nA function of µ is defined to be\nℓ(µ) = sup{\nn\nX\ni=1\nlog pi :\nn\nX\ni=1\npixi = µ;\nn\nX\ni=1\npi = 1, p1 > 0, . . . , pn > 0}\non the space of the interior of the convex hull of x1, . . . , xn.\n(a) Show that this is a concave function of µ on the convex hull.\n(b) Let ¯x = n−1 Pn\ni=1 xi. Let a be a vector of length d. Prove that ℓ(¯x + ta) is a\ndecreasing function of t when t > 0.\n1"}, {"year": "2018", "subject": "Probability & Statistics", "paper": "2018_2018_team", "kind": "team", "n": 4, "chars": 719, "tags": ["概率论", "数理统计"], "d": 2.09, "text": ". Consider the histogram estimator, defined as follows. We observe iid\nrandom variables X1, . . . , Xn, taking values in [0, 1] according to the distribution with\nPDF f (assuming it is sufficiently smooth). Define bins\nB1 =\n·\n0, 1\nm\n¶\n, B2 =\n· 1\nm, 2\nm\n¶\n, . . . , Bm =\n·m −1\nm\n, 1\n¸\nLet h = 1/m, vj be the number of observations in bin Bj, and define ˆpj = vj/n and\npj =\nR\nBj f(u)du. Then the histogram estimator of the density f is\nˆfn(x) =\nm\nX\nj=1\nˆpj\nh I{x ∈Bj}\n1. Find the (exact) mean and variance of ˆfn(x).\n2. Explain why increasing the number of bins decreases the bias of ˆfn(x).\n3. If our goal is to minimize the mean-squared error\nMSE = E\n·Z\n(f(x) −ˆfn(x))2dx\n¸\n,\nplease give some advice on how to choose m."}, {"year": "2018", "subject": "Probability & Statistics", "paper": "2018_2018_team", "kind": "team", "n": 5, "chars": 632, "tags": ["数理统计"], "d": 1.61, "text": ". Let Xi ∼N(θi, 1) independently for i = 1, . . . , k. We are interested in\nestimating τ = θ2\n1 + · · · + θ2\nk given observations X1, . . . , Xk.\n1. A possible estimator of τ is ˜τ = Pk\ni=1 X2\ni −k. Show that it is unbiased and\ncompute its sampling variance.\n2. Now assume the proper prior θi ∼N(0, A), independently for i = 1, . . . , k and\na given A > 0. Since A is unknown, please provide an estimator ˆA of A and\nalso derive the empirical Bayes estimator of τ, denoted as ˆτB. (Hint: ˆτB = E(τ |\nX1, . . . , Xk, ˆA)).\n3. How do you compare the two estimators, ˜τ and ˆτB?\n2\n\n \nS.-T. Yau College Student Mathematics Contests 2018"}, {"year": "2018", "subject": "Geometry & Topology", "paper": "2018_2018_team", "kind": "team", "n": 1, "chars": 179, "tags": [], "d": 1.28, "text": "Let X be (S2 × S2) ∪S2 D3, where we attach the 3-disk via the map\nS2 →S2 ∨S2\nwhich crushes a great circle connecting the north and south poles. Compute the ho-\nmology groups of X."}, {"year": "2018", "subject": "Geometry & Topology", "paper": "2018_2018_team", "kind": "team", "n": 2, "chars": 202, "tags": ["群论", "代数拓扑"], "d": 2.49, "text": "(a) Let A be a single circle in R3. Compute the fundamental group π1(R3 −A).\n(b) Let A and B be disjoint circles in R3, supported in the upper and lower half\nspace, respectively. Compute π1(R3 −(A ∪B))."}, {"year": "2018", "subject": "Geometry & Topology", "paper": "2018_2018_team", "kind": "team", "n": 3, "chars": 151, "tags": [], "d": 1.2, "text": "Consider the differential 1-form ω = xdy −ydx+dz in R3 with coordinates (x, y, z).\nProve that fω is not closed for any nowhere zero function f : R3 →R."}, {"year": "2018", "subject": "Geometry & Topology", "paper": "2018_2018_team", "kind": "team", "n": 4, "chars": 93, "tags": ["微分流形/形式"], "d": 1.11, "text": "Show that\nQn := {(x1, · · · , xn+1) ∈Rn+1;\nn+1\nX\ni=1\n(xi)4 = 1}\nis a differentiable manifold."}, {"year": "2018", "subject": "Geometry & Topology", "paper": "2018_2018_team", "kind": "team", "n": 5, "chars": 161, "tags": ["微分几何"], "d": 1.23, "text": "Let M be a closed surface in R3. Prove that\nZ\nM\n|K|dσ ≥4π(1 + g),\nwhere K, g and dσ is the Gaussian curvature, the genus and the area element of M,\nrespectively."}, {"year": "2018", "subject": "Geometry & Topology", "paper": "2018_2018_team", "kind": "team", "n": 6, "chars": 221, "tags": ["微分几何", "微分流形/形式"], "d": 1.49, "text": "Let M be an n-dimensional compact and simply connnected Riemannian manifold.\nIf the sectional curvature KM of M satisfies\n1\n4 < KM ≤1,\nthen M is homeomorphic to Sn.\n1\n\n \nS.-T. Yau College Student Mathematics Contests 2018"}, {"year": "2018", "subject": "Algebra & Number Theory", "paper": "2018_2018_team", "kind": "team", "n": 1, "chars": 433, "tags": ["环与模"], "d": 2.56, "text": "(20 points). Recall that a ring E is said to be local if for every u ∈E,\nat least one of the elements u and 1 −u is invertible. Let R be a ring and let M be\nan R-module.\n(a) (8 points) Show that if EndR(M) is a local ring, then M is indecomposable.\n(b) (12 points) Assume M indecomposable and of finite length. Prove the Fitting\nlemma: Every endomorphism u of M is either invertible or nilpotent. Deduce\nthat EndR(M) is a local ring."}, {"year": "2018", "subject": "Algebra & Number Theory", "paper": "2018_2018_team", "kind": "team", "n": 2, "chars": 514, "tags": ["数论"], "d": 3.41, "text": "(20 points).\n(a) (6 points) Let n ≥2 be an integer. Show that there exists an integer m with\n1 ≤m ≤n −1 such that the binomial coefficient\n\u0010n\nm\n\u0011\nsatisfies\n\u0010n\nm\n\u0011\n≥2n/n.\n(b) (6 points) Let 0 ≤m ≤n be integers with n ≥1. Show that for every prime\nnumber p,\nvp\n n\nm\n!!\n≤logp(n)\nHere vp is the p-adic valuation: vp(pab) = a for integers b prime to p and a ≥0.\n(c) (8 points) Let n ≥2 be an integer and let π(n) denote the number of prime\nnumbers p ≤n. Deduce the following inequality of Chebyshev:\nπ(n) ≥\nn\nlog2 n −1."}, {"year": "2018", "subject": "Algebra & Number Theory", "paper": "2018_2018_team", "kind": "team", "n": 3, "chars": 598, "tags": ["Galois/域扩张", "群论", "表示论", "数论", "复分析"], "d": 3.85, "text": "(20 points). Let n ≥1 be an integer and let Φn(X) ∈Q[X] denote the\nn-th cyclotomic polynomial, i.e.\nΦn(X) :=\nY\nξ\n(X −ξ),\nwhere ξ runs through primitive n-th roots of unity in C. Recall that Xn −1 =\nQ\nd|n Φd(X) and Φn(X) belongs to Z[X]. Let p be a prime number such that p ∤n.\nDenote by Φn the residue class of Φn in Fp[X]. Prove the following statements:\n(a) (8 points) The roots of Φn = 0 in the algebraic closure Fp of Fp are exactly\nthe primitive n-th roots of 1 in Fp.\n(b) (12 points) Φn is irreducible in Fp[X] if and only if (Z/nZ)× is a cyclic group\ngenerated by the class of p.\nPage 1 of 2"}, {"year": "2018", "subject": "Algebra & Number Theory", "paper": "2018_2018_team", "kind": "team", "n": 4, "chars": 519, "tags": ["Galois/域扩张", "群论", "表示论", "经典场论/相对论"], "d": 3.48, "text": "(20 points). Let G be a finite group. Let V be a finite-dimensional\ncomplex representation of G and let χ: V →C be the associated character.\n(a) (8 points) Show that there exists a subfield L ⊆C containing the image of χ\nsuch that L/Q is a finite Galois extension. Show moreover that\nB(χ) =\nY\nσ∈Gal(L/Q)\nY\ng∈G\nσ(χ(g))\nbelongs to Z.\n(b) (12 points) Suppose that χ is irreducible and dim(V ) ≥2. Show that there\nexists g ∈G with χ(g) = 0. (Hint. One may apply the inequality of arithmetic\nand geometric means to |B(χ)|2.)"}, {"year": "2018", "subject": "Algebra & Number Theory", "paper": "2018_2018_team", "kind": "team", "n": 5, "chars": 818, "tags": [], "d": 3.36, "text": "(20 points). Let F be a field, V an F-vector space of dimension d and\nW ⊆V a subspace. Let f : W →V be an F-linear map. Assume that the only\nsubspace W ′ ⊆W such that f(W ′) ⊆W ′ is {0}.\n(a) (6 points) Let v ∈V be a non-zero vector. Show that there exists a unique\ninteger k(v) ≥0 such that v, f(v), f 2(v), . . . , f k(v)−1(v) ∈W but f k(v)(v) /∈W.\nShow moreover that v, f(v), . . . , f k(v)(v) are linearly independent over F.\n(b) (14 points) Prove that given λ1, . . . , λd ∈F, there exists an F-linear extension\nof f to ˜f : V →V such that the characteristic polynomial of ˜f is\nQd\ni=1(λ−λi).\n(Hint. You may first treat the special case V =\nLk(v)\ni=0 Ff i(v). For the general\ncase, consider the subset Wn ⊆V of vectors v ∈V with k(v) ≥n or v = 0.)\nPage 2 of 2\n\n \nS.-T. Yau College Student Mathematics Contests 2018"}, {"year": "2018", "subject": "Computational & Applied", "paper": "2018_2018_team", "kind": "team", "n": 1, "chars": 492, "tags": [], "d": 1.72, "text": "Let H be a bipartite graph with the bipartition V = V1 ∪V2, where |V1| = |V2| = n.\nWe say that H satisfies the (p, q)-condition if (i) for all subsets I ⊆V1 of cardinality at\nmost p, the inequality |I| ≤|N(I)| holds, and (ii) for all subsets J ⊆V2 of cardinality\nat most q, the inequality |J| ≤|N(J)| holds. Note that the (n, 0)-condition is Hall's\noriginal condition in his marriage theorem.\nProve that if H satisfies the (p, q)-condition with n ≤p + q, then H contains a\nmatching of size n."}, {"year": "2018", "subject": "Computational & Applied", "paper": "2018_2018_team", "kind": "team", "n": 2, "chars": 1573, "tags": ["线性代数/矩阵"], "d": 4.96, "text": "Let Cn be the n dimensional hypercube, i.e., the graph whose vertex set V is {0, 1}n,\nand whose edges are defined by: two vertices u = u1u2 . . . un and v = v1v2 . . . vn are\nadjacent iffui ̸= vi for exactly one i ∈[n]. Let R[V ] be the vector space of all the\nfunctions f : V →R. The space R[V ] has a natural inner product. For f, g ∈R[V ],\n< f, g >=\nX\nu∈{0,1}n\nf(u)g(u).\nThe standard basis of R[V ] is the set {fu : u ∈{0, 1}n} where fu(v) = δu,v, the\nKronecker delta, for u, v ∈{0, 1}n. Denote by B1 the standard basis.\n(1) For any two vertices u, v ∈{0, 1}n, u · v is defined to be P\ni uivi. For each\nu ∈{0, 1}n, define a function χu ∈R[V ] by letting\nχu(v) = (−1)u·v.\nProve that the set {χu : u ∈{0, 1}n} is orthogonal with respect to the inner\nproduct of R[V ], i.e.,\n< χu, χv >= δu,v2n,\nfor all u, v ∈{0, 1}n.\n(2) Prove that the set {χu : u ∈{0, 1}n} forms a basis of the vector space R[V ].\nDenoted by B2 this basis.\n(3) For 1 ≤i ≤n, let ei = (0, . . . , 0, 1, 0, . . . , 0) ∈{0, 1}n where the only 1 occurs\nin position i. Let S = {e1, e2, . . . , en}.\nDefine a linear transformation Φ : R[V ] →R[V ] as follows. For f ∈R[V ],\nΦf is the element in R[V ] which is given by\n(Φf)(v) =\nX\nei∈S\nf(v + ei)\nwhere v + ei is the usual vector addition modulo 2.\nProve that the matrix of Φ with respect to the standard basis B1 is just\nA(Cn), the adjacency matrix of the hypercube Cn.\n1\n\n \n2\n(4) Prove that Φχu = λuχu for each u ∈{0, 1}n, where\nλu =\nX\ne∈S\n(−1)u·e = n −2|u|,\nwhere |u| is the number of 1's in u = u1u2 . . . un.\n(5) Compute the eigenvalues of the matrix A(Cn)."}, {"year": "2018", "subject": "Computational & Applied", "paper": "2018_2018_team", "kind": "team", "n": 3, "chars": 578, "tags": ["线性代数/矩阵", "范畴/同调代数"], "d": 3.78, "text": "Let A ∈Rn×n, and assume that there are unitary matrix Q and diagonal matrix\nD = diag(λ1, · · · , λn) such that A = QDQ∗. Let Ek be the space spanned by the first\nk columns of Q. We let\nbP =\nµ\nIk\n0\n¶\n,\nP = Q bPQ∗\nwhere Ik is the k × k identity matrix.\n(1) Show that P is an orthogonal projection onto Ek.\n(2) Assume that\n|λ1| ≥· · · ≥|λk| > |λk+1| ≥· · · ≥|λn|.\nLet X(0) ∈Rn×k and assume PX(0) is injective. We define the iterations\nX(m+1) = AX(m).\nShow that there is a matrix Λ ∈Rk×k such that\n∥(AX(m) −X(m)Λ)y∥\n∥PX(m)y∥\n≤\n³|λk+1|\n|λk|\n´m∥(AX(0) −X(0)Λ)y∥\n∥PX(0)y∥\n,\n∀y ∈Rk\\{0}."}, {"year": "2018", "subject": "Computational & Applied", "paper": "2018_2018_team", "kind": "team", "n": 4, "chars": 669, "tags": ["代数几何"], "d": 2.75, "text": "For the one-way equation\n(1)\nut + aux = f,\nconsider the multistep scheme given by\n(2)\n3un+1\nm\n−4un\nm + un−1\nm\n2k\n+ aun+1\nm+1 −un+1\nm−1\n2h\n= f n+1\nm\n.\n(1) Show that the scheme is second order accurate.\n(2) Show that the scheme is unconditionally stable.\n(Hint: (i) apply von Neumann analysis to the scheme with f ≡0 and find\nthe characteristic polynomial.\n(ii) show that for all k, h, the characteristic\npolynomial satisfies the root condition: all roots reside in the unit disk, and\nall roots on the unit circle are simple. (iii) for a root r of the characteristic\npolynomial, it would be more convenient to study the form 1\nr = X + iY and\nprove that X2 + Y 2 ≥1.)\n\n \n3"}, {"year": "2018", "subject": "Computational & Applied", "paper": "2018_2018_team", "kind": "team", "n": 5, "chars": 1768, "tags": ["优化/线性规划"], "d": 4.83, "text": "For a convex function f : D →R, where D ⊆Rn is convex and open, define a\nsubgradient of f at x0 ∈D to be any vector s ∈Rn such that\nf(x) −f(x0) ≥s · (x −x0)\nfor all x ∈D. The subgradient is a plausible choice for generalizing the notion of a\ngradient at a point where f is not differentiable. The subdifferential ∂f(x0) is the set\nof all subgradients of f at x0.\n(1) What is ∂f(0) for the function f(x) = |x|.\n(2) Suppose we wish to minimize a convex and continuous function f : Rn →\nR, which may not differentiable everywhere. Propose an optimality condition\ninvolving subdifferential for a point x∗to be a minimizer of f. Show that your\ncondition holds if and only if x∗is a globally minimizer f.\n(3) The subgradient method extends the gradient descent to a wider class of func-\ntions. Analogously to the gradient descent, the subgradient method performs\nthe iteration\nxk+1 = xk −αgk,\nwhere α > 0 is small stepsize that is known as the learning rate, and gk is any\nsubgradient of f at xk. This method might not decrease f in each iteration, so\ninstead we keep track of the best iterate we have seen so far, xbest\nk\n.\nIn the following parts, assume that f is Lipschitz continuous with constant\nL > 0, ∥x1 −x∗∥2 ≤B for some B > 0. Under these assumptions we will show\nthat\n(3)\nlim\nk→∞f(xbest\nk\n) ≤f(x∗) + L2\n2 α,\na bound characterizing convergence of the subgradient method.\n(a) Derive an upper bound for the error ∥xk+1 −x∗∥2\n2 of xk+1 in terms of\n∥xk −x∗∥2\n2, gk, α, f(xk) and f(x∗).\n(b) By recursively applying the result from Problem 3a, provide an upper\nbound for ∥xk+1 −x∗∥2\n2.\n(c) Incorporate f(xbest\nk\n) into your upper bound in Problem 3b, and take a limit\nas k →∞to obtain the desired convergence result (3).\n(d) Suggest a best choice of the learning rate α."}, {"year": "2018", "subject": "Algebra & Number Theory", "paper": "2018_algebra2018_individual", "kind": "individual", "n": 1, "chars": 328, "tags": ["数论"], "d": 2.95, "text": "(20 points).\n(a) (6 points) Show that if 2k −1 is a prime for weakly in L2(Rd), and ∥fn∥L2 →∥f∥L2 as n →∞.\nShow that\n∥fn −f∥L2 →0 as n →∞."}, {"year": "2018", "subject": "Analysis & PDE", "paper": "2018_analysis2018_individual", "kind": "individual", "n": 2, "chars": 190, "tags": ["复分析"], "d": 1.41, "text": "Let f : U →C be a non-constant holomorphic function where U ⊂C is the open\nset containing the closure D of the unit disk D = {z ∈C||z| < 1}.\nIf |f(z)| = 1, for all z ∈∂D, Prove that D ⊂f(D)."}, {"year": "2018", "subject": "Analysis & PDE", "paper": "2018_analysis2018_individual", "kind": "individual", "n": 3, "chars": 141, "tags": ["调和/位势"], "d": 1.16, "text": "Prove that if a sequence of harmonic function on the open disk converges uniformly\non compact subset of the disk, then the limit is harmonic."}, {"year": "2018", "subject": "Analysis & PDE", "paper": "2018_analysis2018_individual", "kind": "individual", "n": 4, "chars": 320, "tags": [], "d": 1.53, "text": "Let µ be a Borel measure on Rn. Let ρ > 0, a fixed positive number, and Bρ(x) =\n{y ∈Rn|d(x, y) < ρ}. For x ∈Rn, define a function:\nθ(x) : x →µ(Bρ(x))\n1) Show that θ is upper semi-continuous, i.e. for every x ∈Rn, θ(x) ≥lim supy→x θ(y).\n2) Give an example of a Borel measure µ, such that the function θ is not continuous."}, {"year": "2018", "subject": "Analysis & PDE", "paper": "2018_analysis2018_individual", "kind": "individual", "n": 5, "chars": 475, "tags": [], "d": 3.27, "text": "Let g denote a smooth function on Rn with compact support. Let f denote the\nfunction given by the formula\nf(x) =\n1\nn(n −1)α(n)\nZ\nRn\n1\n|x −y|n−2g(y)dy.\nHere α(n) is volume of the unit ball in Rn.\n(a) Prove that the integral that defines f converges for each x ∈Rn.\n(b) Prove that f is differentiable and that the gradient of f if given by the formula\n∇f|x =\n1\nn(n −1)α(n)\nZ\nRn\n1\n|x −y|n−2(∇g)|ydy.\n(c) Prove the f obeys −∆f = g with ∆denoting\n∂2\n∂x12 + · · · +\n∂2\n∂xn2.\n1\n\n \n2"}, {"year": "2018", "subject": "Analysis & PDE", "paper": "2018_analysis2018_individual", "kind": "individual", "n": 6, "chars": 138, "tags": ["调和/位势"], "d": 1.27, "text": "If u is a positive harmonic function on Rn \\ {0} (n ≥2), then exist constants\na ≥0, b ≥0 such that\nu(x) = a + b|x|2−n\nfor all x ∈Rn \\ {0}."}, {"year": "2018", "subject": "Computational & Applied", "paper": "2018_applied2018_individual", "kind": "individual", "n": 1, "chars": 798, "tags": ["代数几何", "数值分析"], "d": 2.69, "text": "We consider the following convection-diffusion equation\n(1)\nut + aux = buxx,\n0 ≤x < 1\nwith an initial condition u(x, 0) = f(x) and periodic boundary condition, where a and\nb > 0 are constants. The first order IMEX (implicit-explicit) time discretization and\nsecond order central spatial discretization are used to give the following scheme:\n(2)\nun+1\nj\n−un\nj\n∆t\n+ aun\nj+1 −un\nj−1\n2∆x\n= bun+1\nj+1 −2un+1\nj\n+ un+1\nj−1\n∆x2\nwith a uniform mesh xj = j∆x with spatial mesh size ∆x and time step ∆t. Here un\nj is\nthe numerical solution approximating the exact solution of (1) at x = xj and t = n∆t.\nProve that the scheme is L2 stable under the very mild time step restriction\n(3)\n∆t ≤c\nwith a constant c which is independent of ∆x. Can you determine the dependency of\nc on the two constants a and b in (1)?"}, {"year": "2018", "subject": "Computational & Applied", "paper": "2018_applied2018_individual", "kind": "individual", "n": 2, "chars": 959, "tags": ["代数几何", "辛几何/力学"], "d": 3.79, "text": "Velocity-Verlet method.\n(a) Recast the following Newtonian formula for the acceleration and potential force\nq′′(t) = −∇V (q),\ninto a Hamiltonian system and show that the corresponding map on the phase\nspace is symplectic.\n(b) Show that the velocity-Verlet (recovered many times: Delambre 1791, Størmer in\n1907, Cowell & Crommelin 1909, Verlet 1960s) method\npn+1/2 = pn −∆t\n2 ∇V (qn);\nqn+1 = qn + ∆tpn+1/2;\npn+1 = pn+1/2 −∆t\n2 ∇V (qn+1)\nis symplectic and is second order accurate.\nHint: Let u(t) = (p(t), q(t)) be a solution of the Hamiltonian system with initial data\nu0 = (p0, q0) and we view the solution u(t) as a map map on the phase space ϕt :\nRd × Rd →Rd × Rd ϕt(u0) = u(t). We call the flow map is symplectic if its Jacobian\nΦt(u0) = ∂ϕt(u0)\n∂u0\n=\nÃ∂p(t)\n∂p0\n∂p(t)\n∂q0\n∂q(t)\n∂p0\n∂q(t)\n∂q0\n!\nsatisfies Φt(u0)TJΦt(u0) = J for any u0 ∈Rd × Rd. Here J =\n¡ 0\nI\n−I 0\n¢\n.\nA scheme ϕn(u0), n = 1, 2 . . . , is symplectic if the map ϕn(u0) is symplectic.\n1\n\n \n2"}, {"year": "2018", "subject": "Computational & Applied", "paper": "2018_applied2018_individual", "kind": "individual", "n": 3, "chars": 1727, "tags": ["辛几何/力学"], "d": 4.58, "text": "We begin with some definitions.\n(1) A graph G is a pair G = (V, E) where V is a finite set, called the vertices of G,\nand E is a subset of P2(V ) (i.e., a set E of (unordered) two-element subsets of V ),\ncalled the edges of G. A simple graph G is a graph without loops (edge that connects a\nvertex to itself) or multiple edges between any pair of vertices. The order of the graph\nis |V |. We often put V = {v1, v2, · · · , vn} and E = {vivj| vi and vj are adjacent}.\n(2) Two vertices x and y are adjacent if xy ∈E. The neighborhood of a vertex x,\ndenoted by NG(x) or N(x), is the set of vertices that is adjacent to x. The degree\nof a vertex x, denoted by dG(x) or d(x), is |N(x)| (i.e. the number of vertices that is\nadjacent to x).\n(3) A path is a collection of distinct vertices vi1vi2 · · · vik such that vijvij+1 ∈E for\nall j, 1 ≤j < k. vi1 and vik are the ends of the path. A Hamiltonian path P is a\npath containing all vertices of the graph. A cycle is a closed path with vi1 = vik. A\nHamiltonian cycle is a cycle containing all vertices of the graph. A graph is called\nHamiltonian if it has a Hamiltonian cycle.\n(4) A graph G is (Hamilton) connected, if for every pair of vertices there is a (Hamil-\ntonian) path between them.\nAn example of a simple graph: V = {v1, v2, v3, v4} and E = {v1v2, v2v3, v3v4, v2v4}.\nIn this graph, the order of the graph is 4, N(v1) = {v2}, N(v4) = {v2, v3}, d(v3) = 2,\nd(v2) = 3 and v1v2v4v3 is a Hamiltonian path with ends v1 and v3.\nLet G be a simple graph of order n. Suppose that the degree sum of any pair of\nnonadjacent vertices is at least n+1. Show that G is Hamilton-connected (i.e. between\nany pair of vertices x and y, there is a Hamiltonian path in which x and y are the ends)."}, {"year": "2018", "subject": "Computational & Applied", "paper": "2018_applied2018_individual", "kind": "individual", "n": 4, "chars": 703, "tags": ["线性代数/矩阵"], "d": 3.37, "text": "Define the Hermite polynomials as\n(4)\nHn(x) = (−1)n exp(x2\n2 ) dn\ndxn[exp(−x2\n2 )],\nx ∈(−∞, +∞), n = 0, 1, 2, · · · .\n(a) Prove the weighted orthogonality of the Hermite polynomials:\n(5)\n⟨Hn(x), Hm(x)⟩ρ ≜\nZ +∞\n−∞\nρ(x)Hn(x)Hm(x)dx = n!\n√\n2πδn,m,\nwhere ρ(x) = exp(−x2\n2 ).\n(b) Prove the three recurrence formula:\n(6)\nHn+1(x) = xHn(x) −nHn−1(x),\nn ≥1,\nand then show that for all n ≥1, Hn(x) and Hn−1(x) share no common roots.\n(c) Use the recurrence formula and induction to prove the differential relation:\n(7)\nd\ndxHn(x) = nHn−1(x),\nn ≥1,\nand then prove that Hn is an eigenfunction of the following eigenvalue problem\n(8)\nxu′(x) −u′′(x) = λu.\nYou need to find the eigenvalue λn corresponding to Hn(x).\n\n \n3"}, {"year": "2018", "subject": "Computational & Applied", "paper": "2018_applied2018_individual", "kind": "individual", "n": 5, "chars": 678, "tags": ["线性代数/矩阵", "科学计算/大规模", "经典场论/相对论"], "d": 4.02, "text": "Take σi(A) to be the i-th singular value of the square matrix A ∈Rn×n. Define the\nnuclear norm of A to be\n∥A∥∗≡\nn\nX\ni=1\nσi(A).\n(1) Show that ∥A∥∗= tr(\n√\nATA).\n(2) Show that ∥A∥∗= max\nXT X=I tr(AX).\n(3) Show that ∥A + B∥∗≤∥A∥∗+ ∥B∥∗\n(4) Explain informally why minimizing ∥A −A0∥2\nF + ∥A∥∗over A for a fixed A0 ∈\nRn×n might yield a low-rank approximation of A0.\nNotation: The trace of a matrix tr(A) is the sum P\ni aii of its diagonal elements. We\ndefine the square root of a symmetric positive semidefinite matrix M to be\n√\nM ≡\nUD1/2U T, where D1/2 is the diagonal matrix containing (nonnegative) square roots of\nthe eigenvalues of M and U contains the eigenvectors of M = UDU T."}, {"year": "2018", "subject": "Geometry & Topology", "paper": "2018_geometry2018_individual", "kind": "individual", "n": 1, "chars": 416, "tags": ["群论", "范畴/同调代数", "代数拓扑", "微分流形/形式"], "d": 3.78, "text": "Let M and N be smooth, connected, orientable n-manifolds for n ≥3, and let\nM#N denote their connect sum.\n(a) Compute the fundamental group of M#N in terms of that of M and of N (you\nmay assume that the basepoint is on the boundary sphere along which we glue M\nand N).\n(b) Compute the homology groups of M#N.\n(c) For part (a), what changes if n = 2? Use this to describe the fundamental groups\nof orientable surfaces."}, {"year": "2018", "subject": "Geometry & Topology", "paper": "2018_geometry2018_individual", "kind": "individual", "n": 3, "chars": 124, "tags": ["纤维丛/示性类"], "d": 1.19, "text": "Determine all of the possible degrees of maps S2 →S1 × S1.\nClassify all vector bundles over the circle S1 up to isomorphism."}, {"year": "2018", "subject": "Geometry & Topology", "paper": "2018_geometry2018_individual", "kind": "individual", "n": 4, "chars": 404, "tags": [], "d": 1.55, "text": "Suppose C is a regular curve in the unit sphere S2. For any point W ∈S2, there\nexists the only oriented great circle SW (determined by the right hand rule) in S2 such\nthat W is the pole of SW. Denote by n(W) the number of points at which the oriented\ngreat circle SW and C intersect. Prove the Crofton formula\nZZ\nS2 n(W)dW = 4L,\nwhere dW and L is the area element of S2 and the length of C, respectively."}, {"year": "2018", "subject": "Geometry & Topology", "paper": "2018_geometry2018_individual", "kind": "individual", "n": 5, "chars": 282, "tags": ["微分几何", "微分流形/形式"], "d": 1.62, "text": "Let M be an n-dimensional closed submanifold in the Euclidean space Rn+p. Prove\nthe following inequality\nZ\nM\nHndV ≥vol(Sn),\nwhere H and dV is the mean curvature (i.e., norm of the mean curvature vector) and\nthe volume element of M, and Sn is the standard unit sphere of dimension n."}, {"year": "2018", "subject": "Geometry & Topology", "paper": "2018_geometry2018_individual", "kind": "individual", "n": 6, "chars": 139, "tags": ["微分几何", "微分流形/形式"], "d": 1.38, "text": "Let M be an even dimensional compact and oriented Riemannian manifold with\npositive sectional curvature. Show that M is simply connected.\n1"}, {"year": "2018", "subject": "Probability & Statistics", "paper": "2018_probability2018_individual", "kind": "individual", "n": 1, "chars": 483, "tags": [], "d": 1.54, "text": ". A submarine is lost in some ocean. There are two (and only two) possible\nregions: A and B. Experts estimate the probability of being lost in A is 70%. On the\nother hand, for each search, the probability of finding this submarine is 40% if it is lost\nin A. This number is 80% for region B. Now we have independently searched region A\n4 times and region B once, but still have not found the submarine yet. Now based on\nthese informations, which region we should search next? And why?"}, {"year": "2018", "subject": "Probability & Statistics", "paper": "2018_probability2018_individual", "kind": "individual", "n": 2, "chars": 475, "tags": ["概率论"], "d": 1.57, "text": ". A teacher and 12 students sit around a circle. In the beginning the teach\nholds a gift, he will randomly pass it to the left person or right person next to him, so\nas the other students each time. (For the gift, It is like a random walk between these\npeople) The rule is that the gift will be eventually given to some student (not teacher)\nif he/she\nis the last student who ever touches the gift.\nWhich student(s) have the highest probability to get this gift (i.e., win) ?"}, {"year": "2018", "subject": "Probability & Statistics", "paper": "2018_probability2018_individual", "kind": "individual", "n": 3, "chars": 253, "tags": [], "d": 1.33, "text": ". In a party, N people attend, each of them brings k gifts. When they\nleave, each of them randomly picks k gifts. Let X be the total number of gifts which\nare taken back by their owners. Let's fix k, please find the limiting distribution of X\nwhen N →∞."}, {"year": "2018", "subject": "Probability & Statistics", "paper": "2018_probability2018_individual", "kind": "individual", "n": 4, "chars": 458, "tags": ["线性代数/矩阵"], "d": 1.68, "text": ". Suppose that a random vector x = (x1, ..., xn)′ ∈Rn(n ≥2) is distributed\nas a multivariate normal distribution N(0, Σ) with the following joint probability den-\nsity function\nf(x) =\n1\n(2π)\nn\n2 det(Σ)\n1\n2 exp\n½\n−1\n2x′Σ−1x\n¾\n, x ∈Rn,\nwhere Σ is an n × n positive definite matrix. Let the (i, j) element of Ω= Σ−1 be ωij\n(1 ≤i, j ≤n). For 1 ≤i ̸= j ≤n, show that if ωij = 0, then xi and xj are conditionally\nindependent when the other elements of x are given."}, {"year": "2018", "subject": "Probability & Statistics", "paper": "2018_probability2018_individual", "kind": "individual", "n": 5, "chars": 585, "tags": [], "d": 2.81, "text": ". Letx, y be two independent random vectors in Rn (n ≥3). Assume that\nP(y = 0) = 0 and x has a standard multivariate normal distribution, i.e., x ∼N(0, In).\n(a) For any nonzero constant vector a ∈Rn satisfying ||a|| = (a′a)1/2 = 1, prove that\n√\nn −1\na′x\np\n||x||2 −(a′x)2 ∼tn−1,\nhere tn−1 stands for a t distribution with n −1 degrees of freedom.\n(b) The sample correlation coefficient between x = (x1, ..., xn)′ and y = (y1, ..., yn)′ is\ndefined as\nr =\nPn\ni=1(xi −¯x)(yi −¯y)\npPn\ni=1(xi −¯x)2pPn\ni=1(yi −¯y)2.\nwhere ¯x = Pn\ni=1 xi/n, ¯y = Pn\ni=1 yi/n. Show that √n −2\nr\n√\n1−r2 ∼tn−2.\n1"}, {"year": "2019", "subject": "Algebra & Number Theory", "paper": "2019_Algebra2019_individual", "kind": "individual", "n": 1, "chars": 228, "tags": ["群论", "表示论"], "d": 1.54, "text": "Let G be a finite group. Assume that for any representation V of G over a field of characteristic zero,\nthe character χV takes value in Q. Assume g is an element in G such that g2019 = 1.\nProve that g and g19 are conjugate in G."}, {"year": "2019", "subject": "Algebra & Number Theory", "paper": "2019_Algebra2019_individual", "kind": "individual", "n": 2, "chars": 337, "tags": ["Galois/域扩张", "数论"], "d": 1.69, "text": "Let p be a prime number, and let Fp be the finite field with p elements. Let F = Fp(t) be the field of\nrational functions over Fp. Consider all subfields C of F such that F/C is a finite Galois extension.\n1. Show that among such subfields, there is a smallest one C0, i.e., C0 is contained in any other C.\n2. What is the degree of F/C0 ?"}, {"year": "2019", "subject": "Algebra & Number Theory", "paper": "2019_Algebra2019_individual", "kind": "individual", "n": 3, "chars": 172, "tags": ["环与模", "数论"], "d": 1.52, "text": "Let R ⊂R′ be an integral extension of commutative rings. Let p′ be a prime ideal of R′. Prove that\np′ is a maximal ideal of R′ if and only if p′ ∩R is a maximal ideal of R."}, {"year": "2019", "subject": "Algebra & Number Theory", "paper": "2019_Algebra2019_individual", "kind": "individual", "n": 4, "chars": 139, "tags": [], "d": 1.18, "text": "1. Prove that GLn(C) is path-connected.\n2. Let\nX = {A ∈GLn(C) | Am = Id},\nDescribe the path-connected component of X and prove your answer."}, {"year": "2019", "subject": "Algebra & Number Theory", "paper": "2019_Algebra2019_individual", "kind": "individual", "n": 5, "chars": 353, "tags": ["Galois/域扩张", "数论"], "d": 1.73, "text": "The Fibonacci sequence is defined by\nF0 = 0,\nF1 = 1,\nFn+2 = Fn+1 + Fn.\nLet p be a prime number.\n1. Show that if p ≡1, 4 (mod 5), then p divides Fp−1.\n2. Let Fp2 be the finite field of p2 elements. Show that the norm map N : F×\np2 →F×\np is surjective,\nand deduce the cardinality of the kernel of N.\n3. Show that if p ≡2, 3 (mod 5), then p divides Fp+1.\n1"}, {"year": "2019", "subject": "Algebra & Number Theory", "paper": "2019_Algebra2019_team", "kind": "team", "n": 1, "chars": 183, "tags": ["群论"], "d": 1.21, "text": "Let Sn be the group of permutations of {1, 2, ..., n}. Let σ ∈Sn be the permutation\n(1, n)(2, n −1) · · · (k, n −k + 1) · · · .\nProve that the centraliser ZSn(σ) is isomorphic to S[ n"}, {"year": "2019", "subject": "Algebra & Number Theory", "paper": "2019_Algebra2019_team", "kind": "team", "n": 2, "chars": 429, "tags": ["群论", "经典场论/相对论"], "d": 1.88, "text": "] ⋉(Z/2Z)[ n\n2 ].\n2) Recall that the algebra of regular functions on a vector space W is the symmetric algebra of linear\nforms on W.\nLet V = C2. Let C[EndC(V )] be the algebra of regular functions on EndC(V ). The natural action of\nthe group G = SL2(C) on V induces an action of G × G on EndC(V ) by left and right multiplication.\nThus we get an action of G × G on C[EndC(V )].\nCompute the algebra of fixed points C[EndC(V )]G×G."}, {"year": "2019", "subject": "Algebra & Number Theory", "paper": "2019_Algebra2019_team", "kind": "team", "n": 3, "chars": 144, "tags": ["环与模"], "d": 1.25, "text": "Let R be a Noetherian ring and I ⊂R be an ideal. Define the Rees algebra as\nRees(I, R) :=\nM\nn⩾1\nIntn ⊂R[t].\nProve that Rees(I, R) is Noetherian."}, {"year": "2019", "subject": "Algebra & Number Theory", "paper": "2019_Algebra2019_team", "kind": "team", "n": 4, "chars": 410, "tags": ["Galois/域扩张", "群论", "数论"], "d": 2.03, "text": "Let p be a odd prime. Let Φp be the p-th cyclotomic field, i.e., Φp = Q(ζp) where ζp is a primitive\np-th root of unity.\n1. Show that Φp/Q is a Galois extension with Galois group (Z/pZ)×.\n2. Deduce that Φp contains a unique quadratic extension of Q.\n3. Write gp for the Gauss sum Pp−1\na=1\n¡ a\np\n¢\nζa\np. Show that\n• gp =\n¡ −1\np\n¢\ngp,\n• |gp|2 = p.\n4. Determine the unique quadratic extension of Q contained in Φp."}, {"year": "2019", "subject": "Algebra & Number Theory", "paper": "2019_Algebra2019_team", "kind": "team", "n": 5, "chars": 366, "tags": ["Galois/域扩张", "群论"], "d": 1.79, "text": "1. Let E/F be a finite Galois extension. Assume that the Galois group Gal(E/F) is generated by a\nsingle element σ. Let x be an element of E such that trE/F (x) = 0. Show that there exists y ∈E\nsuch that x = σ(y) −y.\n2. Let F be a field of characteristic p, and let E/F be a Galois extension of degree p. Show that\nthere exists x ∈F such that E ∼= F[T]/(T p −T −x).\n1"}, {"year": "2019", "subject": "Analysis & PDE", "paper": "2019_Analysis2019_individual", "kind": "individual", "n": 1, "chars": 157, "tags": ["优化/线性规划"], "d": 1.25, "text": "Let F : R →R be a strictly convex function. Let u: [0, 1] →R be a continuous function, with\nZ 1\n0\nu(x) dx = 0.\nShow that\nZ 1\n0\nF(u(x)) dx ⩽F(∥u∥∞) + F(−∥u∥∞)"}, {"year": "2019", "subject": "Analysis & PDE", "paper": "2019_Analysis2019_individual", "kind": "individual", "n": 2, "chars": 393, "tags": ["实分析/测度"], "d": 1.61, "text": "where ∥u∥∞:= sup\nx∈[0,1]\n|u(x)|. Also determine when equality occurs.\n2) Prove that there exists a universal constant K, for all C1 function f : R2 →R, if f ∈L1 ¡\nR2¢\n∩L2 ¡\nR2¢\nand |∇f| ∈L2(R2), we have the following inequality:\n∥f∥2\nL2(R2) ⩽K ∥f∥L1(R2) ∥∇f∥L2(R2) .\nCan you provide constant K so that K < 10? In the problem, all the Lp-spaces are defined with\nrespect to the Lebesgue measure."}, {"year": "2019", "subject": "Analysis & PDE", "paper": "2019_Analysis2019_individual", "kind": "individual", "n": 3, "chars": 114, "tags": ["调和/位势"], "d": 1.19, "text": "Let f : R2 →R be a harmonic function. Suppose\nlim\n|x|→∞\n|f(x)|\nln |x| = 0.\nProve or disprove that f is a constant."}, {"year": "2019", "subject": "Analysis & PDE", "paper": "2019_Analysis2019_individual", "kind": "individual", "n": 4, "chars": 286, "tags": ["复分析"], "d": 2.41, "text": "(a) Show that there does not exist a holomorphic function f on C \\ {1, −1} so that\nf ′(z) =\n1\n(z2 −1)2019\nfor all z ∈C \\ {1, −1}.\n(b) Show that there exist a set L ⊂C and a holomorphic function F on C \\ L so that L has Hausdorff\ndimension 1, and\nF ′(z) =\n1\n(z2 −1)2019\nfor all z ∈C \\ L."}, {"year": "2019", "subject": "Analysis & PDE", "paper": "2019_Analysis2019_individual", "kind": "individual", "n": 5, "chars": 177, "tags": [], "d": 1.29, "text": "Let Ω⊂R2 be a bounded domain with smooth boundary. Prove that, for all p > 1 and 1 ⩽q < ∞,\nfor all f ∈Lp(Ω), there exists a unique u ∈H1\n0(Ω), such that\n△u = |u|q−1u + f in Ω.\n1"}, {"year": "2019", "subject": "Analysis & PDE", "paper": "2019_Analysis2019_team", "kind": "team", "n": 1, "chars": 146, "tags": ["Fourier/变换"], "d": 1.17, "text": "Show that there is no non-zero f ∈C∞\n0 (R2) (compactly supported smooth function) so that its Fourier\ntransform bf(ξ) is also compactly supported."}, {"year": "2019", "subject": "Analysis & PDE", "paper": "2019_Analysis2019_team", "kind": "team", "n": 2, "chars": 244, "tags": ["偏微分方程"], "d": 1.27, "text": "Prove the following classical interior Schauder estimates:\nThere exists a universal constant C, for all smooth compactly supported functions u, f ∈C∞\n0 (R3) with\n△u = f, we have\n∥u∥C2,α ⩽C∥f∥C0,α,\nwhere 0 < α < 1 and ∥· ∥Ck,α are H¨older norms."}, {"year": "2019", "subject": "Analysis & PDE", "paper": "2019_Analysis2019_team", "kind": "team", "n": 3, "chars": 316, "tags": ["实分析/测度", "概率论"], "d": 1.84, "text": "Let (X, A, µ) be a probability space and let T : X →X be a measurable and measure preserving map,\ni.e., for all A ∈A, we have µ\n¡\nT −1(A)\n¢\n= µ(A). For A, B ∈A, if µ(A −B) = µ(B −A) = 0, we say\nthat A = B a.e.\nAssume A ∈A such that T −1(A) = A a.e..Prove that there exists a set B ∈A so that T −1B = B and\nA = B a.e."}, {"year": "2019", "subject": "Analysis & PDE", "paper": "2019_Analysis2019_team", "kind": "team", "n": 4, "chars": 163, "tags": ["复分析"], "d": 1.24, "text": "Is there an entire function f with infinitely many zeroes, so that for every r ∈(0, 1), there exist\nconstants Ar, Br < ∞such that\n|f(z)| ⩽AreBr|z|r\nfor every z ∈C?"}, {"year": "2019", "subject": "Analysis & PDE", "paper": "2019_Analysis2019_team", "kind": "team", "n": 5, "chars": 330, "tags": ["偏微分方程"], "d": 1.68, "text": "Let u(t, x, y) be a smooth real function defined on R × R2 where t ∈R and (x, y) ∈R2. We assume\nthat it solves the following semilinear wave equation:\n−∂2\n∂t2 u + △u = u3.\nIf the supports of the initial data u(0, x) and ∂u\n∂t (0, x) are compact, prove that, for all t0 ∈R, the\nsupports of u(t0, x) and ∂u\n∂t (t0, x) are compact.\n1"}, {"year": "2019", "subject": "Computational & Applied", "paper": "2019_AppliedMath2019_individual", "kind": "individual", "n": 1, "chars": 625, "tags": [], "d": 2.08, "text": "(20 points)\nGiven a set X, m ∈N and a hypothesis space H, define\nΠH(m) =\nmax\n{x1,x2,...,xm}⊆X |{(h(x1), h(x2), . . . , h(xm))|h ∈H}|\nwhere |S| denotes the cardinality of the set S. The VC dimension of H is\nVC(H) = max{m : ΠH(m) = 2m}.\n(i) Let X = R. If a ⩽b, define h(x; a, b) = 1 if x ∈[a, b] and h(x) = −1 if x /∈[a, b]. Find the VC\ndimension of the hypothesis space H = {h(x; a, b)|a, b ∈R, a ⩽b}.\n(ii) Let X = Rd, H to be the set of linear classifiers, i.e. H = {f(x)|f(x) = sign(w⊤x + b), w ∈Rd, b ∈\nR} where sign(x) = 1 if x > 0, sign(x) = −1 if x < 0 and sign(x) = 0 if x = 0. Show that the VC\ndimension of H is d + 1."}, {"year": "2019", "subject": "Computational & Applied", "paper": "2019_AppliedMath2019_individual", "kind": "individual", "n": 2, "chars": 477, "tags": ["偏微分方程", "常微分方程", "代数几何", "数值分析"], "d": 2.26, "text": "(25 points)\nConsider Richardson's difference scheme for the heat equation ut = uxx :\n1\n2k (u(x, t + k) −u(x, t −k)) = 1\nh2 (u(x −h, t) −2u(x, t) + u(x + h, t)) .\n(i) Show that this scheme has second-order truncation error.\n(ii) Use either ODE principles or von Neumann analysis to show that this scheme is unconditionally\nunstable.\n(iii) Demonstrate a minor modification of the left-side of Richardson's scheme that yields a familiar\nunconditionally stable scheme and prove it."}, {"year": "2019", "subject": "Computational & Applied", "paper": "2019_AppliedMath2019_individual", "kind": "individual", "n": 3, "chars": 552, "tags": ["优化/线性规划", "经典场论/相对论"], "d": 2.74, "text": "(25 points)\nLet ∅̸= K be a closed convex set in Rn, i.e., K is a closed set and for any x, y ∈K and λ ∈(0, 1),\nλx + (1 −λ)y ∈K. For any z ∈Rn, let ΠK(z) denote the metric projection of z onto K, which is the\nunique optimal solution of following problem:\nmin 1\n2∥y −z∥2\n2,\ns.t.\ny ∈K.\n(1)\nShow that\n(i) the point y ∈K solves (1) if and only if\n(z −y)T (d −y) ⩽0,\n∀d ∈K;\n(ii) for any y, z ∈Rn,\n∥ΠK(y) −ΠK(z)∥2 ≤∥y −z∥2;\n(iii) Θ(·) is continuously differentiable with its gradient given by\n∇Θ(z) = z −ΠK(z),\nwhere for any z ∈Rn, Θ(z) := 1\n2∥z −ΠK(z)∥2\n2.\n1"}, {"year": "2019", "subject": "Computational & Applied", "paper": "2019_AppliedMath2019_individual", "kind": "individual", "n": 4, "chars": 884, "tags": ["范畴/同调代数", "统计物理"], "d": 2.15, "text": "(25 points) The scientists FitzHugh (1961) and Nagumo, Arimoto, Yoshizawa (1962) derived a math-\nematical model to characterize the behavior of a neuron under the externally injected current I:\n(\ndV\ndt\n= V −1\n3V 3 −W + I,\ndW\ndt\n= 1\nτ\n¡\nV + a −bW\n¢\n,\nwhere the variable V describes the membrane potential of the neuron, the variable W describes the\ncurrent arising from opening and closing of ion channels on the neurons membrane. The variables τ,\na and b are parameters with typical values: a = 0.7,b = 0.8 and τ = 13.\n(i) For a small positive constant current I, how the neuron behaves.\n(ii) For a large positive constant current I, how the neuron behaves.\n(iii) Suppose one injects a pulse current with different magnitude at some time t0, i.e., I = I0δ(t −t0),\nwhere I0 describes the magnitude of the pulse, analyze the dynamical behavior of the neuron when I0\nis small or large.\n2"}, {"year": "2019", "subject": "Computational & Applied", "paper": "2019_AppliedMath2019_team", "kind": "team", "n": 1, "chars": 170, "tags": ["数值分析"], "d": 1.22, "text": "(10 points)\nShow that the quadrature formula\nZ 1\n−1\nf(x)\n√\n1 −x2 dx = π\nn\nn−1\nX\nk=0\nf\nµ\ncosπ 2k + 1\n2n\n¶\nis exact for all polynomials\nof degree up to and including 2n −1."}, {"year": "2019", "subject": "Computational & Applied", "paper": "2019_AppliedMath2019_team", "kind": "team", "n": 2, "chars": 296, "tags": ["Fourier/变换"], "d": 1.38, "text": "(15 pointes) Let x = (x0, . . . , xN−1) ∈RN, x ̸= 0 and ˆx be its discrete Fourier transform, i.e.\nˆxw =\n1\n√\nN\nN−1\nX\nt=0\nxt exp(−2πiwt/N), w = 0, . . . , N −1.\nProve that ∥x∥0∥ˆx∥0 ⩾N where ∥x∥0 denotes the number of nonzero entries in x. (Hint: show that ˆx\ncan not have ∥x∥0 consecutive zeros.)"}, {"year": "2019", "subject": "Computational & Applied", "paper": "2019_AppliedMath2019_team", "kind": "team", "n": 3, "chars": 461, "tags": ["线性代数/矩阵", "科学计算/大规模"], "d": 1.97, "text": "(20 pointes)\nLet m ⩽n. Consider the (n + m) × (n + m) real matrix defined by\nA =\n· I\nX\nX⊤\nO\n¸\n,\nwhere I is the n × n identity matrix, X is a full-rank n × m matrix, O is the m × m zero matrix.\n(i) Show that A is nonsingular.\n(ii) Find the eigenvalues of A, some of which are in terms of the singular values of X.\n(iii) Under what conditions on X would the iteration\nxn+1 = xn −(Axn −b)\nconverge to the solution of Ax = b for any (n + m) × (n + m) real vector b?"}, {"year": "2019", "subject": "Computational & Applied", "paper": "2019_AppliedMath2019_team", "kind": "team", "n": 4, "chars": 566, "tags": ["优化/线性规划"], "d": 2.31, "text": "(25 pointes)\nLet f be a continuously differentiable convex function defined on Rn, i.e., f : Rn →R is continuously\ndifferentiable and for any x, y ∈Rn and any α ∈(0, 1), f(αx + (1 −α)y) ≤αf(x) + (1 −α)f(y).\nSuppose that the gradient of f is Lipschitz continuous, i.e., there exists a constant L > 0 such that\n∥∇f(x) −∇f(y)∥2 ≤L∥x −y∥2.\nProve the following inequalities:\n(i). f(y) ≤f(x) + (∇f(x))T (y −x) + L\n2 ∥y −x∥2\n2,\n∀x, y ∈Rn;\n(ii). f(y) ≥f(x) + (∇f(x))T (y −x) +\n1\n2L∥∇f(y) −∇f(x)∥2\n2,\n∀x, y ∈Rn;\n(iii).\n1\nL∥∇f(y) −∇f(x)∥2\n2 ≤(∇f(y) −∇f(x))T (y −x),\n∀x, y ∈Rn."}, {"year": "2019", "subject": "Computational & Applied", "paper": "2019_AppliedMath2019_team", "kind": "team", "n": 5, "chars": 452, "tags": ["偏微分方程", "常微分方程", "代数几何"], "d": 2.97, "text": "(30 pointes) Consider the following problems.\n(i) Determine the order of St¨ormer's method,\nyn+2 −2yn+1 + yn = h2f(tn+1, yn+1),\nn ⩾0,\nfor solving the second order system of ODE's\ny′′ = f(t, y),\nt ⩾0,\nwith the initial conditions y(0) = y0 and y′(0) = y′\n0.\n(ii) Using the second order central differences in space and St¨ormer's method in time, construct a\nscheme to solve the wave equation,\nutt = uxx.\n(iii) Determine the condition for its stability.\n1"}, {"year": "2019", "subject": "Geometry & Topology", "paper": "2019_Geometry2019_individual", "kind": "individual", "n": 1, "chars": 393, "tags": ["范畴/同调代数", "代数拓扑", "微分流形/形式"], "d": 3.0, "text": "Let Confn be the following submanifold of Cn:\nConfn = {(z1, z2, · · · , zn) ∈Cn|zi ̸= zj for any i ̸= j}.\nFor every pair (i, j) with i ̸= j, we define the complex valued 1-form\nωij := dzi −dzj\nzi −zj\n.\n(a) Show that for any i ̸= j, ωij represents a non-zero de Rham cohomology class in H1(Confn, C).\n(b) Show that for any pair-wise distinct indices i, j, k,\nωij ∧ωjk + ωjk ∧ωki + ωki ∧ωij = 0."}, {"year": "2019", "subject": "Geometry & Topology", "paper": "2019_Geometry2019_individual", "kind": "individual", "n": 2, "chars": 330, "tags": ["线性代数/矩阵", "微分流形/形式", "经典场论/相对论"], "d": 1.96, "text": "Let M be a compact oriented manifold of (real) dimension 4. Consider the following symmetric bilinear\nform on H2(M)\nH2(M) × H2(M) →R,\n([α], [β]) 7→\nZ\nM\nα ∧β.\nLet τ(M) be the signature of this bilinear form, i.e. the number of positive eigenvalues minus the\nnumber of negative eigenvalues. Compute τ(M) for M = S4, CP2 and S2 × S2."}, {"year": "2019", "subject": "Geometry & Topology", "paper": "2019_Geometry2019_individual", "kind": "individual", "n": 3, "chars": 199, "tags": [], "d": 1.26, "text": "Let X = R4/ ∼, where\n(x1, x2, x3, x4) ∼(x1, x2 + 1, x3, x4)\n(x1, x2, x3, x4) ∼(x1, x2, x3, x4 + 1)\n(x1, x2, x3, x4) ∼(x1 + 1, x2, x3, x4)\n(x1, x2, x3, x4) ∼(x1, x2 + x4, x3 + 1, x4)\nCompute H1(X, Z)."}, {"year": "2019", "subject": "Geometry & Topology", "paper": "2019_Geometry2019_individual", "kind": "individual", "n": 4, "chars": 671, "tags": ["线性代数/矩阵", "微分几何", "微分流形/形式", "纤维丛/示性类"], "d": 3.79, "text": "Let E be a vector bundle over a smooth manifold M.\nLet ∇E be a connection E and RE ∈\nΩ2(M, End(E)) be its curvature tensor. For any polynomial f(x) = a0 + a1x + a2x2 + · · · + anxn, we\ndenote\nf(RE) = a0 + a1RE + a2(RE)2 · · · + an(RE)n ∈Ω∗(M, End(E)).\nHere (RE)k ∈Ω2k(M, End(E)) is the k-th wedge product on forms combined with matrix multiplica-\ntions on End(E).\n(a) Show that the differential form tr\n£\nf(RE)\n¤\n∈Ω∗(M) is closed\ndtr\n£\nf(RE)\n¤\n= 0.\nHere tr is the trace on End(E).\n(b) Let ∇E, e∇E be two connections on E and RE, eRE be the corresponding curvature tensors. Show\nthat there exists a differential form ω ∈Ω∗(M) such that\ntr\n£\nf(RE)\n¤\n−tr\nh\nf( ˜RE)\ni\n= dω.\n1"}, {"year": "2019", "subject": "Geometry & Topology", "paper": "2019_Geometry2019_individual", "kind": "individual", "n": 5, "chars": 402, "tags": ["微分几何", "微分流形/形式"], "d": 2.88, "text": "(a) Let u be a smooth function over a Riemannian manifold (M, g). Prove the following Bochner's\nformula\n1\n2∆|∇u|2 = |∇∇u|2 + Ric(∇u, ∇u) + g(∇∆u, ∇u)\nwhere ∆is the Laplacian and | • |2 = g(•, •).\n(b) Let (S2, g) be the standard unit sphere and E be a constant. Show that the only smooth positive\nsolution to\n∆ln f + Ef 2 = 1\nis f =\n1\nA+φ where A is a constant and φ is some first eigenfunction of S2.\n2"}, {"year": "2019", "subject": "Geometry & Topology", "paper": "2019_Geometry2019_team", "kind": "team", "n": 1, "chars": 109, "tags": [], "d": 1.16, "text": "Is TS2 diffeomorphic to S2 × R2? Verify your answer. Here TS2 is the total space of the tangent\nbundle of S2."}, {"year": "2019", "subject": "Geometry & Topology", "paper": "2019_Geometry2019_team", "kind": "team", "n": 2, "chars": 304, "tags": [], "d": 1.99, "text": "Solve the problem which Russell Crowe assigns to his students in the movie \"A beautiful mind\" (2001):\nV = {F : R3\\X →R3 s.t. ∇× F = 0}\nW = {F = ∇g}\ndim (V/W) =?\nFirst give the general answer for any closed X ⊂R3, and then specialize it to (a) X = {x = y = z = 0},\n(b) X = {x = y = 0} and (c) X = {x = 0}."}, {"year": "2019", "subject": "Geometry & Topology", "paper": "2019_Geometry2019_team", "kind": "team", "n": 3, "chars": 225, "tags": [], "d": 1.36, "text": "Let T 2 = S1 × S1 be the 2-torus with the standard orientation, and let F : T 2 →T 2 be a smooth\nmap of degree 1 such that F ◦F = Id and F has no fixed points.\nProve that the induced map\nF ∗: H1(T 2) →H1(T 2) is the identity."}, {"year": "2019", "subject": "Geometry & Topology", "paper": "2019_Geometry2019_team", "kind": "team", "n": 4, "chars": 415, "tags": ["群论", "线性代数/矩阵", "代数拓扑", "微分流形/形式"], "d": 3.39, "text": "Let U(n) be the group of n × n unitary matrices, and O(n) be the group of n × n orthogonal matrices.\nLet SU(n) = {A ∈U(n)| det A = 1} be the special unitary group and SO(n) = {A ∈O(n)| det A = 1}\nbe the special orthogonal group. All U(n), SU(n), O(n), SO(n) are Lie groups with natural manifold\nstructures.\n(a) Compute the dimensions of SU(n) and SO(n).\n(b) Compute the fundamental groups of SU(n) and SO(n) (n ⩾2)."}, {"year": "2019", "subject": "Geometry & Topology", "paper": "2019_Geometry2019_team", "kind": "team", "n": 5, "chars": 636, "tags": ["微分几何", "微分流形/形式"], "d": 3.22, "text": "Let (M, g) be a compact Riemannian manifold and R be its Riemannian curvature tensor. (M, g) will\nbe called weakly negative if for any point p ∈M and for any nonzero vector field X ∈TpM, there\nexists a nonzero vector field Y ∈TpM such that R(X, Y, Y, X) < 0.\n(a) Let X be a Killing vector field and f = 1\n2g(X, X) = 1\n2|X|2. Show that for any vector field V\n(Hessf) (V, V ) = g(∇V X, ∇V X) −R(V, X, X, V ).\nHere the Hessian of f is (Hessf) (Y, Z) := g(∇Y grad(f), Z) for any vector fields Y, Z, where\ngrad(f) is the gradient vector of f.\n(b) Prove that if (M, g) is weakly negative, then there are no nontrivial Killing vector fields.\n1"}, {"year": "2019", "subject": "Probability & Statistics", "paper": "2019_ProbaStat2019_individual", "kind": "individual", "n": 1, "chars": 170, "tags": ["概率论"], "d": 1.34, "text": "Suppose (Xn)n≥1 is a sequence of positive random variables. There exists a constant C > 0 such that,\nE[Xn] ≤C,\nE[max{0, −log Xn}] ≤C,\n∀n.\nShow that\nlim sup\nn→∞X1/n\nn\n= 1."}, {"year": "2019", "subject": "Probability & Statistics", "paper": "2019_ProbaStat2019_individual", "kind": "individual", "n": 2, "chars": 329, "tags": ["表示论", "概率论"], "d": 2.67, "text": "Suppose γ is a probability measure on {0, 1, 2} such that γ(0) > γ(2) > 0. Let (ξn)n≥1 be a sequence\nof i.i.d. random variables with common law γ. Define the sequence\nY0 = 0,\nYn+1 = max{0, Yn + ξn+1 −1},\n∀n ≥0.\nShow that (Yn)n≥0 is an irreducible Markov chain on the state space N = {0, 1, 2, . . .} and it is positive\nrecurrent."}, {"year": "2019", "subject": "Probability & Statistics", "paper": "2019_ProbaStat2019_individual", "kind": "individual", "n": 3, "chars": 257, "tags": ["概率论"], "d": 1.32, "text": "Suppose (ϵn)n≥1 is a sequence of i.i.d. random variables and the common law is Bernoulli:\nP[ϵ1 = 1] = P[ϵ1 = −1] = 1/2.\nConsider the random series f(x) = P∞\nn=1 ϵnxn. Show that the random series attains zero infinitely\nmany times on x ∈[0, 1) almost surely."}, {"year": "2019", "subject": "Probability & Statistics", "paper": "2019_ProbaStat2019_individual", "kind": "individual", "n": 4, "chars": 3226, "tags": ["数理统计"], "d": 4.53, "text": "Consider a randomized experiment with 2N units, half to be randomly assigned an active treatment,\nand the other half to be assigned the control treatment; the objective is to measure the effect of the\nactive versus control treatments on an outcome, called Y . For example, the units could be people with\nhigh blood pressure, where Y is blood pressure one week after receiving the active drug or an inactive\ndrug, a placebo, where the patient is blinded to which drug is being given.\nThe estimand, the goal of the experiment, is the average value of Y if all 2N units received active\nminus the average value of Y if all 2N units received control. Assume that these 2 × 2N numbers\nare fixed quantities (in the statistical literature this assumption is known as SUTVA the stable-unit-\ntreatment-value assumption), which means that the outcome Y for the i-th unit receiving a particular\ntreatment is a proper function of that unit and the treatment that unit i received.\nDerive the following results in this simple situation.\na) Find the expectation of the estimator, the difference in the observed sample means (between those\nassigned treatment and those assigned control), in terms of the estimand (defined above), where\nexpectation in this context refers to averaging over all possible random allocations.\nb) The variance of the estimator described in part a) (again, with variance defined as averaging over\nall possible random allocations).\nc) Find an unbiased estimator of the variance in part b), assuming additive treatment effects, that is,\nthe treatment minus control values of Y are constant across the 2N units, so that the treatment\nversus control condition adds a constant value for all 2N units.\nd) Find the bias of the estimator in part c) when the treatment effects are non-additive.\ne) Generalize the results in parts a),b), c) and d) to the situation where 2N is replaced by Nt + Nc,\nwith Nt units getting active treatment and Nc units getting control, where these sample sizes are\nunequal.\nf) Argue that the estimator in part c), when the sample sizes are large, will look gaussian, and\nconduct a small simulation to indicate that this often happens with relatively small sample sizes.\n1\n\n \ng) Modify the first four parts to consider a different randomized experiment, but still with 2N units,\nhalf to be allocated to active and half to be allocated to control, but now we have a covariate, X, a\nbackground variable that is suspected to be related to Y . For example, X could be blood pressure\ntoday, pre-treatment. In this experiment, many randomized allocations are considered, but all\nallocations are rejected if the sample X means of the treated and controls are too different for\nexample more than a standard deviation apart. Be careful here to note which results generalize\nand which do not.\nh) Finally, consider the randomized experiment in part g) when Nt units are treated and Nc are\ncontrol, where Nt and Nc are not equal: Which results in parts a),b),c) and d) generalize without\nmodification? In particular, describe how the conclusion in part f) changes. Note that this is an\ninteresting situation where the asymptotic distributions of sample means are not gaussian. What\nare these distributions?\n2"}, {"year": "2019", "subject": "Probability & Statistics", "paper": "2019_ProbaStat2019_team", "kind": "team", "n": 1, "chars": 156, "tags": ["概率论"], "d": 1.24, "text": "Suppose (Xn)n≥1 is a sequence of i.i.d. random variables and the common law is exponential with\nparameter one. Show that\nP\n·\nlim sup\nn→∞\nXn\nlog n = 1\n¸\n= 1."}, {"year": "2019", "subject": "Probability & Statistics", "paper": "2019_ProbaStat2019_team", "kind": "team", "n": 2, "chars": 204, "tags": ["概率论"], "d": 1.41, "text": "Let (Xn)n≥1 be i.i.d. real random variables and set Sn = Pn\ni=1 Xi for n ≥1. Suppose that for some\nconstant c ∈R we have Sn/n →c as n →∞almost surely. Show that X1 has a finite first moment\nand E[X1] = c."}, {"year": "2019", "subject": "Probability & Statistics", "paper": "2019_ProbaStat2019_team", "kind": "team", "n": 3, "chars": 199, "tags": [], "d": 1.27, "text": "Consider uniform permutation of {1, 2, . . . , n} and denote by Xn the number of cycles in the permu-\ntation. Find a sequence of reals (an)n≥1 such that\nlim\nn→∞\nE[Xn]\nan\n= 1,\nand justify your answer."}, {"year": "2019", "subject": "Probability & Statistics", "paper": "2019_ProbaStat2019_team", "kind": "team", "n": 4, "chars": 438, "tags": [], "d": 2.75, "text": "The Erd¨os-R´enyi random graph G(n, p) with parameters n ≥1 and p ∈[0, 1] is the random graph\nwhose vertex set is V = {1, 2, . . . , n} and where for each pair i ̸= j ∈V the edge i ↔j is present with\nprobability p independently of all the other pairs.\n(a) For ϵ > 0, if pn ≥(1 + ϵ) log n\nn , then\nP[G(n, pn) has an isolated vertex] →0,\nas n →∞.\n(b) For ϵ > 0, if pn ≤(1 −ϵ) log n\nn , then\nP[G(n, pn) has an isolated vertex] →1,\nas n →∞.\n1"}, {"year": "2020", "subject": "Algebra & Number Theory", "paper": "2020_Algebra_NumberTheory_algebra_and_numbertheory_20", "kind": "individual", "n": 1, "chars": 727, "tags": ["环与模", "线性代数/矩阵"], "d": 3.74, "text": ". Let F be a field of characteristic zero. Consider the polynomial ring F[x1,. . ., xn].\n(a) Prove Newton's identity over the field F\npk −pk−1e1 + · · · + (−1)k−1p1ek−1 + (−1)kkek = 0,\nwhere\nek(x1,. . ., xn) =\nÕ\n1≤i1<···<ßk ≤n\nxi1 · · · xik\nfor 1 ≤k ≤n, e0 = 1, ek = 0 when k > n, and\npk(x1,. . ., xn) = xk\n1 + · · · + xk\nn.\n(b) Prove that over the field of F of characteristic zero, an n × n matrix A is nilpotent if and only\nif the trace of Ak is equal to zero for all k = 1,2 . . .\nHint: use Part (a).\n(c) Prove that over the field of F of characteristic zero, two n × n matrix A and B have the\nsame characteristic polynomial if and only if the trace of Ak and trace of Bk are equal for all\nk = 1,2 . . .\nHint: use Part (a)."}, {"year": "2020", "subject": "Algebra & Number Theory", "paper": "2020_Algebra_NumberTheory_algebra_and_numbertheory_20", "kind": "individual", "n": 2, "chars": 406, "tags": ["环与模"], "d": 2.69, "text": ".\n(a) Let M be a finitely generated R-module and a ⊂R an ideal. Suppose φ : M →M is an\nR-module map such that φ(M) ⊆aM. Prove that there is a monic polynomial p(t) ⊂R[t]\nwith coefficients from a such that p(φ) = 0.\nHint: p(t) is basically just the characteristic polynomial.\n(b) If M is a finitely generated R-module such that aM = M for some ideal a ⊂R, then there exits\nx ∈R such that 1 −x ∈a and xM = 0."}, {"year": "2020", "subject": "Algebra & Number Theory", "paper": "2020_Algebra_NumberTheory_algebra_and_numbertheory_20", "kind": "individual", "n": 3, "chars": 183, "tags": [], "d": 2.24, "text": ". Let R = F[x, y]/(y2 −x2 −x3) for some field F.\n(a) Prove that R is an integral domain.\n(b) Compute the normalization of R (i.e., the integral closure of R in its field of fraction)."}, {"year": "2020", "subject": "Algebra & Number Theory", "paper": "2020_Algebra_NumberTheory_algebra_and_numbertheory_20", "kind": "individual", "n": 4, "chars": 521, "tags": ["Galois/域扩张", "群论", "线性代数/矩阵", "表示论", "数论"], "d": 4.17, "text": ".\nLet p and ℓbe two prime numbers and [ℓx] denote the ℓ-th cyclotomic polynomial\n1 + x + · · · + xℓ−1.\n(a) Prove that [ℓx] is an irreducible element of Q[x].\n(b) Show that [ℓx] is divisible by x −1 in Fp[x] if p = ℓ. Here Fp is the finite field Z/pZ.\n\n \n(c) Suppose p , ℓ. let a be the order of p in Fℓ. Show that a is the first value of m for which\nthe group GLm(Fp) of invertible m × m matrices with entries from Fp contains an element of\norder ℓ.\nHint: Derive and use the formula for the number of elements in GLm(Fp)."}, {"year": "2020", "subject": "Algebra & Number Theory", "paper": "2020_Algebra_NumberTheory_algebra_and_numbertheory_20", "kind": "individual", "n": 5, "chars": 470, "tags": ["群论", "环与模", "数论"], "d": 3.24, "text": ". Let p ≥3 be a prime number and let Zp be the ring of p-adic integers.\n(a) Show that an element in 1 + pZp is a p-th power in Zp if and only if it lives in 1 + p2Zp.\n(b) Let Z×\np denote the group of units in Zp. Show that there exist a, b,c ∈Z×\np such that ap+bp = cp\nif and only if\np−1\nÕ\ni=1\nip−2ti ≡0 (mod p)\nfor some integer t ∈{2,3,. . ., p −1}. (In particular, this condition holds for p = 7 by taking\nt = 3. Therefore, Fermat's Last Theorem does not hold for Z7.)"}, {"year": "2020", "subject": "Algebra & Number Theory", "paper": "2020_Algebra_NumberTheory_algebra_and_numbertheory_20", "kind": "individual", "n": 6, "chars": 818, "tags": ["数论", "经典场论/相对论"], "d": 3.79, "text": ". Recall that a metric space is called spherically complete if any decreasing sequence of\nclosed balls has nonempty intersection.\nLet p be a prime number and let Qp be the field of p-adic numbers. For every integer n ≥1,\nconsider the finite extension Qp(µpn) of Qp generated by all pn-th roots of unity. Let Qp(µp∞) =\n∪n≥1Qp(µpn). All of these algebraic extensions of Qp are equipped with the unique norm | · |\nextending the usual p-adic norm on Qp.\nQuestion: Which of the following are spherically complete? Explain why.\n(a) Qp;\n(b) Qp(µpn);\n(c) Qp(µp∞);\n(d)\n\nQp(µp∞), the completion of Qp(µp∞).\nHint: Show that there exists a sequence a1,a2,. . . ∈\nQp(µp∞) such that |a1| > |a2| > · · · and\nlim |ai| > 0, and such that the closed balls\nBi :=\nn\nx ∈\nQp(µp∞) : |x −a1 −a2 −· · · −ai| ≤|ai|\no\nhave empty intersection."}, {"year": "2020", "subject": "Analysis & PDE", "paper": "2020_Analysis_DifferentialEquations_analysis_and_differential_20", "kind": "individual", "n": 1, "chars": 242, "tags": [], "d": 1.38, "text": ". Let χ be a real valued smooth function with compact support on R. We assume that\n∫\nR1 χ(x)dx = 1.\nFor all ε > 0, we define\nχε(x) = 1\nε χ\n\u0010 x\nε\n\u0011\n.\nProve that for any given f ∈L1(R), for almost every x ∈R, we have\nlim\nε→0(χε ∗f )(x) = f (x)."}, {"year": "2020", "subject": "Analysis & PDE", "paper": "2020_Analysis_DifferentialEquations_analysis_and_differential_20", "kind": "individual", "n": 2, "chars": 658, "tags": ["Fourier/变换"], "d": 1.86, "text": ". In last year's Yau College Student Mathematics Contests, four students Tintin, Haddock,\nDupont and Dupond made it to the last round of the oral exam in analysis. Professor Yau asked them\nto compute the Fourier coefficients of the 2π-periodic function F (defined on R):\nF : (0,2π) →R,\nx 7→F(x) = arctan\n\u0010 x\n2π esin(x) + x2019(x −2π) + 2019 sin(x)\n\u0011\n.\nHere were their solutions: for k , 0,\nTintin : bF(k) = cos(kπ)\n|k|\n1\n2\n+ a\n|k| +\nb\n|k|3,\nHaddock : bF(k) = c\nk2 + d\nk4 + e\nk6,\nDupont : bF(k) = 1\nk + 1\nk2 + f\nk3 + g\nk5,\nDupond : bF(k) = 2019\n√\n−1\nk\n+ hk\nk ,\nwhere a, b,c, d,e, f,g, hk(k ∈Z) were constants and\nÕ\nk∈Z\n|hk|2 < ∞.\nWhose solutions were correct?"}, {"year": "2020", "subject": "Analysis & PDE", "paper": "2020_Analysis_DifferentialEquations_analysis_and_differential_20", "kind": "individual", "n": 3, "chars": 334, "tags": [], "d": 1.57, "text": ".\nLet B1 be the unit ball centered at the origin in R4 and u ∈W1,2(B1) ∩C∞(R4) be a\nnonnegative real valued function so that\n−△u ≤u2,\n\n \nwhere △=\n4\nÕ\ni=1\n∂2\n∂x2\ni\n. Prove that, there exists a constant ε > 0, so that if ∥u∥L2(B1) ≤ε, we have\n∥∇u∥L2(B 1\n2\n) ≤10000∥u∥L2(B1),\nwhere B 1\n2 is the ball of radius 1\n2 centered at the origin."}, {"year": "2020", "subject": "Analysis & PDE", "paper": "2020_Analysis_DifferentialEquations_analysis_and_differential_20", "kind": "individual", "n": 4, "chars": 170, "tags": ["复分析"], "d": 1.24, "text": ".\nLet f and g be two holomorphic functions defined on the entire complex plane C so\nthat for all z ∈C, we have\nf (z)2020 + g(z)2020 = 1.\nProve that f and g are constants."}, {"year": "2020", "subject": "Analysis & PDE", "paper": "2020_Analysis_DifferentialEquations_analysis_and_differential_20", "kind": "individual", "n": 5, "chars": 214, "tags": ["常微分方程"], "d": 1.26, "text": ". We consider the following ordinary differential equation:\n(\nx′′(t) + x(t) + x(t)3 = 0,\n(x(0), x′(0)) = (x0,0),\nwhere x(t) takes values in R. Prove that for all x0 ∈R, the solution of the above system is periodic."}, {"year": "2020", "subject": "Analysis & PDE", "paper": "2020_Analysis_DifferentialEquations_analysis_and_differential_20", "kind": "individual", "n": 6, "chars": 388, "tags": ["复分析"], "d": 1.61, "text": ". Let α ∈R and ak ∈C with |ak| < 1, where k = 1,2,. . .,n. We consider the following\nholomorphic map\nf :C −\n\b\n(a1)−1,. . .,(an)−1 \n→C,\nz 7→f (z) = e2\n√\n−1παz · z −a1\n1 −a1z · · · z −an\n1 −anz .\nLet S1 be the unit circle in C, i.e.,\nS1 =\n\b\nz ∈C\n\f\f |z| = 1\n \n.\nProve that f maps S1 to itself and f preserves the surface measure (i.e., dθ in terms of standard\npolar coordiantes of R2) of S1."}, {"year": "2020", "subject": "Computational & Applied", "paper": "2020_Applied_Math_and_Computational_Math_computational_and_applied_20", "kind": "individual", "n": 1, "chars": 389, "tags": [], "d": 1.61, "text": ".\nLet f ∈Ck+1[−1,1] and [−1,1] be partitioned into subintervals Ij = [(j −1)h, jh] of\nwidth h. Assume p is a polynomial of degree k which approximates f in Ij with\nmax\nx∈Ij\n\f\fpj(x) −f (x)\n\f\f ≤C0hk+1,\nwhere C0 is a constant independent of j. Show that there exists an another constant C, independent\nof j, such that\nmax\nx∈Ij±1\n\f\fpj(x) −f (x)\n\f\f ≤Chk+1.\n(as long as Ij±1 ⊂[−1,1], of course)."}, {"year": "2020", "subject": "Computational & Applied", "paper": "2020_Applied_Math_and_Computational_Math_computational_and_applied_20", "kind": "individual", "n": 2, "chars": 253, "tags": [], "d": 1.27, "text": ". Consider the iteration\nxn+1 = xn −\n\u0012\nxn −x0\nf (xn) −f (x0)\n\u0013\nf (xn)\nfor finding the roots of a two times continuous differentiable function f (x). Assuming the method\nconverges to a simple root x∗, what is the rate of convergence? Justify your answer."}, {"year": "2020", "subject": "Computational & Applied", "paper": "2020_Applied_Math_and_Computational_Math_computational_and_applied_20", "kind": "individual", "n": 3, "chars": 407, "tags": ["线性代数/矩阵"], "d": 1.93, "text": ".\nSuppose A is an m × m matrix with a complete set of orthonormal eigenvectors\nq1,. . .,qm and corresponding eigenvalues λ1,. . .,λm. Assume that |λ1| > |λ2| > |λ3| and λj ≥λj+1\nfor j = 3,. . .,m. Consider the power method v(k) = Av(k−1)/λ1, with v(0) = α1q1 + · · · + αmqm\nwhere α1 and α2 are both nonzero. Show that the sequence {v(k)}∞\nk=0 converges linearly to α1q1 with\nasymptotic constant C = |λ2/λ1|."}, {"year": "2020", "subject": "Computational & Applied", "paper": "2020_Applied_Math_and_Computational_Math_computational_and_applied_20", "kind": "individual", "n": 4, "chars": 402, "tags": ["常微分方程", "代数几何"], "d": 3.21, "text": ".\nFor the initial value problem y′ = f (t, y), y(0) = y0 on the interval [0, T], consider\nthe implicit two-step method\nyn+1 = 4\n3 yn −1\n3 yn−1 + 2h\n3 f (tn+1, yn+1),\ny1 = y0 + h f (t1, y0),\nwhere h is the step size and tn = nh.\n(a) What is the order of the accuracy of the scheme?\n(b) Check the stability of the scheme by analyzing the stability polynomial?\n(c) Find the stability region of the scheme."}, {"year": "2020", "subject": "Computational & Applied", "paper": "2020_Applied_Math_and_Computational_Math_computational_and_applied_20", "kind": "individual", "n": 5, "chars": 155, "tags": ["代数几何"], "d": 1.18, "text": ". Suppose the difference scheme un+1 = Bun is stable, and C(∆t) is a bounded family of\n\n \noperators. Show that the scheme\nun+1 = (B + ∆tC(∆t))un\nis stable."}, {"year": "2020", "subject": "Computational & Applied", "paper": "2020_Applied_Math_and_Computational_Math_computational_and_applied_20", "kind": "individual", "n": 6, "chars": 230, "tags": ["线性代数/矩阵"], "d": 1.32, "text": ".\nLet A be an m × m nonsingular matrix. Suppose infpn ∈Pn ||pn(A)|| = ||p∗(A)|| > 0\nwhere Pn denotes the set of all degree-n monic polynomials:\nPn = {p : p is a polynomial of degree n, p(z) = zn + · · · } .\nProve that p∗is unique."}, {"year": "2020", "subject": "Geometry & Topology", "paper": "2020_Geometry_Topology_geometry_and_topology_20", "kind": "individual", "n": 1, "chars": 374, "tags": [], "d": 3.05, "text": ".\nLet Sn be the unit sphere in Rn+1.\n(a) Find a 6-form α on R7 \\ {0} such that\ndα = 0,\nand\n∫\nS6 α = 1.\n(b) For any smooth map f : S11 →S6, show that there exists a 5-form ϕ on S11 such that\nf ∗α = dϕ.\n(1)\n(c) Let\nH( f ) =\n∫\nS11 ϕ ∧dϕ.\nShow that H( f ) is independent of the choice of ϕ satisfying (1).\n(d) Show that H( f ) is an even integer, for any smooth map f : S11 →S6."}, {"year": "2020", "subject": "Geometry & Topology", "paper": "2020_Geometry_Topology_geometry_and_topology_20", "kind": "individual", "n": 2, "chars": 301, "tags": ["微分几何"], "d": 1.47, "text": ".\nFor any h ∈C∞(R2) and h > 0 on R2, define the Ricci curvature Ric(h) associated\nwith h by\nRic(h) = 1\nh\n\u0010 ∂2\n∂x2 + ∂2\n∂y2\n\u0011\nlog h,\nwhere (x, y) are the standard Cartesian coordinates in R2. Either construct a positive smooth function\nh1 such that Ric(h1) = 1, or show that no such function h1 exists."}, {"year": "2020", "subject": "Geometry & Topology", "paper": "2020_Geometry_Topology_geometry_and_topology_20", "kind": "individual", "n": 3, "chars": 753, "tags": ["微分几何", "微分流形/形式"], "d": 4.26, "text": ".\nLet M be an n-dimensional Riemannian manifold, and p ∈M. Let {e1,. . .,en} be\nan orthonormal basis of the tangent space TpM, and let {x1,. . ., xn} be a coordinate system of M\ncentered at p such that\nexp−1\np (q) =\nn\nÕ\nj=1\nx j(q)ej,\nwhere expp denotes the exponential map. Let γ(t) = expp(te1), 0 ≤t ≤δ, where δ is a positive\nconstant less than 1.\n(a) For 2 ≤α ≤n, which one of the following,\nt ∂\n∂xα\n\f\f\f\f\nγ(t)\nor\n∂\n∂xα\n\f\f\f\f\nγ(t)\n,\nis a Jacobi field along γ(t)? Prove your assertion.\n\n \n(b) Denote\ngij =\nD ∂\n∂xi, ∂\n∂x j\nE\n,\n1 ≤i, j ≤n.\nCompute\n∂2g22\n∂x1∂x1\nat the point p.\n(c) Show that\nmax\n0≤t ≤δ\n\f\f\f\f\n∂g22\n∂x1 (γ(t))\n\f\f\f\f ≤CδA,\nwhere C > 0 is a constant depending only on n, and A is the C0-bound of the curvature tensor\nof M along γ(t), for 0 ≤t ≤δ."}, {"year": "2020", "subject": "Geometry & Topology", "paper": "2020_Geometry_Topology_geometry_and_topology_20", "kind": "individual", "n": 4, "chars": 323, "tags": ["群论", "线性代数/矩阵", "代数拓扑", "代数几何"], "d": 3.63, "text": ".\nLet SO(n) be the set of n × n orthogonal real matrices with determinant equal to 1.\nEndow SO(n) with the relative topology as a subspace of Euclidean space Rn2.\n(a) Show that SO(n) is compact.\n(b) Is SO(3) homeomorphic to the real projective space RP3? Prove your assertion.\n(c) Compute the fundamental group of SO(2020)."}, {"year": "2020", "subject": "Geometry & Topology", "paper": "2020_Geometry_Topology_geometry_and_topology_20", "kind": "individual", "n": 5, "chars": 382, "tags": [], "d": 2.53, "text": ".\nLet X be a topological space and π : R2 →X a covering map. Let K be a compact\nsubset of X and B the closed unit ball centered at the origin in R2.\n(a) Suppose π : R2 \\ B →X \\ K is a homeomorphism. Show that π : R2 →X is a homeomor-\nphism.\n(b) Suppose R2 \\ B is homeomorphic to X \\ K, where the homeomorphism may not be π. Is X\nnecessarily homeomorphic to R2? Prove your assertion."}, {"year": "2020", "subject": "Geometry & Topology", "paper": "2020_Geometry_Topology_geometry_and_topology_20", "kind": "individual", "n": 6, "chars": 249, "tags": ["群论", "线性代数/矩阵", "代数拓扑"], "d": 3.29, "text": ". Let Fn be the free group of rank n,\n(a) Give an example of a finite connected graph such that its fundamental group is F2.\n(b) Does F2 contain a proper subgroup isomorphic to F2?\n(c) Does F2 contain a proper finite index subgroup isomorphic to F2?"}, {"year": "2020", "subject": "Probability & Statistics", "paper": "2020_Prob_Stat_probability_and_statistics_20", "kind": "individual", "n": 1, "chars": 150, "tags": ["偏微分方程", "概率论"], "d": 1.44, "text": ". Let X be an essentially bounded random variable with mean zero. Show that\nEeX ≤cosh ∥X∥∞,\nwhere cosh x = ex+
