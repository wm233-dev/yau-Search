const DATA=[{"year": "2010", "subject": "Algebra & Number Theory", "paper": "2010_AlgebraNumberTheory_individual", "kind": "individual", "n": 1, "chars": 170, "tags": ["线性代数/矩阵"], "d": 1.21, "text": "Let V be a finite dimensional complex vector space. Let A, B be\ntwo linear endomorphisms of V satisfying AB −BA = B. Prove that\nthere is a common eigenvector for A and B."}, {"year": "2010", "subject": "Algebra & Number Theory", "paper": "2010_AlgebraNumberTheory_individual", "kind": "individual", "n": 2, "chars": 835, "tags": ["群论", "环与模", "线性代数/矩阵", "表示论", "范畴/同调代数"], "d": 4.69, "text": "Let M2(R) be the ring of 2 × 2 matrices with real entries. Its group\nof multiplicative units is GL2(R), consisting of invertible matrices in\nM2(R).\n(a) Find an injective homomorphism from the field C of complex\nnumbers into the ring M2(R).\n(b) Show that if φ1 and φ2 are two such homomorphisms, then there\nexists a g ∈GL2(R) such that φ2(x) = gφ1(x)g−1 for all x ∈C.\n(c) Let h be an element in GL2(R) whose characteristic polynomial\nf(x) is irreducible over R.\nLet F ⊂M2(R) be the subring\ngenerated by h and a · I for all a ∈R, where I is the idenity\nmatrix. Show that F is isomorphic to C.\n(d) Let h′ be any element in GL2(R) with the same characteristic\npolynomial f(x) as h in (c). Show that h and h′ are conjugate\nin GL2(R).\n(e) If f(x) in (c) and (d) is reducible over R, will the same conclu-\nsion on h and h′ hold? Give reasons."}, {"year": "2010", "subject": "Algebra & Number Theory", "paper": "2010_AlgebraNumberTheory_individual", "kind": "individual", "n": 3, "chars": 404, "tags": ["群论", "数论"], "d": 3.32, "text": "Let G be a non-abelian finite group. Let c(G) be the number of\nconjugacy classes in G Define c(G) := c(G)/|G|, (|G| = Card(G)).\n(a) Prove that c(G) ≤5\n8.\n(b) Is there a finite group H with c(H) = 5\n8?\n(c) (open ended question) Suppose that there exists a prime num-\nber p and an element x ∈G such that the cardinality of the\nconjugacy class of x is divisible by p. Find a good/sharp upper\nbound for c(G)."}, {"year": "2010", "subject": "Algebra & Number Theory", "paper": "2010_AlgebraNumberTheory_individual", "kind": "individual", "n": 4, "chars": 237, "tags": ["Galois/域扩张", "群论"], "d": 2.57, "text": "Let F be a splitting field over Q the polynomial x8−5 ∈Q[x]. Recall\nthat F is the subfield of C generated by all roots of this polynomial.\n1\n\n \n2\n(a) Find the degree [F : Q] of the number field F.\n(b) Determine the Galois group Gal(F/Q)."}, {"year": "2010", "subject": "Algebra & Number Theory", "paper": "2010_AlgebraNumberTheory_individual", "kind": "individual", "n": 5, "chars": 324, "tags": [], "d": 1.51, "text": "Let T ⊂N>0 be a finite set of positive integers. For each integer\nn > 0, define an to be the number of all finite sequences (t1, . . . , tm)\nwith m ≤n, ti ∈T for all i = 1, . . . , m and t1 + . . . + tm = n. Prove\nthat the infinite series\n1 +\nX\nn≥1\nan zn ∈C[[z]]\nis a rational function in z, and find this rational function."}, {"year": "2010", "subject": "Algebra & Number Theory", "paper": "2010_AlgebraNumberTheory_individual", "kind": "individual", "n": 6, "chars": 107, "tags": ["群论", "表示论", "经典场论/相对论"], "d": 1.6, "text": "Describe all the irreducible complex representations of the group S4\n(the symmetric group on four letters)."}, {"year": "2010", "subject": "Algebra & Number Theory", "paper": "2010_AlgebraNumberTheory_team", "kind": "team", "n": 1, "chars": 271, "tags": [], "d": 1.29, "text": "For a real number r, let [r] denote the maximal integer less or equal\nthan r.\nLet a and b be two positive irrational numbers such that\n1\na + 1\nb = 1.\nShow that the two sequences of integers [ax], [bx] for\nx = 1, 2, 3, · · · contain all natural numbers without repetition."}, {"year": "2010", "subject": "Algebra & Number Theory", "paper": "2010_AlgebraNumberTheory_team", "kind": "team", "n": 2, "chars": 218, "tags": [], "d": 1.34, "text": "Let n ≥2 be an integer and consider the Fermat equation\nXn + Y n = Zn,\nX, Y, Z ∈C[t].\nFind all nontrivial solution (X, Y, Z) of the above equation in the sense\nthat X, Y, Z have no common zero and are not all constant."}, {"year": "2010", "subject": "Algebra & Number Theory", "paper": "2010_AlgebraNumberTheory_team", "kind": "team", "n": 3, "chars": 184, "tags": ["数论"], "d": 2.23, "text": "Let p ≥7 be an odd prime number.\n(a) Evaluate the rational number cos(π/7) · cos(2π/7) · cos(3π/7).\n(b) Show that Q(p−1)/2\nn=1\ncos(nπ/p) is a rational number and deter-\nmine its value."}, {"year": "2010", "subject": "Algebra & Number Theory", "paper": "2010_AlgebraNumberTheory_team", "kind": "team", "n": 4, "chars": 187, "tags": ["Galois/域扩张", "群论", "表示论"], "d": 1.71, "text": "For a positive integer a, consider the polynomial\nfa = x6 + 3ax4 + 3x3 + 3ax2 + 1.\nShow that it is irreducible. Let F be the splitting field of fa. Show\nthat its Galois group is solvable."}, {"year": "2010", "subject": "Algebra & Number Theory", "paper": "2010_AlgebraNumberTheory_team", "kind": "team", "n": 6, "chars": 275, "tags": ["群论", "表示论", "经典场论/相对论"], "d": 2.83, "text": "Prove that a group of order 150 is not simple.\nLet V ∼= C2 be the standard representation of SL2(C).\n(a) Show that the n-th symmetric power Vn = Symn V is irre-\nducible.\n(b) Which Vn appear in the decomposition of the tensor product\nV2 ⊗V3 into irreducible representations?\n1"}, {"year": "2010", "subject": "Analysis & PDE", "paper": "2010_Analysis_and_differential_equations_individual", "kind": "individual", "n": 1, "chars": 168, "tags": [], "d": 2.28, "text": "a) Let xk, k = 1, . . . , n be real numbers from the interval (0, π)\nand define x =\nn\nX\ni=1\nxi\nn\n. Show that\nn\nY\nk=1\nsin xk\nxk\n≤\nµsin x\nx\n¶n\n.\nb) From\nZ ∞\n0\ne−x2dx =\n√π"}, {"year": "2010", "subject": "Analysis & PDE", "paper": "2010_Analysis_and_differential_equations_individual", "kind": "individual", "n": 2, "chars": 174, "tags": [], "d": 1.24, "text": ",\ncalculate the integral\nR ∞\n0 sin(x2)dx.\n2. Let f : R →R be any function. Prove that the set of points x in\nR where f is continuous is a countable intersection of open sets."}, {"year": "2010", "subject": "Analysis & PDE", "paper": "2010_Analysis_and_differential_equations_individual", "kind": "individual", "n": 3, "chars": 178, "tags": ["复分析"], "d": 1.33, "text": "Let f(z) be holomorphic in D: |z| < 1 and |f(z)| ≤1 (z ∈D). If\nz0 is a point in D such that both z0 and −z0 are zeros of order m of\nf(z) and 0 < |z0| ≤m −1\nm\n, then |f(0)| < e−2."}, {"year": "2010", "subject": "Analysis & PDE", "paper": "2010_Analysis_and_differential_equations_individual", "kind": "individual", "n": 4, "chars": 245, "tags": ["调和/位势"], "d": 1.28, "text": "Find a harmonic function f on the right half-plane such that when\napproaching any point in the positive half of the y-axis, the function\nhas limit 1, while when approaching any point in the negative half of\nthe y-axis, the function has limit −1."}, {"year": "2010", "subject": "Analysis & PDE", "paper": "2010_Analysis_and_differential_equations_individual", "kind": "individual", "n": 5, "chars": 454, "tags": ["实分析/测度"], "d": 1.62, "text": "Let K(x, y) ∈L1([0, 1] × [0, 1]). For all f ∈C0[0, 1], the space of\ncontinuous functions on [0, 1], define a function\nTf(x) =\nZ 1\n0\nK(x, y)f(y)dy\nProve that Tf ∈C0([0, 1]). Moreover Ω= {Tf| ||f||sup ≤1} is pre-\ncompact in C0([0, 1]), i.e. every sequence in Ωhas a converging subse-\nquence, here ||f||sup = sup{|f(x)||x ∈[0, 1]}. (Hint: Every Lebesgue\nintegrable function over the square can be approximated by polynomial\nfunctions in the L1 norm.)\n1\n\n \n2"}, {"year": "2010", "subject": "Analysis & PDE", "paper": "2010_Analysis_and_differential_equations_individual", "kind": "individual", "n": 6, "chars": 154, "tags": [], "d": 1.29, "text": "Consider the equation ˙x = −x + f(t, x), where |f(t, x)| ≤φ(t)|x|\nfor all (t, x) ∈R × R,\nR ∞φ(t)dt < ∞.\nProve that every solution\napproaches zero as t →∞."}, {"year": "2010", "subject": "Analysis & PDE", "paper": "2010_Analysis_and_differential_equations_team", "kind": "team", "n": 1, "chars": 235, "tags": ["复分析"], "d": 2.41, "text": "a) Let f(z) be holomorphic in D: |z| < 1 and |f(z)| ≤1 (z ∈\nD). Prove that\n|f(0)| −|z|\n1 + |f(0)||z| ≤|f(z)| ≤|f(0)| + |z|\n1 −|f(0)||z|.\n(z ∈D)\nb) For any finite complex value a, prove that\n1\n2π\nZ 2π\n0\nlog |a −eiθ|dθ = max{log |a|, 0}."}, {"year": "2010", "subject": "Analysis & PDE", "paper": "2010_Analysis_and_differential_equations_team", "kind": "team", "n": 2, "chars": 97, "tags": [], "d": 1.19, "text": "Let f ∈C1(R), f(x + 1) = f(x), for all x, then we have\n||f||∞≤\nZ 1\n0\n|f(t)|dt +\nZ 1\n0\n|f\n′(t)|dt."}, {"year": "2010", "subject": "Analysis & PDE", "paper": "2010_Analysis_and_differential_equations_team", "kind": "team", "n": 3, "chars": 138, "tags": ["常微分方程"], "d": 1.14, "text": "Consider the equation\n¨x + (1 + f(t))x = 0.\nWe assume that\nR ∞|f(t)|dt < ∞. Study the Lyapunov stability of the\nsolution (x, ˙x) = (0, 0)."}, {"year": "2010", "subject": "Analysis & PDE", "paper": "2010_Analysis_and_differential_equations_team", "kind": "team", "n": 4, "chars": 157, "tags": [], "d": 1.28, "text": "Suppose f : [a, b] →R be a L1-integrable function. Extend f to be\n0 outside the interval [a, b]. Let\nφ(x) = 1\n2h\nZ x+h\nx−h\nf\nShow that\nZ b\na\n|φ| ≤\nZ b\na\n|f|."}, {"year": "2010", "subject": "Analysis & PDE", "paper": "2010_Analysis_and_differential_equations_team", "kind": "team", "n": 5, "chars": 304, "tags": [], "d": 1.4, "text": "Suppose f ∈L1[0, 2π], ˆf(n) =\n1\n2π\nR 2π\n0\nf(x)e−inxdx, prove that\n1)\n∞\nX\n|n|=0\n| ˆf(n)|2 < ∞implies f ∈L2[0, 2π],\n2)\nX\nn\n|n ˆf(n)| < ∞implies that f = f0, a.e., f0 ∈C1[0, 2π],\nwhere C1[0, 2π] is the space of functions f over [0, 1] such\nthat both f and its derivative f\n′ are continuous functions.\n1\n\n \n2"}, {"year": "2010", "subject": "Analysis & PDE", "paper": "2010_Analysis_and_differential_equations_team", "kind": "team", "n": 6, "chars": 287, "tags": [], "d": 1.36, "text": "Let Ωbe a bounded domain of Rn and let f be a smooth function\ndefined in [0, +∞) such that f(t)/t is strictly decreasing. Assume that\nu1 and u2 are positive solutions of\n∆u + f(u) = 0 in Ω, u = 0 on ∂Ω\nShow that u1 = u2. (Hint: Calculate ∆log u2\nu1 and consider the maxi-\nmum principle.)"}, {"year": "2010", "subject": "Probability & Statistics", "paper": "2010_Applied_Computational_Probability_and_Statistics_individual", "kind": "individual", "n": 1, "chars": 97, "tags": ["概率论"], "d": 1.13, "text": "Let Z1, · · · , Zn be i.i.d. random variables with Zi ∼N(µ, σ2). Find\nE(\nn\nX\ni=1\nZi|Z1 −Z2 + Z3)."}, {"year": "2010", "subject": "Probability & Statistics", "paper": "2010_Applied_Computational_Probability_and_Statistics_individual", "kind": "individual", "n": 2, "chars": 156, "tags": [], "d": 1.25, "text": "Let X1, · · · , Xn be pairwise independent.\nFurther, assume that\nEXi = 1 + i−1 and that max1≤i≤n E|Xi|1+ϵ < ∞for some ϵ > 0.\nShow that\n1\nn\nn\nX\ni=1\nXi\nP\n−→1."}, {"year": "2010", "subject": "Probability & Statistics", "paper": "2010_Applied_Computational_Probability_and_Statistics_individual", "kind": "individual", "n": 3, "chars": 105, "tags": ["概率论"], "d": 1.14, "text": "Let Z1, · · · , Z6 be i.i.d. random variables with Zi ∼N(0, 1). Set\nU 2 = (Z1Z2 + Z3Z4 + Z5Z6)2\nZ2\n2 + Z2"}, {"year": "2010", "subject": "Probability & Statistics", "paper": "2010_Applied_Computational_Probability_and_Statistics_individual", "kind": "individual", "n": 4, "chars": 547, "tags": ["数理统计"], "d": 2.5, "text": "+ Z2\n6\n,\nV 2 = U 2(Z2\n2 + Z2\n4)\nU 2 + Z2\n6\n.\nFind and identify the densities of U 2 and V 2.\n4. Suppose that three characteristics in a large propulation can be\nobserved according to the following frequencies\np1 = θ3,\np2 = 3θ(1 −θ),\np3 = (1 −θ)3,\nwhere θ ∈(0, 1). Let Nj, j = 1, 2, 3 be the observed frequencies of\ncharacteristic j in a random sample of size n.\n(a) Construct the approximate level (1 −α) maximum likelihood\nconfidence set for θ.\n(b) Derive the asymptotic distribution for the frequency substitu-\ntion estimator ˆθ2 = 1 −(N3/n)1/3."}, {"year": "2010", "subject": "Probability & Statistics", "paper": "2010_Applied_Computational_Probability_and_Statistics_individual", "kind": "individual", "n": 5, "chars": 872, "tags": ["线性代数/矩阵"], "d": 3.5, "text": "(1) Suppose\nS =\n·\nσ\nuT\n0\nSc\n¸\n,\nT =\n·\nτ\nvT\n0\nTc\n¸\n,\nb =\n·\nβ\nbc\n¸\n,\nwhere σ, τ and β are scalars, Sc and Tc are n-by-n matrices,\nand bc is an n-vector. Show that if there exists a vector xc such\nthat\n(ScTc −λI)xc = bc\n1\n\n \n2\nand wc = Tcxc is available, then\nx =\n·\nγ\nxc\n¸\n,\nγ = β −σvTxc −uTwc\nστ −λ\nsolves (ST −λI)x = b.\n(2) Hence or otherwise, derive an O(n2) algorithm for solving the\nlinear system (U1U2 −λI)x = b where U1 and U2 are n-by-\nn upper triangular matrices, and (U1U2 −λI) is nonsingular.\nPlease write down your algorithm and prove that it is indeed of\nO(n2) complexity.\n(3) Hence or otherwise, derive an O(pn2) algorithm for solving the\nlinear system (U1U2 · · · Up −λI)x = b where {Ui}p\ni=1 are all n-\nby-n upper triangular matrices, and (U1U2 · · · Up −λI) is non-\nsingular. Please write down your algorithm and prove that it is\nindeed of O(pn2) complexity."}, {"year": "2010", "subject": "Probability & Statistics", "paper": "2010_Applied_Computational_Probability_and_Statistics_individual", "kind": "individual", "n": 6, "chars": 422, "tags": ["线性代数/矩阵"], "d": 2.69, "text": "(1) Let A ∈Rm×n, i.e. A is an m-by-n real matrix. Show that\nthere exists an m-by-m orthogonal matrix U and an n-by-n\northogonal matrix V such that\nU TAV = diag(σ1, σ2, . . . , σp),\nwhere p = min{m, n} and\nσ1 ≥σ2 ≥. . . ≥σp ≥0.\n(2) Let rank(A)= r. Show that for any positive integer k < r,\nmin\nrank(B)=k∥A −B∥2 = σk+1.\n(Hint: Consider the matrix Ak =\nk\nX\ni=1\nσiuivT\ni , where ui and vi\nare columns of U and V respectively.)"}, {"year": "2010", "subject": "Probability & Statistics", "paper": "2010_Applied_Computational_Probability_and_Statistics_team", "kind": "team", "n": 1, "chars": 300, "tags": [], "d": 1.27, "text": "Let X1, · · · , Xn be independent and identically distributed random\nvariables with continuous distribution functions F(x1), · · · , F(xn), re-\nspectively. Let Y1 < · · · < Yn be the order statistics of X1, · · · , Xn.\nProve that Zj = F(Yj) has the beta (j, n −j + 1) distribution (j =\n1, · · · , n)."}, {"year": "2010", "subject": "Probability & Statistics", "paper": "2010_Applied_Computational_Probability_and_Statistics_team", "kind": "team", "n": 2, "chars": 95, "tags": ["概率论"], "d": 1.12, "text": "Let X1, · · · , Xn be i.i.d. random variable with a continuous density\nf at point 0. Let\nYn,i ="}, {"year": "2010", "subject": "Probability & Statistics", "paper": "2010_Applied_Computational_Probability_and_Statistics_team", "kind": "team", "n": 3, "chars": 411, "tags": [], "d": 1.58, "text": "4bn\n(1 −X2\ni /b2\nn)I(|Xi| ≤bn).\nShow that\nPn\ni=1(Yn,i −EYn,i)\n(bn\nPn\ni=1 Yn,i)1/2\nL\n−→N(0, 3/5),\nprovided bn →0 and nbn →∞.\n3. Let X1, · · · , Xn be independently and indentically distributed ran-\ndom variables with Xi ∼N(θ, 1). Suppose that it is known that |θ| ≤τ,\nwhere τ is given. Show\nmin\na1,··· ,an+1 sup\n|θ|≤τ\nE(\nn\nX\ni=1\naiXi + an+1 −θ)2 =\nτ 2n−1\nτ 2 + n−1.\nHint: Carefully use the sufficiency principle."}, {"year": "2010", "subject": "Probability & Statistics", "paper": "2010_Applied_Computational_Probability_and_Statistics_team", "kind": "team", "n": 4, "chars": 982, "tags": ["概率论", "数理统计"], "d": 3.87, "text": "The rules for \"1 and 1\" foul shooting in basketball are as follows.\nThe shooter gets to try to make a basket from the foul line.\nIf he\nsucceeds, he gets another try. More precisely, he make 0 baskets by\nmissing the first time, 1 basket by making the first shot and xsmissing\nthe second one, or 2 baskets by making both shots.\nLet n be a fixed integer, and suppose a player gets n tries at \" 1 and\n1\" shooting. Let N0, N1, and N2 be the random variables recording\nthe number of times he makes 0, 1, or 2 baskets, respectively. Note\nthat N0 + N1 + N2 = n. Suppose that shots are independent Bernoulli\ntrails with probability p for making a basket.\n(a) Write down the likelihood for (N0, N1, N2).\n1\n\n \n2\n(b) Show that the maximum likelihood estimator of p is\nˆp =\nN1 + 2N2\nN0 + 2N1 + 2N2\n.\n(c) Is ˆp an unbiased estimator for p? Prove or disprove. (Hint: Eˆp\nis a polynomial in p, whose order is higher than 1 for p ∈(0, 1).)\n(d) Find the asymptotic distribution of ˆp as n tends to ∞."}, {"year": "2010", "subject": "Probability & Statistics", "paper": "2010_Applied_Computational_Probability_and_Statistics_team", "kind": "team", "n": 5, "chars": 1527, "tags": ["偏微分方程", "代数几何", "数值分析"], "d": 4.81, "text": "When considering finite difference schemes approximating partial\ndifferential equations (PDEs), for example, the scheme\n(1)\nun+1\nj\n= un\nj −λ(un\nj −un\nj−1)\nwhere λ = ∆t\n∆x, approximating the PDE\n(2)\nut + ux = 0,\nwe are often interested in stability, namely\n(3)\n||un|| ≤C||u0||,\nn∆t ≤T\nfor a constant C = C(T) independent of the time step ∆t and the spa-\ntial mesh size ∆x. Here ||·|| is a given norm, for example the L2 norm or\nthe L∞norm, of the numerical solution vector un = (un\n1, un\n2, · · · , un\nN).\nThe mesh points are xj = j∆x, tn = n∆t, and the numerical solution\nun\nj approximates the exact solution u(xj, tn) of the PDE (2) with a\nperiodic boundary condition.\n(i) Prove that the scheme (1) is stable in the sense of (3) for both\nthe L2 norm and the L∞norm under the time step restriction\nλ ≤1.\n(ii) Since the numerical solution un is in a finite dimensional space,\nStudent A argues that the stability (3), once proved for a spe-\ncific norm || · ||a, would also automatically hold for any other\nnorm || · ||b. His argument is based on the equivalency of all\nnorms in a finite dimensional space, namely for any two norms\n|| · ||a and || · ||b on a finite dimensional space W, there exists a\nconstant δ > 0 such that\nδ||u||b ≤||u||a ≤1\nδ||u||b.\nDo you agree with his argument? If yes, please give a detailed\nproof of the following theorem: If a scheme is stable, namely (3)\nholds for one particular norm (e.g. the L2 norm), then it is also\nstable for any other norm. If not, please explain the mistake\nmade by Student A."}, {"year": "2010", "subject": "Probability & Statistics", "paper": "2010_Applied_Computational_Probability_and_Statistics_team", "kind": "team", "n": 6, "chars": 1032, "tags": ["线性代数/矩阵", "偏微分方程", "代数几何", "数值分析"], "d": 4.54, "text": "We have the following 3 PDEs\n(4)\nut + Aux = 0,\n(5)\nut + Bux = 0,\n\n \n3\n(6)\nut + Cux = 0,\nC = A + B.\nHere u is a vector of size m and A and B are m × m real matrices.\nWe assume m ≥2 and both A and B are diagonalizable with only real\neigenvalues. We also assume periodic initial condition for these PDEs.\n(i) Prove that (4) and (5) are both well-posed in the L2-norm.\nRecall that a PDE is well-posed if its solution satisfies\n||u(·, t)|| ≤C(T)||u(·, 0)||,\n0 ≤t ≤T\nfor a constant C(T) which depends only on T.\n(ii) Is (6) guaranteed to be well-posed as well? If yes, give a proof;\nif not, give a counter example.\n(iii) Suppose we have a finite difference scheme\nun+1 = Ahun\nfor approximating (4) and another scheme\nun+1 = Bhun\nfor approximating (5). Suppose both schemes are stable in the\nL2-norm, namely (3) holds for both schemes. If we now form\nthe splitting scheme\nun+1 = Bh Ahun\nwhich is a consistent scheme for solving (6), is this scheme guar-\nanteed to be L2 stable as well? If yes, give a proof; if not, give\na counter example."}, {"year": "2010", "subject": "Geometry & Topology", "paper": "2010_GeometryTopology_indi", "kind": "individual", "n": 1, "chars": 241, "tags": ["微分几何", "经典场论/相对论"], "d": 1.52, "text": "Let D∗= {(x, y) ∈R2 | 0 < x2 +y2 < 1} be the punctured unit disc\nin the Euclidean plane. Let g be the complete Riemannian metric on\nD∗with contsant curvature −1. Find the disctance under the metric\nbetween the points (e−2π, 0) and (−e−π, 0)."}, {"year": "2010", "subject": "Geometry & Topology", "paper": "2010_GeometryTopology_indi", "kind": "individual", "n": 2, "chars": 112, "tags": ["微分几何"], "d": 1.12, "text": "Show that every closed hypersurface in Rn has a point at which the\nsecond fundamental form is positive definite."}, {"year": "2010", "subject": "Geometry & Topology", "paper": "2010_GeometryTopology_indi", "kind": "individual", "n": 3, "chars": 80, "tags": ["代数几何"], "d": 1.11, "text": "Prove that the real projective space RP n is orientable if and only if\nn is odd."}, {"year": "2010", "subject": "Geometry & Topology", "paper": "2010_GeometryTopology_indi", "kind": "individual", "n": 4, "chars": 372, "tags": ["代数拓扑", "微分流形/形式"], "d": 1.76, "text": "Suppose π : M1 −→M2 is a C∞map of one connected differentiable\nmanifold to another. And suppose for each p ∈M1, the differential\nπ∗: TpM1 −→Tπ(p)M2 is a vector space isomorphism.\n(a). Show that if M1 is connected, then π is a covering space projection.\n(b). Given an example where M2 is compact but π : M1 −→M2 is not\na covering space (but has the π∗isomorphism property)."}, {"year": "2010", "subject": "Geometry & Topology", "paper": "2010_GeometryTopology_indi", "kind": "individual", "n": 5, "chars": 106, "tags": ["代数拓扑"], "d": 1.13, "text": "Let Σg be the closed orientable surface of genus g. Show that if\ng > 1, then Σg is a covering space of Σ2."}, {"year": "2010", "subject": "Geometry & Topology", "paper": "2010_GeometryTopology_indi", "kind": "individual", "n": 6, "chars": 225, "tags": ["微分流形/形式", "辛几何/力学"], "d": 1.5, "text": "Let M be a smooth 4-dimensional manifold. A symplectic form is a\nclosed 2-form ω on M such that ω ∧ω is a nowhere vanishing 4-form.\n(a). Construct a symplectic form on R4.\n(b). Show that there are no symplectic forms on S4.\n1"}, {"year": "2010", "subject": "Geometry & Topology", "paper": "2010_GeometryTopology_team", "kind": "team", "n": 1, "chars": 445, "tags": ["复分析", "经典场论/相对论"], "d": 1.89, "text": "Let Sn ⊂Rn+1 be the unit sphere, and Rn ⊂Rn+1 the equator n-\nplane through the center of Sn. Let N be the north pole of Sn. Define\na mapping π : Sn\\{N} →Rn called the stereographic projection that\ntakes A ∈Sn\\{N} into the intersection A′ ∈Rn of the equator n-\nplane Rn with the line which passes through A and N. Prove that the\nstereographic projection is a conformal change, and derive the standard\nmetric of Sn by the stereographic projection."}, {"year": "2010", "subject": "Geometry & Topology", "paper": "2010_GeometryTopology_team", "kind": "team", "n": 2, "chars": 245, "tags": ["微分几何", "微分流形/形式"], "d": 1.64, "text": "Let M be a (connected) Riemannian manifold of dimension 2. Let f\nbe a smooth non-constant function on M such that f is bounded from\nabove and ∆f ≥0 everywhere on M. Show that there does not exist\nany point p ∈M such that f(p) = sup{f(x) : x ∈M}."}, {"year": "2010", "subject": "Geometry & Topology", "paper": "2010_GeometryTopology_team", "kind": "team", "n": 3, "chars": 150, "tags": ["微分流形/形式"], "d": 1.21, "text": "Let M be a compact smooth manifold of dimension d. Prove that\nthere exists some n ∈Z+ such that M can be regularly embedded in\nthe Euclidean space Rn."}, {"year": "2010", "subject": "Geometry & Topology", "paper": "2010_GeometryTopology_team", "kind": "team", "n": 4, "chars": 192, "tags": ["微分流形/形式"], "d": 1.23, "text": "Show that any C∞function f on a compact smooth manifold M\n(without boundary) must have at least two critical points. When M is\nthe 2-torus, show that f must have more than two critical points."}, {"year": "2010", "subject": "Geometry & Topology", "paper": "2010_GeometryTopology_team", "kind": "team", "n": 5, "chars": 109, "tags": ["范畴/同调代数", "代数拓扑"], "d": 1.42, "text": "Construct a space X with H0(X) = Z, H1(X) = Z2 × Z3, H2(X) =\nZ, and all other homology groups of X vanishing."}, {"year": "2010", "subject": "Geometry & Topology", "paper": "2010_GeometryTopology_team", "kind": "team", "n": 6, "chars": 284, "tags": [], "d": 1.42, "text": "(a). Define the degree deg f of a C∞map f : S2 −→S2 and prove\nthat deg f as you present it is well-defined and independent of any\nchoices you need to make in your definition.\n(b). Prove in detail that for each integer k (possibly negative), there\nis a C∞map f : S2 −→S2 of degree k.\n1"}, {"year": "2011", "subject": "Analysis & PDE", "paper": "2011_1_AnalysisDiffEquation_Individual_2011", "kind": "individual", "n": 1, "chars": 163, "tags": [], "d": 2.21, "text": "a) Compute the integral:\nR ∞\n−∞\nx cos xdx\n(x2+1)(x2+2),\nb) Show that there is a continuous function f : [0, +∞) →(−∞, +∞)\nsuch that f ̸≡0 and f(4x) = f(2x) + f(x)."}, {"year": "2011", "subject": "Analysis & PDE", "paper": "2011_1_AnalysisDiffEquation_Individual_2011", "kind": "individual", "n": 2, "chars": 87, "tags": [], "d": 2.12, "text": "Solve the following problem:\n½ d2u\ndx2 −u(x) = 4e−x,\nx ∈(0, 1),\nu(0) = 0,\ndu\ndx(0) = 0."}, {"year": "2011", "subject": "Analysis & PDE", "paper": "2011_1_AnalysisDiffEquation_Individual_2011", "kind": "individual", "n": 3, "chars": 99, "tags": ["复分析"], "d": 1.09, "text": "Find an explicit conformal transformation of an open set U = {|z| >\n1} \\ (−∞, −1] to the unit disc."}, {"year": "2011", "subject": "Analysis & PDE", "paper": "2011_1_AnalysisDiffEquation_Individual_2011", "kind": "individual", "n": 4, "chars": 163, "tags": [], "d": 1.48, "text": "Assume f ∈C2[a, b] satisfying |f(x)| ≤A, |f\n′′(x)| ≤B for each\nx ∈[a, b] and there exists x0 ∈[a, b] such that |f\n′(x0)| ≤D, then\n|f\n′(x)| ≤2\n√\nAB + D, ∀x ∈[a, b]."}, {"year": "2011", "subject": "Analysis & PDE", "paper": "2011_1_AnalysisDiffEquation_Individual_2011", "kind": "individual", "n": 5, "chars": 364, "tags": ["泛函分析"], "d": 1.59, "text": "Let C([0, 1]) denote the Banach space of real valued continuous\nfunctions on [0, 1] with the sup norm, and suppose that X ⊂C([0, 1])\nis a dense linear subspace. Suppose l : X →R is a linear map (not\nassumed to be continuous in any sense) such that l(f) ≥0 if f ∈X\nand f ≥0. Show that there is a unique Borel measure µ on [0, 1] such\nthat l(f) =\nR\nfdµ for all f ∈X."}, {"year": "2011", "subject": "Analysis & PDE", "paper": "2011_1_AnalysisDiffEquation_Individual_2011", "kind": "individual", "n": 6, "chars": 458, "tags": ["Fourier/变换"], "d": 1.59, "text": "For s ≥0, let Hs(T) be the space of L2 functions f on the circle\nT = R/(2πZ) whose Fourier coefficients ˆfn =\nR 2π\n0\ne−inxf(x)dx satisfy\nΣ(1 + n2)s|| ˆfn|2 < ∞, with norm ||f||2\ns = (2π)−1Σ(1 + n2)s| ˆfn|2.\na. Show that for r > s ≥0, the inclusion map i : Hr(T) →Hs(T) is\ncompact.\nb.\nShow that if s > 1/2, then Hs(T) includes continuously into\nC(T), the space of continuous functions on T, and the inclusion map\nis compact.\n1\n附件/试卷 1\nAppendix/Contest Paper 1"}, {"year": "2011", "subject": "Computational & Applied", "paper": "2011_2_AppliedMathProb_Individual_2011", "kind": "individual", "n": 1, "chars": 1174, "tags": [], "d": 3.7, "text": "Given a weight function ρ(x) > 0, let the inner-product correspond-\ning to ρ(x) be defined as follows:\n(f, g) :=\nZ b\na\nρ(x)f(x)g(x)dx,\nand let ∥f∥:= (f, f).\n(1) Define a sequence of polynomials as follows:\np0(x)\n=\n1,\np1(x) = x −a1,\npn(x)\n=\n(x −an)pn−1(x) −bnpn−2(x),\nn = 2, 3, · · ·\nwhere\nan\n=\n(xpn−1, pn−1)\n(pn−1, pn−1) ,\nn = 1, 2, · · ·\nbn\n=\n(xpn−1, pn−2)\n(pn−2, pn−2) ,\nn = 2, 3, · · · .\nShow that {pn(x)} is an orthogonal sequence of monic polyno-\nmials.\n(2) Let {qn(x)} be an orthogonal sequence of monic polynomials\ncorresponding to the ρ inner product. (A polynomial is called\nmonic if its leading coefficient is 1.) Show that {qn(x)} is unique\nand it minimizes ∥qn∥amongst all monic polynomials of degree\nn.\n(3) Hence or otherwise, show that if ρ(x) = 1/\n√\n1 −x2 and [a, b] =\n[−1, 1], then the corresponding orthogonal sequence is the Cheby-\nshev polynomials:\nTn(x) = cos(n arccos x),\nn = 0, 1, 2, · · · .\nand the following recurrent formula holds:\nTn+1(x) = 2xTn(x) −Tn−1(x),\nn = 1, 2, · · · .\n(4) Find the best quadratic approximation to f(x) = x3 on [−1, 1]\nusing ρ(x) = 1/\n√\n1 −x2.\n1\n附件/试卷 2\nAppendix/Contest Paper 2\n\n \nApplied Math. Prob. Stat., 2011-Individual"}, {"year": "2011", "subject": "Computational & Applied", "paper": "2011_2_AppliedMathProb_Individual_2011", "kind": "individual", "n": 2, "chars": 146, "tags": [], "d": 2.66, "text": "2. If two polynomials p(x) and q(x), both of fifth degree, satisfy\np(i) = q(i) = 1\ni ,\ni = 2, 3, 4, 5, 6,\nand\np(1) = 1,\nq(1) = 2,\nfind p(0) −q(0)."}, {"year": "2011", "subject": "Computational & Applied", "paper": "2011_2_AppliedMathProb_Individual_2011", "kind": "individual", "n": 3, "chars": 426, "tags": [], "d": 1.62, "text": "Lay aside m black balls and n red balls in a jug. Supposes 1 ≤r ≤\nk ≤n. Each time one draws a ball from the jug at random.\n1) If each time one draws a ball without return, what is the prob-\nability that in the k-th time of drawing one obtains exactly the\nr-th red ball?\n2) If each time one draws a ball with return, what is the probability\nthat in the first k times of drawings one obtained totally an odd\nnumber of red balls?"}, {"year": "2011", "subject": "Computational & Applied", "paper": "2011_2_AppliedMathProb_Individual_2011", "kind": "individual", "n": 4, "chars": 172, "tags": [], "d": 1.25, "text": "Let X and Y be independent and identically distributed random\nvariables. Show that\nE[|X + Y |] ≥E[|X|].\nHint: Consider separately two cases: E[X+] ≥E[X−] and E[X+] <\nE[X−]."}, {"year": "2011", "subject": "Computational & Applied", "paper": "2011_2_AppliedMathProb_Individual_2011", "kind": "individual", "n": 5, "chars": 632, "tags": ["数理统计"], "d": 3.22, "text": "Suppose that X1, · · · , Xn are a random sample from the Bernoulli\ndistribution with probability of success p1 and Y1, · · · , Yn be an inde-\npendent random sample from the Bernoulli distribution with probabil-\nity of success p2.\n(a) Give a minimum sufficient statistic and the UMVU (uniformly\nminimum variance unbiased) estimator for θ = p1 −p2.\n(b) Give the Cramer-Rao bound for the variance of the unbiased\nestimators for v(p1) = p1(1 −p1) or the UMVU estimator for\nv(p1).\n(c) Compute the asymptotic power of the test with critical region\n|√n(ˆp1 −ˆp2)/\np\n2ˆpˆq| ≥z1−α\nwhen p1 = p and p2 = p + n−1/2∆, where ˆp = 0.5ˆp1 + 0.5ˆp2."}, {"year": "2011", "subject": "Computational & Applied", "paper": "2011_2_AppliedMathProb_Individual_2011", "kind": "individual", "n": 6, "chars": 1484, "tags": ["数理统计"], "d": 4.09, "text": "Suppose that an experiment is conducted to measure a constant θ.\nIndependent unbiased measurements y of θ can be made with either\nof two instruments, both of which measure with normal errors: for\ni = 1, 2, instrument i produces independent errors with a N(0, σ2\ni )\ndistribution. The two error variances σ2\n1 and σ2\n2 are known. When a\nmeasurement y is made, a record is kept of the instrument used so that\nafter n measurements the data is (a1, y1), . . . , (an, yn), where am = i if\nym is obtained using instrument i. The choice between instruments is\nmade independently for each observation in such a way that\nP(am = 1) = P(am = 2) = 0.5,\n1 ≤m ≤n.\n附件/试卷 2\nAppendix/Contest Paper 2\n\n \nApplied Math. Prob. Stat., 2011-Individual\n3\nLet x denote the entire set of data available to the statistician, in this\ncase (a1, y1), . . . , (an, yn), and let lθ(x) denote the corresponding log\nlikelihood function for θ. Let a =\nn\nX\nm=1\n(2 −am).\n(a) Show that the maximum likelihood estimate of θ is given by\nˆθ =\nÃ\nn\nX\nm=1\n1/σ2\nam\n!−1 Ã\nn\nX\nm=1\nym/σ2\nam\n!\n.\n(b) Express the expected Fisher information Iθ and the observed\nFisher information Ix in terms of n, σ2\n1, σ2\n2, and a. What hap-\npens to the quantity Iθ/Ix as n →∞?\n(c) Show that a is an ancillary statistic, and that the conditional\nvariance of ˆθ given a equals 1/Ix. Of the two approximations\nˆθ\n·∼N(θ, 1/Iθ)\nand\nˆθ\n·∼N(θ, 1/Ix),\nwhich (if either) would you use for the purposes of inference,\nand why?\n附件/试卷 2\nAppendix/Contest Paper 2"}, {"year": "2011", "subject": "Geometry & Topology", "paper": "2011_3_GeomTop_Individual_2011", "kind": "individual", "n": 1, "chars": 258, "tags": ["微分流形/形式"], "d": 2.36, "text": "Suppose M is a closed smooth n-manifold.\na) Does there always exist a smooth map f : M →Sn from M into the\nn-sphere, such that f is essential (i.e. f is not homotopic to a constant\nmap)? Justify your answer.\nb) Same question, replacing Sn by the n-torus T n."}, {"year": "2011", "subject": "Geometry & Topology", "paper": "2011_3_GeomTop_Individual_2011", "kind": "individual", "n": 2, "chars": 141, "tags": ["经典场论/相对论"], "d": 1.26, "text": "Suppose (X, d) is a compact metric space and f : X →X is a map\nso that d(f(x), f(y)) = d(x, y) for all x, y in X. Show that f is an onto\nmap."}, {"year": "2011", "subject": "Geometry & Topology", "paper": "2011_3_GeomTop_Individual_2011", "kind": "individual", "n": 3, "chars": 93, "tags": [], "d": 1.13, "text": "Let C1, C2 be two linked circles in R3. Show that C1 cannot be\nhomotopic to a point in R3\\C2."}, {"year": "2011", "subject": "Geometry & Topology", "paper": "2011_3_GeomTop_Individual_2011", "kind": "individual", "n": 4, "chars": 196, "tags": ["微分流形/形式"], "d": 1.31, "text": "Let M = R2/Z2 be the two dimensional torus, L the line 3x = 7y\nin R2, and S = π(L) ⊂M where π : R2 →M is the projection map.\nFind a differential form on M which represents the Poincar´e dual of S."}, {"year": "2011", "subject": "Geometry & Topology", "paper": "2011_3_GeomTop_Individual_2011", "kind": "individual", "n": 5, "chars": 579, "tags": ["微分几何"], "d": 2.81, "text": "A regular curve C in R3 is called a Bertrand Curve, if there exists\na diffeomorphism f : C →D from C onto a different regular curve D\nin R3 such that NxC = Nf(x)D for any x ∈C. Here NxC denotes the\nprincipal normal line of the curve C passing through x, and TxC will\ndenote the tangent line of C at x. Prove that:\na) The distance |x −f(x)| is constant for x ∈C; and the angle made\nbetween the directions of the two tangent lines TxC and Tf(x)D is also\nconstant.\nb) If the curvature k and torsion τ of C are nowhere zero, then there\nmust be constants λ and µ such that λk + µτ = 1"}, {"year": "2011", "subject": "Geometry & Topology", "paper": "2011_3_GeomTop_Individual_2011", "kind": "individual", "n": 6, "chars": 408, "tags": ["微分几何"], "d": 1.57, "text": "Let M be the closed surface generated by carrying a small circle\nwith radius r around a closed curve C embedded in R3 such that the\ncenter moves along C and the circle is in the normal plane to C at each\npoint. Prove that\nZ\nM\nH2dσ ≥2π2,\nand the equality holds if and only if C is a circle with radius\n√\n2r. Here\nH is the mean curvature of M and dσ is the area element of M.\n1\n附件/试卷 3\nAppendix/Contest Paper 3"}, {"year": "2011", "subject": "Algebra & Number Theory", "paper": "2011_4_Algebra_Individual_2011", "kind": "individual", "n": 1, "chars": 532, "tags": ["Galois/域扩张", "群论", "环与模", "辛几何/力学", "经典场论/相对论"], "d": 4.18, "text": "Let K = Q(√−3), an imaginary quadratic field.\n(a) Does there exists a finite Galois extension L/Q which contains\nK such that Gal(L/Q) ∼= S3? (Here S3 is the symmetric group\nin 3 letters.)\n(b) Does there exists a finite Galois extension L/Q which contains\nK such that Gal(L/Q) ∼= Z/4Z?\n(c) Does there exists a finite Galois extension L/Q which contains\nK such that Gal(L/Q) ∼= Q? Here Q is the quaternion group\nwith 8 elements {±1, ±i, ±j, ±k}, a finite subgroup of the group\nof units H× of the ring H of all Hamiltonian quaternions."}, {"year": "2011", "subject": "Algebra & Number Theory", "paper": "2011_4_Algebra_Individual_2011", "kind": "individual", "n": 2, "chars": 197, "tags": ["群论", "线性代数/矩阵", "表示论"], "d": 1.76, "text": "Let f be a two-dimensional (complex) representation of a finite\ngroup G such that 1 is an eigenvalue of f(σ) for every σ ∈G. Prove\nthat f is a direct sum of two one-dimensional representations of G"}, {"year": "2011", "subject": "Algebra & Number Theory", "paper": "2011_4_Algebra_Individual_2011", "kind": "individual", "n": 3, "chars": 219, "tags": [], "d": 2.35, "text": "Let F ⊂R be the subset of all real numbers that are roots of monic\npolynomials f(X) ∈Q[X].\n(1) Show that F is a field.\n(2) Show that the only field automorphisms of F are the identity\nautomorphism α(x) = x for all x ∈F."}, {"year": "2011", "subject": "Algebra & Number Theory", "paper": "2011_4_Algebra_Individual_2011", "kind": "individual", "n": 4, "chars": 277, "tags": ["表示论"], "d": 2.39, "text": "Let V be a finite-dimensional vector space over R and T : V →V\nbe a linear transformation such that\n(1) the minimal polynomial of T is irreducible;\n(2) there exists a vector v ∈V such that {T iv | i ≥0} spans V .\nShow that V contains no non-trivial proper T-invariant subspace."}, {"year": "2011", "subject": "Algebra & Number Theory", "paper": "2011_4_Algebra_Individual_2011", "kind": "individual", "n": 5, "chars": 365, "tags": ["范畴/同调代数"], "d": 1.58, "text": "Given a commutative diagram\nA\n→\nB\n→\nC\n→\nD\n→\nE\n↓\n↓\n↓\n↓\n↓\nA′\n→\nB′\n→\nC′\n→\nD′\n→\nE′\n1\n附件/试卷 4\nAppendix/Contest Paper 4\n\n \nAlgebra, Number Theory and Combinatorics, 2011-Individual\n2\nof Abelian groups, such that (i) both rows are exact sequences and (ii)\nevery vertical map, except the middle one, is an isomorphism. Show\nthat the middle map C →C′ is also an isomorphism."}, {"year": "2011", "subject": "Algebra & Number Theory", "paper": "2011_4_Algebra_Individual_2011", "kind": "individual", "n": 6, "chars": 79, "tags": ["群论"], "d": 1.07, "text": "Prove that a group of order 150 is not simple.\n附件/试卷 4\nAppendix/Contest Paper 4"}, {"year": "2011", "subject": "Analysis & PDE", "paper": "2011_5_AnalysisDiffEquation_Team_2011", "kind": "team", "n": 1, "chars": 237, "tags": ["复分析", "泛函分析"], "d": 1.56, "text": "Let H2(∆) be the space of holomorphic functions in the unit disk\n∆= {|z| < 1} such that\nR\n∆|f|2|dz|2 < ∞. Prove that H2(∆) is a\nHilbert space and that for any r < 1, the map T : H2(∆) →H2(∆)\ngiven by Tf(z) := f(rz) is a compact operator."}, {"year": "2011", "subject": "Analysis & PDE", "paper": "2011_5_AnalysisDiffEquation_Team_2011", "kind": "team", "n": 2, "chars": 122, "tags": [], "d": 1.14, "text": "For any continuous function f(z) of period 1, show that the equation\ndϕ\ndt = 2πϕ + f(t)\nhas a unique solution of period 1."}, {"year": "2011", "subject": "Analysis & PDE", "paper": "2011_5_AnalysisDiffEquation_Team_2011", "kind": "team", "n": 3, "chars": 160, "tags": [], "d": 1.24, "text": "Let h(x) be a C∞function on the real line R. Find a C∞function\nu(x, y) on an open subset of R2 containing the x-axis such that ux +\n2uy = u2 and u(x, 0) = h(x)."}, {"year": "2011", "subject": "Analysis & PDE", "paper": "2011_5_AnalysisDiffEquation_Team_2011", "kind": "team", "n": 4, "chars": 156, "tags": ["数论"], "d": 1.27, "text": "Let S = {x ∈R | |x−p\nq| ≤c/q3, for infinitely many relatively prime p, q ∈\nZ, q > 0, for a fixed c > 1}, show that S is uncountable and its measure\nis zero."}, {"year": "2011", "subject": "Analysis & PDE", "paper": "2011_5_AnalysisDiffEquation_Team_2011", "kind": "team", "n": 5, "chars": 516, "tags": ["线性代数/矩阵", "复分析"], "d": 3.46, "text": "Let sl(n) denote the set of all n × n real matrices with trace equal\nto zero and let SL(n) be the set of all n × n real matrices with deter-\nminant equal to one. Let ϕ(z) be a real analytic function defined in a\nneighborhood of z = 0 of the complex plane C satisfying the conditions\nϕ(0) = 1 and ϕ\n′(0) = 1.\n(a) If ϕ maps any near zero matrix in sl(n) into SL(n) for some n ≥3,\nshow that ϕ(z) = exp(z).\n(b)Is the conclusion of (a) still true in the case n = 2? If it is true,\nprove it. If not, give a counterexample."}, {"year": "2011", "subject": "Analysis & PDE", "paper": "2011_5_AnalysisDiffEquation_Team_2011", "kind": "team", "n": 6, "chars": 155, "tags": [], "d": 2.14, "text": "Use mathematical analysis to show that:\n(a) e and π are irrational numbers;\n(b) e and π are also transcendental numbers.\n1\n附件/试卷 5\nAppendix/Contest Paper 5"}, {"year": "2011", "subject": "Computational & Applied", "paper": "2011_6_AppliedMathProb_Team_2011", "kind": "team", "n": 1, "chars": 492, "tags": ["线性代数/矩阵", "经典场论/相对论"], "d": 3.38, "text": "Let A be an N-by-N symmetric positive definite matrix. The con-\njugate gradient method can be described as follows:\nr0 = b −Ax0, p0 = r0, x0 = 0\nFOR n = 0, 1, . . .\nαn = ∥rn∥2\n2/(pT\nnApn)\nxn+1 = xn + αnpn\nrn+1 = rn −αnApn\nβn = −rT\nk+1Apk/pT\nk Apk\npn+1 = rn+1 + βnpn\nEND FOR\nShow\n(a) αn minimizes f(xn + αpn) for all α ∈R where\nf(x) ≡1\n2xTAx −bTx.\n(b) pT\ni rn = 0 for i < n and pT\ni Apj = 0 if i ̸= j.\n(c) Span{p0, p1, . . . , pn−1}= Span{r0, r1, . . . , rn−1} ≡Kn.\n(d) rn is orthogonal to Kn."}, {"year": "2011", "subject": "Computational & Applied", "paper": "2011_6_AppliedMathProb_Team_2011", "kind": "team", "n": 2, "chars": 895, "tags": ["范畴/同调代数", "偏微分方程", "代数几何"], "d": 2.68, "text": "We use the following scheme to solve the PDE ut + ux = 0:\nun+1\nj\n= aun\nj−2 + bun\nj−1 + cun\nj\nwhere a, b, c are constants which may depend on the CFL number λ =\n∆t\n∆x. Here xj = j∆x, tn = n∆t and un\nj is the numerical approximation\nto the exact solution u(xj, tn), with periodic boundary conditions.\n(i) Find a, b, c so that the scheme is second order accurate.\n(ii) Verify that the scheme you derived in Part (i) is exact (i.e. un\nj =\nu(xj, tn)) if λ = 1 or λ = 2. Does this imply that the scheme is stable\nfor λ ≤2? If not, find λ0 such that the scheme is stable for λ ≤λ0.\nRecall that a scheme is stable if there exist constants M and C, which\nare independent of the mesh sizes ∆x and ∆t, such that\n∥un∥≤MeCT∥u0∥\nfor all ∆x, ∆t and n such that tn ≤T. You can use either the L∞\nnorm or the L2 norm to prove stability.\n1\n附件/试卷 6\nAppendix/Contest Paper 6\n\n \nApplied Math. Prob. Stat., 2011-Team\n2"}, {"year": "2011", "subject": "Computational & Applied", "paper": "2011_6_AppliedMathProb_Team_2011", "kind": "team", "n": 3, "chars": 572, "tags": ["概率论"], "d": 3.08, "text": "Let X and Y be independent random variables, identically dis-\ntributed according to the Normal distribution with mean 0 and variance\n1, N(0, 1).\n(a) Find the joint probability density function of (R, θ), where\nR = (X2 + Y 2)1/2\nand\nθ = arctan(Y/X).\n(b) Are R and θ independent? Why, or why not?\n(c) Find a function U of R which has the uniform distribution on\n(0, 1), Unif(0, 1).\n(d) Find a function V of θ which is distributed as Unif(0,1).\n(e) Show how to transform two independent observations U and V\nfrom Unif(0,1) into two independent observations X, Y from\nN(0, 1)."}, {"year": "2011", "subject": "Computational & Applied", "paper": "2011_6_AppliedMathProb_Team_2011", "kind": "team", "n": 4, "chars": 124, "tags": ["概率论"], "d": 1.22, "text": "Let X be a random variable such that E[|X|] < ∞. Show that\nE[|X −a|] = inf\nx∈R E[|X −x|],\nif and only if a is a median of X."}, {"year": "2011", "subject": "Computational & Applied", "paper": "2011_6_AppliedMathProb_Team_2011", "kind": "team", "n": 5, "chars": 459, "tags": ["实分析/测度", "数理统计", "经典场论/相对论"], "d": 1.93, "text": "Let Y1, . . . , Yn be iid observations from the distribution f(x −θ),\nwhere θ is unknown and f( ) is probability density function symmetric\nabout zero.\nSuppose a priori that θ has the improper prior θ ∼Lebesgue (flat)\non (−∞, ∞). Write down the posterior distribution of θ.\nProvides some arguments to show that this flat prior is noninforma-\ntive.\nShow that with the posterior distribution in (a), a 95% probability\ninterval is also a 95% confidence interval."}, {"year": "2011", "subject": "Computational & Applied", "paper": "2011_6_AppliedMathProb_Team_2011", "kind": "team", "n": 6, "chars": 557, "tags": ["数理统计"], "d": 3.04, "text": "Suppose we have two independent random samples {Y1, i = 1, . . . , n}\nfrom Poisson with (unknown) mean λ1 and {Yi, i = n+1, . . . , 2n} from\nPoisson with (unknown) mean λ2 Let θ = λ1/(λ1 + λ2).\n(a) Find an unbiased estimator of θ\n(b) Does your estimator have the minimum variance among all un-\nbiased estimators? If yes, prove it. If not, find one that has the\nminimum variance (and prove it).\n(c) Does the unbiased minimum variance estimator you found at-\ntain the Fisher information bound? If yes, show it. If no, why\nnot?\n附件/试卷 6\nAppendix/Contest Paper 6"}, {"year": "2011", "subject": "Geometry & Topology", "paper": "2011_7_GeomTop_Team_2011", "kind": "team", "n": 1, "chars": 195, "tags": [], "d": 2.23, "text": "Suppose K is a finite connected simplicial complex. True or false:\na) If π1(K) is finite, then the universal cover of K is compact.\nb) If the universal cover of K is compact then π1(K) is finite."}, {"year": "2011", "subject": "Geometry & Topology", "paper": "2011_7_GeomTop_Team_2011", "kind": "team", "n": 2, "chars": 75, "tags": ["范畴/同调代数", "代数拓扑", "优化/线性规划"], "d": 1.64, "text": "Compute all homology groups of the the m-skeleton of an n-simplex,\n0 ≤m ≤n."}, {"year": "2011", "subject": "Geometry & Topology", "paper": "2011_7_GeomTop_Team_2011", "kind": "team", "n": 3, "chars": 209, "tags": ["微分几何", "微分流形/形式"], "d": 1.57, "text": "Let M be an n-dimensional compact oriented Riemannian manifold\nwith boundary and X a smooth vector field on M. If n is the inward\nunit normal vector of the boundary, show that\nZ\nM\ndiv(X) dVM =\nZ\n∂M\nX · n dV∂M."}, {"year": "2011", "subject": "Geometry & Topology", "paper": "2011_7_GeomTop_Team_2011", "kind": "team", "n": 4, "chars": 403, "tags": ["范畴/同调代数", "代数拓扑", "微分流形/形式"], "d": 3.15, "text": "Let Fk(M) be the space of all C∞k-forms on a differentiable man-\nifold M. Suppose U and V are open subsets of M.\na) Explain carefully how the usual exact sequence\n0 −→F(U ∪V ) −→F(U) ⊕FV ) −→F(U ∩V ) −→0\narises.\nb) Write down the \"long exact sequence\" in de Rham cohomology as-\nsociated to the short exact sequence in part (a) and describe explicitly\nhow the map\nHk\ndeR(U ∩V ) −→Hk+1\ndeR (U ∪V )\narises."}, {"year": "2011", "subject": "Geometry & Topology", "paper": "2011_7_GeomTop_Team_2011", "kind": "team", "n": 5, "chars": 339, "tags": ["微分几何", "微分流形/形式"], "d": 1.72, "text": "Let M be a Riemannian n-manifold. Show that the scalar curvature\nR(p) at p ∈M is given by\nR(p) =\n1\nvol(Sn−1)\nZ\nSn−1 Ricp(x)dSn−1,\nwhere Ricp(x) is the Ricci curvature in direction x ∈Sn−1 ⊂TpM,\nvol(Sn−1) is the volume of Sn−1 and dSn−1 is the volume element of\nSn−1.\n1\n附件/试卷 7\nAppendix/Contest Paper 7\n\n \nGeometry and Topology, 2011-Team\n2"}, {"year": "2011", "subject": "Geometry & Topology", "paper": "2011_7_GeomTop_Team_2011", "kind": "team", "n": 6, "chars": 285, "tags": ["表示论", "微分几何", "微分流形/形式"], "d": 1.79, "text": "Prove the Schur's Lemma: If on a Riemannian manifold of dimension\nat least three, the Ricci curvature depends only on the base point but\nnot on the tangent direction, then the Ricci curvature must be constant\neverywhere, i.e., the manifold is Einstein.\n附件/试卷 7\nAppendix/Contest Paper 7"}, {"year": "2011", "subject": "Algebra & Number Theory", "paper": "2011_8_Algebra_Team_2011", "kind": "team", "n": 1, "chars": 292, "tags": ["Galois/域扩张"], "d": 1.47, "text": "Let F be a field and ¯F the algebraic closure of F. Let f(x, y) and\ng(x, y) be polynomials in F[x, y] such that g.c.d.(f, g) = 1 in F[x, y].\nShow that there are only finitely many (a, b) ∈¯F ×2 such that f(a, b) =\ng(a, b) = 0. Can you generalize this to the cases of more than two-\nvariables?"}, {"year": "2011", "subject": "Algebra & Number Theory", "paper": "2011_8_Algebra_Team_2011", "kind": "team", "n": 2, "chars": 112, "tags": ["环与模", "线性代数/矩阵"], "d": 1.45, "text": "Let D be a PID, and Dn the free module of rank n over D. Then\nany submodule of Dn is a free module of rank m ≤n."}, {"year": "2011", "subject": "Algebra & Number Theory", "paper": "2011_8_Algebra_Team_2011", "kind": "team", "n": 3, "chars": 195, "tags": [], "d": 1.31, "text": "Identify pairs of integers n ̸= m ∈Z+ such that the quotient rings\nZ[x, y]/(x2 −yn) ∼= Z[x, y]/(x2 −ym); and identify pairs of integers\nn ̸= m ∈Z+ such that Z[x, y]/(x2 −yn) ̸∼= Z[x, y]/(x2 −ym)."}, {"year": "2011", "subject": "Algebra & Number Theory", "paper": "2011_8_Algebra_Team_2011", "kind": "team", "n": 4, "chars": 106, "tags": [], "d": 1.1, "text": "Is it possible to find an integer n > 1 such that the sum\n1 + 1\n2 + 1\n3 + 1\n4 + · · · + 1\nn\nis an integer?"}, {"year": "2011", "subject": "Algebra & Number Theory", "paper": "2011_8_Algebra_Team_2011", "kind": "team", "n": 5, "chars": 294, "tags": ["Galois/域扩张", "群论", "线性代数/矩阵"], "d": 3.36, "text": "Recall that F7 is the finite field with 7 elements, and GL3(F7) is the\ngroup of all invertible 3 × 3 matrices with entries in F7.\n(a) Find a 7-Sylow subgroup P7 of GL3(F7).\n(b) Determine the normalizer subgroup N of the 7-Sylow subgroup\nyou found in (a).\n(c) Find a 2-Sylow subgroup of GL3(F7)."}, {"year": "2011", "subject": "Algebra & Number Theory", "paper": "2011_8_Algebra_Team_2011", "kind": "team", "n": 6, "chars": 195, "tags": ["群论", "环与模", "线性代数/矩阵"], "d": 1.71, "text": "For a ring R, let SL2(R) denote the group of invertible 2×2 matrices.\nShow that SL2(Z) is generated by T =\nµ\n1\n1\n0\n1\n¶\nand S =\nµ\n0\n1\n−1\n0\n¶\n.\nWhat about SL2(R)?\n1\n附件/试卷 8\nAppendix/Contest Paper 8"}, {"year": "2012", "subject": "Algebra & Number Theory", "paper": "2012_Algebra2012Individual", "kind": "individual", "n": 1, "chars": 148, "tags": [], "d": 1.14, "text": "Prove that the polynomial x6 + 30x5 −15x3 + 6x −120 cannot be\nwritten as a product of two polynomials of rational coefficients and\npositive degrees."}, {"year": "2012", "subject": "Algebra & Number Theory", "paper": "2012_Algebra2012Individual", "kind": "individual", "n": 2, "chars": 205, "tags": ["群论", "线性代数/矩阵"], "d": 3.0, "text": "Let Fp be the field of p-elements and GLn(Fp) the group of invertible\nn by n matrices.\n(1) Compute the order of GLn(Fp).\n(2) Find a Sylow p-subgroup of GLn(Fp).\n(3) Compute the number of Sylow p-subgroups."}, {"year": "2012", "subject": "Algebra & Number Theory", "paper": "2012_Algebra2012Individual", "kind": "individual", "n": 3, "chars": 255, "tags": ["群论", "经典场论/相对论"], "d": 1.62, "text": "Let V be a finite dimensional vector space over complex field C with\na nondegenerate symmetric bilinear form (, ). Let\nO(V ) = {g ∈GL(V )|(gu, gv) = (u, v), u, v ∈V }\nbe the orthogonal group. Prove that fixed point subspace (V ⊗C V )O(n)\nis 1-dimensional."}, {"year": "2012", "subject": "Algebra & Number Theory", "paper": "2012_Algebra2012Individual", "kind": "individual", "n": 4, "chars": 717, "tags": ["环与模"], "d": 3.04, "text": "Let D be the ring consisting of all linear differential operators of\nfinite order on R with polynomial coefficients, of the form\nD =\nn\nX\ni=0\nai(x) di\ndxi\nfor some natural number n ∈N and polynomials a0(x), · · · , an(x) ∈\nR[x]. This ring R operates naturally on M := R[x], making M a left\nD-module.\n(1) (to warm up) Suppose that b(x) ∈R[x] is a non-zero polynomial\nin M, and let c(x) be any element in M. Show that there is an\nelement D ∈D such that D(b(x)) = c(x).\n(2) Suppose that m is a positive integer, b1(x), · · · , bm(x) are m\npolynomials in M linearly independent over R and c1(x), · · · , cm(x)\nare m polynomials in M. Prove that there exists an element\nD ∈D such that D(bi(x)) = ci(x) for i = 1, · · · , m."}, {"year": "2012", "subject": "Algebra & Number Theory", "paper": "2012_Algebra2012Individual", "kind": "individual", "n": 5, "chars": 624, "tags": ["群论", "线性代数/矩阵", "范畴/同调代数"], "d": 3.89, "text": "Let Λ be a lattice of C, i.e., a subgroup generated by two R-linear\nindependent elements. Let R be the subring of C consists of elements\nα such that αΛ ⊂Λ. Let R× denote the group of invertible elements\nin R.\n(1) Show that either R = Z or have rank 2 over Z.\n1\nS.-T YAU COLLEGE MATH CONTESTS 2012 \nPlease solve 5 out of the following 6 problems, \nor highest scores of 5 problems will be counted. \nO(V)\n\n \n2\nINDIVIDUAL TEST\n(2) Let n ≥3 be a positive integer and (R/nR)× the group of invert-\nible elements in the quotient R/nR. Show that the canonical\ngroup homomorphism\nR× →(R/nR)×\nis injective.\n(3) Find maximal size of R×."}, {"year": "2012", "subject": "Algebra & Number Theory", "paper": "2012_Algebra2012Individual", "kind": "individual", "n": 6, "chars": 290, "tags": ["线性代数/矩阵"], "d": 2.36, "text": "Let V be a (possible) infinite dimensional vector space over R with\na positive definite quadratic norm ∥· ∥. Let A be an additive subgroup\nof V with following properties:\n(1) A/2A is finite;\n(2) for any real number c the set\n{a ∈A :\n∥a∥< c}\nis finite.\nProve that A is of finite rank over Z."}, {"year": "2012", "subject": "Algebra & Number Theory", "paper": "2012_Algebra2012team", "kind": "team", "n": 1, "chars": 279, "tags": ["线性代数/矩阵"], "d": 1.48, "text": "Let a1, · · · , an and b1, · · · , bn be complex numbers such that ai+bj ̸=\n0 for all i, j = 1, · · · , n. Define cij :=\n1\nai + bj\nfor all i, j = 1, · · · , n, and\nlet C be the n × n determinant with entries cij. Prove that\ndet(C) =\nQ\n1≤i<j≤n(ai −aj)(bi −bj)\nQ\n1≤i,j≤n(ai + bj)\n."}, {"year": "2012", "subject": "Algebra & Number Theory", "paper": "2012_Algebra2012team", "kind": "team", "n": 2, "chars": 294, "tags": ["Galois/域扩张", "群论", "线性代数/矩阵"], "d": 3.34, "text": "Recall that F7 is the finite field with 7 elements, and GL3(F7) is the\ngroup of all invertible 3 × 3 matrices with entries in F7.\n(1) Find a 7-Sylow subgroup P7 of GL3(F7).\n(2) Determine the normalizer subgroup N of the 7-Sylow subgroup\nyou found in (a).\n(3) Find a 2-Sylow subgroup of GL3(F7)."}, {"year": "2012", "subject": "Algebra & Number Theory", "paper": "2012_Algebra2012team", "kind": "team", "n": 3, "chars": 558, "tags": ["群论", "线性代数/矩阵"], "d": 3.56, "text": "Let V be a finite dimensional vector space with a positive definite\nquadratic form (−, −). Let O(V ) denote the orthogonal group:\nO(V ) = {g ∈GL(V ) :\n(gx, gy) = (x, y),\n∀x, y ∈V } .\nFor any non-zero v ∈V , let sv denote the reflection on V :\nsv(w) = w −2(v, w)\n(v, v) v.\n(1) Show that sv ∈O(V );\n(2) Show that if v and w are vectors in V with ∥v∥= ∥w∥,then\nthere is either a reflection or product of two reflections that\ntakes v into w;\n(3) Deduce that every element of the orthogonal group of V can be\nwritten as the product of at most 2 dim V reflections."}, {"year": "2012", "subject": "Algebra & Number Theory", "paper": "2012_Algebra2012team", "kind": "team", "n": 4, "chars": 194, "tags": ["群论", "线性代数/矩阵", "代数拓扑", "微分流形/形式"], "d": 1.99, "text": "Consider the real Lie group SL2(R) of 2 by 2 matrices of determinant\none. Compute the fundamental group of SL2(R) and describe the Lie\ngroup structure on the universal covering\nf\nSL2(R) →SL2(R)."}, {"year": "2012", "subject": "Algebra & Number Theory", "paper": "2012_Algebra2012team", "kind": "team", "n": 5, "chars": 400, "tags": ["群论", "表示论"], "d": 1.8, "text": "Let f ∈C[x, y, z] be an irreducible homogenous polynomial of degree\nd > 0. For each integer n ≥d, define\nP(n) = dimC C[x, y, z]n/f · C[x, y, z]n−d\n1\nS.-T YAU COLLEGE MATH CONTESTS 2012 \nPlease solve 5 out of the following 6 problems.\n\n \n2\nGROUP TEST\nwhere C[x, y, z]d is the subspace of homogenous polynomials of degree\nn. Show there are constants c such that for n sufficiently large,\nP(n) = dn + c."}, {"year": "2012", "subject": "Algebra & Number Theory", "paper": "2012_Algebra2012team", "kind": "team", "n": 6, "chars": 776, "tags": ["群论", "数论"], "d": 3.89, "text": "Let p be an odd prime and Zp the p-adic integer which can be\ndefined as the projective limit of Z/pnZ and let Qp be its fractional\nfield. Let Z×\np denote the group of invertible elements in Zp which is\nalso the projective limit of (Z/pnZ)×.\n(1) For any integer a is not divisible by p, show that the sequence\n(apn)n convergent to an element ω(a) ∈Zp satisfying\nω(a)p−1 = 1,\nω(a) ≡a\n(mod p).\nMoreover, ω(a) depends only on a mod p.\n(2) Define a logarithmic function log on 1 + pZp by usual formula:\nlog(1 + px) =\n∞\nX\nn=1\n(−1)n−1pn\nn xn.\nShow that the logarithmic function is convergent and define an\nisomorphism\n1 + pZp →pZp.\nMoreover, on the dense subgroup log(1 + p)Z, the inverse is\ngiven by\nlog(1 + p) · x 7→(1 + p)x,\n∀x ∈Z.\n(3) Deduce from above that Z×\np ≃Zp × Z/(p −1)Z."}, {"year": "2012", "subject": "Analysis & PDE", "paper": "2012_Analysis_individual", "kind": "individual", "n": 2, "chars": 173, "tags": ["复分析"], "d": 1.21, "text": "Compute the integral\nZ ∞\n0\nxp\n1 + x2dx, −1 < p < 1.\nConstruct a one to one conformal mapping from the region\nU = {z ∈C||z −i\n2| < 1\n2}/{z||z −i\n4| < 1\n4}\nonto the unit disk."}, {"year": "2012", "subject": "Analysis & PDE", "paper": "2012_Analysis_individual", "kind": "individual", "n": 3, "chars": 94, "tags": [], "d": 1.16, "text": "Let f(x) be a nonlinear C2 function on R. Show that\nsup |f ′(x)|2 ≤4 sup |f(x)| sup |f ′′(x)|."}, {"year": "2012", "subject": "Analysis & PDE", "paper": "2012_Analysis_individual", "kind": "individual", "n": 4, "chars": 166, "tags": ["实分析/测度"], "d": 1.23, "text": "Let f(x) be a real measurable function defined on [a, b]. Let n(y)\nbe the number of solutions of the equation f(x) = y. Prove that n(y)\nis a measurable function on R."}, {"year": "2012", "subject": "Analysis & PDE", "paper": "2012_Analysis_individual", "kind": "individual", "n": 5, "chars": 157, "tags": [], "d": 1.2, "text": "For 1 < p, q < ∞, 1\np + 1\nq = 1, let g in Lq. Consider the linear\nfunctional F on Lp given by: F(f) is equal to the integral of fg. Show\nthat ||F|| = ||g||q."}, {"year": "2012", "subject": "Analysis & PDE", "paper": "2012_Analysis_individual", "kind": "individual", "n": 6, "chars": 236, "tags": [], "d": 1.41, "text": "Let Rn\n+ = {x = (x1, x2, ..., xn) ∈Rn|xn > 0}. Show that the formula\nu(x) = 2xn\nnαn\nZ\n∂Rn\n+\ng(y)\n|x −y|ndy, x ∈Rn\n+\nis a solution of the problem\n∆u = 0, in Rn\n+, u = g on ∂Rn\n+,\nwhere αn is the volume of the unit n dimensional sphere.\n1"}, {"year": "2012", "subject": "Analysis & PDE", "paper": "2012_Analysis_team", "kind": "team", "n": 1, "chars": 94, "tags": ["线性代数/矩阵", "经典场论/相对论"], "d": 1.42, "text": "Let A = [aij] be a real symmetric n × n matrix. Define f : Rn →R\nby f(x1, · · · , xn) = exp(−1"}, {"year": "2012", "subject": "Analysis & PDE", "paper": "2012_Analysis_team", "kind": "team", "n": 2, "chars": 426, "tags": ["线性代数/矩阵", "复分析"], "d": 1.82, "text": "Pn\ni,j=1 aijxixj). Prove that f is in L1(Rn)\nif and only if the matrix A is positive definite.\nCompute\nR\nRn exp(−1\n2\nPn\ni,j=1 aijxixj +Σn\ni=1bixi)dx when A is positive\ndefinite.\n2. Let V be a simply connected region in the complex plane and V ̸= C.\nLet a, b be two distinct points in V .\nLet φ1, φ2 be two one-to-one\nholomorphic maps of V onto itself. If φ1(a) = φ2(a) and φ1(b) = φ2(b),\nshow that φ1(z) = φ2(z) for all z ∈V ."}, {"year": "2012", "subject": "Analysis & PDE", "paper": "2012_Analysis_team", "kind": "team", "n": 3, "chars": 152, "tags": ["实分析/测度"], "d": 1.17, "text": "In the unit interval [0, 1] consider a subset\nE = {x| in the decimal expansion of x there is no 4},\nshow that E is measurable and calculate its measure."}, {"year": "2012", "subject": "Analysis & PDE", "paper": "2012_Analysis_team", "kind": "team", "n": 4, "chars": 179, "tags": ["实分析/测度"], "d": 1.22, "text": "Let 1 < p < ∞, Lp([0, 1], dm) be the completion of C[0, 1] with the\nnorm: ||f||p = (\nR 1\n0 |f(x)|pdm)\n1\np, where dm is the Lebesgue measure.\nShow that limλ→∞λpm(x||f(x)| > λ) = 0."}, {"year": "2012", "subject": "Analysis & PDE", "paper": "2012_Analysis_team", "kind": "team", "n": 5, "chars": 469, "tags": [], "d": 1.61, "text": "Let F = {eν}, ν = 1, 2, ..., n or ν = 1, 2, ... is an orthonormal basis in\nan inner product space H. Let E be the closed linear subspace spanned\nby F. For any x ∈H show that the following are equivalent: 1) x ∈E;\n2) ||x||2 = Σν|(x, eν)|2; 3) x = Σν(x, eν)eν.\nLet H = L2[0, 2π] with the inner product < f, g >= 1\nπ\nR 2π\n0\nf(x)g(x)dx,\nF = { 1\n√\n2, cos x, sin x, ..., cos nx, sin nx, ...}\nbe an orthonormal basis. Show that the closed linear sub-space E\nspanned by F is H."}, {"year": "2012", "subject": "Analysis & PDE", "paper": "2012_Analysis_team", "kind": "team", "n": 6, "chars": 157, "tags": ["线性代数/矩阵", "实分析/测度", "泛函分析"], "d": 1.69, "text": "Let H = L2[0, 1] relative to the Lebesgue measure and define (Kf)(s) =\nR s\n0 f(t)dt for each f in H. Show that K is a compact operator without\neigenvalues.\n1"}, {"year": "2012", "subject": "Computational & Applied", "paper": "2012_Applied2012individual", "kind": "individual", "n": 1, "chars": 324, "tags": [], "d": 1.39, "text": "In the numerical integration formula\n(1)\nZ 1\n−1\nf(x)dx ≈af(−1) + bf(c),\nif the constants a, b, c can be chosen arbitrarily, what is the highest\ndegree k such that the formula is exact for all polynomials of degree\nup to k? Find the constants a, b, c for which the formula is exact for\nall polynomials of degree up to this k."}, {"year": "2012", "subject": "Computational & Applied", "paper": "2012_Applied2012individual", "kind": "individual", "n": 2, "chars": 1002, "tags": ["经典场论/相对论"], "d": 3.89, "text": "Here is the definition of a moving least square approximation of a\nfunction f(x) near a point x given K points xk around x in R, k ∈\n[1, · · · , K].\n(2)\nmin\nPx∈Πm\nK\nX\nk=1\n|Px(xk) −fk|2\nwhere fk = f(xk), Πm is the space of polynomials of degree less or\nequal to m, i.e.\nPx(x) = bx(x)Tc(x),\nc(x) = [c0, c1, · · · , cm]T is the coefficient vector to be determined by (2),\nbx(x) is the polynomial basis vector, bx(x) = [1, x −x, (x −x)2, . . . , (x −x)m]T.\nAssume that there are K > m different points xk and f(x) is smooth,\n(a) prove that there is a unique solution P x(x) to (2)\n(b) denote h = maxk |xk −x|, prove\n|ci −1\ni!f (i)(x)| = C(f, i)hm+1−i, i = 0, 1, . . . , m,\nwhere f (i)(·) is the i-th derivative of f and C(f, i) denote some constant\ndepending on f, i.\n1\n\n \n2\n(c) if S = {xk|k = 1, 2, . . . , K} are symmetrically distributed around\nx, that is, if xk ∈S then 2x −xk ∈S, prove that\n|ci −1\ni!f (i)(x)| = C(f, i)hm+2−i, i = 0, 1, . . . , m,\nfor i (∈{0, 1, · · · , m}) with the same parity of m."}, {"year": "2012", "subject": "Computational & Applied", "paper": "2012_Applied2012individual", "kind": "individual", "n": 3, "chars": 394, "tags": ["偏微分方程", "代数几何", "数值分析"], "d": 1.92, "text": "Describe the forward-in-time and center-in-space finite difference\nscheme for the one-wave wave equation:\nut + ux = 0.\n(i). Conduct the von Neumann stability analysis and comment on\ntheir stability property.\n(ii).\nUnder what condition on ∆t and ∆x would this scheme be\nstable and convergent?\n(iii). How many ways you can modify this scheme to make it stable\nwhen the CFL condition is satisfied."}, {"year": "2012", "subject": "Computational & Applied", "paper": "2012_Applied2012individual", "kind": "individual", "n": 4, "chars": 1284, "tags": ["线性代数/矩阵", "科学计算/大规模"], "d": 3.39, "text": "Let C and D in Cn×n be Hermitian matrices. Denote their eigen-\nvalues by\nλ1 ≥λ2 ≥· · · ≥λn\nand\nµ1 ≥µ2 ≥· · · ≥µn,\nrespectively. Then it is known that\nn\nX\ni=1\n(λi −µi)2 ≤∥C −D∥2\nF.\n1) Let A and B be in Cn×n. Denote their singular values by\nσ1 ≥σ2 ≥· · · ≥σn\nand\nτ1 ≥τ2 ≥· · · ≥τn,\nrespectively. Prove that the following inequality holds:\nn\nX\ni=1\n(σi −τi)2 ≤∥A −B∥2\nF.\n2) Given A ∈Rn×n and its SVD is A = UΣV T, where U =\n(u1, u2, . . . , un), V = (v1, v2, . . . , vn) are orthogonal matrices,\nand\nΣ = diag(σ1, σ2, . . . , σn),\nσ1 ≥σ2 ≥· · · ≥σn ≥0.\nSuppose rank(A) > k and denote by\nUk = (u1, u2, . . . , uk),\nVk = (v1, v2, . . . , vk),\nΣk = diag(σ1, σ2, . . . , σk),\nand\nAk = UkΣkV T\nk =\nk\nX\ni=1\nσiuivT\ni .\nProve that\nmin\nrank(B)=k ∥A −B∥2\nF = ∥A −Ak∥2\nF =\nn\nX\ni=k+1\nσ2\ni .\n\n \n3\n3) Let the vectors xi ∈Rn, i = 1, 2, . . . , n, be in the space W with\ndimension d, where d ≪n. Let the orthonormal basis of W be\nW ∈Rn×d. Then we can represent xi by\nxi = c + Wri + ei, i = 1, 2, . . . , n,\nwhere c ∈Rn is a constant vector, ri ∈Rd is the coordinate\nof the point xi in the space W, and ei is the error. Denote\nR = (r1, r2, . . . , rn) and E = (e1, e2, . . . , en). Find W, R and c\nsuch that the error ∥E∥F is minimized.\n(Hint: write X = [x1, x2, . . . , xn] = c(1, 1, . . . , 1) + WR + E.)"}, {"year": "2012", "subject": "Computational & Applied", "paper": "2012_Applied2012individual", "kind": "individual", "n": 5, "chars": 338, "tags": [], "d": 1.36, "text": "Two primes p and q are called twin primes if q = p + 2.\nFor\nexample, 5 and 7, 11 and 13, 29 and 31 are twin primes. There is\na still unproven (but extensively numerically verified) conjecture that\nthere are infinitely many twin primes and that they are rather common.\nShow how to factor an integer N which is a product of two twin primes."}, {"year": "2012", "subject": "Computational & Applied", "paper": "2012_Applied2012team", "kind": "team", "n": 1, "chars": 363, "tags": [], "d": 1.62, "text": "If the function u(x) is in Ck+1 (has continuous (k + 1)-th deriva-\ntive) on the interval [0, 2], and a sequence of polynomials pn(x) (n =\n1, 2, 3, ...) of degree at most k satisfies\n(1)\n|u(x) −pn(x)| ≤\nC\nnk+1\n∀0 ≤x ≤1\nn,\nwhere the constant C is independent of n, prove\n|u(x) −pn(x)| ≤\n˜C\nnk+1\n∀1\nn ≤x ≤2\nn,\nwith another constant ˜C which is also independent of n."}, {"year": "2012", "subject": "Computational & Applied", "paper": "2012_Applied2012team", "kind": "team", "n": 2, "chars": 576, "tags": ["偏微分方程", "数值分析"], "d": 2.88, "text": "Consider the one-dimensional elliptic equation\n−d2\ndx2u(x) = f(x),\n0 < x < 1,\nwith homogeneous boundary condition, u(0) = 0 and u(1) = 0, f ∈\nL2(0, 1).\n(i) Describe the standard piecewise linear finite element method for\nthis boundary value problem.\n(ii) Is this method stable and convergent? If so, what is the order of\nconvergence?\n(iii). In this case, the linear finite element method has a super con-\nvergence property at the nodal point xj (j = 1, 2, ..., N), i.e. uh(xj) =\nu(xj), here uh is the finite element solution and u is the exact solution.\nCould you explain why?"}, {"year": "2012", "subject": "Computational & Applied", "paper": "2012_Applied2012team", "kind": "team", "n": 3, "chars": 984, "tags": ["线性代数/矩阵", "代数几何"], "d": 4.11, "text": "Let A = (aij) ∈MN×N(C) be strictly diagonally dominant, that is,\n|aii| >\nN\nX\nj=1,j̸=i\n|aij| for all 1 ≤i ≤N,\nAssume that A = I + L + U where I is the identity matrix, L and U\nare the lower and upper triangular matrices with zero diagonal entries.\n1\n\n \n2\nNow, we consider solving the linear system Ax = b by the following\niterative scheme:\n(∗)\nxk+1 = (I +αΩL)−1[(I −Ω)−(1−α)ΩL−ΩU)]xk +(I +αΩL)−1b\nwhere Ω:= diag(ω1, ...ωN) and 0 ≤α ≤1. (When α = 1, it gives the\nSOR method.)\n(1) Prove that the linear system Ax = b has a unique solution.\n(2) Prove that the necessary condition for the convergence of (*) is\nN\nY\ni=1\n|1 −ωi| < 1\n(3) Let M = (I + αΩL)−1[(I −Ω) −(1 −α)ΩL −ΩU)]. Prove that\nthe spectral radius ρ(M) of M is bounded by:\nρ(M) ≤max\ni\n|1 −ωi| + |ωi|(|1 −α|li + ui)\n1 −|ωiα|li\nwhenever |ωiα|li < 1 for all 1 ≤i ≤N where li = P\nj<i |aij|\nand ui = P\nj>i |aij|.\n(4) Using (c), prove that the sufficient condition for the convergence\nof (*) is\n0 < ωi <\n2\n1 + li + ui\nfor all 1 ≤i ≤N"}, {"year": "2012", "subject": "Computational & Applied", "paper": "2012_Applied2012team", "kind": "team", "n": 4, "chars": 1012, "tags": ["数论"], "d": 2.16, "text": "The famous RSA cryptosystem is based on the assumed difficulty of\nfactoring integers N = pq (called RSA integers) which are products of\ntwo large primes p and q which should be kept secret. Currently p and\nq are chosen to be about 500 bits long, that is,\np, q ≈2500.\nAssume someone uses the following algorithm to find secret n-bit primes\np and q to form an RSA integer N = pq:\n• Choose a random odd 500-bit integer s.\n• Test the odd numbers s, s+2, s+4, etc. for primality until the\nfirst prime p is found (note the primality testing is very easy\nnowdays).\n• Continue testing p + 2, p + 4, p + 6, etc. for primality until the\nsecond prime q is found.\n• Compute and publish N = pq, but keep p and q secret.\nHow secure is this procedure? Can you suggest an algorithm to factor\nan RSA integer N = pq generated this way?\nNote that there are about x/ log x primes up to x, where log x is\nthe natural logarithm. This means that the expected gap between two\nconsecutive n-bit primes is\nlog 2n = n log 2 ≈0.69 · n.\n\n \n3"}, {"year": "2012", "subject": "Computational & Applied", "paper": "2012_Applied2012team", "kind": "team", "n": 5, "chars": 881, "tags": ["常微分方程", "流体/连续介质"], "d": 2.59, "text": "The solution h(r, t) of the following Boussinesq equation describes\nthe hight of a circular drop of fluid spreading on a dry surface h = 0:\n∂h\n∂t = ∆r(h2) = 1\nr\n∂\n∂r\nµ\nr∂(h2)\n∂r\n¶\n,\nr > 0,\nt > 1\nwith\n∂h\n∂r\n¯¯¯\nr=0 = 0,\nZ ∞\n0\nh(r, t)rdr ≡1\n64\nThe solution is positive on a finite range 0 ≤r ≤r∗(t) with h(r∗(t), t) =\n0 defining a moving \"edge\" position with no fluid outside of the droplet.\nFor r > r∗(t) truncate the solution beyond the edge to be zero ( h ≡0\nfor r > r∗(t)).\n(a): Show that this problem is scale invariant by finding relations\nh(r, t) = H(T)˜h(˜r, ˜t), r = R(T)˜r, t = T˜t so that the problem\nfor ˜h(˜r, ˜t) is identical to the original problem.\n(b): Determine the ODE for the similarity function Φ(η) with\nh(r, t) = tαΦ(η), r = ηtβ.\n(c): Determine the explicit solution for Φ(η) and then use h(r, t) =\ntαΦ(η) to find r∗(t) for t ≥1.\nHint\nR ∞\n0 hrdr =\nR r∗\n0 hrdr."}, {"year": "2012", "subject": "Geometry & Topology", "paper": "2012_Geometry2012individual", "kind": "individual", "n": 2, "chars": 363, "tags": ["微分流形/形式"], "d": 1.68, "text": "Show that π3(S2) ̸= 0.\nLet M be a smooth manifold of dimension n, and X1, · · · , Xk be k\neverywhere linearly independent smooth vector fields on an open set\nU ⊂M satisfying that [Xi, Xj] = 0 for 1 ≤i, j ≤k. Prove that for any\npoint p ∈U there is a coordinate chart (V, yi) with p ∈V ⊆U and\ncoordinates {y1, · · · , yn} such that Xi =\n∂\n∂yi on V for each 1 ≤i ≤k."}, {"year": "2012", "subject": "Geometry & Topology", "paper": "2012_Geometry2012individual", "kind": "individual", "n": 3, "chars": 66, "tags": [], "d": 1.06, "text": "Show that any self homeomorphism of CP2 is orientation preserving."}, {"year": "2012", "subject": "Geometry & Topology", "paper": "2012_Geometry2012individual", "kind": "individual", "n": 4, "chars": 309, "tags": ["经典场论/相对论"], "d": 1.34, "text": "Prove the following version of the isoperimetric inequality: Suppose\nC is a simple (that is, without self-intersection), smooth, closed curve\nin the Euclidean plane, with length L. Show that the area enclosed by\nC is less than or equal to L2\n4π, and the equality occurs when and only\nwhen C is a round circle."}, {"year": "2012", "subject": "Geometry & Topology", "paper": "2012_Geometry2012individual", "kind": "individual", "n": 5, "chars": 360, "tags": ["微分几何"], "d": 1.47, "text": "Let x : M →R3 be a closed surface in 3-dimensional Euclidean\nspace. Its Gaussian curvature and mean curvature are denoted by K\nand H respectively. Prove that:\nZZ\nM\nHdA +\nZZ\nM\npKdA = 0,\nZZ\nM\npHdA +\nZZ\nM\ndA = 0,\nwhere p = ⃗x · ⃗n is the support function of M, ⃗x denotes the position\nvector of M, ⃗n denotes the unit normal to M, and dA is the area\nelement of M."}, {"year": "2012", "subject": "Geometry & Topology", "paper": "2012_Geometry2012individual", "kind": "individual", "n": 6, "chars": 280, "tags": ["微分几何", "微分流形/形式", "经典场论/相对论"], "d": 1.77, "text": "Write the structure equation of an orthonormal frame on a Riemann-\nian manifold. Prove the following Riemannian metric g has constant\nsectional curvature c using the structure equation:\ng =\nPn\ni=1(dxi)2\n[1 + c\n4\nPn\ni=1(xi)2]2\nwhere (x1, . . . , xn) is a local coordinate system.\n1"}, {"year": "2012", "subject": "Geometry & Topology", "paper": "2012_Geometry2012team", "kind": "team", "n": 1, "chars": 85, "tags": ["微分流形/形式", "代数几何"], "d": 1.34, "text": "Prove that the real projective space RPn is a differentiable manifold\nof dimension n."}, {"year": "2012", "subject": "Geometry & Topology", "paper": "2012_Geometry2012team", "kind": "team", "n": 2, "chars": 154, "tags": ["线性代数/矩阵", "微分流形/形式"], "d": 1.46, "text": "Let M, N be n-dimensional smooth, compact, connected manifolds,\nand f : M →N a smooth map with rank equals to n everywhere.\nShow that f is a covering map."}, {"year": "2012", "subject": "Geometry & Topology", "paper": "2012_Geometry2012team", "kind": "team", "n": 3, "chars": 101, "tags": ["微分几何", "微分流形/形式"], "d": 1.36, "text": "Given any Riemannian manifold (M n, g), show that there exists a\nunique Riemannian connection on M n."}, {"year": "2012", "subject": "Geometry & Topology", "paper": "2012_Geometry2012team", "kind": "team", "n": 4, "chars": 170, "tags": [], "d": 1.28, "text": "Let Sn be the unit sphere in Rn+1 and f : Sn →Sn a continuous\nmap. Assume that the degree of f is an odd integer. Show that there\nexists x0 ∈Sn such that f(−x0) = −f(x0)."}, {"year": "2012", "subject": "Geometry & Topology", "paper": "2012_Geometry2012team", "kind": "team", "n": 5, "chars": 66, "tags": ["微分流形/形式"], "d": 1.06, "text": "State and prove the Stokes theorem for oriented compact manifolds."}, {"year": "2012", "subject": "Geometry & Topology", "paper": "2012_Geometry2012team", "kind": "team", "n": 6, "chars": 424, "tags": ["微分几何"], "d": 1.59, "text": "Let M be a surface in R3. Let D be a simply-connected domain\nin M such that the boundary ∂D is compact and consists of a finite\nnumber of smooth curves. Prove the Gauss-Bonnet Formula:\nZ\n∂D\nkg ds +\nX\nj\n(π −αj) +\nZZ\nD\nK dA = 2π,\nwhere kg is the geodesic curvature of the boundary curve. Each αj\nis the interior angle at a vertex of the boundary, K is the Gaussian\ncurvature of M, and the 2-form dA is the area element of M.\n1"}, {"year": "2012", "subject": "Probability & Statistics", "paper": "2012_Probability2012_individual", "kind": "individual", "n": 1, "chars": 309, "tags": [], "d": 1.37, "text": "Solve the following two problems:\n1) An urn contains b black balls and r red balls. One of the balls was\ndrawn at random, and putted back in the urn with a additional balls\nof the same color. Now suppose that the second ball drawn at random\nis red. What is the probability that the first ball drawn was black?"}, {"year": "2012", "subject": "Probability & Statistics", "paper": "2012_Probability2012_individual", "kind": "individual", "n": 2, "chars": 645, "tags": ["概率论"], "d": 1.82, "text": "Let (Xn) be a sequence of random variables satisfying\nlim\na→∞sup\nn≥1\nP(|Xn| > a) = 0.\nAssume that sequence of random variables (Yn) converges to 0 in prob-\nability. Prove that (XnYn) converges to 0 in probability.\n2. Solve the following two problems:\n1) Let (Ω, F, P) be a probability space, G be a sub-algebra of F.\nAssume that X is a non-negative integrable random variable. Set Y =\nE[X|G]. Prove that\n(a)[X > 0] ⊂[Y > 0],a.s.;\n(b)[Y > 0] = ess.inf{A : A ∈G, [X > 0] ⊂A}.\n2) Let X and Y have a bivariate normal distribution with zero means,\nvariances σ2 and τ 2, respectively, and correlation ρ. Find the condi-\ntional expectation E(X|X + Y )."}, {"year": "2012", "subject": "Probability & Statistics", "paper": "2012_Probability2012_individual", "kind": "individual", "n": 3, "chars": 416, "tags": [], "d": 1.57, "text": "Suppose that {p(i, j) : i = 1, 2, · · · , m; j = 1, 2, · · · , n} is a finite\nbivariate joint probability distribution, that is,\np(i, j) > 0,\nm\nX\ni=1\nn\nX\nj=1\np(i, j) = 1.\n(i) Can {p(i, j)} be always expressed as\np(i, j) =\nX\nk\nλkak(i)bk(j)\nfor some finite λk ≥0, P\nk λk = 1, ak(i) ≥0, Pm\ni=1 ak(i) = 1, bk(j) ≥\n0, Pn\nj=1 bk(j) = 1?\n1\n\n \n2\n(ii) Prove or disprove the above relation by use of conditional prob-\nability."}, {"year": "2012", "subject": "Probability & Statistics", "paper": "2012_Probability2012_individual", "kind": "individual", "n": 4, "chars": 1394, "tags": ["线性代数/矩阵", "概率论", "经典场论/相对论"], "d": 4.1, "text": "Let X1, · · · , Xm be an independent and identically distributed (i.i.d.)\nrandom sample from a cumulative distribution function (CDF) F, and\nY1, · · · , Yn an i.i.d. random sample from a CDF G. We want to test\nH0 : F = G versus H1 : F ̸= G. The total sample size is N = m + n.\nConsider the following two nonparametric tests.\n• The Wilcoxon rank sum tests. The test proceeds by first rank-\ning the pooled X and Y samples and then taking the sum of the\nranks associated with the Y sample. Let Ry1, · · · , Ryn be the\nrankings of the sample y1 < · · · < yn from the pooled sample\nin increasing order. The Wilcoxon rank sum statistic is defined\nas W = Pn\nj=1 Ryj.\n• The Mann-Whitney U-test.\nLet Uij = 1 if Xi < Yj, and\nUij = 0 otherwise. The Mann-Whitney U-statistic is defined\nas U = Pm\ni=1\nPn\nj=1 Uij. The probability γ = P(X < Y ) can be\nestimated as U/(mn). The decision rule is based on assessing\nif γ = 0.5.\nAssume that there are no tied data values.\n(a) Show that W = U + 1\n2n(n + 1), which shows that the two test\nstatistics differ only by a constant and yield exactly the same\np-values.\n(b) Using the central limit theorem, the Wilcoxon rank sum statis-\ntic W can be converted to a Z-variable, which provides an easy-\nto-use approximation. The transformation is\nZW = W −µW\nσW\n,\nwhere µW and σ2\nW are the mean and variance of W under H0.\nShow that µW = 1\n2n(N + 1) and σ2\nW =\n1\n12mn(N + 1)."}, {"year": "2012", "subject": "Probability & Statistics", "paper": "2012_Probability2012_individual", "kind": "individual", "n": 5, "chars": 192, "tags": ["实分析/测度", "概率论", "经典场论/相对论"], "d": 1.71, "text": "Let X be a random variable with EX2 < ∞, and Y = |X|. Assume\nthat X has a Lebesgue density symmetric about 0. Show that random\nvariables X and Y are uncorrelated, but they are not independent."}, {"year": "2012", "subject": "Probability & Statistics", "paper": "2012_Probability2012_individual", "kind": "individual", "n": 6, "chars": 446, "tags": ["概率论"], "d": 2.99, "text": "Let E1, · · · , En be i.i.d. random variables with Ei ∼Exponential(1).\nLet U1, · · · , Un be i.i.d. uniformly (on [0,1]) distributed random vari-\nables. Further, assume that E1, · · · , En and U1, · · · , Un are indepen-\ndent.\n(a) Find the density of X = (E1 +· · ·+Em)/(E1 +· · ·+En), where\nm < n.\n(b) Show that Y = (n−m)X\nm(1−X) is distributed as the F-distribution with\ndegrees of freedom (2m, 2(n −m))\n(c) Find the density of (U1 · · · Un)−X."}, {"year": "2012", "subject": "Probability & Statistics", "paper": "2012_Probability2012_team", "kind": "team", "n": 1, "chars": 376, "tags": ["概率论"], "d": 2.58, "text": "Let (Xn) be a sequence of i.i.d. random variables.\n1) Assume that each Xn satisfies the exponential distribution with\nparameter 1 (i.e. P(Xn ≥x) = e−x, x ≥0). Prove that\n(a) P(Xn > α log n, i.o.) = 0, if α > 1; P(Xn > α log n, i.o.) = 1, if\nα ≤1.\nHere \"i.o\" stands for \"infinitely often\", and An, i.o. stands lim supn→∞An.\n(b) Let L = lim supn→∞(Xn/ log n), then P(L = 1) = 1."}, {"year": "2012", "subject": "Probability & Statistics", "paper": "2012_Probability2012_team", "kind": "team", "n": 2, "chars": 437, "tags": ["概率论", "经典场论/相对论"], "d": 1.84, "text": "Assume that each Xn satisfies the Poisson distribution with pa-\nrameter λ (i.e. P(Xn = k) = λk\nk! e−λ, k = 0, 1, 2, · · · .) Put\nL = lim sup\nn→∞(Xn log log n/ log n).\nProve that P(L = 1) = 1.\n2. Let Xi be i.
