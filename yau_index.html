i.d exponential r.v with rate one, i ≥1. Let N be a\ngeometric random variable with success probability p, 0 < p < 1, i.e.\nP(N = k) = (1−p)k−1p, k = 1, 2, · · · , and independent of all Xi, i ≥1.\nFind the distribution of PN\ni=1 Xi."}, {"year": "2012", "subject": "Probability & Statistics", "paper": "2012_Probability2012_team", "kind": "team", "n": 3, "chars": 84, "tags": ["概率论"], "d": 1.15, "text": "Let X and Y be i.i.d real valued r.v's. Prove that P(|X +Y | < 1) ≤\n3P(|X −Y | < 1)."}, {"year": "2012", "subject": "Probability & Statistics", "paper": "2012_Probability2012_team", "kind": "team", "n": 4, "chars": 177, "tags": [], "d": 1.19, "text": "Suppose S = X1 + X2 + · · · + Xn, a sum of independent random\nvariables with Xi distributed Binomial(1, pi). Show that P(S even) =\n1/2 if and only if at least one pi equals 1/2."}, {"year": "2012", "subject": "Probability & Statistics", "paper": "2012_Probability2012_team", "kind": "team", "n": 5, "chars": 234, "tags": ["数理统计"], "d": 1.23, "text": "Let Bθ denote the closed unit ball in R2 with center θ. Suppose\nX1, X2, · · · , Xn are independently and uniformly distributed on Bθ,\nfor an unknown θ in R2. Denote that maximum likelihood estimator\nby ˆθ. Show that |ˆθ −θ| = Op(1/n)."}, {"year": "2012", "subject": "Probability & Statistics", "paper": "2012_Probability2012_team", "kind": "team", "n": 6, "chars": 603, "tags": ["数理统计"], "d": 2.67, "text": "Suppose that X1, · · · , Xn are a random sample from the Bernoulli\ndistribution with probability of success p1 and Y1, · · · , Yn be an inde-\npendent random sample from the Bernoulli distribution with probabil-\nity of success p2.\n1\n\n \n2\n(a) Derive the maximum likelihood ratio test statistic for\nH0 : p1 = p2 ←→H1 : p1 ̸= p2.\n(Note: No simplification of the resulting test statistic is re-\nquired. However, you need to give the asymptotic null.)\n(b) Compute the asymptotic power of the test with critical region\n|√n(ˆp1 −ˆp2)/\np\n2ˆpˆq| ⩾z1−α\nwhen p1 = p and p2 = p + n−1/2∆, where ˆp = 0.5.ˆp1 + 0.5ˆp2."}, {"year": "2013", "subject": "Analysis & PDE", "paper": "2013_TeamProblems2013", "kind": "team", "n": 1, "chars": 288, "tags": ["复分析"], "d": 1.96, "text": "Suppose ∆= {z ∈C | |z| < 1} is the open unit disk in the complex\nplane. Show that for any holomorphic function f : ∆→∆,\n(1)\n|f ′(z)|\n1 −|f(z)|2 ≤\n1\n1 −|z|2\nfor all z in ∆. If equality holds in (1) for some z0 ∈∆, show that\nf ∈Aut(∆), and that\n|f ′(z)|\n1 −|f(z)|2 =\n1\n1 −|z|2\nfor all z ∈∆."}, {"year": "2013", "subject": "Analysis & PDE", "paper": "2013_TeamProblems2013", "kind": "team", "n": 2, "chars": 574, "tags": ["实分析/测度"], "d": 2.89, "text": "Let f be a function of bounded variation on [a, b], f1 its generalized\nderivative as a measure, i.e. f(x)−f(a) =\n∫x\na f1(y)dy for every x ∈[a, b]\nand f1(x) is an integrable function on [a, b]. Let f\n′ be its weak deriva-\ntive as a generalized function, i.e.\n∫b\na f(x)g\n′(x)dx = −\n∫b\na f\n′(x)g(x)dx,\nfor any smooth function g(x) on [a, b], g(a) = g(b) = 0. Show that:\na) If f is absolutely continuous, then f\n′ = f1.\nb) If the weak derivative f\n′ of f is an integrable function on [a, b],\nthen f(x) is equal to an absolutely continuous function outside a set\nof measure zero."}, {"year": "2013", "subject": "Analysis & PDE", "paper": "2013_TeamProblems2013", "kind": "team", "n": 3, "chars": 278, "tags": ["优化/线性规划"], "d": 1.32, "text": "Show that the convex hull of the roots of any polynomial contains\nall its critical points as well as all the zeros of higher derivatives of the\npolynomial. Here the convex hull of a given bounded set in the plane\nis the smallest convex set containing the given set in the plane."}, {"year": "2013", "subject": "Analysis & PDE", "paper": "2013_TeamProblems2013", "kind": "team", "n": 4, "chars": 247, "tags": [], "d": 1.82, "text": "Let D ⊂R3 be an open domain. Show that every smooth vector\nfield F = (P, Q, R) over D can be written as F = F1 + F2 such that\nrot(F1) = 0, div(F2) = 0, where rot(F) = (∂R\n∂y −∂Q\n∂z , ∂P\n∂z −∂R\n∂x , ∂Q\n∂x −\n∂P\n∂y ), div(F) = ∂P\n∂x + ∂Q\n∂y + ∂R\n∂z ."}, {"year": "2013", "subject": "Analysis & PDE", "paper": "2013_TeamProblems2013", "kind": "team", "n": 5, "chars": 388, "tags": ["线性代数/矩阵", "泛函分析"], "d": 1.76, "text": "Let H be a Hilbert space and A a compact self-adjoint linear op-\nerator over H. Show that there exists an orthor-normal basis of H\nconsisting of eigenvectors φn of A with non-zero eigenvalues λn such\nthat every vector ξ ∈H can be written as: ξ = Σkckφk + ξ\n′, where\nξ\n′ ∈KerA, i.e., Aξ\n′ = 0. We also have Aξ = Σkλkckφk.\nIf there are infinitely many eigenvectors then limn→∞λn = 0.\n1\n\n \n2"}, {"year": "2013", "subject": "Analysis & PDE", "paper": "2013_TeamProblems2013", "kind": "team", "n": 6, "chars": 587, "tags": ["优化/线性规划"], "d": 3.31, "text": "A function f: R →R is called convex if\nf(λx + (1 −λ)x′) ≤λf(x) + (1 −λ)f(x′)\nfor 0 ≤λ ≤1 and each x, x′ ∈R, and is called strictly convex if\nf(λx + (1 −λ)x′) < λf(x) + (1 −λ)f(x′)\nfor 0 < λ < 1. We assume that |f(x)| < ∞whenever |x| < ∞.\n(a) Show that a convex function f is continuous and the function\ng(y) = max\nx∈R (xy −f(x))\nis a well-defined convex function over R.\n(b) Show that a convex function f is differentiable except at most\ncountably many points.\n(c) f is differentiable everywhere if both f and g are strictly convex.\n\n \nS.-T. Yau College Student Mathematics Contests 2013"}, {"year": "2013", "subject": "Geometry & Topology", "paper": "2013_TeamProblems2013", "kind": "team", "n": 1, "chars": 110, "tags": ["群论", "代数拓扑"], "d": 1.37, "text": "Let X be the space\n{(x, y, 0) | x2 + y2 = 1} ∪{(x, 0, z) | x2 + z2 = 1}\nFind the fundamental group π1(R3 \\ X)."}, {"year": "2013", "subject": "Geometry & Topology", "paper": "2013_TeamProblems2013", "kind": "team", "n": 2, "chars": 155, "tags": ["范畴/同调代数", "微分流形/形式"], "d": 1.49, "text": "Let M be a smooth connected manifold and f : M →M be an\ninjective smooth map such that f ◦f = f. Show that the image set\nf(M) is a smooth submanifold in M."}, {"year": "2013", "subject": "Geometry & Topology", "paper": "2013_TeamProblems2013", "kind": "team", "n": 3, "chars": 138, "tags": [], "d": 1.23, "text": "Let T 2 = {(z, w) ∈C2 | |z| = 1, |w| = 1} be the torus. Define a map\nf : T 2 →T 2 by f(z, w) = (zw3, w). Prove that f is a diffeomorphism."}, {"year": "2013", "subject": "Geometry & Topology", "paper": "2013_TeamProblems2013", "kind": "team", "n": 4, "chars": 66, "tags": ["微分几何", "微分流形/形式"], "d": 1.3, "text": "Prove: Any 3-dimensional Einstein manifold has constant curvature."}, {"year": "2013", "subject": "Geometry & Topology", "paper": "2013_TeamProblems2013", "kind": "team", "n": 5, "chars": 70, "tags": ["微分几何"], "d": 1.07, "text": "State and prove the Myers theorem for complete Riemannian man-\nifolds."}, {"year": "2013", "subject": "Geometry & Topology", "paper": "2013_TeamProblems2013", "kind": "team", "n": 6, "chars": 375, "tags": [], "d": 1.49, "text": "Let C be a regular closed curve in R3. Its torsion is τ. The integral\n1\n2π\n∫\nC τds is called the total torsion of C, where s is the arc length\nparameter. Prove: Given a smooth surface M in R3, if for any regular\nclosed curve C on M, the total torsion of C is always an integer, then\nM is a part of a sphere or a plane.\n1\n\n \nS.-T. Yau College Student Mathematics Contests 2013"}, {"year": "2013", "subject": "Algebra & Number Theory", "paper": "2013_TeamProblems2013", "kind": "team", "n": 1, "chars": 264, "tags": ["群论", "线性代数/矩阵", "经典场论/相对论"], "d": 1.82, "text": "(20pt) Let A be an n × n skew symmetric real matrix.\n1.1 (10 pt) Prove that all eigenvalues of A are imaginary or zero and that\neA is orthogonal.\n1.2 (10 pt) Find conditions on an orthogonal B such that B = eA is solvable\nfor some skew symmetric and real matrix A."}, {"year": "2013", "subject": "Algebra & Number Theory", "paper": "2013_TeamProblems2013", "kind": "team", "n": 2, "chars": 663, "tags": ["Galois/域扩张", "线性代数/矩阵"], "d": 2.37, "text": "(20pt) Let E/F be a field extension. Let A be an m × m matrix with\nentries in E such that tr(An) belongs to F for every n ≥2. Show that tr(A)\nbelongs to F by following steps.\n2.1 (5pt) Show that there is a polynomial P(x) = P\ni aixi ∈¯E[x] with\na0 = 1 such that\nX\ni\naitr(Ai+k) = 0,\n∀k ≥1.\n2.2 (5pt) Show that we have a polynomial Q = P\ni bixi ∈F[x] with b0 = 1\nsuch that\nX\ni\nbitr(Ai+k) = 0,\n∀k ≥2.\n2.3 (5pt) Let t ∈¯E be an eigenvalue of A with multiplicity m invertible in\nF. Show that Q(t) = 0.\n2.4 (5pt) Show that tr(A) belongs to F.\nHint: Let ti ∈¯E be all distinct non-zero eigen values of A with multiplicity\nmi invertible in F. Then\ntr(An) =\nX\ni\nmitn\ni .\n1"}, {"year": "2013", "subject": "Algebra & Number Theory", "paper": "2013_TeamProblems2013", "kind": "team", "n": 3, "chars": 155, "tags": ["数论"], "d": 1.19, "text": "(20pt) Let p be a prime and G = SL2(Fp).\n3.1 (10pt) Find the order of G.\n3.2 (10pt) Show that the order of every element of G divides either (p2 −1)\nor 2p."}, {"year": "2013", "subject": "Algebra & Number Theory", "paper": "2013_TeamProblems2013", "kind": "team", "n": 4, "chars": 160, "tags": ["群论", "表示论", "经典场论/相对论"], "d": 1.65, "text": "(20pt) Let S4 be the symmetric group of 4 letters.\n4.1 (10pt) Classify all complex irreducible representations of S4;\n4.2 (10pt) Find the character table of S4."}, {"year": "2013", "subject": "Algebra & Number Theory", "paper": "2013_TeamProblems2013", "kind": "team", "n": 5, "chars": 200, "tags": ["Galois/域扩张", "表示论"], "d": 1.45, "text": "(20pt) Let F2 be the finite field of two elements.\n5.1 (10pt ) Find all irreducible polynomials of degree 2 and 3 over F2;\n5.2 (10pt) What is the number of irreducible polynomials of degree 6 over\nF2?"}, {"year": "2013", "subject": "Algebra & Number Theory", "paper": "2013_TeamProblems2013", "kind": "team", "n": 6, "chars": 262, "tags": ["Galois/域扩张", "群论"], "d": 1.53, "text": "(20pt) Let F be the splitting field of x4 −2.\n6.1 (10pt) Describe the field F and the Galois group G = Gal(F/Q).\n6.2 (10pt) Describe all subfields K of F and corresponding Galois sub-\ngroups GK = Gal(F/K).\n2\n\n \nS.-T. Yau College Student Mathematics Contests 2013"}, {"year": "2013", "subject": "Computational & Applied", "paper": "2013_TeamProblems2013", "kind": "team", "n": 1, "chars": 1221, "tags": [], "d": 2.83, "text": "Scaling behavior is one of the most important phenomena in sci-\nentific modeling and mathematical analysis.\nThe following problem\nshows the universality and rigidity of scaling limits.\n(a): (10 points) Suppose U > 0 is an increasing function on [0, ∞)\nand there is a function 0 < ψ(x) < ∞for x > 0 such that\nlim\nt→∞\nU(tx)\nU(t) = ψ(x),\nfor all x > 0\nThen ψ(x) = xα for some α ≥0.\n(b): (10 points) The above problem can be generalized as:\nSuppose U > 0 is an increasing function on [0, ∞) and there\nis an extended function 0 ≤ψ(x) ≤∞and a set A dense in\n[0, ∞) such that\nlim\nt→∞\nU(tx)\nU(t) = ψ(x),\nfor all x ∈A\nThen ψ(x) = xα for some α ∈[0, ∞].\n(c): (15 points) (Warming: this part is hard).\nA function L : (0, ∞) →(0, ∞) is called slowly varying at ∞\nif\nlim\nt→∞\nL(tx)\nL(t) = 1,\nfor all x ∈A dense in (0, ∞)\nThe function U in (a) and (b) can be recast as U(x) = c xαL(x)\nfor some c ≥0. Now we can extend (b) to an even more general\nsetting:\nSuppose U > 0 is increasing on (0, ∞), set A dense in [0, ∞)\nand\nlim\nn→∞anU(bnx) = ψ(x) ≤∞, for all x ∈A.\nwhere bn →∞and an+1\nan\n→1 for some interval. Then there is a\nreal number α ∈[0, ∞], constant c ≥0, and a function L slowly\nvarying at ∞such that ψ(x) = xα and U(x) = c xαL(x)."}, {"year": "2013", "subject": "Computational & Applied", "paper": "2013_TeamProblems2013", "kind": "team", "n": 2, "chars": 601, "tags": ["线性代数/矩阵"], "d": 1.76, "text": "The following three operators are important for many mathematics\nand physics problems. Let ϕ(x) be a smooth periodic function in Tn, ∆,\n∇, ∇· be the standard Laplacian, gradient and divergence operators.\n(i): Fokker-Planck operator: Fu = −∆u −∇· (u∇ϕ)\n1\n\n \n2\n(ii): Witten Laplacian operator: Wu = −∆u + ∇ϕ · ∇u\n(iii): Schr¨odinger operator: Su = −∆u +\n(1\n4|∇ϕ|2 −1\n2∆ϕ\n)\nu\nShow that\n(a): (5 points) The Fokker-Planck operator can be recast as Fu =\n−∇· (e−ϕ∇(eϕu).\n(b): (10 points) These three operators have same eigenvalues.\n(c): (5 points) Find all equilibrium solutions for these three op-\nerators."}, {"year": "2013", "subject": "Computational & Applied", "paper": "2013_TeamProblems2013", "kind": "team", "n": 3, "chars": 508, "tags": [], "d": 1.62, "text": "(15 points) Let f(x) defined on [0, 1] be a smooth function with\nsufficiently many derivatives. xi = ih, where h = 1\nN and i = 0, 1, · · · , N\nare uniformly distributed points in [0, 1]. What is the highest integer\nk such that the numerical integration formula\nIN = 1\nN\n(\na0(f(x0) + f(xN)) + a1(f(x1) + f(xN−1)) +\nN−2\n∑\ni=2\nf(xi)\n)\nis k-th order accurate, namely\n\f\f\f\fIN −\n∫1\n0\nf(x)dx\n\f\f\f\f ≤Chk\nfor a constant C independent of h? Please describe the procedure to\nobtain the two constants a0 and a1 for this k."}, {"year": "2013", "subject": "Computational & Applied", "paper": "2013_TeamProblems2013", "kind": "team", "n": 4, "chars": 1193, "tags": ["代数几何"], "d": 4.14, "text": "The wave guide problem is defined as\nut + ux = 0,\nvt −vx = 0\nwith the boundary condition\nu(−1, t) = v(−1, t),\nv(1, t) = u(1, t)\nand the initial condition\nu(x, 0) = f(x),\nv(x, 0) = g(x).\nThe upwind scheme for the guide problem is defined as\nun+1\nj\n−un\nj\n∆t\n+ un\nj −un\nj−1\n∆x\n= 0,\nj = −N + 1, · · · , N;\nvn+1\nj\n−vn\nj\n∆t\n−vn\nj+1 −vn\nj\n∆x\n= 0,\nj = −N, · · · , N −1;\nwith the boundary condition\nun+1\n−N = vn+1\n−N ,\nvn+1\nN\n= un+1\nN\nwhere un\nj and vn\nj approximate u(xj, tn) and v(xj, tn) respectively at the\ngrid point (xj, tn), with xj = j∆x, tn = n∆t, ∆x = 1\nN .\n\n \n3\n(1) (5 points) For the solution to the wave guide problem with the\nabove boundary condition, prove the energy conservation\nd\ndt\n∫1\n−1\n(u2 + v2)dx = 0.\n(2) (5 points) For the numerical solution of the the upwind scheme,\nif we define the discrete energy as\nEn =\nN\n∑\nj=−N+1\n(un\nj )2 +\nN−1\n∑\nj=−N\n(vn\nj )2,\nprove the discrete energy stability\nEn+1 ≤En\nunder a suitable time step restriction ∆t\n∆x ≤λ0. You should first\nfind λ0.\n(3) (10 points) Under the same time step restriction, is the numer-\nical solution stable in the maximum norm? That is, can you\nprove\nmax\n−N≤j≤N max(|un+1\nj\n|, |vn+1\nj\n|) ≤\nmax\n−N≤j≤N max(|un\nj |, |vn\nj |)?"}, {"year": "2013", "subject": "Computational & Applied", "paper": "2013_TeamProblems2013", "kind": "team", "n": 5, "chars": 559, "tags": [], "d": 1.83, "text": "(15 points)\nLet G = (V, E) be a graph of order n. Let X1, X2,\n. . . , Xq with 2 ≤q ≤κ(X) be subsets of the vertex set V such that\nX = X1 ∪X2 ∪. . . ∪Xq. If for each i, i = 1, 2, . . . , q, and for any pair\nof nonadjacent vertices x, y ∈Xi, we have\nd(x) + d(y) ≥n,\nthen X is cyclable in G (i.e., there is a cycle containing all vertices of\nX.).\nWhere d(x) is the degree of x and κ(X) is the smallest number of\nvertices separating two vertices of X if X does not induce a complete\nsubgraph of G, otherwise we put κ(X) = |X| −1 if |X| ≥2 and\nκ(X) = 1 if |X| = 1."}, {"year": "2013", "subject": "Computational & Applied", "paper": "2013_TeamProblems2013", "kind": "team", "n": 6, "chars": 600, "tags": [], "d": 1.59, "text": "(15 points)\nLet (Fn)n be the Fibonacci sequence. Namely, F0 =\n0, F1 = 1, . . . , Fn+2 = Fn+1 + Fn.\nEstablish a relation between\n(\n0\n1\n1\n1\n)n\nand Fn and use it to design\nan efficient algorithm that for a given n computes the n-th Fibonacci\nnumber Fn. In particular, it must be more efficient than computing\nFn in n consecutive steps.\nGive an estimate on the number of steps of your algorithm.\nHint: Not that if m is even then\n(\n0\n1\n1\n1\n)m\n=\n((\n0\n1\n1\n1\n)m/2)2\n\n \n4\nand if m is odd then\n(\n0\n1\n1\n1\n)m\n=\n(\n0\n1\n1\n1\n)m−1\n·\n(\n0\n1\n1\n1\n)\nand m −1 is even.\n\n \nS.-T. Yau College Student Mathematics Contests 2013"}, {"year": "2013", "subject": "Probability & Statistics", "paper": "2013_TeamProblems2013", "kind": "team", "n": 1, "chars": 224, "tags": ["概率论"], "d": 1.27, "text": ". The characteristic function f of a probability distribution function F is\ndefined by\nf(t) =\n∫∞\n−∞\neitx dF(x).\nShow that f1(t) = (cos t)2 is a characteristic function and f2(t) = | cos t| is not a charac-\nteristic function."}, {"year": "2013", "subject": "Probability & Statistics", "paper": "2013_TeamProblems2013", "kind": "team", "n": 2, "chars": 316, "tags": ["实分析/测度", "概率论"], "d": 1.67, "text": ". Let I = [0, 1] be the unit interval and B the σ-algebra of Borel sets on I.\nLet P be the Lebesgue measure on I. Show that on the probability space (I, B, P) the\nset of points of x with the following property has probability 1: for all but finitely many\nrational numbers p/q ∈(0, 1),\n\f\f\f\fx −p\nq\n\f\f\f\f ≥\n1\n(q log q)2."}, {"year": "2013", "subject": "Probability & Statistics", "paper": "2013_TeamProblems2013", "kind": "team", "n": 3, "chars": 365, "tags": ["概率论"], "d": 2.49, "text": ". Let X be an integrable random variable, G a σ−algebra, and Y = E[X|G].\nAssume that X and Y have the same distribution.\n(1) Prove that if X is square-integrable, then X = Y , a.s. (i.e. X must be G measur-\nable) ;\n(2) Using a) to prove that for any pair of real numbers a, b with a < b, we have\nmin{max{X, a}, b} = min{max{Y, a}, b}, and consequently, X = Y , a.s."}, {"year": "2013", "subject": "Probability & Statistics", "paper": "2013_TeamProblems2013", "kind": "team", "n": 4, "chars": 549, "tags": ["数理统计"], "d": 3.12, "text": ". Let X1, · · · , Xn be iid N(θ, σ2), σ2 known, and let θ have a double exponen-\ntial distribution, that is, π(θ) = e−|θ|/a/(2a), a known. A Bayesian test of the hypothesis\nH0 : θ ≤0 versus H1 : θ > 0 will decide in favor of H1 if its posterior probability is large.\n1\n\n \n(a) For a given constant K, calculate the posterior probability that θ > K, that is,\nP(θ > K | x1, · · · , xn, a).\n(b) Find an expression for lima→∞P(θ > K | x1, · · · , xn, a).\n(c) Compare your answer in part (b) to the p-value associated with the classical hypoth-\nesis test."}, {"year": "2013", "subject": "Probability & Statistics", "paper": "2013_TeamProblems2013", "kind": "team", "n": 5, "chars": 1351, "tags": ["线性代数/矩阵", "数理统计"], "d": 3.52, "text": ". Two sets of interesting ideas emerging in the 1990's are the proposal of\nmodel selection with L1-penalty (e.g., lasso) and the proposal of soft thresholding in\nsimultaneous inferences. Consider a linear model\nY = Xβ + ε,\nwhere the set up is as usual (i.e., X is a non-random n by p matrix with 1 < p < n,\nε ∼N(0, σ2 · In) with In being the identity matrix). The lasso procedure is to obtain an\nestimate of the parameter vector β through minimizing\n(L) :\n1\n2||Y −Xβ||2\n2 + λ · ||β||1,\nwhich we denote by β∗\nλ; here λ > 0 is a tuning parameter, ||·||2 denote the usual L2 vector\nnorm, and || · ||1 denotes the usual L1 vector norm.\nDenote the ordinary least square estimate of β by ˆβ, we have\n1\n2||Y −Xβ||2\n2 + λ · ||β||1 = 1\n2||Y −X ˆβ||2\n2 + 1\n2||X(β −ˆβ)||2\n2 + λ · |β||1.\n(0.1)\nFurthermore, if X has orthonormal columns, e.g.,\nX′X = Ip,\nthen it can be shown that\nβ∗\nλ,i =\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nˆβi −γ,\nˆβi > γ,\n0,\n|ˆβi| ≤γ,\nˆβi + γ,\nβi < −γ.\n(0.2)\n(0.2) is called the soft thresholding of ˆβi's. This says that with orthonormal design, lasso\nsolution is equivalent to applying soft thresholding to the ordinary least square solution.\n2\n\n \n(a) Prove equation (0.1) without assuming X is orthogonal.\n(b) Show that the lasso estimator is obtained by (0.2) under the assumption that X is\northogonal, and find the relationship between λ and γ."}, {"year": "2013", "subject": "Probability & Statistics", "paper": "2013_TeamProblems2013", "kind": "team", "n": 6, "chars": 355, "tags": ["线性代数/矩阵"], "d": 2.92, "text": ". Consider a usual linear model Y = Xβ + ε, where ε ∼N(0, σ2 · In) and\nX has n rows and p columns where 1 < p < n. Consider a p-dimensional column vector\na ̸= 0.\n(a) Show that, if Xa = 0, then a′β is not estimable.\n(b) Prove or disprove that, if a′β is not estimable, then Xa = 0.\n(c) Show that X is full rank if and only if a′β are estimable for all a.\n3"}, {"year": "2013", "subject": "Algebra & Number Theory", "paper": "2013_algebra2013_individual", "kind": "individual", "n": 1, "chars": 170, "tags": ["群论"], "d": 1.17, "text": "(20pt)\n1.1 (15 pt) Classify finite groups of order 26 up to isomorphisms.\n1.2 (5 pt) For each finite group G of order 26, describe the group Aut(G)\nof automorphisms of G."}, {"year": "2013", "subject": "Algebra & Number Theory", "paper": "2013_algebra2013_individual", "kind": "individual", "n": 2, "chars": 553, "tags": [], "d": 1.82, "text": "(20 pt) Consider f ∈Z>0 and nonzero vector spaces Vi indexed by i ∈\nZ/fZ. Suppose that there are linear maps φi : Vi →Vi+1 and ψi : Vi →Vi−1\nsuch that\nφi−1 ◦ψi = 0,\nψi+1 ◦φi = 0.\n(We may think of a circular graph with oriented edges such that the \"Orpheus\ncondition\" holds: Whenever you turn back while traveling through the graph\nyou are killed.)\nProve that there exists lines ℓi ⊂Vi for every i ∈Z/fZ such that\nφi(ℓi) ⊂ℓi+1,\nψi(ℓi) ⊂ℓi−1\nunder one of the following two conditions:\n2.1 (10 pt) all ψi = 0, or\n2.2 (10 pt) dim Vi are equal to each other."}, {"year": "2013", "subject": "Algebra & Number Theory", "paper": "2013_algebra2013_individual", "kind": "individual", "n": 3, "chars": 454, "tags": ["表示论"], "d": 1.54, "text": "(20pt) For a parameter t = (t0, t1, · · · t5) ∈F6\n5 with t0 ̸= 0 and {ti, i > 0}\nan ordering of elements in F5, define a polynomial\nPt(x) = (x −t1)(x −t2)(x −t3) + t0(x −t4)(x −t5).\n1\n\n \n3.1 (7 pt) Show that Pt(x) is irreducible in F5[x];\n3.2 (6 pt) Show that two parameters t, t′ give the same polynomial if and\nonly if t0 = t′\n0 and {t4, t5} = {t′\n4, t′\n5}.\n3.3 (7 pt) Show that every irreducible cubic monic polynomial over F5 is\nobtained by this way."}, {"year": "2013", "subject": "Algebra & Number Theory", "paper": "2013_algebra2013_individual", "kind": "individual", "n": 4, "chars": 890, "tags": ["表示论", "范畴/同调代数"], "d": 2.73, "text": "(40 pt) For k non-negative integer, let Vk := R[x]≤k be the vector space\nof real polynomials of degree at most k with an action by SL2(R) by\nγ · P(x) = (cx + d)kP\n\u0012ax + b\ncx + d\n\u0013\n,\nγ =\n\u0012a\nb\nc\nd\n\u0013\n∈SL2(R).\n4.1 (20 pt) Show that Vk is an irreducible representation of SL2(R);\n4.2 (15 pt) For non-negative integers m, n, consider Vm,n := Vm ⊗Vn as\na subspace of C[x, y] of polynomials with both x, y-degrees at most\nk, with diagonal action of SL2(R). Assume m ≥n ≥1. Show that\nfollowing exact sequence is exact and split as representations of SL2(R).\n0−→Vm−1,n−1\n·(y−x)\n−→Vm,n\ny=x\n−→Vm+n−→0.\nThis implies the following decomposition of representations:\nVm ⊗Vn = ⊕n\ni=0Vm+n−2i.\n4.3 (5 pt) For non-negative integers ℓ≥m ≥n consider the space of\ninvariants (Vℓ⊗Vm ⊗Vn)SL2(R). Show that this space is either trivial or\none-dimensional; it is non-trivial if and only if\nℓ+ m + n ≡0\nmod 2,\nℓ+ m ≥n."}, {"year": "2013", "subject": "Algebra & Number Theory", "paper": "2013_algebra2013_individual", "kind": "individual", "n": 5, "chars": 229, "tags": ["表示论", "数论"], "d": 1.51, "text": "(60 pt)\n5.1 (20pt) Find a polynomial f(x) with integer coefficients which has a\nroot over Fp for each prime p but has not root over Q.\n5.2 (20pt) Can you find f irreducible?\n5.3 (20pt) What is the smallest possible degree of f?\n2"}, {"year": "2013", "subject": "Analysis & PDE", "paper": "2013_analysis2013_individual", "kind": "individual", "n": 1, "chars": 130, "tags": [], "d": 1.21, "text": "Suppose that f is an integrable function on Rd. For each α > 0, let\nEα = {x||f(x)| > α}. Prove that:\n∫\nRd |f(x)|dx =\n∫∞\n0\nm(Eα)dα."}, {"year": "2013", "subject": "Analysis & PDE", "paper": "2013_analysis2013_individual", "kind": "individual", "n": 2, "chars": 112, "tags": [], "d": 1.18, "text": "Let p(z) be a polynomial of degree d ≥2, with distinct roots\na1, a2, · · · , ad. Show that\nd\n∑\ni=1\n1\np′(ai) = 0."}, {"year": "2013", "subject": "Analysis & PDE", "paper": "2013_analysis2013_individual", "kind": "individual", "n": 3, "chars": 236, "tags": [], "d": 1.39, "text": "Let α be a number such that α/π is not a rational number. Show\nthat:\n1) limN→∞ΣN\nn=1eik(x+nα) =\n1\n2π\n∫π\n−π eiktdt.\n2) For every continuous periodic function f : R →C of period 2π,\nwe have\nlim\nN→∞\n1\nN ΣN\nn=1f(x + nα) = 1\n2π\n∫π\n−π\nf(t)dt."}, {"year": "2013", "subject": "Analysis & PDE", "paper": "2013_analysis2013_individual", "kind": "individual", "n": 4, "chars": 118, "tags": ["调和/位势"], "d": 1.13, "text": "Let u be a positive harmonic function over the punctured complex\nplane C/{0}. Show that u must be a constant function."}, {"year": "2013", "subject": "Analysis & PDE", "paper": "2013_analysis2013_individual", "kind": "individual", "n": 5, "chars": 269, "tags": ["实分析/测度"], "d": 2.49, "text": "Suppose H = L2(B), B is the unit ball in Rd. Let K(x, y) be a\nmeasurable function on B × B that satisfies\n|K(x, y)| ≤A|x −y|−d+α\nfor some α > 0, whenever x, y ∈B. Define\nTf(x) =\n∫\nB\nK(x, y)f(y)dy\n(a) Prove that T is a bounded operator on H.\n(b) Prove that T is compact."}, {"year": "2013", "subject": "Analysis & PDE", "paper": "2013_analysis2013_individual", "kind": "individual", "n": 6, "chars": 358, "tags": ["线性代数/矩阵", "经典场论/相对论"], "d": 1.84, "text": "Let A be a n×n real non-degenerate symmetric matrix. For λ ∈R+,\nwe define:\n∫\nR exp(iλx2)dx = limϵ→0+ ∫∞\n−∞exp(iλx2 −1\n2ϵx2)dx. Show\nthat:\n1\n\n \n2\n∫\nRn exp(iλ\n2 < Ax, x > −i < x, ξ >)dx\n= (2π\nλ )n/2| det(A)|−1/2 exp(−i\n2λ < A−1ξ, ξ >) exp(iπ\n4 sgnA).\nHere λ ∈R+, ξ ∈Rn, sgn(A) = ν+(A) −ν−(A), ν+(A)(ν−(A)) is the\nnumber of positive (negative) eigenvalues of A."}, {"year": "2013", "subject": "Computational & Applied", "paper": "2013_applied2013_individual", "kind": "individual", "n": 1, "chars": 1026, "tags": ["偏微分方程", "统计物理"], "d": 2.62, "text": "We consider the wave equation utt = ∆u in R3 × R+.\n(a): (5 pts) A right going pulse with speed 1\nu(x, y, z, t) = 1 for t < x < t + 1;\nu(x, y, z, t) = 0 else\nis clearly a solution to the wave equation.\nHowever, it is a\ndiscontinuous solution, explain in which sense it is a solution to\nthe equation.\n(b): (5 pts) Surprisingly, one can construct smooth progressive\nwave solutions with speed larger than 1.\nIn astronomy this\nkind of wave known as superluminal wave. Try a solution of\nthe form\nu(x, y, z, t) = v( x −ct\n√\nc2 −1, y, z),\nc ∈R3,\n|c| > 1.\nDerive an equation for v and show that there is a nontrivial\nsolution with compact support in (y, z) for any fixed x, t.\n(c): (5 pts) For any R > 0, 0 < t < R, show that energy\nE(t) :=\n∫\n|⃗x|≤R−t\n(\n|ut(·, t)|2 + |∇u(·, t)|2)\nd⃗x\nis a decreasing function.\n(c): (10 pts) Show that smooth superluminal progressive wave\nsolutions of the form\nu(⃗x, t) = v(⃗x −⃗ct),⃗c ∈R3,\n|⃗c| > 1.\ncannot have a finite energy.\nHint: Using (c) and look at the energy of the solution in\nvarious balls."}, {"year": "2013", "subject": "Computational & Applied", "paper": "2013_applied2013_individual", "kind": "individual", "n": 2, "chars": 668, "tags": ["常微分方程"], "d": 3.31, "text": "Finite time extinction and hyper-contractiveity are important prop-\nerties in modeling of some physical and biology systems. The essence\nof estimates is given by the following problem for ODE.\nAssume y(t) ≥0 is a C1 function for t > 0 satisfying y′(t) ≤α −\nβy(t)a for α > 0, β > 0, then\n(a) (10 points) For a > 1, y(t) has the following hyper-contractive\nproperty\ny(t) ≤(α/β)1/a +\n[\n1\nβ(a −1)t\n]\n1\na−1\n,\nfor t > 0.\n1\n\n \n2\n(b) (2 points) For a = 1, y(t) decays exponentially\ny(t) ≤α/β + y(0)e−βt.\n(c) (10 points) For a < 1, α = 0, y(t) has finite time extinction,\nwhich means that there exists Text such that 0 < Text ≤y1−a(0)\nβ(1−a)\nand that y(t) = 0 for all t > Text."}, {"year": "2013", "subject": "Computational & Applied", "paper": "2013_applied2013_individual", "kind": "individual", "n": 3, "chars": 163, "tags": ["微分流形/形式", "流体/连续介质"], "d": 1.41, "text": "Consider the speed v of a ball (density ρ, radius R) falling through\na viscous fluid (density ρf, viscosity µ) with drag coefficient given by\nStokes' law ζ = 6πRµ:"}, {"year": "2013", "subject": "Computational & Applied", "paper": "2013_applied2013_individual", "kind": "individual", "n": 4, "chars": 1413, "tags": ["常微分方程"], "d": 4.39, "text": "3πR3ρdv\ndt = 4\n3πR3(ρ −ρf)g −ζv,\nv(0) = v0\n(a): (5 points) Nondimensionalize the equation by writing, v(t) =\nV ˜v(˜t) with t = T˜t. Select V , T (characteristic scales known\nas terminal velocity and settling time respectively) so that all\ncoefficients in the ODE but one are equal to 1. Your equation\nwill have a single dimensionless parameter given by the ratio of\nthe initial speed v0 to the characteristic speed V .\n(b): (2 points) Solve the nondimensional problem for ˜v(˜t).\n(c): (8 points) Describe the behavior of the solution if the initial\nspeed v0 is (i) faster than and (ii) slower than the characteristic\nspeed V . Compute the time to reach (v0 + V )/2.\n4. Let\nVh = {v : v|Ij ∈P k(Ij)\n1 ≤j ≤N}\nwhere\nIj = (xj−1, xj),\n1 ≤j ≤N\nwith\nxj = jh,\nh = 1\nN .\nHere P k(Ij) denotes the set of polynomials of degree at most k in the\ninterval Ij.\nRecall the L2 projection of a function u(x) into the space Vh is defined\nby the unique function uh ∈Vh which satisfies\n||u −uh|| ≤||u −v||\n∀v ∈Vh\nwhere the norm is the usual L2 norm. We assume u(x) has at least\nk + 2 continuous derivatives.\n(1) (5 points) Prove the error estimate\n||u −uh|| ≤Chk+1\nExplain how the constant C depends on the derivatives of u(x).\n\n \n3\n(2) (10 points)\nIf another function φ(x) also has at least k + 2\ncontinuous derivatives, prove\n|\n∫1\n0\n(u(x) −uh(x))φ(x)dx| ≤Ch2k+2\nExplain how the constant C depends on the derivatives of u(x)\nand φ(x)."}, {"year": "2013", "subject": "Computational & Applied", "paper": "2013_applied2013_individual", "kind": "individual", "n": 5, "chars": 324, "tags": ["辛几何/力学"], "d": 2.45, "text": "(15 points)\nLet G(V, E) be a simple graph of order n and δ the\nminimum degree of vertices. Suppose that the degree sum of any pair\nof nonadjacent vertices is at least n and F ⊂E with |F| ≤⌊δ−2\n2 ⌋. Let\nG−F be the graph obtained from G by deleting the edges in F. Prove\nthat\n(1) G −F is connected and\n(2) G −F is Hamiltonian."}, {"year": "2013", "subject": "Computational & Applied", "paper": "2013_applied2013_individual", "kind": "individual", "n": 6, "chars": 540, "tags": [], "d": 1.55, "text": "(15 points)\nLet (Fn)n be the Fibonacci sequence. Namely, F0 =\n0, F1 = 1, . . . , Fn+2 = Fn+1 + Fn.\nEstablish a relation between\n(\n0\n1\n1\n1\n)n\nand Fn and use it to design\nan efficient algorithm that for a given n computes the n-th Fibonacci\nnumber Fn. In particular, it must be more efficient than computing\nFn in n consecutive steps.\nGive an estimate on the number of steps of your algorithm.\nHint: Not that if m is even then\n(\n0\n1\n1\n1\n)m\n=\n((\n0\n1\n1\n1\n)m/2)2\nand if m is odd then\n(\n0\n1\n1\n1\n)m\n=\n(\n0\n1\n1\n1\n)m−1\n·\n(\n0\n1\n1\n1\n)\nand m −1 is even."}, {"year": "2013", "subject": "Geometry & Topology", "paper": "2013_geometry2013_individual", "kind": "individual", "n": 1, "chars": 149, "tags": ["群论", "范畴/同调代数", "代数拓扑"], "d": 1.7, "text": "Find the homology and fundamental group of the space X = S1 ×\nS1/{p, q} obtained from the torus by identifying two distinct points\np, q to one point."}, {"year": "2013", "subject": "Geometry & Topology", "paper": "2013_geometry2013_individual", "kind": "individual", "n": 2, "chars": 139, "tags": ["经典场论/相对论"], "d": 1.28, "text": "Suppose (X, d) is a compact metric space and f : X →X is a map\nso that d(f(x), f(y)) = d(x, y) for all x, y ∈X. Show that f is an onto\nmap."}, {"year": "2013", "subject": "Geometry & Topology", "paper": "2013_geometry2013_individual", "kind": "individual", "n": 3, "chars": 329, "tags": ["群论", "微分几何"], "d": 1.68, "text": "Let M 2 ba a complete regular surface and K be the Gaussian curva-\nture. Suppose σ : [0, ∞) →M is a geodesic such that K(σ(t)) ≤f(t),\nwhere f is a differentiable function on [0, ∞). Prove that any solution\nu(t) of the equation\nu′′(t) + f(t)u(t) = 0\nhas a zero on [0, t0], where σ(t0) is the first conjugate point to σ(0)\nalong σ."}, {"year": "2013", "subject": "Geometry & Topology", "paper": "2013_geometry2013_individual", "kind": "individual", "n": 4, "chars": 288, "tags": ["微分几何", "微分流形/形式", "经典场论/相对论"], "d": 1.93, "text": "Let g1, g2 be Riemannian metrics on a differentiable manifold M,\nand denote by R1 and R2 their respective Riemannian curvature tensor.\nSuppose that R1(X, Y, Y, X) = R2(X, Y, Y, X) holds for any tangent\nvectors X, Y ∈TpM. Show that R1(X, Y, Z, W) = R2(X, Y, Z, W) for\nany X, Y , Z, W ∈TpM."}, {"year": "2013", "subject": "Geometry & Topology", "paper": "2013_geometry2013_individual", "kind": "individual", "n": 5, "chars": 408, "tags": ["微分几何", "微分流形/形式"], "d": 2.75, "text": "Let M n be an even dimensional, orientable Riemannian manifold\nwith positive sectional curvature.\nLet σ : [0, l] →M be a closed\ngeodesic, namely, σ is a geodesic with σ(0) = σ(l) and σ′(0) = σ′(l).\nShow that there exist an ϵ > 0 and a smooth map F : [0, l] × (−ϵ, ϵ) →\nM, such that F(t, 0) = σ(t), and for any fixed s ̸= 0 in (−ϵ, ϵ), σs(t) =\nF(t, s) is a closed smooth curve with length less than that of σ."}, {"year": "2013", "subject": "Geometry & Topology", "paper": "2013_geometry2013_individual", "kind": "individual", "n": 6, "chars": 245, "tags": ["微分几何", "经典场论/相对论"], "d": 1.52, "text": "Let (M 2, ds2) be a minimal surface in R3, where ds2 is the restriction\nof the Euclidean metric. Assume that the Gaussian curvature K of\n(M 2, ds2) is negative.\nDenote by eK the Gaussian curvature of the\nmetric f\nds2 = −Kds2. Show that eK = 1.\n1"}, {"year": "2013", "subject": "Probability & Statistics", "paper": "2013_probability2013_individual", "kind": "individual", "n": 1, "chars": 226, "tags": ["概率论"], "d": 2.34, "text": ". Let (Xn) be a sequence of random variables.\n(1) Assume that ∑∞\nn=0 P(|Xn| > n) < ∞. Prove that lim supn→∞\n|Xn|\nn\n≤1.\n(2) Prove that (Xn) converges in probability to 0 if and only if for certain r > 0,\nE\n[\n|Xn|r\n1+|Xn|r\n]\n→0."}, {"year": "2013", "subject": "Probability & Statistics", "paper": "2013_probability2013_individual", "kind": "individual", "n": 2, "chars": 270, "tags": ["概率论"], "d": 2.44, "text": ". Let X and Y be independent N(0, 1) random variables.\n(1) Find E[X + Y |X ≥0, Y ≥0];\n(2) Find the distribution function of X + Y given that X ≥0 and Y ≥0.\n(Hint: For b) using the fact that U = (X + Y )/\n√\n2 and V = (X −Y )/\n√\n2 are\nindependent and N(0, 1) distributed.)"}, {"year": "2013", "subject": "Probability & Statistics", "paper": "2013_probability2013_individual", "kind": "individual", "n": 3, "chars": 483, "tags": ["概率论"], "d": 2.57, "text": ". Let {Xn} be a sequence of independent and identically distributed con-\ntinuous real valued random variables, and regard n as time. Let An be the following\nevent:\nAn = {Xn = max{X1, X2, · · · , Xn}}.\nWe say that a maximum record occurs at n in such an event.\n(1) Evaluate the probability P(An).\n(2) Denote by Yn the number of maximum records occurred until time n, i.e.,\nYn = the number of {1 ≤k ≤n : Xk = max{X1, X2, · · · , Xk}}.\nEvaluate the expectation EYn and the variance DYn."}, {"year": "2013", "subject": "Probability & Statistics", "paper": "2013_probability2013_individual", "kind": "individual", "n": 4, "chars": 523, "tags": [], "d": 3.06, "text": ". Let X = (X1, · · · , Xn) be an iid sample from an exponential density with\nmean θ. Consider testing H0 : θ = θ0 vs. H1 : θ > θ0. Let P(X) = your p-value for an\nappropriate test.\n1\n\n \n(a) What is Eθ0(P(X))? Derive your answer explicitly.\n(b) Derive Eθ(P(X)) for θ ̸= θ0. Specifically, assuming only one sample, i.e. n = 1,\ncalculate Eθ(P(X)) as explicitly as possible for θ ̸= θ0.\n(c) When there is only one sample, is Eθ(P(X)) a decreasing function of θ? In general,\ncan you prove your result for an arbitrary MLR family?"}, {"year": "2013", "subject": "Probability & Statistics", "paper": "2013_probability2013_individual", "kind": "individual", "n": 5, "chars": 509, "tags": ["数理统计"], "d": 3.06, "text": ". Let X1, X2 be iid uniform on θ −1\n2 to θ + 1\n2.\n(a) Show that for any given 0 < α < 1, you can find c > 0 such that\nPθ{ ¯X −c < θ < ¯X + c} = 1 −α,\nwhere ¯X is the sample mean.\n(b) Show that for ϵ positive and sufficiently small\nPθ{ ¯X −c < θ < ¯X + c\n\f\f |X2 −X1| ≥1 −ϵ} = 1\n(c) The statement in (a) is used to assert that ¯X ±c is a 100(1−α)% confidence interval\nfor θ. Does the assertion in (b) contradict this? If your sample observations are\nX1 = 1, X2 = 2, would you use the confidence interval in (a)?"}, {"year": "2013", "subject": "Probability & Statistics", "paper": "2013_probability2013_individual", "kind": "individual", "n": 6, "chars": 535, "tags": ["数理统计"], "d": 2.56, "text": ". Suppose you want to estimate the total number of enemy tanks in a war on\nthe basis of the captured tanks. Assume without loss of generality that the tank serial\nnumbers are 1, 2, · · · , N, where N is the unknown total number of enemy tanks. Also\nassume the serial numbers of the n captured tanks are iid uniform on 1, 2, · · · , N. (This\nis a simplified assumption which provides a good approximation if n << N).\n(a) Find the complete sufficient statistic.\n(b) Suggest how you may find the minimum variance unbiased estimate of N.\n2"}, {"year": "2014", "subject": "Algebra & Number Theory", "paper": "2014_algebra2014_individual", "kind": "individual", "n": 1, "chars": 632, "tags": ["群论", "表示论"], "d": 3.84, "text": ". Let G be a finite subgroup of GL(V ) where V is an n-dimensional complex\nvector space.\n(a) (5 points) Let\nH = {h ∈G : hv = η(h)v for some η(h) ∈C× and all v ∈V }.\nProve that H is a normal subgroup of G and that the map h 7→η(h) is an isomor-\nphism between H and its image in C×.\n(b) (5 points) Let χV be the character function of G acting on V , i.e., χV (g) = tr(g)\nwith g viewed as an automorphism of V . Prove |χV (g)| ≤n for all g ∈G, and the\nequality holds if and only if g ∈H.\n(c) (10 points) Let W be an irreducible representation of G. Then W is isomorphic to\na direct summand of V ⊗m for some m (as representations of G)."}, {"year": "2014", "subject": "Algebra & Number Theory", "paper": "2014_algebra2014_individual", "kind": "individual", "n": 2, "chars": 388, "tags": ["线性代数/矩阵"], "d": 3.03, "text": ". Let a1, . . . , an be nonnegative real numbers.\n(a) (6 points) Prove that the n × n matrix A = (tai+aj) is positive semi-definite for\nevery real number t > 0. Find the rank of A.\n(b) (7 points) Let B = (cij)n×n be an n × n-matrix with cij =\n1\n1+ai+aj . Prove that A is\na positive semi-definite matrix.\n(c) (7 points) Prove that B is positive definite if and only if ai are all distinct."}, {"year": "2014", "subject": "Algebra & Number Theory", "paper": "2014_algebra2014_individual", "kind": "individual", "n": 3, "chars": 318, "tags": ["数论"], "d": 2.86, "text": ". Consider the equations\nX2 −82Y 2 = ±2\n(a) (5 points) Show that if (x, y) is a solution for X2−82Y 2 = ±2, then (9x−82y, x−9y)\nis a solution for X2 −82Y 2 = ∓2.\n(b) (7 points) Show that the equations have solutions over Z/pnZ for any n and odd\nprime p.\n(c) (8 points) Show that the equations have no solutions over Z."}, {"year": "2014", "subject": "Algebra & Number Theory", "paper": "2014_algebra2014_individual", "kind": "individual", "n": 4, "chars": 408, "tags": ["群论"], "d": 2.99, "text": ". Let S and T be nonabelian finite simple groups, and write G = S × T.\n(a) (7 points) Show that the total number of normal subgroups of G is four.\n(b) (6 points) If S and T are isomorphic, show that G has a maximal proper subgroup\nnot containing either direct factor.\n(c) (7 points) If G has a maximal proper subgroup that contains neither of the direct\nfactors of G, show that S and T are isomorphic.\n1\n\n \n2"}, {"year": "2014", "subject": "Algebra & Number Theory", "paper": "2014_algebra2014_individual", "kind": "individual", "n": 5, "chars": 410, "tags": ["Galois/域扩张", "数论"], "d": 1.92, "text": ". (20 points) Let F be a finite field and fi ∈F[X1, X2, ..., Xn] be polynomials\nof degree di, where 1 ≤i ≤r, such that fi(0, ..., 0) = 0 for all i. Show that if\nn >\nr\n∑\ni=1\ndi,\nthen there exists nonzero solution to the system of equations: fi = 0, for all 1 ≤i ≤\nr. (Hint: you may first verify that the number of integral solutions is congruent to the\nfollowing number modulo p\n∑\nX∈Fn\nr∏\ni=1\n(\n1 −fi(X)q−1)\n.\n)"}, {"year": "2014", "subject": "Algebra & Number Theory", "paper": "2014_algebra2014_individual", "kind": "individual", "n": 6, "chars": 180, "tags": ["线性代数/矩阵"], "d": 2.26, "text": ".\n(a) ( 5 points) Let A and B be two real n × n matrices such that AB = BA. Show\nthat det(A2 + B2) ≥0.\n(b) (15 points) Generalize this to the case of k pairwise commuting matrices."}, {"year": "2014", "subject": "Algebra & Number Theory", "paper": "2014_algebra2014_team", "kind": "team", "n": 1, "chars": 800, "tags": ["群论"], "d": 3.73, "text": ". Let the special linear group (of order 2)\nSL2(R) = {g =\n\u0012\na\nb\nc\nd\n\u0013\n∈M2(R) : det g = 1}\nact on the upper half plane H = {z = x + iy ∈C : y > 0} linear fractionally:\n\u0012\na\nb\nc\nd\n\u0013\nz = az + b\ncz + d.\n(a) (5 points)\nProve that the action is transitive, i.e., for any two z1, z2 ∈H, there is\ng ∈SL2(R) such that gz1 = z2.\n(b) (5 points)\nFor a fixed z ∈H, prove that its stabilizer Gz = {g ∈SL2(R) : gz = z}\nis isomorphic to SO2(R) = {g ∈M2(R) : ggt = 1}, where gt is the transpose of g.\n(c)(10 points)\nLet Z be the set of integers and let\nΓ(2) =\n\u001a\u0012\na\nb\nc\nd\n\u0013\n∈SL2(R) : a, b, c, d ∈Z,\na −1 ≡d −1 ≡b ≡c ≡0\n(mod 2)\n\u001b\nbe a discrete subgroup of SL2(R) (no need to prove this), and let it act on Q∪{∞} linearly\nfractionally as above. How many orbits does this action have? Give a representative for\neach orbit."}, {"year": "2014", "subject": "Algebra & Number Theory", "paper": "2014_algebra2014_team", "kind": "team", "n": 2, "chars": 216, "tags": ["数论"], "d": 2.26, "text": ". Let p ≥7 be an odd prime number.\n(a) (5 points) (to warm up) Evaluate the rational number cos(π/7)·cos(2π/7)·cos(3π/7).\n(b) (15 points) Show that Q(p−1)/2\nn=1\ncos(nπ/p) is a rational number and determine its\nvalue."}, {"year": "2014", "subject": "Algebra & Number Theory", "paper": "2014_algebra2014_team", "kind": "team", "n": 3, "chars": 468, "tags": ["群论", "线性代数/矩阵"], "d": 2.89, "text": ". (20 points, 10 points each) For any 3 × 3 matrix A ∈M3(Q), let Adb be the\n6 × 6 matrix\nAdb :=\n\u0012\n0\nI3\nA\n0\n\u0013\n(a) Express the characteristic and minimal polynomials of Adb over Q in terms of the\ncharacteristic and minimal polynomial of A.\n(b) Suppose that A, B ∈M3(Q) are such that Adb and Bdb are conjugate in the sense\nthat there exists an element C ∈GL6(Q) such that C · Adb · C−1 = Bdb. Are A and\nB conjugate? (Either prove this statement or give a counterexample.)"}, {"year": "2014", "subject": "Algebra & Number Theory", "paper": "2014_algebra2014_team", "kind": "team", "n": 4, "chars": 52, "tags": [], "d": 1.04, "text": ". (20 points) Classify all groups of order 8.\n1\n\n \n2"}, {"year": "2014", "subject": "Algebra & Number Theory", "paper": "2014_algebra2014_team", "kind": "team", "n": 5, "chars": 481, "tags": ["群论", "经典场论/相对论"], "d": 3.08, "text": ". Let V be a finite dimensional vector space over complex field C with a non-\ndegenerate symmetric bilinear form ( , ). Let\nO(V ) = {g ∈GL(V )|(gu, gv) = (u, v), u, v ∈V }\nbe the orthogonal group.\n(a) (10 points) Prove that\n(V ⊗C V )O(V ) ∼= EndO(V )(V ),\nand construct one such isomorphism. Here O(V ) acts on V ⊗C V via g(a ⊗b) =\nga ⊗gb, and (V ⊗C V )O(V ) is the fixed point subspace of V ⊗V .\n(b) (10 points) Prove that the fixed point subspace (V ⊗C V )O(V ) is 1-dimensional."}, {"year": "2014", "subject": "Algebra & Number Theory", "paper": "2014_algebra2014_team", "kind": "team", "n": 6, "chars": 517, "tags": [], "d": 3.17, "text": ". (20 points) Let c be a non-zero rational integer.\n(a) (6 points) Factorize the three variable polynomial\nf(x, y, z) = x3 + cy3 + c2z3 −3cxyz\nover C (you may assume c = θ3 for some θ ∈C).\n(b) (7 points) When c = θ3 is a cube for some rational integer θ, prove that there are\nonly finitely many integer solutions (x, y, z) ∈Z3 to the equation f(x, y, z) = 1.\n(c) (7 points) When c is not a cube of any rational integers, prove that there infinitely\nmany integer solutions (x, y, z) ∈Z3 to the equation f(x, y, z) = 1."}, {"year": "2014", "subject": "Analysis & PDE", "paper": "2014_analysis2014_individual", "kind": "individual", "n": 1, "chars": 163, "tags": [], "d": 1.36, "text": "Let f : R →R be a continuous function which satisfies\nsup\nx,y∈R\n|f(x + y) −f(x) −f(y)| < ∞.\nIf we have\nlim\nn→∞,n∈N\nf(n)\nn\n= 2014, prove sup\nx∈R\n|f(x) −2014 x| < ∞."}, {"year": "2014", "subject": "Analysis & PDE", "paper": "2014_analysis2014_individual", "kind": "individual", "n": 2, "chars": 177, "tags": ["复分析"], "d": 1.22, "text": "Let f1, ..., fn are analytic functions on D = {z||z| < 1} and contin-\nuous on ¯D, prove that ϕ(z) = |f1(z)| + |f2(z)| + ... + |fn(z)| achieves\nmaximum values at the boundary ∂D."}, {"year": "2014", "subject": "Analysis & PDE", "paper": "2014_analysis2014_individual", "kind": "individual", "n": 3, "chars": 135, "tags": ["复分析"], "d": 1.14, "text": "Prove that if there is a conformal mapping between the annulus\n{z|r1 < |z| < r2} and the annulus {z|ρ1 < |z| < ρ2}, then r2\nr1 = ρ2\nρ1."}, {"year": "2014", "subject": "Analysis & PDE", "paper": "2014_analysis2014_individual", "kind": "individual", "n": 4, "chars": 261, "tags": ["调和/位势"], "d": 1.39, "text": "Let U(ξ) be a bounded function on R with finitely many points of\ndiscontinuity, prove that\nPU(x) = 1\nπ\n∫\nR\ny\n(x −ξ)2 + y2U(ξ)dξ\nis a harmonic function on the upper half plane {z ∈C|Imz > 0} and\nit converges to U(ξ) as z →ξ at a point ξ where U(ξ) is continuous."}, {"year": "2014", "subject": "Analysis & PDE", "paper": "2014_analysis2014_individual", "kind": "individual", "n": 5, "chars": 354, "tags": ["Fourier/变换", "数学物理/量子"], "d": 1.79, "text": "Let f ∈L2(R) and let ˆf be its Fourier transform. Prove that\n∫∞\n−∞\nx2|f(x)|2dx\n∫∞\n−∞\nξ2| ˆf(ξ)|2dξ ≥\n(\n∫∞\n−∞|f(x)|2dx)2\n16π2\n,\nunder the condition that the two integrals on the left are bounded.\n(Hint: Operators f(x) →xf(x) and ˆf(ξ) →ξ ˆf(ξ) after Fourier\ntransform are non-commuting operators. The inequality is a version of\nthe uncertainty principle.)"}, {"year": "2014", "subject": "Analysis & PDE", "paper": "2014_analysis2014_individual", "kind": "individual", "n": 6, "chars": 494, "tags": ["复分析"], "d": 3.24, "text": "Let Ωbe an open domain in the complex plane C. Let H be the\nsubspace of L2(Ω) consisting of holomorphic functions on Ω.\na) Show that H is a closed subspace of L2(Ω), and hence is a Hilbert\nspace with inner product\n(f, g) =\n∫\nΩ\nf(z)¯g(z)dxdy, where z = x + iy.\nb) If {ϕn}∞\nn=0 is an orthonormal basis of H, then\n1\n\n \n2\nΣ∞\nn=0|ϕn(z)|2 ≤\nc2\nd(z, Ωc), for z ∈Ω.\nc) The sum\nB(z, w) = Σ∞\nn=0ϕn(z)¯ϕn(w)\nconverges absolutely for (z, w) ∈Ω× Ω, and is independent of the\nchoice of the orthonormal basis."}, {"year": "2014", "subject": "Analysis & PDE", "paper": "2014_analysis2014_team", "kind": "team", "n": 2, "chars": 127, "tags": [], "d": 1.15, "text": "Calculate the integral:\n∫∞\n0\nlog x\n1 + x2dx.\nConstruct an increasing function on R whose set of discontinuities\nis precisely Q."}, {"year": "2014", "subject": "Analysis & PDE", "paper": "2014_analysis2014_team", "kind": "team", "n": 3, "chars": 175, "tags": ["复分析"], "d": 1.23, "text": "Prove that any bounded analytic function F over {z|r < |z| < R}\ncan be written as F(z) = zαf(z), where f is an analytic function over\nthe disk {z||z| < R} and α is a constant."}, {"year": "2014", "subject": "Analysis & PDE", "paper": "2014_analysis2014_team", "kind": "team", "n": 4, "chars": 395, "tags": [], "d": 2.68, "text": "Let D ⊂Rn be a bounded open set, f : ¯D →¯D is a smooth map\nsuch that its Jacobian\n\f\f\f\f\n∂f\n∂x\n\f\f\f\f ≡1, where ¯D denotes the closure of D.\nProve\n(a) for each small ball Bϵ(x), there exists a positive integer k such\nthat f k(Bϵ(x)) ∩Bϵ(x) ̸= ∅, where Bϵ(x) denotes the ball cen-\ntered at x with radius ϵ;\n(b) there exists x ∈¯D and a sequence k1, k2, · · · kj, · · · such that\nf kj(x) →x as kj →∞."}, {"year": "2014", "subject": "Analysis & PDE", "paper": "2014_analysis2014_team", "kind": "team", "n": 5, "chars": 195, "tags": ["调和/位势"], "d": 1.39, "text": "Let u be a subharmonic function over a domain Ω⊂C, i.e., it is\ntwice differentiable and ∆u = ∂2u\n∂x2 + ∂2u\n∂y2 ≥0. Prove that u achieves its\nmaximum in the interior of Ωonly when u is a constant."}, {"year": "2014", "subject": "Analysis & PDE", "paper": "2014_analysis2014_team", "kind": "team", "n": 6, "chars": 175, "tags": [], "d": 1.38, "text": "Suppose that ϕ ∈C∞\n0 (Rn),\n∫\nRn ϕdx = 1. Let ϕϵ(x) = ϵ−nϕ(x/ϵ), x ∈\nRn, ϵ > 0. Prove that if f ∈Lp(Rn), 1 ≤p < ∞, then f ∗ϕϵ →f in\nLp(Rn), as ϵ →0. It is not true for p = ∞.\n1"}, {"year": "2014", "subject": "Computational & Applied", "paper": "2014_applied2014_individual", "kind": "individual", "n": 1, "chars": 428, "tags": ["范畴/同调代数"], "d": 1.36, "text": "(20 pts) Ming Antu (1692-1763) is one of the greatest Chinese/Mongolian\nmathematicians. In the 1730s, he first established and used what was\nlater to be known as Catalan numbers (Euler (1707-1763) rediscov-\nered them around 1756; Belgian mathematician Eugene Catalan (1814-\n1894) \"rediscovered\" them again in 1838),\ncn =\n1\nn + 1\n(2n\nn\n)\n,\nn = 0, 1, 2, · · ·\nand Ming Antu derived the following half-angle formula in 1730:\nsin2 θ"}, {"year": "2014", "subject": "Computational & Applied", "paper": "2014_applied2014_individual", "kind": "individual", "n": 2, "chars": 761, "tags": ["Galois/域扩张"], "d": 1.92, "text": "=\n∞\n∑\nn=1\ncn−1\n(sin θ\n2\n)2n\nProve this formula.\nHint: you may use generating function\nF(z) =\n∞\n∑\nn=0\ncnzn\nand show that ∑\nm+k=n cmck = cn+1 and then show zF(z)2 = F(z)−1.\n2. Many algorithms, including polynomial factorisation in finite fields,\nrequire to compute gcd(f(X), XN −1) for a polynomial f of reasonably\nsmall degree n and a binomial XN −1 of very large degree N. Since\nN is very large the direct application of the Euclid algorithm is very\ninefficient.\nQuestions:\n(i) (10 pts) Suggest a more efficient approach the direct computa-\ntion of gcd(f(X), XN −1) via the Euclid algorithm.\n(ii) (10 pts) Generalise it to gcd(f(X), A1XN1 + . . . + AmXNm +\nAm+1).\nHint: If for three polynomials f, g and h we have g ≡h (mod f)\nthen\ngcd(f, g) = gcd(f, h).\n1\n\n \n2"}, {"year": "2014", "subject": "Computational & Applied", "paper": "2014_applied2014_individual", "kind": "individual", "n": 3, "chars": 636, "tags": ["代数几何"], "d": 2.38, "text": "For solving the following partial differential equation\nut + f(u)x = 0,\n0 ≤x ≤1\n(1)\nwhere f ′(u) ≥0, with periodic boundary condition, we can use the\nfollowing semi-discrete upwind scheme\nd\ndtuj + f(uj) −f(uj−1)\n∆x\n= 0,\nj = 1, 2, · · · , N,\n(2)\nwith periodic boundary condition\nu0 = uN,\n(3)\nwhere uj = uj(t) approximates u(xj, t) at the grid point x = xj = j∆x,\nwith ∆x = 1\nN .\n(i) (15 pts) Prove the following L2 stability of the scheme\nd\ndtE(t) ≤0\n(4)\nwhere E(t) = ∑N\nj=1 |uj|2∆x.\n(ii) (15 pts) Do you believe (4) is true for E(t) = ∑N\nj=1 |uj|2p∆x for\narbitrary integer p ≥1? If yes, prove the result. If not, give a\ncounter example."}, {"year": "2014", "subject": "Computational & Applied", "paper": "2014_applied2014_individual", "kind": "individual", "n": 4, "chars": 766, "tags": ["线性代数/矩阵", "数值分析", "经典场论/相对论"], "d": 2.36, "text": "Let A be an n × n matrix with real and positive eigenvalues and b\nbe a given vector. Consider the solution of Ax = b by the following\nRichardson's iteration\nx(k+1) = (I −ωA)x(k) + ωb\nwhere ω is a damping coefficient. Let λ1 and λn be the smallest and\nthe largest eigenvalues of A. Let Gω = I −ωA.\n(i) (4 points) Prove that the Richardson's iteration converges if\nand only if\n0 < ω < 2\nλn\n.\n(ii) (8 points) Prove that the optimal choice of ω is given by\nωopt =\n2\nλ1 + λn\n.\nProve also that\nρ(Gω) =\n\n\n\n\n\n1 −ωλ1\nω ≤ωopt\n(λn −λ1)/(λn + λ1)\nω = ωopt\nωλn −1\nω ≥ωopt\nwhere ρ(Gω) is the spectral radius of Gω.\n\n \n3\n(iii) (8 points) Prove that, if A is symmetric and positive definite,\nthen\nρ(Gωopt) = κ2(A) −1\nκ2(A) + 1\nwhere κ2(A) is the spectral condition number of A."}, {"year": "2014", "subject": "Computational & Applied", "paper": "2014_applied2014_individual", "kind": "individual", "n": 5, "chars": 742, "tags": ["偏微分方程", "数值分析"], "d": 3.19, "text": "(10 pts) For solving the following heat equation on interval\nut = uxx,\n0 ≤x ≤1\n(5)\nwith boundary condition\nu(0) = u0,\nu(1) = u1,\n(6)\nwe first discretize the interval [0, 1] into N subintervals uniformly, that\nis, the mesh size h = 1/N. We choose a temporal step size k and ap-\nproximate the solution u(jh, nk) by U n\nj , j = 1, ..., N −1, n = 0, 1, 2, ....\nUsing the backward Euler method in time and central finite difference\nin space, the discrete function U n\nj satisfies:\nU n+1\nj\n−U n\nj = λ(U n+1\nj−1 −2U n+1\nj\n+ U n+1\nj+1 ),\nj = 1, ..., N −1,\n(7)\nwhere λ = k/h2, and\nU n+1\n0\n= u0, U n+1\nN\n= u1.\nShow that\n1\n2\nN−1\n∑\nj=1\n(\n(U n+1\nj\n)2 −(U n\nj )2)\n≤−λ\nN−2\n∑\nj=1\n(U n+1\nj+1 −U n+1\nj\n)2\n−λ\n2((U n+1\n1\n)2 + (U n+1\nN−1)2) + λ\n2(u2\n0 + u2\n1)\n(8)"}, {"year": "2014", "subject": "Computational & Applied", "paper": "2014_applied2014_team", "kind": "team", "n": 1, "chars": 311, "tags": [], "d": 1.43, "text": "(15 pts)\nGiven a finite positive (Borel) measure dµ on [0, 1], define its sequence\nof moments as follows\ncj =\n∫1\n0\nxj dµ(x) ,\nj = 0, 1, . . . .\nShow that the sequence is completely monotone in the sense that that\n(I −S)kcj ≥0\nfor all j, k ≥0,\nwhere S denotes the backshift operator given by Scj = cj+1 for j ≥0."}, {"year": "2014", "subject": "Computational & Applied", "paper": "2014_applied2014_team", "kind": "team", "n": 2, "chars": 707, "tags": ["表示论", "数论"], "d": 2.01, "text": "(20 pts)\nWe recall that a polynomial\nf(X) = adXd + ad−1Xd−1 + · · · + a1X + a0 ∈Z[X]\nis called an Eisenstein polynomial if for some prime p we have\n(i) p | ai for i = 0, . . . , d −1,\n(ii) p2 ∤a0,\n(iii) p ∤ad.\nEisenstein polynomials are well-know to be irreducible over Z, so they\ncan be used to construct explicit examples of irreducible polynomials.\nQuestions:\n(i) Prove that a composition f(g(X)) of two Eisenstein polynomi-\nals f and g is an Eisenstein polynomial again.\n(ii) Suggest a multivariate generalisation of the Eisenstein polyno-\nmials. That is, describe a class polynomials F(X1, . . . , Xm) in\nterms of the divisibility properties of their coefficients that are\nguaranteed to be irreducible."}, {"year": "2014", "subject": "Computational & Applied", "paper": "2014_applied2014_team", "kind": "team", "n": 3, "chars": 746, "tags": ["代数几何"], "d": 2.03, "text": "(20 pts) For solving the following partial differential equation\nut + f(u)x = 0,\n0 ≤x ≤1\n(1)\nwhere f ′(u) ≥0, with periodic boundary condition, we can use the\nfollowing semi-discrete discontinuous Galerkin method: Find uh(·, t) ∈\nVh such that, for all v ∈Vh and j = 1, 2, · · · , N,\n∫\nIj\n(uh)tvdx−\n∫\nIj\nf(uh)vxdx+f((uh)−\nj+1/2)v−\nj+1/2−f((uh)−\nj−1/2)v+\nj−1/2 = 0,\n(2)\n1\n\n \n2\nwith periodic boundary condition\n(uh)−\n1/2 = (uh)−\nN+1/2;\n(uh)+\nN+1/2 = (uh)+\n1/2,\n(3)\nwhere Ij = (xj−1/2, xj+1/2), 0 = x1/2 < x3/2 < · · · < xN+1/2 = 1,\nh = maxj(xj+1/2 −xj−1/2), v±\nj+1/2 = v(x±\nj+1/2, t), and\nVh = {v : v|Ij is a polynomial of degree at most k for 1 ≤j ≤N}.\nProve the following L2 stability of the scheme\nd\ndtE(t) ≤0\n(4)\nwhere E(t) =\n∫1\n0 (uh(x, t))2dx."}, {"year": "2014", "subject": "Computational & Applied", "paper": "2014_applied2014_team", "kind": "team", "n": 4, "chars": 752, "tags": [], "d": 1.79, "text": "Consider the linear system Ax = b. The GMRES method is a pro-\njection method which obtains a solution in the m-th Krylov subspace\nKm so that the residual is orthogonal to AKm. Let r0 be the initial\nresidual and let v0 = r0. The Arnoldi process is applied to build an\northonormal system v1, v2, · · · , vm−1 with v1 = Av0/∥Av0∥. The ap-\nproximate solution is obtained from the following space\nKm = span{v0, v1, · · · , vm−1}.\n(i) (5 points) Show that the approximate solution is obtained as\nthe solution of a least-square problem, and that this problem is\ntriangular.\n(ii) (5 points) Prove that the residual rk is orthogonal to {v1, v2, · · · , vk−1}.\n(iii) (5 points) Find a formula for the residual norm.\n(iv) (5 points) Derive the complete algorithm."}, {"year": "2014", "subject": "Computational & Applied", "paper": "2014_applied2014_team", "kind": "team", "n": 5, "chars": 287, "tags": ["线性代数/矩阵", "数值分析"], "d": 1.54, "text": "(10 pts)\n(i) Set x0 = 0. Write the recurrence\nxk = 2xk−1 + bk,\nk = 1, 2, · · · , n,\nin a matrix form A⃗x = ⃗b. For b1 = −1/3, bk = (−1)k, k =\n2, 3, · · · , n, verify that xk = (−1)k/3, k = 1, 2, · · · , n is the\nexact solution.\n(ii) Find A−1 and compute condition number of A in L1 norm."}, {"year": "2014", "subject": "Geometry & Topology", "paper": "2014_geometry2014_individual", "kind": "individual", "n": 1, "chars": 200, "tags": ["范畴/同调代数", "代数拓扑"], "d": 1.52, "text": "Let X be the quotient space of S2 under the identifications x ∼−x\nfor x in the equator S1. Compute the homology groups Hn(X). Do the\nsame for S3 with antipodal points of the equator S2 ⊂S3 identified."}, {"year": "2014", "subject": "Geometry & Topology", "paper": "2014_geometry2014_individual", "kind": "individual", "n": 2, "chars": 458, "tags": ["微分几何", "经典场论/相对论"], "d": 2.96, "text": "Let M →R3 be a graph defined by z = f(u, v) where {u, v, z} is\na Descartes coordinate system in R3. Suppose that M is a minimal\nsurface. Prove that:\n(a) The Gauss curvature K of M can be expressed as\nK = ∆log\n(\n1 + 1\nW\n)\n,\nW :=\n√\n1 +\n(∂f\n∂u\n)2\n+\n(∂f\n∂v\n)2\n,\nwhere ∆denotes the Laplacian with respect to the induce metric on\nM (i.e., the first fundamental form of M).\n(b) If f is defined on the whole uv-plane, then f is a linear function\n(Bernstein theorem)."}, {"year": "2014", "subject": "Geometry & Topology", "paper": "2014_geometry2014_individual", "kind": "individual", "n": 3, "chars": 196, "tags": ["微分流形/形式"], "d": 1.31, "text": "Let M = R2/Z2 be the two dimensional torus, L the line 3x = 7y\nin R2, and S = π(L) ⊂M where π : R2 →M is the projection map.\nFind a differential form on M which represents the Poincar´e dual of S."}, {"year": "2014", "subject": "Geometry & Topology", "paper": "2014_geometry2014_individual", "kind": "individual", "n": 4, "chars": 321, "tags": ["微分几何"], "d": 3.01, "text": "Let p : ( ˜\nM, ˜g) →(M, g) be a Riemannian submersion. This is a\nsubmersion p : ˜\nM →M such that for each x ∈˜\nM, Dp : ker⊥(Dp) →\nTp(x)(M) is a linear isometry.\n(a) Show that p shortens distances.\n(b) If ( ˜\nM, ˜g) is complete, so is (M, g).\n(c) Show by example that if (M, g) is complete, ( ˜\nM, ˜g) may not be\ncomplete."}, {"year": "2014", "subject": "Geometry & Topology", "paper": "2014_geometry2014_individual", "kind": "individual", "n": 5, "chars": 164, "tags": ["微分几何", "经典场论/相对论"], "d": 1.54, "text": "Let Ψ : M →R3 be an isometric immersion of a compact surface\nM into R3. Prove that\n∫\nM H2dσ ≥4π, where H is the mean curvature\nof M and dσ is the area element of M."}, {"year": "2014", "subject": "Geometry & Topology", "paper": "2014_geometry2014_individual", "kind": "individual", "n": 6, "chars": 210, "tags": ["微分流形/形式"], "d": 1.28, "text": "The unit tangent bundle of S2 is the subset\nT 1(S2) = {(p, v) ∈R3 | ∥p∥= 1, (p, v) = 0 and ∥v∥= 1}.\nShow that it is a smooth submanifold of the tangent bundle T(S2) of\nS2 and T 1(S2) is diffeomorphic to RP 3.\n1"}, {"year": "2014", "subject": "Geometry & Topology", "paper": "2014_geometry2014_team", "kind": "team", "n": 1, "chars": 100, "tags": ["范畴/同调代数", "代数拓扑"], "d": 1.4, "text": "Compute the fundamental and homology groups of the wedge sum\nof a circle S1 and a torus T = S1 × S1."}, {"year": "2014", "subject": "Geometry & Topology", "paper": "2014_geometry2014_team", "kind": "team", "n": 2, "chars": 295, "tags": ["微分流形/形式"], "d": 1.43, "text": "Given a properly discontinuous action F : G×M →M on a smooth\nmanifold M, show that M/G is orientable if and only if M is orientable\nand F(g, ·) preserves the orientation of M. Use this statement to show\nthat the M¨obius band is not orientable and that RP n is orientable if\nand only if n is odd."}, {"year": "2014", "subject": "Geometry & Topology", "paper": "2014_geometry2014_team", "kind": "team", "n": 3, "chars": 275, "tags": [], "d": 2.38, "text": "(a) Consider the space Y obtained from S2 × [0, 1] by identifying\n(x, 0) with (−x, 0) and also identifying (x, 1) with (−x, 1), for all x ∈\nS2. Show that Y is homeomorphic to the connected sum RP 3#RP 3.\n(b) Show that S2 × S1 is a double cover of the connected sum\nRP 3#RP 3."}, {"year": "2014", "subject": "Geometry & Topology", "paper": "2014_geometry2014_team", "kind": "team", "n": 4, "chars": 86, "tags": ["群论", "微分几何", "微分流形/形式", "经典场论/相对论"], "d": 1.84, "text": "Prove that a bi-invariant metric on a Lie group G has nonnegative\nsectional curvature."}, {"year": "2014", "subject": "Geometry & Topology", "paper": "2014_geometry2014_team", "kind": "team", "n": 5, "chars": 108, "tags": ["经典场论/相对论"], "d": 1.14, "text": "Let M be the upper half-plane R2\n+ with the metric\nds2 = dx2 + dy2\nyk\n.\nFor which values of k is M complete?"}, {"year": "2014", "subject": "Geometry & Topology", "paper": "2014_geometry2014_team", "kind": "team", "n": 6, "chars": 165, "tags": ["微分流形/形式"], "d": 1.2, "text": "Given any nonorientable manifold M show the existence of a smooth\norientable manifold M which is a double covering of M. Find M when\nM is RP 2 or the M¨obius band.\n1"}, {"year": "2014", "subject": "Probability & Statistics", "paper": "2014_probability2014_individual", "kind": "individual", "n": 1, "chars": 185, "tags": ["概率论"], "d": 1.25, "text": ". Let X be a real valued random variable such that for all smooth functions\nf : R →R with compact support we have E[Xf(X)] = E[f ′(X)]. Show that X has the\nstandard normal distribution."}, {"year": "2014", "subject": "Probability & Statistics", "paper": "2014_probability2014_individual", "kind": "individual", "n": 2, "chars": 151, "tags": ["概率论"], "d": 1.17, "text": ". Let (Xn) be a sequence of uncorrelated random variables of mean zero such\nthat\n∞\nX\nn=1\nnE|Xn|2 < ∞.\nShow that Sn = Pn\ni=1 Xi converges almost surely."}, {"year": "2014", "subject": "Probability & Statistics", "paper": "2014_probability2014_individual", "kind": "individual", "n": 3, "chars": 387, "tags": ["实分析/测度", "概率论"], "d": 2.74, "text": ". Let (Ω, F) be a measurable space and G be a sub-σ-field of F. Let P and\nQ be two probabilities which are mutually absolutely continuous on F. We denote by X0\nthe Radon-Nikodym density of Q with respect to P on F. Show that the following two\nproperties are satisfied:\n(a) 0 < EP[X0|G] < +∞, P-a.s.;\n(b) for every F-measurable non-negative random variable f,\nEP[fX0|G] = EQ[f|G]EP[X0|G]."}, {"year": "2014", "subject": "Probability & Statistics", "paper": "2014_probability2014_individual", "kind": "individual", "n": 4, "chars": 557, "tags": [], "d": 3.14, "text": ".\nSuppose X1, . . . , Xn, . . . is a sequence of random numbers drawn from\nthe uniform distribution U(0, 1). One observes these numbers sequentially. At time n,\none keeps a record of Yn\ndef\n= X(n) = maxn\ni=1 Xi = max{Yn−1, Xn} and Zn\ndef\n=\n¯Xn =\nPn\ni=1 Xi/n = (n −1)/nZn−1 + 1/nXn and discards all previous recordings.\n(a) What is the best guess of X1 if one only observes Yn?\n(b) What is the best guess of X1 if one only observes Zn?\n(c) Comparing the two guesses of X1, which one is better (and in what sense)?\nGive good reasoning to justify your answers."}, {"year": "2014", "subject": "Probability & Statistics", "paper": "2014_probability2014_individual", "kind": "individual", "n": 5, "chars": 781, "tags": ["数理统计"], "d": 1.86, "text": ". Suppose we take a random sample of size n from a bag of colored balls\n(red, blue and yellow balls) with replacement. Let X1 denote the number of red balls, X2\ndenote the number of blue balls, and X3 denote the number of yellow balls in the sample.\nAssuming we know that the total number of yellow balls is triple the total number of red\nballs in the bag. Or in other words, the red, blue and yellow balls occur with probability\np1, p2 and p3 = 3p1, respectively in the bag.\n1. Find the aymptotic distribution (after appropriate normalization) for the MLE of\np2.\n2. Construct the likelihood ratio test statistic for the null hypothesis that p1 = p2 =\np3/3 (the alternative is that p1 = p2 = p3/3 is not true). What is the asymptotic\ndistribution of your test statistic under null?"}, {"year": "2014", "subject": "Probability & Statistics", "paper": "2014_probability2014_team", "kind": "team", "n": 1, "chars": 188, "tags": [], "d": 2.21, "text": ". Suppose that Xn converges to X in distribution and Yn converges to a\nconstant c in distribution. Show that\n(a) Yn converges to c in probability;\n(b) XnYn converges to cX in distribution."}, {"year": "2014", "subject": "Probability & Statistics", "paper": "2014_probability2014_team", "kind": "team", "n": 2, "chars": 319, "tags": ["概率论"], "d": 2.38, "text": ". Let X and Y be two random variables with |Y | > 0, a.s.. Let Z = X/Y .\n(a) Assume the distribution function of (X, Y ) has the density p(x, y). What is the\ndensity function of Z?\n(b) Assume X and Y are independent and X is N(0, 1) distributed, Y has the uniform\ndistribution on (0, 1). Give the density function of Z."}, {"year": "2014", "subject": "Probability & Statistics", "paper": "2014_probability2014_team", "kind": "team", "n": 3, "chars": 410, "tags": ["概率论"], "d": 2.54, "text": ". Let (Ω, F, P) be a probability space.\n(a) Let G be a sub σ-algebra of F, and Γ ∈F. Prove that the following properties\nare equivalent:\n(i) Γ is independent of G under P,\n(ii) for every probability Q on (Ω, F), equivalent to P, with dQ/dP being G measur-\nable, we have Q(Γ) = P(Γ).\n(b) Let X, Y, Z be random variables and Y is integrable. Show that if (X, Y ) and Z\nare independent, then E[Y |X, Z] = E[Y |X]."}, {"year": "2014", "subject": "Probability & Statistics", "paper": "2014_probability2014_team", "kind": "team", "n": 4, "chars": 324, "tags": ["概率论", "数理统计"], "d": 1.6, "text": ". Let X1, ..., Xn be i.i.d. N(0, σ2), and let M be the mean of |X1|, ..., |Xn|.\n1. Find c ∈R so that ˆσ = cM is a consistent estimator of σ.\n2. Determine the limiting distribution for √n(ˆσ −σ).\n3. Identify an approximate (1 −α)% confidence interval for σ.\n4. Is ˆσ = cM asymptotically efficient? Please justify your answer."}, {"year": "2014", "subject": "Probability & Statistics", "paper": "2014_probability2014_team", "kind": "team", "n": 5, "chars": 656, "tags": ["表示论", "数理统计"], "d": 1.91, "text": ". The shifted exponential distribution has the density function\nf(y; ϕ, θ) = 1/θ exp{−(u −ϕ)/θ},\ny > ϕ, θ > 0.\nLet Y1, . . . , Yn be a random sample from this distribution. Find the maximum likelihood\nestimator (MLE) of ϕ and θ and the limiting distribution of the MLE.\nYou may use the following R´enyi representation of the order statistics: Let E1, . . . , En, be\na random sample from the standard exponential distribution (i.e., the above distribution\nwith ϕ = 0, θ = 1). Let E(r) denote the r-th order statistics. According to the R´enyi\nrepresentation,\nE(r)\nD=\nr\n∑\nj=1\nEj\nn + 1 −j ,\nr = 1, . . . , n.\nHere, the symbol\nD= denotes equal in distribution."}, {"year": "2015", "subject": "Algebra & Number Theory", "paper": "2015_algebra2015_individual", "kind": "individual", "n": 1, "chars": 1170, "tags": ["群论", "环与模", "偏微分方程"], "d": 4.8, "text": ". (20 pt) Let G be an finite Z-module ( i.e., a finite abelian group with\nadditive group law) with a bilinear, (strongly) alternative, and non-degenerate pairing\nℓ: G × G →Q/Z.\nHere \"(strongly) alternating\" means for every a ∈G, ℓ(a, a) = 0; \"non-degenerate\"\nmeans for every nonzero a ∈G there is a b ∈G such that ℓ(a, b) ̸= 0. Show in steps\nthe following statement:\n(S) : G is isomorphic to H1 ⊕H2 for some finite abelian groups H1 ≃H2 such that\nℓ|Hi×Hi = 0.\n(1.1) (5pt) For every a ∈G, write o(a) for the order of a and ℓa : G−→Q/Z for the\nhomomorphism ℓa(b) = ℓ(a, b). Show that the image of ℓa is o(a)−1Z/Z.\n(1.2) (5pt) Show that G has a pair of elements a, b with the following properties:\n(a) o(a) is maximal in the sense that for any x ∈G, o(x) | o(a);\n(b) ℓ(a, b) = o(a)−1 mod Z.\n(c) o(a) = o(b)\nWe call the subgroup < a, b >:= Za + Zb a maximal hyperbolic subgroup of G.\n(1.3) (5pt) Let < a, b > be a maximal hyperbolic subgroup of G. Let G′ be the orthog-\nonal complement of < a, b > consisting of elements x ∈G such that ℓ(x, c) = 0\nfor all c ∈< a, b >. Show that G is a direct sum as follows:\nG = Za ⊕Zb ⊕G′.\n(1.4) (5pt) Finish the proof of (S) by induction."}, {"year": "2015", "subject": "Algebra & Number Theory", "paper": "2015_algebra2015_individual", "kind": "individual", "n": 2, "chars": 1081, "tags": ["群论", "线性代数/矩阵"], "d": 4.6, "text": "(40pt). Let On(C) denote the group of n×n orthogonal complex matrices,\nand Mn×k(C) the space of n × k complex matrices, where n and k are two positive\nintegers. For i = 0, 1, let Fi be the space of rational function f on Mn×k(C) such that\n(∗)\nf(gx) = det(g)if(x)\nfor all g ∈On(C) and x ∈Mn×k(C).\nWe want to study in steps the structures of F0 and F1.\n1\n\n \n(2.1) (10pt) For each x ∈Mn×k, let Vx denote the subspace of Cn generated by columns\nof x, and let Q(x) = xt · x ∈Mk×k(C). Show the following are equivalent:\n(a) the space Vx has dimension k, and the Euclidean inner product (·, ·) is non-\ndegenerate on Vx in the sense that V ⊥\nx ∩Vx = 0.\n(b) det Q(x) ̸= 0.\n(2.2) (10pt) Show that F0 is a field generated by entries of Q(x).\n(2.3) (10pt) Assuem k < n and let f ∈F1. Show that f = 0 by the following two steps:\n(a) for any x ∈Mn×k(C) with det Q(x) ̸= 0, construct a g ∈On(C) such that\ng|Vx = 1 and det g = −1.\n(b) Show that f vanishes on a general point x ∈Mn×k(C) with det Q(x) ̸= 0,\nthus f ≡0.\n(2.4) (10pt) Assume k ≥n. Show that F1 is a free vector space of rank 1 over F0."}, {"year": "2015", "subject": "Algebra & Number Theory", "paper": "2015_algebra2015_individual", "kind": "individual", "n": 3, "chars": 904, "tags": ["Galois/域扩张", "群论", "环与模", "表示论", "数论"], "d": 4.65, "text": ". (40pt) Consider the equation f(x) := x3 + x + 1 = 0. We want to show\nin steps that\nfor any prime p, if\n(\n31\np\n)\n= −1, then x3 + x + 1 is solvable mod p.\nLet x1, x2, x3 be three roots of f(x) := x3 + x + 1 = 0. Let F = Q(x1), and L =\nQ(x1, x2, x3), and K = Q(\n√\n∆) where ∆is the discriminant of f(x):\n∆= [(x1 −x2)(x2 −x3)(x3 −x1)]2.\n(3.1) (10pt) Show that f is irreducible, that ∆= −31, and that F is not Galois over\nQ;\n(3.2) (10pt) Show that Gal(L/Q) ≃S3, the permutation group of three letters, that\nGal(L/K) ≃Z/3Z, and that Gal(L/F) ≃Z/2Z;\n(3.3) (20pt) Let OF, OK, OL = be rings of integers of F, K, L respectively. Let p be a\nprime such that x3 + x + 1 = 0 is not soluble in Z/pZ. Show the following:\n(a) (5pt) pOF is still a prime ideal in OF,\n(b) (5pt) pOL is product of two prime ideals in OL, and\n(c) (5pt) pOK is product of two primes ideals in OK, and\n(d) (5pt) x2 + 31 = 0 is soluble in Fp.\n2"}, {"year": "2015", "subject": "Algebra & Number Theory", "paper": "2015_algebra2015_individual", "kind": "individual", "n": 4, "chars": 986, "tags": ["环与模", "线性代数/矩阵", "数论", "复分析"], "d": 3.31, "text": ". (40pt) Let p be a prime and Zp the ring of p-adic integers with a p-adic\nnorm normalized by |p| = p−1. Let ϕ : Zp−→Zp be a map defined by a power series of\nthe form\nϕ(x) = xp + p\n∑\nanxn,\nan ∈Zp,\n|an|−→0.\nLet E be a field, and F the E-vector space of locally constant E-valued functions on\nZp with an operator ϕ∗defined by ϕ∗f = f ◦ϕ. We want to show in steps the following\nstatement:\nThe set of eigenvalues of ϕ∗on F is {0, 1}.\n(4.1) (10pt) Show that ϕ is a contraction map on each residue class R ∈Zp/pZp:\n|ϕ(x) −ϕ(y)| ≤p−1|x −y|,\n∀x, y ∈R.\n(4.2) (10pt) Show that there is a ϵR ∈R for each residue class R such that\nlim\nn ϕn(x) = ϵR,\n∀x ∈R.\nHere ϕn is defined inductively by ϕ1 = ϕ, ϕn = ϕn−1 ◦ϕ.\n(4.3) (10pt) Let F0 (resp. F1) be the subspace of functions f vanishing on each ϵR\n(resp. constant on R) for all residue class R. Show that ϕ∗= 1 on F1, and that\nfor each f ∈F0 ϕ∗nf = 0 for some n ∈N.\n(4.4) (10pt) Show that for any a ∈E, a ̸= 0, 1, the operator ϕ∗−a is invertible on F."}, {"year": "2015", "subject": "Algebra & Number Theory", "paper": "2015_algebra2015_individual", "kind": "individual", "n": 5, "chars": 215, "tags": ["环与模"], "d": 1.24, "text": "(20pt). Check if the following rings are UFD (unique factorization domain).\n(5.1) (5pt) R1 = Z[\n√\n6];\n(5.2) (5pt) R2 = Z[(1 + √−11)/2];\n(5.3) (5pt) R3 = C[x, y]/(x2 + y2 −1);\n(5.4) (5pt) R4 = C[x, y]/(x3 + y3 −1).\n3"}, {"year": "2015", "subject": "Analysis & PDE", "paper": "2015_analysis2015_individual", "kind": "individual", "n": 1, "chars": 141, "tags": ["实分析/测度"], "d": 1.27, "text": "Let fn ∈L2(R) be a sequence of measurable functions over the line, fn →f almost\neverywhere. Let ||fn||L2 →||f||L2, prove that ||fn −f||L2 →0."}, {"year": "2015", "subject": "Analysis & PDE", "paper": "2015_analysis2015_individual", "kind": "individual", "n": 2, "chars": 141, "tags": [], "d": 1.24, "text": "Let f be a continuous function on [a, b], define Mn =\n∫b\na f(x)xndx. Suppose that\nMn = 0 for all integers n ≥0, show that f(x) = 0 for all x."}, {"year": "2015", "subject": "Analysis & PDE", "paper": "2015_analysis2015_individual", "kind": "individual", "n": 3, "chars": 110, "tags": ["复分析"], "d": 1.14, "text": "Determine all entire functions f that satisfying the inequality\n|f(z)| ≤|z|2|Im(z)|2\nfor z sufficiently large."}, {"year": "2015", "subject": "Analysis & PDE", "paper": "2015_analysis2015_individual", "kind": "individual", "n": 4, "chars": 160, "tags": ["复分析"], "d": 1.18, "text": "Describe all functions that are holomorphic over the unit disk D = {z||z| < 1},\ncontinuous on ¯D and map the boundary of the disk into the boundary of the disk."}, {"year": "2015", "subject": "Analysis & PDE", "paper": "2015_analysis2015_individual", "kind": "individual", "n": 5, "chars": 358, "tags": ["泛函分析"], "d": 1.58, "text": "Let T : H1 →H2, Q : H2 →H1 be bounded linear operators of Hilbert spaces\nH1, H2. Let QT = Id −S1, TQ = Id −S2 where S1 and S2 are compact operators.\nProve KerT = {v ∈H1, Tv = 0}, CokerT = H2/Im(T) are finite dimensional and\nIm(T) = {Tv ∈H2, v ∈H1} is closed in H2.\nNote: S is compact means for every bounded sequence xn ∈H1, Sxn has a converging\nsubsequence."}, {"year": "2015", "subject": "Analysis & PDE", "paper": "2015_analysis2015_individual", "kind": "individual", "n": 6, "chars": 395, "tags": ["泛函分析", "偏微分方程", "Fourier/变换"], "d": 2.02, "text": "Let H1 be the Sobolev space on the unit interval [0, 1], i.e.\nthe Hilbert space\nconsisting of functions f ∈L2([0, 1]) such that\n||f||2\n1 = Σ∞\nn=−∞(1 + n2)| ˆf(n)|2 < ∞;\nwhere\nˆf(n) = 1\n2π\n∫1\n0\nf(x)e−2πinxdx\nare Fourier coefficients of f. Show that there exists constant C > 0 such that\n||f||L∞≤C||f||1\nfor all f ∈H1, where ||.||L∞stands for the usual supremum norm. (Hint: Use Fourier\nseries.)\n1"}, {"year": "2015", "subject": "Computational & Applied", "paper": "2015_applied2015_individual", "kind": "individual", "n": 1, "chars": 225, "tags": ["数论"], "d": 1.26, "text": ". Let r and s be relatively prime positive integers. Prove that the number\nof lattice paths from (0, 0) to (r, s), which consists of steps (1, 0) and (0, 1) and never\ngo above the line ry = sx is given by\n1\nr + s\n(r + s\ns\n)\n."}, {"year": "2015", "subject": "Computational & Applied", "paper": "2015_applied2015_individual", "kind": "individual", "n": 2, "chars": 1267, "tags": ["线性代数/矩阵", "数值分析", "科学计算/大规模"], "d": 4.43, "text": ". The following 2 × 2 block matrix\nC(α) =\n[\nαI\nA\nAT\n0\n]\nplays a key role in an augmented system method to solve linear least squares problem, a\nfundamental numerical linear algebra problem for fitting a linear model to observations\nsubject to errors in science, where A ∈Rm×n is of full rank n ≤m, I is a m×m identity\nmatrix, and α ≥0. Prove the following results which address the question of optimal\nchoice of scaling α for stabiltiy of the augmented system method.\n(a) The eigenvalues of C(α) are\nα\n2 ±\n(α2\n4 + σ2\ni\n)1/2\nfor i = 1, 2, . . . , n,\nand\nα\n(m −n times),\nwhere σi for i = 1, 2, . . . , n are the singular values of A, arranged in the de-\ncreasing order, i.e., σ1 ≥σ2 ≥· · · ≥σn.\n(b) The condition number κ2(C(α)) = ∥C(α)∥2 ∥[C(α)]−1∥2 has the following bounds:\n√\n2κ2(A) ≤min\nα κ2(C(α)) ≤2κ2(A),\nwith minα κ2(C(α)) being achieved for α = σn/\n√\n2, and\nmax\nα\nκ2(C(α)) > κ2(A)2,\nwhere ∥· ∥is the spectral norm of a matrix.\nRecall that any matrix A ∈Rm×n has a singular value decomposition (SVD):\nA = UΣV T,\nΣ = diag(σ1, σ2, . . . , σp) ∈Rm×n,\np = min(m, n),\nwhere σ1 ≥σ2 ≥· · · ≥σp ≥0, and U ∈Rm×m, V ∈Rn×n are both orthogonal. The σi\nare the singular values of A and the columns of U and V are the left and right singular\nvectors of A, respectively.\n1\n\n \n2"}, {"year": "2015", "subject": "Computational & Applied", "paper": "2015_applied2015_individual", "kind": "individual", "n": 3, "chars": 811, "tags": ["偏微分方程", "代数几何", "数值分析"], "d": 3.91, "text": ". Solve the following linear hyperbolic partial differential equation\nut + aux = 0,\nt ≥0,\n(1)\nwhere a is a constant. Using the finite difference approximation, we can obtain the\nforward-time central-space scheme as follows,\nun+1\nm\n−un\nm\nk\n+ aun\nm+1 −un\nm−1\n2h\n= 0,\n(2)\nwhere k and h are temporal and spatial mesh sizes.\n(a) Show that when we fix λ = k/h as a positive constant, the forward-time central-\nspace scheme (2) is consistent with equation (1).\n(b) Analyze the stability of this method. Is the method stable with λ = k/h being\nfixed as a constant?\n(c) How would the answer change if you are allowed to make λ = k/h small?\n(d) Would this is a good scheme to use even if you can make it stable by making λ\nsmall? If not, please provide a simple modification to make this scheme stable\nby keeping λ fixed."}, {"year": "2015", "subject": "Computational & Applied", "paper": "2015_applied2015_individual", "kind": "individual", "n": 4, "chars": 249, "tags": [], "d": 1.37, "text": ". Let A, H, Q ∈Cn×n and Q is non-singular. Assume that H = Q−1AQ\nand H is properly upper Hessenberg. Show that\nspan{q1, q2, . . . , qj} = Kj(A, q1),\nj = 1, 2, . . . , n\nwhere qj is the j-th column of Q, and Kj(A, q1) = span{q1, Aq1, . . . , Aj−1q1}."}, {"year": "2015", "subject": "Computational & Applied", "paper": "2015_applied2015_individual", "kind": "individual", "n": 5, "chars": 513, "tags": ["经典场论/相对论"], "d": 1.61, "text": ". Minkowski Problem.\nn푖\n퐹푖\n퐴푖\nAssume P is a convex polyhedron embedded in R3, the faces are {F1, F2, · · · , Fk},\
