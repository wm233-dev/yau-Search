e−x\n2\nis the hyperbolic cosine function."}, {"year": "2020", "subject": "Probability & Statistics", "paper": "2020_Prob_Stat_probability_and_statistics_20", "kind": "individual", "n": 2, "chars": 206, "tags": ["概率论"], "d": 1.23, "text": ".\nLet λ be a positive number. Suppose that X is a random variable with E|X| < ∞.\nSuppose that\nλE f (X + 1) = E{X f (X)}\nfor all bounded smooth functions. Show that X has the Poisson distribution Poisson(λ)."}, {"year": "2020", "subject": "Probability & Statistics", "paper": "2020_Prob_Stat_probability_and_statistics_20", "kind": "individual", "n": 3, "chars": 409, "tags": ["概率论"], "d": 1.44, "text": ". Consider the random walk\nSn = a + X1 + X2 + · · · + Xn,\nwhere a is a positive integer and {Xi} are independent and identically distributed random variables\nwith a common distribution\nP{Xi = 1} = p,\nP{Xi = −1} = 1 −p.\nLet τ0 = inf{n : Sn = 0} be the first time the random walk reaches the state x = 0. For all p ∈[0,1]\nfind the probability Pa{τ0 < ∞} that the random walk will eventually hit the state x = 0."}, {"year": "2020", "subject": "Probability & Statistics", "paper": "2020_Prob_Stat_probability_and_statistics_20", "kind": "individual", "n": 4, "chars": 1545, "tags": ["群论", "概率论"], "d": 4.38, "text": ". Let Z = (X,Y) be an R2-valued random variable such that (1) X andY are independent;\n(2) both X and Y have mean zero and finite (nonvanishing) second moments; (3) the distribution of\nZ is invariant under the rotation counter-clockwise around the origin by an angle θ not a multiple of\n90 degrees. Show that X and Y must be normal random variables with the same variance.\nPart II: Statistics\nThe following collection of questions concerns the design of a randomized experiment where the\nN units to be randomized to drug A or drug B are people, for whom we have a large number\nof background covariates, collectively labelled X (e.g., age, sex, blood pressure, height, weight,\noccupational status, history of heart disease, family history of heart disease). The objective is to\nassign approximately half to drug A and half to drug B where the means of each of the X variables\n(and means of non-linear functions of them, such as squares or products) are close to equal in the\ntwo groups. Instead of using classical methods of design, such as blocking or stratification, the plan\nis to use modern computers to try many random allocations and discard those allocations that are\nconsidered unacceptable according to a pre-determined criterion for balanced X means, in particular\n\n \nan affinely invariant measure such as the Mahalanobis distance between the means of X in the two\ngroups. After an acceptable allocation is found, outcome variables will be measured, and their\nmeans will be compared in group A and group B to estimate a treatment effect."}, {"year": "2020", "subject": "Probability & Statistics", "paper": "2020_Prob_Stat_probability_and_statistics_20", "kind": "individual", "n": 5, "chars": 238, "tags": ["数理统计"], "d": 1.32, "text": ".\nProve that if the two groups are of the same size (i.e., N/2 for even N), this plan\nwill result in unbiased estimates of the A versus B casual effect based on the sample means of Y in\ngroups A and B, where Y is any linear function of X."}, {"year": "2020", "subject": "Probability & Statistics", "paper": "2020_Prob_Stat_probability_and_statistics_20", "kind": "individual", "n": 6, "chars": 96, "tags": [], "d": 1.11, "text": ".\nProvide a counter-example to the assertion that Problem 5 is true in small samples\nwith odd N."}, {"year": "2021", "subject": "Algebra & Number Theory", "paper": "2021_ExamPaper_21S_algebra_and_numbertheory_21s", "kind": "individual", "n": 1, "chars": 126, "tags": ["表示论", "数论"], "d": 1.43, "text": ".\nFor any prime p and a nonzero element a ∈Fp, prove that the polynomial A(x) = xp −x −a\nis irreducible and separable over Fp."}, {"year": "2021", "subject": "Algebra & Number Theory", "paper": "2021_ExamPaper_21S_algebra_and_numbertheory_21s", "kind": "individual", "n": 2, "chars": 87, "tags": ["Galois/域扩张", "群论"], "d": 1.34, "text": ". Determine the automorphism group of the splitting field of f (x) = x3 −3x + 1 over Q."}, {"year": "2021", "subject": "Algebra & Number Theory", "paper": "2021_ExamPaper_21S_algebra_and_numbertheory_21s", "kind": "individual", "n": 3, "chars": 240, "tags": [], "d": 2.86, "text": ". Let R = F[x, y]/(x2 −y3) for some field F.\n(a) Prove that R is an integral domain.\n(b) If t denotes the element x/y in the fraction field K of R, prove that K is equal to F(t).\n(c) Prove that F[t] is the integral closure of R in K = F[t]."}, {"year": "2021", "subject": "Algebra & Number Theory", "paper": "2021_ExamPaper_21S_algebra_and_numbertheory_21s", "kind": "individual", "n": 4, "chars": 88, "tags": ["数论"], "d": 1.14, "text": ". Let p1,. . ., pn be n distinct prime numbers. Show: √p1 + · · · + √pn is not rational."}, {"year": "2021", "subject": "Algebra & Number Theory", "paper": "2021_ExamPaper_21S_algebra_and_numbertheory_21s", "kind": "individual", "n": 5, "chars": 131, "tags": [], "d": 1.16, "text": ". Find all integral solutions (x, y) for the equation x2 + 13 = y3. (Hint: You can use the fact that\nQ(\n√\n−13) has class number 2)."}, {"year": "2021", "subject": "Algebra & Number Theory", "paper": "2021_ExamPaper_21S_algebra_and_numbertheory_21s", "kind": "individual", "n": 6, "chars": 963, "tags": ["Galois/域扩张", "数论"], "d": 4.18, "text": ".\nLet p be a prime number and Qp be the field of p-adic numbers. Fix an algebraic closure Qp\nof Qp. Let g: Z≥0 →N be a strictly increasing function. For each i ∈Z≥0, pick a primitive (pg(i) −1)-th\nroot of unity ζi in Qp.\n(a) Show that for each i ≥0, Ki B Qp(ζi) is an unramified Galois extension of Qp of degree g(i).\n(b) Give an explicit function g as above such that Ki−1 ⊂Ki for all i > 0. Let 0 = N0 < N1 < N2 · · ·\nbe an increasing sequence of nonnegative integers. Let αi B Íi\nj=0 ζjpNj. Show that for each i ≥0,\nKi = Qp(αi) and that (αi) is a Cauchy sequence in Qp.\n(c) Let η ∈Qp be of degree g over Qp, prove that there exists M ∈N such that ζi does not satisfy any\ncongruence\nsg−1ηg−1 + sg−2ηg−2 + · · · + s1η + s0 ≡0\n(mod pM)\nin which the si's are p-adic integers not all of which are divisible by p.\n(d) Take a suitable sequence (Ni) as above such that (ai) does not converge in Qp. Conclude that Qp is\nnot complete with respect to the p-adic topology."}, {"year": "2021", "subject": "Analysis & PDE", "paper": "2021_ExamPaper_21S_analysis_and_differential_21s", "kind": "individual", "n": 1, "chars": 70, "tags": [], "d": 1.09, "text": ". Prove that f (x) ≡0 is the only solution in L2(Rn) such that\n△f = 0."}, {"year": "2021", "subject": "Analysis & PDE", "paper": "2021_ExamPaper_21S_analysis_and_differential_21s", "kind": "individual", "n": 2, "chars": 220, "tags": [], "d": 1.27, "text": ". Let X ⊂C ([0,1]) be a finite dimensional linear subspace of the space of real-valued continuous\nfunctions on [0,1]. Show that, for a sequence of functions { fk}k⩾1 ⊂X, if it converges pointwise, it converges\nuniformly."}, {"year": "2021", "subject": "Analysis & PDE", "paper": "2021_ExamPaper_21S_analysis_and_differential_21s", "kind": "individual", "n": 3, "chars": 260, "tags": ["实分析/测度"], "d": 2.46, "text": ".\n(a) For f ∈L1(Rn), g ∈L∞(Rn), show that their convolution f ∗g is a well-defined continuous function.\n(b) Let E ⊂Rn be a Lebesgue measurable set with Lebesgue measure m(E) > 0. Prove that\nE −E :=\n\b\nx −y\n\f\f x ∈E, y ∈E\n \ncontains an open neighborhood of 0 ∈Rn."}, {"year": "2021", "subject": "Analysis & PDE", "paper": "2021_ExamPaper_21S_analysis_and_differential_21s", "kind": "individual", "n": 4, "chars": 152, "tags": [], "d": 1.16, "text": ".\nAssume that P is a polynomial with complex coefficients. Prove that there exists infinitely\nmany solutions of the following equations on C:\nez = P(z)."}, {"year": "2021", "subject": "Analysis & PDE", "paper": "2021_ExamPaper_21S_analysis_and_differential_21s", "kind": "individual", "n": 5, "chars": 262, "tags": ["复分析"], "d": 1.35, "text": ".\nLet f be a bounded holomorphic function defined on B =\n\b\nz\n\f\f 0 < Re(z) < 1\n \nthat can be\nextended as a continuous function on B. Let\nA0 =\nsup\nRe(z)=0\n| f (z)| > 0, A0 =\nsup\nRe(z)=1\n| f (z)| > 0.\nProve that for all z ∈B, we have\n| f (z)| ⩽(A0)1−Re(z)(A1)Re(z)."}, {"year": "2021", "subject": "Analysis & PDE", "paper": "2021_ExamPaper_21S_analysis_and_differential_21s", "kind": "individual", "n": 6, "chars": 252, "tags": [], "d": 1.35, "text": ".\nAssume that Ω⊂Rn is a bounded domain with smooth boundary. Prove that there exists a\npositive constant ε0 so that for all real numbers ε < ε0, for all f ∈L2(Ω), there exist a unique u ∈H1\n0(Ω) so\nthat\n−△u + ε sin(u) = f\nin the sense of distributions."}, {"year": "2021", "subject": "Computational & Applied", "paper": "2021_ExamPaper_21S_computational_and_applied_21s", "kind": "individual", "n": 1, "chars": 336, "tags": [], "d": 2.47, "text": ".\n(a) Show that\nTn(x) = cos(n arccos x),\nx ∈[−1,1],\nis a polynomial of degree n with extrema at\nxk = cos\n\u0010\nk π\nn\n\u0011\n,\nk = 0,1,. . .,n\nand leading coefficient 2n−1.\n(b) Show that if f ∈Cn+1[−1,1] and if P(x) is the polynomial with degree at most n that interpolates f\nat xk, k = 0,1,. . .,n then\n∥f (x) −P(x)∥∞≤\n1\n2n−1(n + 1)!\n\n f n+1\n\n∞."}, {"year": "2021", "subject": "Computational & Applied", "paper": "2021_ExamPaper_21S_computational_and_applied_21s", "kind": "individual", "n": 2, "chars": 161, "tags": [], "d": 1.23, "text": ".\nLet S(x) be a cubic spline with knots {ti}n\ni=0. If it is determined that S(x) is linear over [t1,t2]\nand [t3,t4]. Prove that S(x) is also linear over [t2,t3]."}, {"year": "2021", "subject": "Computational & Applied", "paper": "2021_ExamPaper_21S_computational_and_applied_21s", "kind": "individual", "n": 3, "chars": 503, "tags": [], "d": 3.12, "text": ". Let f : R →R be defined by f (x) = 2x −cos x.\n(a) Prove that the equation f (x) = 0 has a unique solution x∗∈R that lies in the interval (1\n4, 1\n2).\n(b) Prove that the sequence defined by the fixed point iteration\nx0,\nxn = 1\n2 cos xn−1,\nn = 1,2,. . .\nconverges to x∗with any initial guess x0.\n(c) For the fixed point iteration in (b) with x0 = π\n6 , determine an n that guarantees |xn −x∗| < 1\n2 × 10−8.\nFor the fixed point iteration in (b) with x0 = 20, determine an n that guarantees |xn −x∗| < 1\n4."}, {"year": "2021", "subject": "Computational & Applied", "paper": "2021_ExamPaper_21S_computational_and_applied_21s", "kind": "individual", "n": 4, "chars": 562, "tags": ["线性代数/矩阵", "科学计算/大规模"], "d": 3.08, "text": ". Let matrix A ∈Rm×n with m ≥n and r = rank(A) < n, and assume A has the following SVD\ndecomposition\nA = [U1,U2]\n\u0014Σ1\n0\n0\n0\n\u0015\n[V1,V2]T = U1Σ1VT\n1 ,\nwhere Σ1 is r × r nonsingular and U1 and V1 have r columns. Let σ = σmin(Σ1), the smallest nonzero\nsingular value of A. Consider the following least square problem, for some b ∈Rm,\nmin\nx∈Rn ∥Ax −b∥2 .\n\n \n(a) Show that all solutions x can be written as\nx = V1Σ−1\n1 UT\n1 b + V2z2,\nwith z2 an arbitrary vector.\n(b) Show that the solution x has minimal norm ∥x∥2 precisely when z2 = 0, and in which case,\n∥x∥2 ≤∥b∥2\nσ ."}, {"year": "2021", "subject": "Computational & Applied", "paper": "2021_ExamPaper_21S_computational_and_applied_21s", "kind": "individual", "n": 5, "chars": 372, "tags": ["数值分析"], "d": 2.38, "text": ". Consider the family of semi-implicit Runge-Kutta methods\nk1 = f (yn + βhk1),\nk2 = f (yn + hk1 + βhk2),\nyn+1 = yn + h\n\u0010\n( 1\n2 + β)k1 + (1\n2 −β)k2\n\u0011\n.\n(a) Determine the order and the principal part of the local truncation error.\n(b) Show that if β > 1\n2, then the negative real axis {z : Re(z) < 0,Im(z) = 0} is contained in the region of\nabsolute stability of the method."}, {"year": "2021", "subject": "Computational & Applied", "paper": "2021_ExamPaper_21S_computational_and_applied_21s", "kind": "individual", "n": 6, "chars": 901, "tags": ["数值分析"], "d": 3.46, "text": ". Consider the Beam equation from mechanics with boundary conditions that model a cantilever\nbeam:\nu(4) = f (x),\nx ∈(0, 1),\nu(0) = u′(0) = u′′(1) = u′′′(1) = 0.\n(1)\n(a) Recast this equation into a variational problem, stating the trial and test function spaces.\n(b) Interpret the variational problem as an energy minimization problem, clearly stating the energy\nfunctional. Prove that the variational problem and the energy minimization problems are equivalent.\n(c) Develop a CG(3) (cubic continuous Galerkin method) finite element method for this problem.\n(d) Prove an a priori error estimate for this method in the energy norm:\n∥e∥E =\n\u0012 ∫1\n0\n(e′′)2dx\n\u0013 1\n2\n,\nWhere e = u(x) −U(x), in which, u(x) is the exact solution to VP (variational problem), U(x) is the\nFEM (finite element method) solution.\n(e) Prove an a priori error estimate for this method in the L2 norm:\n∥e∥L2 =: ∥e∥=\n\u0012 ∫1\n0\ne2dx\n\u0013 1\n2\n."}, {"year": "2021", "subject": "Geometry & Topology", "paper": "2021_ExamPaper_21S_geometry_and_topology_21s", "kind": "individual", "n": 1, "chars": 125, "tags": ["微分流形/形式"], "d": 2.16, "text": ".\n(a) Show that P2n can not be the boundary of a compact manifold.\n(b) Show that P3 is the boundary of some compact manifold."}, {"year": "2021", "subject": "Geometry & Topology", "paper": "2021_ExamPaper_21S_geometry_and_topology_21s", "kind": "individual", "n": 2, "chars": 205, "tags": ["微分流形/形式", "经典场论/相对论"], "d": 1.59, "text": ". Suppose M is a noncompact, complete n-dimensional manifold, and suppose there is an open\nsubset U ⊂M and an open set V ⊂Rn such that M\\U is isomorphic to Rn\\V. If RicM ≥0, show that M is\nisometric to Rn."}, {"year": "2021", "subject": "Geometry & Topology", "paper": "2021_ExamPaper_21S_geometry_and_topology_21s", "kind": "individual", "n": 3, "chars": 82, "tags": [], "d": 1.19, "text": ". Compute all the homotopy groups of the n-torus T n = S1 × S1 × · · · × S1, n ≥2."}, {"year": "2021", "subject": "Geometry & Topology", "paper": "2021_ExamPaper_21S_geometry_and_topology_21s", "kind": "individual", "n": 4, "chars": 222, "tags": ["偏微分方程", "微分几何", "经典场论/相对论"], "d": 1.76, "text": ".\nConsider the upper half space H3 = {(x, y, z) | z > 0} equipped with hyperbolic metric\ng = dx2 + dy2 + dz2\nz2\n. Let P be the surface defined by {z = x tan α, z > 0} for some α ∈(0, π\n2 ). Compute\nthe mean curvature of P."}, {"year": "2021", "subject": "Geometry & Topology", "paper": "2021_ExamPaper_21S_geometry_and_topology_21s", "kind": "individual", "n": 5, "chars": 191, "tags": ["微分几何", "微分流形/形式"], "d": 1.43, "text": ". Suppose M is a compact 2-dimensional Riemannian manifold without boundary, with positive\nsectional curvature. Show that any two compact closed geodesics on M must intersect with each other."}, {"year": "2021", "subject": "Geometry & Topology", "paper": "2021_ExamPaper_21S_geometry_and_topology_21s", "kind": "individual", "n": 6, "chars": 148, "tags": ["微分流形/形式"], "d": 1.16, "text": ".\nSuppose Σ is a smooth compact embedded hypersurface (i.e. a codimension 1 submanifold)\nwithout boundary in Rn for n ≥3. Show that Σ is orientable."}, {"year": "2021", "subject": "Probability & Statistics", "paper": "2021_ExamPaper_21S_probability_and_statistics_21s", "kind": "individual", "n": 1, "chars": 216, "tags": ["概率论"], "d": 1.34, "text": ".\nSuppose that a sequence {Xn} of real-valued random variables converges to X in distribution\nand there are positive constants r and C such that E|Xn|r ≤C for all n. Show that\nlim\nn→∞E|Xn|s = E|X|s\nfor all 0 < s < r."}, {"year": "2021", "subject": "Probability & Statistics", "paper": "2021_ExamPaper_21S_probability_and_statistics_21s", "kind": "individual", "n": 2, "chars": 263, "tags": ["概率论"], "d": 1.4, "text": ".\nLet p(x, y) be the (one-step) transition function of a Markov chain on a discrete state space S\nand pn(x, y) be the n-step transition function. Show that for any positive integers L and N and any two states\nx and y we have\nN+L\nÕ\nn=L\npn(x, y) ≤\nN\nÕ\nn=0\npn(y, y)."}, {"year": "2021", "subject": "Probability & Statistics", "paper": "2021_ExamPaper_21S_probability_and_statistics_21s", "kind": "individual", "n": 3, "chars": 250, "tags": ["概率论", "经典场论/相对论"], "d": 1.51, "text": ".\nLet {Xn} be an independent, identically distributed sequence of random variables with the\nsymmetric Bernoulli distribution\nP {X = 1} = P {X = −1} = 1\n2.\nLet Sn =\nN\nÕ\ni=1\nXi be the partial sum. Show that for all α > 1\n2,\nP\n\u001a\nlim\nn→∞\nSn\nnα = 0\n\u001b\n= 1."}, {"year": "2021", "subject": "Probability & Statistics", "paper": "2021_ExamPaper_21S_probability_and_statistics_21s", "kind": "individual", "n": 4, "chars": 263, "tags": ["线性代数/矩阵", "概率论", "经典场论/相对论"], "d": 1.81, "text": ".\nLet Xn =\n\b\nXij\n \nbe an n × n random matrix whose entries are independent and identically\ndistributed random variables with the symmetric Bernoulli distribution\nP {X = 0} = P {X = 1} = 1\n2.\nLet pn = P {det XN is odd}. Show that lim\nn→∞pn > 0.\nPart II: Statistics"}, {"year": "2021", "subject": "Probability & Statistics", "paper": "2021_ExamPaper_21S_probability_and_statistics_21s", "kind": "individual", "n": 5, "chars": 1468, "tags": ["群论"], "d": 2.53, "text": ". You have been asked to help design a randomized trial of a new drug, call it drug A, to be used\nin place of the current drug, call it drug B, for a particular medical condition. The budget is fixed to have\n1000 patients treated with A and 1000 treated with drug B. The issue is how to do the allocation of patients,\nbecause we have many pre-randomization measurements on each patient, roughly 200, such as blood pressure\n\n \nrecordings, age, sex, and a large collection of genetics measurements. Obviously it is desirable to have the\nA group similar to the B group with respect to all pre-treatment covariates and non-linear functions of them\nthat are expected to influence the effectiveness of the drugs with respect to the outcome variables.\nComplete (or simple) randomization does this in expectation, but with many covariates, some covariates will\nnot be balanced between the A and B groups in any one single randomized allocation. Standard blocking\nused in traditional experimental design can force balance on a few covariates, but the designer of drug A\nwants to have an experimental design that creates balance on many covariates, and feels that you, as a modern\napplied mathematician/statistician, should be able to do this.\nDescribe a class of methods that achieves this goal where each patient has a positive probability of receiving\ndrug A and a positive probability of receiving drug B. Provide enough detail that you are describing an\nexplicit algorithm."}, {"year": "2021", "subject": "Probability & Statistics", "paper": "2021_ExamPaper_21S_probability_and_statistics_21s", "kind": "individual", "n": 6, "chars": 796, "tags": ["范畴/同调代数", "数理统计", "经典场论/相对论"], "d": 3.34, "text": ". You are given the results of a randomized experiment of two drugs, A and B. The experiment\nwas not conducted in the usual way, however, but rather by allocating patients by a machine-learning\nalgorithm under which each patient has a positive probability of receiving A and of receiving B; moreover\nthe algorithm is completely specified and is built to create better than random balance on the covariates.\n(a) Can unbiased estimates of the causal effect of drug A versus B be found, and if so, show why.\n(b) Can exact small sample, non-parametric inferences for the causal effect in part (a) be derived, based\nsolely on the randomization distribution of some statistic? For example, can we find exact significance\nlevels under a sharp null hypothesis? If so, outline how to accomplish this goal."}, {"year": "2022", "subject": "Mathematical Physics", "paper": "2022_ExamPaper_2022_Mathematical_Physics_22s", "kind": "individual", "n": 1, "chars": 789, "tags": ["泛函分析", "辛几何/力学", "数学物理/量子"], "d": 3.77, "text": "Problems\n1.\n(a) A symmetry transformation in quantum mechanics is represented by\na unitary or anti-unitary operator acting on a Hilbert space. The\ntime reversal transformation Θ relates the wave function at time t to\ntime −t. Prove: Θ is an anti-unitary operator.\n(b) Consider state vector |ψ⟩for a quantum system.\nA time reversal\ntransformation is represented by an anti-unitary operator Θ. We now\nconsider position space wavefunction ψ(x) = ⟨x|ψ⟩, and Θ|x⟩= |x⟩.\nProve: the position space wave function for Θ|ψ⟩is\nψ(x)∗\n(c) A one dimensional quantum system is invariant under time reversal\ntransformation, and so its Hamiltonian satisfies ΘH = HΘ. If an\nenergy eigenstate |ψ⟩has no degeneracy, Prove: it is possible to take\nthe position space energy eigenfunction to be real:\nψ(x)∗= ψ(x)"}, {"year": "2022", "subject": "Mathematical Physics", "paper": "2022_ExamPaper_2022_Mathematical_Physics_22s", "kind": "individual", "n": 2, "chars": 821, "tags": ["线性代数/矩阵", "表示论", "调和/位势", "微分流形/形式", "辛几何/力学", "数学物理/量子"], "d": 4.33, "text": "Consider following quantum Hamiltonian:\nH0 = p2\n1\n2m + 1\n2mω2x2\n1 + p2\n2\n2m + 1\n2mω2x2\n2\nThis is the Hamiltonian for two decoupled harmonic oscillators.\n(a) Calculate the eigenstates and eigenvalues for H0 (an energy eigen-\nstate could be labeled as |n1, n2⟩).\n(b) Assume the creation and annihilation operators for two harmonic\noscillators are a†\ni, ai, i = 1, 2. Define following operators\nJ+ = a†\n1a2,\nJ−= a†\n2a1,\nJz = 1\n2(a†\n1a1 −a†\n2a2)\ni. Prove that: [Jz, J±] = ±J±,\n[J+, J−] = 2Jz.\nii. Consider one eigenvalue En of H0, (here n1 + n2 = n). Prove\nthat: all eigenstates of En form an irreducible representation of\nsu(2) Lie algebra, and compute the spin.\n(c) Consider following perturbed Hamiltonian (λ is small)\nH = H0 + λx2\n1p2\n2\nCompute the first order correction to the energy for the energy level\nn1 + n2 = 2.\n1"}, {"year": "2022", "subject": "Mathematical Physics", "paper": "2022_ExamPaper_2022_Mathematical_Physics_22s", "kind": "individual", "n": 3, "chars": 366, "tags": ["微分流形/形式"], "d": 2.53, "text": "A Killing vector field kµ\n∂\n∂xµ satisfies the equation kλ∂λgµν + ∂µkλgλν +\n∂νkλgλµ = 0.\n(a) Prove: Dµkν + Dνkµ = 0, here Dµ is the covariant derivative.\n(b) For a moving particle in gravitational background with a Killing vec-\ntor field, Prove: kµPµ is a conserved quantity, Here Pµ = m dxν\ndτ gµν\nis the momentum for the free falling particle with trajectory xν(τ)."}, {"year": "2022", "subject": "Mathematical Physics", "paper": "2022_ExamPaper_2022_Mathematical_Physics_22s", "kind": "individual", "n": 4, "chars": 346, "tags": ["微分流形/形式", "经典场论/相对论"], "d": 2.79, "text": "Consider following metric\nds2 = −(1 −2M\nr )dv2 + drdv + r2dΩ2\nHere dΩ2 is the standard metric on two sphere. Consider the hypersurface\ndefined by S = r −2M = 0, and a vector field l = ˜f(x)(gµν∂νS)\n∂\n∂xµ , here\n˜f(x) is a non-zero function. Prove:\n(a) l is normal to the surface S.\n(b) l2 = 0 on the surface S.\n(c)\n∂\n∂v is a Killing vector field."}, {"year": "2022", "subject": "Mathematical Physics", "paper": "2022_ExamPaper_2022_Mathematical_Physics_22s", "kind": "individual", "n": 5, "chars": 773, "tags": ["辛几何/力学", "数学物理/量子", "经典场论/相对论"], "d": 3.9, "text": "The energy momentum tensor for a relativistic quantum field theory is\ndenoted as θµν, which is symmetric and conserved.\n(a) Define new current sµ = xνθµν and Kλµ = x2θλµ −2xλxρθρµ. Com-\npute ∂µsµ and ∂µKλµ, and explain the condition on θµν so that these\nnew currents are conserved.\n(b) Consider a scalar field σ(x) which transforms under a scale transfor-\nmation as\nδσ = xλ∂λσ + f −1\nwe have following Lagrangian\nL = Ls −µ2\n0\n2 φ2e2fσ +\n1\n2f 2 ∂µefσ∂µefσ\nThe infinitesimal scale transformation on scalar field φ is δφ = (1 +\nxλ∂λ)φ. Here Ls is scale invariant part of the Lagrangian. Prove\nthat: the above Lagrangian is scale invariant.\n(c) Explain why a classically scale invariant Lagrangian for a quantum\nfield theory may fail to be scale invariant quantum mechanically."}, {"year": "2022", "subject": "Mathematical Physics", "paper": "2022_ExamPaper_2022_Mathematical_Physics_22s", "kind": "individual", "n": 6, "chars": 520, "tags": ["辛几何/力学"], "d": 2.61, "text": "Consider following Lagrangian for N scalar fields φa, a = 1, . . . , N:\nL = 1\n2∂µφa∂µφa −1\n2µ2\n0φaφa −1\n8λ0(φaφa)2\nHere the repeated index implies the summation over the index.\n2\n\n \n(a) Write down the propagator and interaction vertex for this model, and\nwrite down four point Feynman diagrams up to one loop level.\n(b) Define g0 = λ0N, and compute the order in g0 and N for all the\ndiagrams listed in last question. If we fix the coupling g0, and let N\ngo to infinity, list the leading order Feynman diagrams in\n1\nN .\n3"}, {"year": "2022", "subject": "Algebra & Number Theory", "paper": "2022_ExamPaper_2022_algebra_and_numbertheory_22s", "kind": "individual", "n": 1, "chars": 259, "tags": ["数论"], "d": 2.38, "text": ".\n(a) Let 𝑝(𝑥) = 𝑎𝑛𝑥𝑛+ ⋯+ 𝑎1𝑥+ 𝑎0 ∈𝑅[𝑥] be a polynomial over an integral domain 𝑅. Let 𝐾denote the\nfraction field of 𝑅. Suppose 𝑎/𝑏∈𝐾is a root of 𝑝(𝑥), where 𝑎, 𝑏∈𝑅and are relatively prime. Then, show\nthat 𝑎|𝑎0 and 𝑏|𝑎𝑛.\n(b) Prove that 𝐐(√2, √3) = 𝐐(√2 + √3)."}, {"year": "2022", "subject": "Algebra & Number Theory", "paper": "2022_ExamPaper_2022_algebra_and_numbertheory_22s", "kind": "individual", "n": 2, "chars": 401, "tags": ["环与模"], "d": 1.44, "text": ".\nLet 𝑅be an integral domain with the fraction field 𝐾. An 𝑅-module 𝑃is projective if there is an\n𝑅-module 𝑄such that 𝑃⊕𝑄≅𝐹for some free 𝑅-module 𝐹. A fractional ideal 𝐴is an 𝑅-submodule of 𝐾such that\n𝐴= 𝑑−1𝐼for some ideal 𝐼of 𝑅and a nonzero element 𝑑∈𝑅. A fractional ideal 𝐴is called invertible if 𝐴𝐵= 𝑅\nfor some fractional ideal 𝐵.\nShow that an invertible fractional ideal 𝐴is a projective 𝑅-module."}, {"year": "2022", "subject": "Algebra & Number Theory", "paper": "2022_ExamPaper_2022_algebra_and_numbertheory_22s", "kind": "individual", "n": 3, "chars": 268, "tags": ["微分流形/形式"], "d": 1.26, "text": ". Give a direct proof that the Lie algebra 𝔰𝔩(4, 𝐂) is isomorphic to the Lie algebra 𝔰𝔬(6, 𝐂). (You should\nconstruct a Lie algebra homomorphism and prove that it is an ismorphism; you should not use Dynkin diagrams\nor the classification theory of simple Lie algebras.)"}, {"year": "2022", "subject": "Algebra & Number Theory", "paper": "2022_ExamPaper_2022_algebra_and_numbertheory_22s", "kind": "individual", "n": 4, "chars": 215, "tags": ["环与模"], "d": 1.28, "text": ". Let 𝐴= 𝒪𝐾be the ring of integers of a number field 𝐾. Given a nonzero ideal 𝔞⊂𝐴and an arbitrary\nnonzero element 𝑎∈𝔞, show that there exists 𝑏∈𝔞such that 𝑎and 𝑏generate 𝔞(in particular, every ideal is\n2-generated)."}, {"year": "2022", "subject": "Algebra & Number Theory", "paper": "2022_ExamPaper_2022_algebra_and_numbertheory_22s", "kind": "individual", "n": 5, "chars": 348, "tags": ["环与模", "线性代数/矩阵", "数论"], "d": 3.39, "text": ". Let 𝑝be a prime number and 𝜁𝑝be a primitive 𝑝-th root of unity. Let 𝐾= 𝐐(𝜁𝑝).\n(a) Show that Φ𝑝= ∑𝑝−1\n𝑖=0 𝑋𝑖is the minimal polynomial of 𝜁𝑝over 𝐐.\n(b) Compute the trace Tr𝐾/𝐐(1 −𝜁𝑝) and the norm 𝒩𝐾/𝐐(1 −𝜁𝑝).\n(c) Show that (1 −𝜁𝑝)𝒪𝐾∩𝐙= 𝑝𝐙and deduce that for all 𝑦∈𝒪𝐾, we have\nTr𝐾/𝐐(𝑦(1 −𝜁𝑝)) ∈𝑝𝐙.\n(d) Determine explicitly the ring of integers of 𝐾."}, {"year": "2022", "subject": "Algebra & Number Theory", "paper": "2022_ExamPaper_2022_algebra_and_numbertheory_22s", "kind": "individual", "n": 6, "chars": 634, "tags": ["表示论"], "d": 3.09, "text": ". Let 𝜃∈𝐐be a root of the polynomial 𝑓(𝑋) = 𝑋3 + 12𝑋2 + 8𝑋+ 1. Let 𝐾= 𝐐(𝜃).\n(a) Let 𝑔(𝑋) = 𝑋3 + 𝑝𝑋+ 𝑞∈𝐙[𝑋]. Compute the discriminant disc(𝑔) of 𝑔(𝑋) in terms of 𝑝, 𝑞.\n(b) Show that 𝑓(𝑋) is irreducible over 𝐐.\n(c) Compute the discriminant 𝑑𝐾(1, 𝜃, 𝜃2). Please provide necessary details.\n(d) For any arbitrary number field 𝐹of degree 𝑛, let 𝑎1, 𝑎2, … , 𝑎𝑛∈𝒪𝐹. Find and verify a sufficient condition\nin terms of the discriminant 𝑑𝐹(𝑎1, … , 𝑎𝑛) that the 𝑎1, … , 𝑎𝑛form an integral basis of 𝐹.\n(e) Write down an explicit integral basis of 𝐾in terms of 𝜃by using the above sufficient condition you have\nfound. Please justify your arguments."}, {"year": "2022", "subject": "Analysis & PDE", "paper": "2022_ExamPaper_2022_analysis_and_differential_22s", "kind": "individual", "n": 1, "chars": 110, "tags": [], "d": 1.13, "text": ". For 𝑛≥1, we consider the integral\n𝐼𝑛= ∫\n[0,1]𝑛\n𝑛\n1\n𝑥1 + 1\n𝑥2 + ⋯+\n1\n𝑥𝑛\n𝑑𝑥1 ⋯𝑑𝑥𝑛.\nProve that lim\n𝑛→∞𝐼𝑛exists."}, {"year": "2022", "subject": "Analysis & PDE", "paper": "2022_ExamPaper_2022_analysis_and_differential_22s", "kind": "individual", "n": 2, "chars": 129, "tags": ["复分析"], "d": 1.2, "text": ". Let 𝑈⊂𝐂be a non-empty open set and 𝑓∶𝑈→𝑈be a non-constant holomorphic function. Prove\nthat, if 𝑓∘𝑓= 𝑓, then 𝑓(𝑧) ≡𝑧for all 𝑧∈𝑈."}, {"year": "2022", "subject": "Analysis & PDE", "paper": "2022_ExamPaper_2022_analysis_and_differential_22s", "kind": "individual", "n": 3, "chars": 223, "tags": ["实分析/测度"], "d": 1.26, "text": ".\nLet 𝑋⊂𝐑be a set with positive (Lebesgue) measure. Show that we can find an arithmetic pro-\ngression of 2022 terms in 𝑋, i.e., there exists 𝑥1, … , 𝑥2022 ∈𝑋so that the 𝑥𝑖+1 −𝑥𝑖's are all equal and positive,\n𝑖= 1, … , 2021."}, {"year": "2022", "subject": "Analysis & PDE", "paper": "2022_ExamPaper_2022_analysis_and_differential_22s", "kind": "individual", "n": 4, "chars": 201, "tags": [], "d": 1.2, "text": ".\nLet 𝐶([0, 1]) be the space of all continuous 𝐂-valued functions equipped with 𝐿∞-norm. Let 𝐏⊂\n𝐶([0, 1]) be a closed linear subspace. Assume that the elements of 𝐏are polynomials. Prove that dim 𝐏< ∞."}, {"year": "2022", "subject": "Analysis & PDE", "paper": "2022_ExamPaper_2022_analysis_and_differential_22s", "kind": "individual", "n": 5, "chars": 198, "tags": ["调和/位势"], "d": 1.26, "text": ".\nLet Ω ⊂𝐑3 be a bounded domain with smooth boundary. Assume that 𝑢∈𝐶(𝐑3 −Ω) is a\nharmonic function on 𝐑3 −Ω so that 𝑢||Ω = 1 and lim\n|𝑥|→∞|𝑢(𝑥)| = 0.\nProve that for such 𝑢, lim\n|𝑥|→∞|𝑥|𝑢(𝑥) exists."}, {"year": "2022", "subject": "Analysis & PDE", "paper": "2022_ExamPaper_2022_analysis_and_differential_22s", "kind": "individual", "n": 6, "chars": 431, "tags": ["常微分方程"], "d": 2.94, "text": ". Let 𝑓(𝑥, 𝑦) ∈𝐶1(𝐑2). We assume that there exists 𝐶> 0 so that for all (𝑥, 𝑦) ∈𝐑2, ||\n𝜕𝑓\n𝜕𝑦(𝑥, 𝑦)|| ≤𝐶.\nProve that the following ODE has a globally defined solution for all 𝑦(0) = 𝑦0 ∈𝐑:\n{\n𝑑\n𝑑𝑥𝑦(𝑥) = 𝑓(𝑥, 𝑦(𝑥)),\n𝑦(0) = 𝑦0.\n(1)\nIn addition, we assume that 𝑓is 1-periodic in 𝑥, i.e., for all (𝑥, 𝑦) ∈𝐑2, we have 𝑓(𝑥+ 1, 𝑦) = 𝑓(𝑥, 𝑦). Prove that\nif (1) admits a globally defined bounded solution, then (1) admits a periodic solution."}, {"year": "2022", "subject": "Computational & Applied", "paper": "2022_ExamPaper_2022_computational_and_applied_22s", "kind": "individual", "n": 1, "chars": 499, "tags": [], "d": 1.46, "text": ". Consider {𝑝𝑖(𝑥)}∞\n𝑖=0, a family of orthogonal polynomials associated with the inner product\n⟨𝑓, 𝑔⟩= ∫\n1\n−1\n𝑓(𝑥)𝑔(𝑥)𝑤(𝑥) 𝑑𝑥,\n𝑤(𝑥) > 0\nfor 𝑥∈(−1, 1),\nwhere 𝑝𝑖(𝑥) is a polynomial of degree 𝑖. Let 𝑥0, 𝑥1, … , 𝑥𝑛be the roots of 𝑝𝑛+1(𝑥). Construct an orthonormal\nbasis in the subspace of the polynomials of degree no more than 𝑛such that, for any polynomial in this subspace,\nthe coefficients of its expansion into the basis are equal to the scaled values of this polynomial at the nodes\n𝑥0, 𝑥1, … , 𝑥𝑛."}, {"year": "2022", "subject": "Computational & Applied", "paper": "2022_ExamPaper_2022_computational_and_applied_22s", "kind": "individual", "n": 2, "chars": 506, "tags": ["线性代数/矩阵"], "d": 1.89, "text": ". Consider a 2D fixed point iteration of the form\n𝑥𝑘+1 = 𝑓(𝑥𝑘, 𝑦𝑘), 𝑦𝑘+1 = 𝑔(𝑥𝑘, 𝑦𝑘).\n(1)\nAssume that the vector-valued function\n⃗𝐻(𝑥, 𝑦) = (𝑓(𝑥, 𝑦), 𝑔(𝑥, 𝑦))𝑇is continuously-differentiable, and the infin-\nity norm of the Jacobian matrix is less than 1 at a unique fixed point (𝑥∞, 𝑦∞).\nNow consider a new iteration:\n𝑥𝑘+1 = 𝑓(𝑥𝑘, 𝑦𝑘),\n𝑦𝑘+1 = 𝑔(𝑥𝑘+1, 𝑦𝑘).\n(2)\nProve that iteration (2) is convergent, to the same fixed point as iteration (1), for the initial conditions sufficiently\nclose to the fixed point."}, {"year": "2022", "subject": "Computational & Applied", "paper": "2022_ExamPaper_2022_computational_and_applied_22s", "kind": "individual", "n": 3, "chars": 276, "tags": ["线性代数/矩阵"], "d": 2.88, "text": ". Let 𝐴∈𝐑𝐦×𝐦be a matrix with entries 𝑎𝑖𝑗which satisfy\n𝑎𝑖𝑖≥∑\n𝑗≠𝑖\n|𝑎𝑖𝑗| + 2,\n𝑎𝑖𝑖≤7.\n(a) Prove that 𝐴−1 exists.\n(b) Prove that ‖𝐴‖∞is the max row sum (of absolute values) of 𝐴.\n(c) Find both a lower and upper bound for ‖𝐴‖∞.\n(d) Now assume 𝐴= 𝐴𝑇. Find bounds for ‖𝐴‖2 and ‖𝐴−1‖2."}, {"year": "2022", "subject": "Computational & Applied", "paper": "2022_ExamPaper_2022_computational_and_applied_22s", "kind": "individual", "n": 4, "chars": 832, "tags": ["常微分方程", "数值分析"], "d": 3.58, "text": ". Consider a system of ODE initial value problems of the form:\n𝑑\n𝑑𝑡𝑢= 𝑓(𝑢),\n𝑢(0) = 𝑢0.\nAssume that 𝑓(𝑢) has the property that the forward Euler (FE) method:\n𝑈𝑛+1 = 𝑈𝑛+ 𝑘𝑓(𝑈𝑛),\nsatisfies\n‖𝑈𝑛+1‖ ≤‖𝑈𝑛‖\n\n \nfor some norm ‖ ⋅‖ and for all time-steps 𝑘, 0 < 𝑘≤𝑘𝐹𝐸. Now consider the 2-stage Runge-Kutta method:\n𝑈(1) = 𝑈𝑛+ 𝑘𝛽10𝑓(𝑈𝑛),\n𝑈𝑛+1 = {𝛼20𝑈𝑛+ 𝑘𝛽20𝑓(𝑈𝑛)} + {𝛼21𝑈(1) + 𝑘𝛽21𝑓(𝑈(1))}\nwhere\n𝛽10 ≥0,\n𝛽20 ≥0,\n𝛽21 ≥0,\n𝛼20 ≥0,\n𝛼21 ≥0,\n𝛼20 + 𝛼21 = 1.\n(a) Prove that the above 2-stage Runge-Kutta method also satisfies the inequality:\n‖𝑈𝑛+1‖ ≤‖𝑈𝑛‖\nunder some appropriate time-step restriction: 0 ≤𝑘≤𝑘∗, where you need to explicitly determine 𝑘∗in\nterms of 𝑘𝐹𝐸.\n(b) Explicitly determine the coefficients:\n𝛽10,\n𝛽20,\n𝛽21,\n𝛼20,\n𝛼21,\nso that\n(i) The method is second-order accurate; and\n(ii) The maximum allowed time-step, 𝑘∗, is as large as possible."}, {"year": "2022", "subject": "Computational & Applied", "paper": "2022_ExamPaper_2022_computational_and_applied_22s", "kind": "individual", "n": 5, "chars": 538, "tags": ["数值分析"], "d": 1.96, "text": ". Construct a third-order accurate Lax-Wendroff-type method for 𝑢𝑡+ 𝑎𝑢𝑥= 0 (𝑎> 0 is a constant)\nin the following way:\n(a)\n• Expand 𝑢(𝑡+ 𝑘, 𝑥) in a Taylor series and keep the first four terms. Replace all time derivatives by\nspatial derivatives using the equation.\n• Construct a cubic polynomial passing through the points 𝑈𝑛\n𝑗−2, 𝑈𝑛\n𝑗−1, 𝑈𝑛\n𝑗, 𝑈𝑛\n𝑗+1.\n• Approximate the spatial derivatives in the Taylor series by the exact derivatives of the above con-\nstructed cubic polynomial.\n(b) Verify that the truncation error is 𝑂(𝑘3) if ℎ= 𝑂(𝑘)."}, {"year": "2022", "subject": "Computational & Applied", "paper": "2022_ExamPaper_2022_computational_and_applied_22s", "kind": "individual", "n": 6, "chars": 594, "tags": ["优化/线性规划"], "d": 2.56, "text": ". Suppose you have $60K to invest and there are 3 investment options available. You must invest in\nmultiples of $10𝐾. If 𝑑𝑖dollars are invested in investment 𝑖then you receive a net value (as the profit) of 𝑟𝑖(𝑑𝑖)\ndollars. For 𝑑𝑖> 0 we have\n𝑟1(𝑑1) = (7𝑑1 + 2) × 10,\n𝑟2(𝑑2) = (3𝑑2 + 7) × 10,\n𝑟3(𝑑3) = (4𝑑3 + 5) × 10,\nand 𝑑1(0) = 𝑑2(0) = 𝑑3(0). All are measured in $10𝐾dollars. The objective is to maximize the net value of your\n\n \ninvestments. This can be formulated as a linear programming problem:\nmax\n𝑑1,𝑑2,𝑑3\n𝑟1(𝑑1) + 𝑟2(𝑑2) + 𝑟3(𝑑3),\nsuch that\n𝑑1 + 𝑑2 + 𝑑3 ≤6,\n𝑑𝑖≥0\n𝑖= 1, 2, 3\nare integers."}, {"year": "2022", "subject": "Geometry & Topology", "paper": "2022_ExamPaper_2022_geometry_and_topology_22s", "kind": "individual", "n": 1, "chars": 352, "tags": ["微分流形/形式"], "d": 1.36, "text": ".\nThe topological space 𝑋is obtained by gluing two tetrahedra as illustrated by the figure. There\nis a unique way to glue the faces of one tetrahedron to the other so that the arrows are matched. The resulting\ncomplex has 2 tetrahedra, 4 triangles, 2 edges and 1 vertex.\nShow that 𝑋can not have the homotopy type of a compact manifold without boundary."}, {"year": "2022", "subject": "Geometry & Topology", "paper": "2022_ExamPaper_2022_geometry_and_topology_22s", "kind": "individual", "n": 2, "chars": 331, "tags": ["微分几何", "微分流形/形式", "经典场论/相对论"], "d": 1.85, "text": ". Suppose (𝑀, ℎ) is a closed (i.e., compact without boundary) Riemannian manifold, and ℎis a metric\non 𝑀with sec(ℎ) ≤−1, where sec(ℎ) is the sectional curvature. Suppose Σ is a closed minimal surface with genus\n𝑔in (𝑀, ℎ). Show that\nArea(Σ) ≤4𝜋(𝑔−1).\nRemark: A minimal surface is an immersed surface with constant mean curvature 0."}, {"year": "2022", "subject": "Geometry & Topology", "paper": "2022_ExamPaper_2022_geometry_and_topology_22s", "kind": "individual", "n": 3, "chars": 385, "tags": ["群论", "微分流形/形式", "经典场论/相对论"], "d": 1.86, "text": ". For any topological space 𝑋, the 𝑛-th symmetric product of 𝑋is the quotient of the Cartesian product\n(𝑋)𝑛by the action of the symmetric group 𝑆𝑛, which permutes the factors in (𝑋)𝑛. This space is denoted by\nSP𝑛(𝑋), and the topology is the natural quotient topology induced from (𝑋)𝑛.\nShow that SP𝑛(𝐂𝐏1) is homeomorphic to 𝐂𝐏𝑛. Here 𝐂𝐏1 and 𝐂𝐏𝑛are equipped with the manifold topology."}, {"year": "2022", "subject": "Geometry & Topology", "paper": "2022_ExamPaper_2022_geometry_and_topology_22s", "kind": "individual", "n": 4, "chars": 533, "tags": ["微分几何", "微分流形/形式"], "d": 2.38, "text": ".\nLet 𝑀be a complete noncompact Riemannian manifold. 𝑀is said to have the geodesic loops to\ninfinity property if for any [𝛼] ∈𝜋1(𝑀) and any compact subset 𝐾⊂𝑀, there is a geodesic loop 𝛽⊂𝑀\\𝐾, such\nthat 𝛽is homotopic to 𝛼.\nShow that if a complete noncompact Riemannian manifold 𝑀does not have the geodesic loops to infinity property,\nthen there is a line in the universal cover ˜\n𝑀.\nRemark: A line is a geodesic 𝛾∶(−∞, ∞) →𝑀such that dist (𝛾(𝑠), 𝛾(𝑡)) = |𝑠−𝑡|; a geodesic loop is a curve\n𝛽∶[0, 1] →𝑀that is a geodesic and 𝛽(0) = 𝛽(1)."}, {"year": "2022", "subject": "Geometry & Topology", "paper": "2022_ExamPaper_2022_geometry_and_topology_22s", "kind": "individual", "n": 5, "chars": 402, "tags": ["群论", "代数拓扑"], "d": 2.79, "text": ". A topological space 𝑋is called an H-space if there exist 𝑒∈𝑋and 𝜇∶𝑋×𝑋→𝑋such that 𝜇(𝑒, 𝑒) = 𝑒\nand the maps 𝑥→𝜇(𝑒, 𝑥) and 𝑥→𝜇(𝑥, 𝑒) are both homotopic to the identity map.\n(a) Show that the fundamental group of an H-space is Abelian.\n(b) Show that the sphere 𝑆2022 is not an H-space.\nHistoric Remark: \"H\" was suggested by Jean-Pierre Serre in recognition of the contributions in Topology by Heinz\nHopf."}, {"year": "2022", "subject": "Geometry & Topology", "paper": "2022_ExamPaper_2022_geometry_and_topology_22s", "kind": "individual", "n": 6, "chars": 386, "tags": ["微分几何"], "d": 2.45, "text": ". A hypersurface Σ ⊂𝐑𝐧+𝟏is called a shrinker if it satisfies the equation\n𝐻(𝑥) = 1\n2⟨𝑥, ⃗𝑛⟩.\nHere 𝐻is the mean curvature, which is −⟨tr𝐴, ⃗𝑛⟩where 𝐴is the second fundamental form, 𝑥is the position vector,\nand\n⃗𝑛is outer unit normal vector.\n(a) Show that 𝑆𝑛(√2𝑛), the sphere with radius √2𝑛, is a shrinker.\n(b) Show that any compact shrinker without boundary must intersect with 𝑆𝑛(√2𝑛)."}, {"year": "2022", "subject": "Probability & Statistics", "paper": "2022_ExamPaper_2022_probability_and_statistics_22s", "kind": "individual", "n": 1, "chars": 229, "tags": ["概率论"], "d": 1.24, "text": ".\nLet {𝑋𝑛} be a sequence of Gaussian random variables. Suppose that 𝑋is a random variable such\nthat 𝑋𝑛converges to 𝑋in distribution as 𝑛→∞. Show that 𝑋is also a (possibly degenerate, i.e., variance zero)\nGaussian random variable."}, {"year": "2022", "subject": "Probability & Statistics", "paper": "2022_ExamPaper_2022_probability_and_statistics_22s", "kind": "individual", "n": 2, "chars": 617, "tags": ["实分析/测度", "概率论"], "d": 1.81, "text": ".\nFor two probability measures 𝜇and 𝜈on the real line 𝐑, the total variation distance ‖𝜇−𝜈‖𝑇𝑉is\ndefined as\n‖𝜇−𝜈‖𝑇𝑉= sup {𝜇(𝐶) −𝜈(𝐶) ∶𝐶∈ℬ(𝐑)} ,\nwhere ℬ(𝐑) is the 𝜎-algebra of Borel sets on 𝐑. Let 𝒞(𝜇, 𝜈) be the space of couplings of the probability measures\n𝜇and 𝜈, i.e., the space of 𝐑2 valued random variables (𝑋, 𝑌) defined on some (not necessarily same) probability\nspace (Ω, ℱ, ℙ) such that the marginal distributions of 𝑋and 𝑌are 𝜇and 𝜈, respectively. Show that\n‖𝜇−𝜈‖𝑇𝑉= inf {ℙ(𝑋≠𝑌) ∶(𝑋, 𝑌) ∈𝒞(𝜇, 𝜈)} .\nFor simplicity you may assume that 𝜇and 𝜈are absolutely continuous with respect to the Lebesgue measure on\n𝐑."}, {"year": "2022", "subject": "Probability & Statistics", "paper": "2022_ExamPaper_2022_probability_and_statistics_22s", "kind": "individual", "n": 3, "chars": 373, "tags": [], "d": 2.36, "text": ".\nWe throw a fair die repeatedly and independently. Let 𝜏11 be the first time the pattern 11 (two\nconsecutive 1's) appears and 𝜏12 the first time the pattern 12 (1 followed by 2) appears.\n(a) Calculate the expected value 𝔼𝜏11.\n(b) Which is larger, 𝔼𝜏11 or 𝔼𝜏12? It is sufficient to give an intuitive argument to justify your answer. You can\nalso calculate 𝔼𝜏12 if you wish."}, {"year": "2022", "subject": "Probability & Statistics", "paper": "2022_ExamPaper_2022_probability_and_statistics_22s", "kind": "individual", "n": 4, "chars": 443, "tags": ["概率论"], "d": 2.64, "text": ".\nLet {𝑋𝑛} be a Markov chain on a discrete state space 𝑆with transition function 𝑝(𝑥, 𝑦), 𝑥, 𝑦∈𝑆.\nSuppose that there is a state 𝑦0 ∈𝑆and a positive number 𝜃such that 𝑝(𝑥, 𝑦0) ≥𝜃for all 𝑥∈𝑆.\n(a) Show that is a positive constant 𝜆< 1 such that for any two initial distribution 𝜇and 𝜈,\n∑\n𝑦∈𝑆\n||ℙ𝜇{𝑋1 = 𝑦} −ℙ𝜈{𝑋1 = 𝑦}|| ≤𝜆∑\n𝑦∈𝑆\n|𝜇(𝑦) −𝜈(𝑦)| .\n(b) Show that the Markov chain has a unique stationary distribution 𝜋and\n∑\n𝑦∈𝑆\n||ℙ𝜇{𝑋𝑛= 𝑦} −𝜋(𝑦)|| ≤2𝜆𝑛."}, {"year": "2022", "subject": "Probability & Statistics", "paper": "2022_ExamPaper_2022_probability_and_statistics_22s", "kind": "individual", "n": 5, "chars": 542, "tags": ["线性代数/矩阵", "数理统计"], "d": 1.78, "text": ". Consider a linear regression model with 𝑝predictors and 𝑛observations:\n𝐘= 𝑋𝛽+ 𝐞,\nwhere 𝑋𝑛×𝑝is the design matrix, 𝛽is the unknown coefficient vector, and the random error vector 𝐞has a mul-\ntivariate normal distribution with mean zero and Var(𝐞) = 𝜎2𝐼𝑛(𝜎2 > 0 unknown and 𝐼𝑛is the identity matrix).\n\n \nHere rank(𝑋) = 𝑘≤𝑝, 𝑝may or may not be greater than 𝑛, but we assume 𝑛−𝑘> 1. Let 𝐱1 = (𝑥1,1, … , 𝑥1,𝑝) be\nthe first row of 𝑋and define\n𝛾= 𝐱1𝛽\n𝜎.\nFind the uniformly minimum variance unbiased estimator (UMVUE) of 𝛾or prove it does not exist."}, {"year": "2022", "subject": "Probability & Statistics", "paper": "2022_ExamPaper_2022_probability_and_statistics_22s", "kind": "individual", "n": 6, "chars": 354, "tags": ["概率论", "数理统计"], "d": 1.52, "text": ". Let 𝑋1, … , 𝑋2022 be independent random variables with 𝑋𝑖∼ 𝑁( 𝜃𝑖, 𝑖2), 1 ≤𝑖≤2022. For estimating\nthe unknown mean vector 𝜽∈𝑅2022, consider the loss function 𝐿(𝜽, 𝐝) = ∑\n2022\n𝑖=1 (𝑑𝑖−𝜃𝑖)2/𝑖2. Prove that 𝐗=\n(𝑋1, … , 𝑋2022) is a minimax estimator of 𝜽.\nRecall: If 𝑌|𝜇  ∼𝑁(𝜇, 𝜎2) and 𝜇∼ 𝑁(𝜇0, 𝜎2\n0) then 𝜇|𝑌= 𝑦∼𝑁(\n𝜇0/𝜍2\n0+𝑦/𝜍2\n1/𝜍2\n0+1/𝜍2 ,\n1\n1/𝜍2\n0+1/𝜍2)."}, {"year": "2023", "subject": "Algebra & Number Theory", "paper": "2023_Algebra_Number_theory", "kind": "individual", "n": 1, "chars": 761, "tags": ["Galois/域扩张", "群论", "线性代数/矩阵", "数学物理/量子"], "d": 4.33, "text": "Let F be a field. Let n ≥2 be an integer. For 1 ≤i ̸= j ≤n and for λ ∈F, set\nEij(λ) = (ekl) the following n × n-matrix such that\nekl =\n\n\n\n1,\nif k = l;\nλ,\nif (k, l) = (i, j);\n0,\notherwise.\n(1) Show that the special linear group SLn(F) can be generated by the matrices\nEij(λ) (1 ≤i ̸= j ≤n and λ ∈F).\n(2) Assume n ≥3. Show that the general linear group GLn(F) is not solvable.\nHint: one can start by computing the commutators of the matrices Eij(λ).\n(3) Assume n = 2 and F is a field containing at least 4 elements. Show that GLn(F)\nis not solvable either. Hint: one can start by computing the commutator of the\nmatrix E12(λ) with a diagonal matrix.\n(4) Let Fq denote the finite field with q elements.\nAre GL2(F2) and GL2(F3)\nsolvable? Justifiy your assertion."}, {"year": "2023", "subject": "Algebra & Number Theory", "paper": "2023_Algebra_Number_theory", "kind": "individual", "n": 2, "chars": 1017, "tags": ["环与模", "线性代数/矩阵"], "d": 4.14, "text": "Let R be a ring with identity 1 ̸= 0.\n(1) Assume that R is commutative. Show that, if we have an isomorphism Rn ≃Rm\nof R-modules for some positive integers n and m, then m = n.\n(2) The analogous assertion of (1) for a non-commutative ring is not true in general\nas shown by the following example (in particular, the notion of \"rank\" of a finite\nfree module over such rings is not well-defined). Let K be a non-trivial (not\nnecessarily commutative) ring with identity, and F be a free K-module with a\ncountable basis indexed by Z≥1:\ne1, . . . , e2, . . . , en . . . .\nWrite R = EndK(F), which is a ring with the usual addition and composition\nof two K-linear endomorphisms of F.\n(a) Show that R is not commutative.\n(b) Let f0 ∈R (resp. f1 ∈R) such that f0(e2i) = ei and f0(e2i−1) = 0 (resp.\nf1(e2i) = 0 and f1(e2i−1) = ei) for every i ∈Z≥1. Show that {f0, f1} is a\nbasis of R as a left R-module (given by left-multiplication).\n(c) For any integers n, m ≥1, show that there exists an isomorphism Rn\n∼→Rm\nof R-modules.\n1"}, {"year": "2023", "subject": "Algebra & Number Theory", "paper": "2023_Algebra_Number_theory", "kind": "individual", "n": 3, "chars": 499, "tags": ["Galois/域扩张", "群论"], "d": 2.78, "text": "Let G be a profinite gorup. We say that it is topologically finitely generated if there\nexist finitely many elements g1, . . . , gn such that the closed subgroup generated by\ng1, . . . , gn is equal to G.\n(1) Assume that G is topologically finitely generated. Show that, for a fixed positive\ninteger n, G has only finitely many open subgroups of index n.\n(2) Show that, for K a number field (i.e., a finite field extension of Q), its absolute\nGalois group GK is not topologically finitely generated."}, {"year": "2023", "subject": "Algebra & Number Theory", "paper": "2023_Algebra_Number_theory", "kind": "individual", "n": 4, "chars": 775, "tags": ["环与模", "范畴/同调代数"], "d": 3.93, "text": "Let R be a commutative ring with identity. An R-module M is said to be of finite\npresentation if there exists an exact sequence of R-modules\nRn −→Rm −→M −→0\nfor some positive integers m, n ≥0.\n(1) Let f : N →M be a surjective morphism of R-modules with N of finite type\nand M of finite presentation. Show that the R-module ker(f) is of finite type.\n(2) Let M be an R-module of finite type. Show that the following statements are\nequivalent.\n(a) M is flat and of finite presentation.\n(b) M is locally free, i.e., there exist f1, . . . , fs ∈R generating the unit ideal of\nR such that Mfi is free over Rfi.\n(c) M is projective as an R-module.\n(3) Let S = Q\nN R the product of countably many copies of R, and I = ⊕NR ⊂S.\nShow that S/I is a flat S-module which is not projective."}, {"year": "2023", "subject": "Algebra & Number Theory", "paper": "2023_Algebra_Number_theory", "kind": "individual", "n": 5, "chars": 392, "tags": ["环与模", "线性代数/矩阵", "表示论", "数论"], "d": 3.88, "text": "Let p be a prime number. Let Zp be the ring of p-adic integers.\n(1) Let a ∈C such that limr→∞apr = 1. Show that a is a pm-th root of unity for\nsome m.\n(2) Let A ∈Mn×n(C) be an n×n complex matrix such that limr→∞Apr = In, with\nIn the identity matrix. Show that Apm = In for some integer m.\n(3) Determine, up to isomorphisms, all the finite-dimensional continuous complex\nrepresentations of Zp."}, {"year": "2023", "subject": "Algebra & Number Theory", "paper": "2023_Algebra_Number_theory", "kind": "individual", "n": 6, "chars": 542, "tags": ["Galois/域扩张", "群论", "环与模", "数论"], "d": 3.57, "text": "Let p be a prime number. Let K be a p-adic local field, i.e., a finite field extension\nof Qp. Denote by OK its ring of integers, with π ∈OK a uniformizer.\n(1) Show that, the following logarithm map\nlog : 1 + pOK −→pOK,\n1 + x 7→x −x2\n2 + x3\n3 + · · ·\nis a well-defined isomorphism of groups, which can be extended in a unique way\nto a group homomorphism\nlogπ : K× −→K,\nsuch that logπ(π) = 0. Determine the kernel of logπ.\n(2) With the help of the logarithm above, show that for any integer n ≥1, the\ngroup quotient K×/K×,n is a finite group.\n2"}, {"year": "2023", "subject": "Analysis & PDE", "paper": "2023_Analysis_and_differential_equation", "kind": "individual", "n": 1, "chars": 402, "tags": ["线性代数/矩阵", "泛函分析"], "d": 3.04, "text": "Let (Mn, ∥· ∥) be the Banach space formed by n × n real matrices, equipped with\nHilbert-Schmidt norm. Prove:\n(1). If γ : R →Mn is a C1-function with γ(0) = I (the identity matrix) and ˙γ(0) =\nA ∈Mn, then for ∀t ∈R, the sequence {γn(t/n)}∞\nn=1 converges to exp(tA); In\nparticular, for ∀A, B ∈Mn, et(A+B) = limn→∞(e\nt\nnAe\nt\nnB)n;\n(2). For ∀A, B ∈Mn, if et(A+B) = etAetB, ∀t ∈R, then [A, B] := AB −BA = 0."}, {"year": "2023", "subject": "Analysis & PDE", "paper": "2023_Analysis_and_differential_equation", "kind": "individual", "n": 2, "chars": 393, "tags": ["常微分方程"], "d": 3.11, "text": "Let f(t, x, y) be a C1 function on [0, 1] × R2. Let ϕ be a solution of the second-order\nordinary differential equation (∗)d2x\ndt2 = f(t, x, d\ndtx), t ∈[0, 1] such that ϕ(0) = a, ϕ(1) =\nb where a, b are given real numbers. Suppose ∂f\n∂x(t, x, y) > 0 for all (t, x, y) ∈[0, 1]×R2.\nProve: if |β −b|, β ∈R, is sufficiently small, then there exists a solution ψ of (∗) such\nthat ψ(0) = a, ψ(1) = β."}, {"year": "2023", "subject": "Analysis & PDE", "paper": "2023_Analysis_and_differential_equation", "kind": "individual", "n": 3, "chars": 486, "tags": ["实分析/测度"], "d": 3.17, "text": "A function ϕ : Rn →C is called positive definite if for all k ∈N, yj ∈Rn, cj ∈C,\nj = 1, . . . , k, one have Pk\ni,j=1 ci¯cjϕ(yi −yj) ⩾0. If ϕ is a measurable positive definite\nfunction on Rn. Prove:\n(1) ϕ(−y) = ϕ(y) and |ϕ(y)| ⩽ϕ(0).\n(2) For every Lebesgue integrable nonnegative function f on Rn, one have\nZ\nRn ϕ(x −y)f(x)f(y)dxdy ⩾0.\n(3) If the function f is also even, then\nZ\nRn ϕ(x)f ∗f(x)dx ⩾0,\nwhere ∗stands for convolution.\n(4) For all α > 0, we have\nZ\nRn ϕ(x) exp(−α|x|2)dx ⩾0.\n1"}, {"year": "2023", "subject": "Analysis & PDE", "paper": "2023_Analysis_and_differential_equation", "kind": "individual", "n": 4, "chars": 147, "tags": [], "d": 1.17, "text": "For a 2π-periodic function x ∈L2([0, 2π]), let xn(t) = x(nt), n = 1, 2, . . . .\nProve that {xn} converges weakly in L2([0, 2π]) and find the limit."}, {"year": "2023", "subject": "Analysis & PDE", "paper": "2023_Analysis_and_differential_equation", "kind": "individual", "n": 5, "chars": 149, "tags": ["复分析"], "d": 1.23, "text": "Let f be an entire function on C and there exists a constant C > 0 such that f(z)| ⩽\nC\np\n|z|| cos(z)| for all z ∈C. Prove that f is identically zero."}, {"year": "2023", "subject": "Analysis & PDE", "paper": "2023_Analysis_and_differential_equation", "kind": "individual", "n": 6, "chars": 457, "tags": [], "d": 1.62, "text": "Let u(t, x) satisfy the following equation,\nut +\nn\nX\ni=1\nψi(t, x, u)uxi = µ∆u; u(0, x) = u0,\nwhere u0 ∈C2(Rn), ψi, i = 1, . . . , n are of bounded C2-norm, ∆= Pn\ni=1 ∂2\nxi is the\nLaplacian in Rn and µ > 0. Assume |u0| ⩽eΦ/µ where Φ is bounded above and has\nLipschitz constant 1. Assume that (Pn\ni=1 |Ψi(t, x, u)|2)1/2 ⩽A, where A is a postive\nconstant.\nProve that there exists a constant C depending only on n that\n|u(t, x)| ⩽eCte((A+1)t+Φ(x)+2)/µ,\n∀t ⩾0.\n2"}, {"year": "2023", "subject": "Computational & Applied", "paper": "2023_Computational_Applied", "kind": "individual", "n": 1, "chars": 686, "tags": ["数值分析"], "d": 3.41, "text": "Consider the forward and the centered finite difference formulas\nD+\nh f(x0) = f(x0 + h) −f(x0)\nh\n,\n(1)\nD0\nhf(x0) = f(x0 + h) −f(x0 −h)\n2h\n,\n(2)\nto approximate the derivative of f at a point x0. Assume f is a smooth function in a\nneighborhood of x0 containing the points x0 + h and x0 −h.\n(a) Prove that D+\nh f(x0) and D0\nhf(x0) approximate f ′(x0) to O(h) and O(h2), respec-\ntively.\n(b) Derive an O(h2) approximation to f ′(x0) from D+\nh f(x0) by doing Richardson\nextrapolation.\n(c) Take f(x) = sin x and x0 = 0.\nProve that both D+\nh f(x0) and D0\nhf(x0) con-\nverge quadratically to f ′(x0) as h →0 and that in fact they produce the same\napproximation to f ′(x0) in this particular case."}, {"year": "2023", "subject": "Computational & Applied", "paper": "2023_Computational_Applied", "kind": "individual", "n": 2, "chars": 886, "tags": ["线性代数/矩阵", "数值分析", "经典场论/相对论"], "d": 3.96, "text": "For functions defined on a closed interval [0, 1], we want to compute the following\ndefinite integral,\nI[f] =\nZ 1\n0\nf(x) log(1/x)dx.\nHere we consider the weight function log(1/x), and denote Pn(x) as the monic orthog-\nonal polynomials for the corresponding weighted inner product.\n(a) Let P0 = 1. Find P1(x), and the corresponding node x1\n1 and weight ω1\n1 for the\n1-point Gaussian quadrature rule.\n(b) Derive a recursive formula for Pn+1(x) using Pn(x) and Pn−1(x).\n(c) Consider the normalized orthogonal polynomials Qn(x) = Pn(x)/||Pn||, where\n||Pn|| =\np\nPn(x)2 log(1/x)dx.\nDerive a recursive formula for Qn+1(x) using Qn(x) and Qn−1(x).\n1\n\n \n(d) Use the above recursive formula to show that x = λ is a node of the 4-point\nGaussian quadrature if and only if it is an eigenvalue of a symmetric, tridiagonal\nmatrix. Write out the form of the symmetric and tridiagonal matrix explicitly."}, {"year": "2023", "subject": "Computational & Applied", "paper": "2023_Computational_Applied", "kind": "individual", "n": 3, "chars": 356, "tags": ["线性代数/矩阵"], "d": 2.62, "text": "Let A be a real n × n matrix with distinct eigenvalues such that\n|λ1| > |λ2| ≥|λ3| ≥· · · ≥|λn| ≥0,\nwith corresponding eigenvectors {vj}n\nj=1.\n(a) Show that the power iteration\nzm =\nAmz0\n||Amz0||∞\n−→± v1\n||v1||∞\n,\n∀z0 ∈Rn.\n(b) Consider the following iteration with initial guess x0 = y0 = 1,\nxn+1 = xn + yn,\nyn+1 = xn+1 + xn.\nShow that yn/xn →\n√\n2 as n →∞."}, {"year": "2023", "subject": "Computational & Applied", "paper": "2023_Computational_Applied", "kind": "individual", "n": 4, "chars": 706, "tags": ["常微分方程"], "d": 3.46, "text": "Consider the initial value problem\ny′ = f(t, y),\n0 < t ≤T.\n(3)\ny(0) = y0.\n(4)\nAssume f is continuous and Lipschitz in y in [0, T] × (−∞, ∞). Denote yn ≈y(tn),\ntn = nh, and h = T/N, with N a positive integer, and consider the one-step method\nyn+1 = yn + αhf(tn, yn) + βhf(tn + γh, yn + γhf(tn, yn)),\nwhere α, β and γ are real parameters.\n(a) Prove that the method is consistent if and only if α + β = 1, and the order of the\nmethod can not exceed 2.\n(b) Suppose that a second-order method of the above form is applied to f(t, y) = −λy\nwith λ > 0, and the initial condition y0 = 1. Show that the sequence (yn)n≥0 is\nbounded if and only if h ≤2\nλ. Show further that for such h,\n|y(tn) −yn| ≤1\n6λ3h2tn,\nn ≥0.\n2"}, {"year": "2023", "subject": "Computational & Applied", "paper": "2023_Computational_Applied", "kind": "individual", "n": 5, "chars": 687, "tags": ["代数几何", "数值分析"], "d": 3.62, "text": "Let u(t, x) be the solution of the initial-boundary value problem\nut = Duxx,\n0 < x < L,\n0 < t ≤T,\n(5)\nu(0, x) = f(x)\n(6)\nu(t, 0) = u(t, L) = 0,\n(7)\nwhere L > 0 and D > 0. Consider the finite difference scheme\nun+1\nj\n−un\nj\n∆t\n= Dun\nj+1 −2un\nj + un\nj−1\n(∆x)2\n,\nj = 1, . . . , M −1,\nn = 0, 1, . . . , N −1\n(8)\nwith un\n0 = un\nM = 0 for all n and u0\nj = f(j∆x), j = 0, . . . , M . Here ∆t = T/N and\n∆x = L/M and un\nj ≈u(n∆t, j∆x).\n(a) Prove that (8) is consistent with (5).\n(b) Prove that if ∆t ≤\n1\n2D(∆x)2 the finite difference scheme (8) is stable under the\nl∞norm.\n(c) Prove that if ∆t ≤\n1\n2D(∆x)2 the finite difference scheme (8) converges in the l∞\nnorm to the exact solution of (5)-(7)."}, {"year": "2023", "subject": "Computational & Applied", "paper": "2023_Computational_Applied", "kind": "individual", "n": 6, "chars": 646, "tags": [], "d": 3.07, "text": "Let ψε(t, x) be the solution to the following Schr¨odinger equation:\niε∂ψε\n∂t = −ε2\n2 ∇2\nxψε + V (x)ψε,\nx = (x1, · · · , xn)T ∈Rn,\nwhere i = √−1, ε ≪1 is a small positive real number (rescaled Planck constant),\n∇2\nx =\nn\nX\nj=1\n∂2\nxj, and V (x) ∈C∞(Rn) is the potential function.\nConsider the WKB expansion\nψε(t, x) = A(t, x)ei S(t,x)\nε\n,\n(a) Derive equations for A(t, x) and S(t, x) by asymptotic expansion. (Here both\nA(t, x) and S(t, x) are real-valued functions, and do not depend on ε.)\n(b) Define u(t, x) = ∇xS(t, x) ∈Rn. Derive an equation for u(t, x). Suppose u(0, x) ∈\nC∞(Rn), will u(t, x) always be in C∞(Rn) for all t > 0? Explain why.\n3"}, {"year": "2023", "subject": "Geometry & Topology", "paper": "2023_Geometry_and_Topology", "kind": "individual", "n": 1, "chars": 691, "tags": ["群论", "线性代数/矩阵", "微分流形/形式"], "d": 3.89, "text": "(a) Let G be a Lie group, g be its Lie algebra. The Maurer-Cartan form on G is the\nunique left-invariant g-valued 1-form such that ω|e : TeG →g is the identity map,\nwhere e is the identity in G. Show that the Maurer-Cartan form ω satisfies the\nMaurer-Cartan equation dω + 1\n2[ω, ω] = 0.\n(b) Let G be a matrix group GL(n, R), give detailed computation to find the Maurer-\nCartan form ω.\n(c) Let SE(3) be the special Euclidean group, i.e. it contains all transformations\nof R3 (as 3-dim Euclidean space) of the form x 7→t + Ax, where t ∈R3 and\nA ∈SO(3). Find an expression of the Maurer Cartan form ω of SE(3), also\ncheck it satisfies the standard Cartan structure equations in Eulidean space."}, {"year": "2023", "subject": "Geometry & Topology", "paper": "2023_Geometry_and_Topology", "kind": "individual", "n": 2, "chars": 319, "tags": ["范畴/同调代数", "代数拓扑", "微分流形/形式"], "d": 3.49, "text": "Let M, N be closed, connected, oriented 3-manifolds with the first fundamental groups\nπ1(M1) = Z3 ⊕Z2,\nπ1(M2) = Z6 ⊕Z3,\n(a) Find all homology groups Hn(M1, Z) and Hn(M2, Z).\n(b) Find all homology groups Hn(M1 × M2, Q).\n(c) Does there exist a closed connected oriented 3-manifold M with\nπ1(M) = Z3 ⊕Z2\nor\nπ1(M) = Z6 ⊕Z3?"}, {"year": "2023", "subject": "Geometry & Topology", "paper": "2023_Geometry_and_Topology", "kind": "individual", "n": 3, "chars": 354, "tags": ["群论", "微分流形/形式"], "d": 2.74, "text": "(a) Let f be a diffeomorphism goup of a circle S1, assume f has no fixed point and\nit is generated by a smooth vector field, show that f must be conjugate to a\nrotation.\n(b) Show that there is a diffeomorphism f : S1 →S1, such that f can not be generated\nby a smooth vector field but it is arbitrarily closed the identity map i : S1 →S1\nin C∞-topology.\n1"}, {"year": "2023", "subject": "Geometry & Topology", "paper": "2023_Geometry_and_Topology", "kind": "individual", "n": 4, "chars": 382, "tags": ["代数拓扑", "纤维丛/示性类"], "d": 3.33, "text": "(a) State the Leray-Hirsh theorem.\n(b) Let\nFlk(Cn) = { all k-flags in Cn}\n= {(F0, · · · , Fk)| Fi is an i-dim subspace of Cn, s.t. F0 ⊂F1 ⊂· · · ⊂Fk ⊂Cn}\nLet Φ : Flk(Cn) →Flk−1(Cn) be the projection map sending a k-flag (F0, · · · , Fk)\nto a (k −1)-flag (F0, · · · , Fk−1), it is known this is a fiber bundle. What is the\nfiber of Φ?\n(c) Compute the Euler Characteristic χ(Fln(Cn))."}, {"year": "2023", "subject": "Geometry & Topology", "paper": "2023_Geometry_and_Topology", "kind": "individual", "n": 5, "chars": 134, "tags": [], "d": 1.18, "text": "On the Euclidean space Rn, we consider an n −1 form α, which is of class C1, such\nthat both α and dα are in L1. Show that\nR\nRn dα = 0."}, {"year": "2023", "subject": "Geometry & Topology", "paper": "2023_Geometry_and_Topology", "kind": "individual", "n": 6, "chars": 355, "tags": ["微分几何", "微分流形/形式", "经典场论/相对论"], "d": 1.91, "text": "A complete Riemannian metric gij on a smooth manifold M n is called a gradient\nexpanding Ricci soliton if there exists a smooth function f on M n such that the Ricci\ntensor Ric of the metric g is given by\nRic + Hessf = λg,\nfor some negative constant λ < 0. Show that if M is compact, then a gradient expand-\ning Ricci soliton must be an Einstein metric.\n2"}, {"year": "2023", "subject": "Mathematical Physics", "paper": "2023_Mathematical_Physics", "kind": "individual", "n": 2, "chars": 1349, "tags": ["调和/位势", "辛几何/力学"], "d": 4.28, "text": "Consider the Lagrangian\nL(x, y, ˙x, ˙y) = 1\n˙x2 + ˙y2 + 2(x ˙y −y ˙x)\nx2 + y2\n(1)\n(a) Compute the Hamiltonian H(x, y, pz, py), and show the final form can be written\nas\n1\n2f(x, y)[(px −Ax(x, y))2 + (py −Ay(x, y))2]\n(2)\nfor some f, Ax, Ay. Find the vector potential ⃗A and then compute the correspond-\ning magnetic field away from the origin. (Hint: recall that ⃗B = curl ⃗A = ∇× ⃗A).\n(b) Prove that the Lagrangian L(x, y, ˙x, ˙y) is invariant under two symmetries: rota-\ntions and scale transformations.\n(c) Derive the conserved quantities for both symmetries.\n(d) Rewrite the Lagrangian in polar coordinates, write down the Euler-Lagrange equa-\ntions and solve them.\n2. A particle of mass m in 2 dimensions is confined by an isotropic harmonic oscillator\npotential of frequency ω, while subject to a weak and anisotropic perturbation of\nstrength α ≪1. The total Hamiltonian of the particle is\nH = H0 + V = p2\nx\n2m + p2\ny\n2m + 1\n2mω2(x2 + y2) + αmω2xy\n(3)\n(a) When α = 0, what are the energies and degeneracies of the three lowest-lying\nunperturbed states?\n(b) Use perturbation theory to correct the energies of the above three states to the\nfirst order in α.\n(c) Find the exact spectrum of H. (Hint: you may want to rotate x and y into a new\ncoordinates)\n(d) Check that the perturbative results in part b. are recovered from the exact spec-\ntrum.\n1"}, {"year": "2023", "subject": "Mathematical Physics", "paper": "2023_Mathematical_Physics", "kind": "individual", "n": 3, "chars": 1134, "tags": ["偏微分方程", "经典场论/相对论"], "d": 4.27, "text": "One can express the electric fields ⃗E and magnetic fields ⃗B in terms of the scalar and\nvector potentials, Aµ = (φ, ⃗A).\n(a) Write down the expression of ⃗E and ⃗B in terms of (φ, ⃗A) and show that the result\nis unchanged under gauge transformation\nφ →φ + ∂\n∂tf,\n⃗A →⃗A −∇f,\n(4)\nwhere f = f(⃗x, t) is a scalar function.\n(b) Show that two of the 4 Maxwell equations of ⃗E and ⃗B are satisfied automatically\nin terms of Aµ = (φ, ⃗A).\n(c) Derive the equations for the scalar and vector potentials from the remaining\nMaxwell equations in Lorentz gauge.\n1\nc∂tφ + ∇· ⃗A = 0,\n(5)\n(d) Recall that the Green's function of the wave equation\n\u0012 1\nc2∂2\nt −∇2\n\u0013\nG(t,⃗r) = δ(t)δ3(⃗r)\n(6)\nis\nG(t −t0,⃗r −⃗r0) = θ(t −t0)\n4π|⃗r −⃗r0|δ\n\u0012\nt −t0 −|⃗r −⃗r0|\nc\n\u0013\n.\n(7)\nAssume a particle of electric charge e moves with trajectory ⃗R(t) with ⃗v(t) =\nd⃗R(t)/dt.\nUse the Green's function to derive the potential φ(⃗r, t) and ⃗A(⃗r, t)\nof this particle at (⃗r, t). You may assume that |⃗R(t)| ≪|⃗r|, |⃗R(t)| ≪ct and\n|⃗v(t)| ≪c and expand your result up to the order O(1/|⃗r|) and O(|⃗v(t)|/c). This\nis also called non-relativistic and far-field approximations."}, {"year": "2023", "subject": "Mathematical Physics", "paper": "2023_Mathematical_Physics", "kind": "individual", "n": 4, "chars": 815, "tags": [], "d": 2.78, "text": "Consider a one-dimensional system of free massless bosons with one polarization, and\nthe dispersion relation Ek = ℏv|k|, where v is the particle velocity, k wavevector, Ek\nenergy. The particles are not interacting either among themselves or with external\nscattering potentials. If the system is in equilibrium at temperature T,\n(a) Assume that the chemical potential µ is 0, calculate the heat capacity C per unit\nlength.\n(b) Repeat the calculations for massive fermions, for which Ek = ℏ2k2/2m and the\nchemical potential µ is far above the bottom of the energy spectrum: µ ≫kBT.\n(Consider one spin direction for the fermions, and you may make reasonable\napproximations.)\n2\n\n \nHint: you might find the following formulae useful to evaluate some integrals needed\n∞\nX\nk=1\n1\nk2 = π2\n6 ,\n∞\nX\nk=1\n(−1)k+1\nk2\n= π2\n12.\n(8)"}, {"year": "2023", "subject": "Mathematical Physics", "paper": "2023_Mathematical_Physics", "kind": "individual", "n": 5, "chars": 601, "tags": ["微分几何", "微分流形/形式", "经典场论/相对论"], "d": 3.72, "text": "Consider the vacuum Einstein's equation in four dimensional spacetime with a cosmo-\nlogical constant\nRµν −1\n2gµνR + gµνΛ = 0.\n(9)\n(a) Proof that Rµν = kgµν and find out the value of k.\n(b) Now start with an ansatz of a metric in the following form\nds2 = −f(r)dt2 +\n1\nf(r)dr2 + r2(dθ2 + sin2 θdφ2),\n(10)\nwhere f(r) is a polynomial in r. Compute non zero components of the Ricci\ntensor Rµν and scalar curvature R of this metric.\n(c) Assuming that the above ansatz is a solution of the vacuum Einstein equation\nwith cosmological constant Λ, solve f(r).\n(d) Prove that ∂t and ∂φ are Killing vector fields."}, {"year": "2023", "subject": "Mathematical Physics", "paper": "2023_Mathematical_Physics", "kind": "individual", "n": 6, "chars": 840, "tags": ["辛几何/力学", "经典场论/相对论"], "d": 3.67, "text": "Consider the φ3 model with a real scalar field φ(x) in 3 + 1 dimensional Minkowski\nspacetime with metric (−, +, +, +). Its Lagrangian density is\nL = −1\n2∂µφ∂µφ −1\n2m2φ2 −1\n6gφ3,\n(11)\nwhere g is a coupling with dimensions of mass.\n(a) Write down the propagator and the interaction vertex for this model in momentum\nspace.\n(b) Compute the one-loop self-energy graph using dimensional regularization.\n(c) Introducing m2 = m2\nR + δm2. What is the value of δm2 if we want to write the\none-loop self-energy graph as a finite function of mR?\nYou may find the following formula useful\n(AB)−1 =\nZ 1\n0\ndx[xA + (1 −x)B]−2,\n(12)\nZ\nddk\n1\n(−k2 −2p · k −M 2 + iϵ)s = (−1)siπd/2Γ(s −d/2)\nΓ(s)\n(−p2 + M 2 −iϵ)d/2−s, (13)\n3\n\n \nwhere Γ(z) is the Gamma function which has a simple pole at the origin.\nΓ(z) = 1\nz −γ + O(z),\n(14)\nwhere γ is the Euler constant.\n4"}, {"year": "2023", "subject": "Probability & Statistics", "paper": "2023_probability_statistics", "kind": "individual", "n": 1, "chars": 639, "tags": [], "d": 2.71, "text": "The sequence (X1, X2, . . . , Xn, . . .) is a Dirichlet process with base distribution G0 and\nconcentration parameter α0 > 0 if G0 is a probability distribution on R and satisfies:\n• X1 ∼G0\n• Conditional on X1, X2, . . . , Xn, the distribution of Xn+1 is α0G0+Pn\ni=1 δXi, appro-\npriately normalized, where δx is the Dirac measure with probability 1 on singleton\n{x}.\nAssume that G0 has finite first and second moments.\n(a) Derive the distribution of Xn, n ≥1.\n(b) Let Yn = I(Xn > 0). Prove or disprove (Yn)n≥1 forms a Dirichlet Process. If\n(Yn)n≥1 forms a Dirichlet Process, determine its concentration parameter and its\nbase distribution."}, {"year": "2023", "subject": "Probability & Statistics", "paper": "2023_probability_statistics", "kind": "individual", "n": 2, "chars": 491, "tags": ["概率论"], "d": 1.67, "text": "Suppose X and Y are non-negative random variables on a probability space (Ω, F, P).\nLet H(x, y) be a function on [0, ∞)2 such that E(|H(X, Y )|) < ∞. Define function\nφ(u) = u/(1 + u) for u ≥0. For integer n = 0, 1, 2, . . ., let\nUn =\n2n\nX\nj=1\nj −1\n2n I\n\u0010j −1\n2n\n≤φ(X) < j\n2n\n\u0011\n,\nVn = E(H(X, Y )|Un).\nProve or disprove that there exists a random variable Z such that as n →∞, Vn\nconverges to Z almost surely. If there exists such a Z, show the expression of Z (in\nthe sense of almost surely)."}, {"year": "2023", "subject": "Probability & Statistics", "paper": "2023_probability_statistics", "kind": "individual", "n": 3, "chars": 331, "tags": ["概率论"], "d": 1.43, "text": "Let X1, X2, . . . , Xn be a sequence of i.i.d. random variables with a uniform distribution\non (0, 1). Define the events A1, A2, . . . by\nAn = {Xn = max(X1, . . . , Xn)}.\nDefine Rn = Pn\nk=1 I(Ak).\nLet (mn) be a sequence of positive numbers such that\nlimn→∞mn = ∞. Compute the following limit\nlim\nn→∞P\n\u0010\n|Rn −log n| > mn\np\nlog n\n\u0011\n1"}, {"year": "2023", "subject": "Probability & Statistics", "paper": "2023_probability_statistics", "kind": "individual", "n": 4, "chars": 599, "tags": ["实分析/测度", "概率论"], "d": 2.19, "text": "Denote by B the Borel sigma field on the real line R, and let (Ω, F) be a measurable\nspace. Define a mapping Q(t, A) for t ∈R and A ∈F such that Q(t, ·) is a probability\nmeasure on (Ω, F) for each t ∈R, and Q(·, A) is a Borel function for each A ∈F.\nDenote by Π a probability measure on (R, B), P a probability measure on (Ω, F), and\nT a random variable on (Ω, F, P). Assume that Π, P and T satisfy Π = P ◦T −1, and\nfor A ∈F,\nP(A) =\nZ\nR\nQ(t, A)Π(dt),\nwhere P ◦T −1 denotes the induced probability measure by T. Prove or disprove the\nfollowing statement:\nFor any A ∈F,\nP(A|T) = Q(T, A) almost surely."}, {"year": "2023", "subject": "Probability & Statistics", "paper": "2023_probability_statistics", "kind": "individual", "n": 5, "chars": 752, "tags": ["数理统计"], "d": 3.34, "text": "Four statisticians I, II, III and IV play a sequence of games. For each game, the winning\nprobabilities of I, II, III and IV are (1 −θ)/2, (1 −θ)/2, θ/2 and θ/2, respectively,\nwhere 0 < θ < 1. There is only one winner in each game and no tie is allowed. Assume\nthat outcomes of games are independent of each other. For a fixed integer r ≥2, the\nstopping rule is to terminate as soon as one of the following conditions hold: (1) I\nand II together win r games; (2) III and IV together win r + 1 games. At the time of\ntermination, let X1, X2, X3 and X4 denote the numbers of games won by I, II, III and\nIV, respectively.\n(a) Prove or disprove the statistic T = (X1 + X2, X3 + X4) is complete.\n(b) Find a uniformly minimum variance unbiased estimator of θ."}, {"year": "2023", "subject": "Probability & Statistics", "paper": "2023_probability_statistics", "kind": "individual", "n": 6, "chars": 748, "tags": ["概率论", "数理统计"], "d": 3.06, "text": "A system of interest involves three random variables, X, Y , and S, where S has a\nPoisson distribution with mean 2λ, for a parameter λ > 0, and where X and Y are\nconditionally independent Bernoulli variables, given S = s, with\nP(X = 1|S = s) =\n1\n2s+1 and P(Y = 1|S = s) = θ\n2s,\nwhere θ ∈(0, 1) is a second parameter. The random variable S is unobservable.\nWe have n i.i.d. copies (Xi, Yi) of (X, Y ).\n(a) An intuitive estimator for θ is ˆθn = ¯Yn/(2 ¯Xn), where ¯Xn = 1\nn\nPn\ni=1 Xi and ¯Yn =\n1\nn\nPn\ni=1 Yi. Derive its asymptotic distribution.\n(b) Consider the hypothesis testing problem\nH0 : θ = 1/2\nversus\nH1 : θ ̸= 1/2.\nConstruct an exact test statistic. As θ moves away from 1/2, describe all sources\nof increasing power that you can think of.\n2"}, {"year": "2024", "subject": "Algebra & Number Theory", "paper": "2024_2024_Algebra", "kind": "individual", "n": 1, "chars": 481, "tags": ["群论", "表示论"], "d": 3.28, "text": ". Let G be a finite group.\n(1) Let K be a field. Show that G has a finite-dimensional faithful K-linear representation.\n(2) Show that G has a faithful one-dimensional complex representation if and only if G is cyclic.\n(3) Assume moreover that G is commutative. Let n ≥1 be an integer. Show that G has a faithful\nn-dimensional complex representation if and only if G can be generated by n elements.\n(4) Classify all finite groups having a faithful 2-dimensional real representation."}, {"year": "2024", "subject": "Algebra & Number Theory", "paper": "2024_2024_Algebra", "kind": "individual", "n": 2, "chars": 951, "tags": ["群论", "环与模", "线性代数/矩阵", "数论"], "d": 3.11, "text": ". Let n ≥1 be an integer. Let A be a discrete valuation ring with K its field of\nfractions and π ∈A a uniformizer. For λ = (λ1, . . . , λn) ∈Zn write\nDλ = diag(πλ1, . . . , πλn) =\n\n\n\n\n\nπλ1\n0\n. . .\n0\n0\nπλ2\n. . .\n0\n...\n...\n...\n...\n0\n0\n. . .\nπλn\n\n\n\n\n∈GLn(K).\nShow that, for λ, µ ∈Zn, the following intersection inside GLn(K)\nGLn(A) · Dµ · GLn(A)\n\\\nU(K) · Dλ\nis non-empty if and only if λdom ≤µdom. Here\n• GLn(K) (resp. GLn(A)) is the group of invertible n × n square matrices with coefficients\nin K (resp. in A), and U(K) ⊂GLn(K) is the standard unipotent subgroup, that is, the\nsubgroup of upper triangular matrices with coefficients 1 on the diagonal.\n• for α = (a1, . . . , an) and β = (b1, . . . , bn) two elements in Zn, we write α ≤β if\nk\nX\ni=1\nai ≤\nk\nX\ni=1\nbi,\nfor any 1 ≤k ≤n,\nand if Pn\ni=1 ai = Pn\ni=1 bi. Write also αdom := (a′\n1, . . . , a′\nn) with a′\n1, . . . a′\nn an arrangement\nof a1, . . . , an such that\na′\n1 ≥a′\n2 ≥. . . ≥a′\nn."}, {"year": "2024", "subject": "Algebra & Number Theory", "paper": "2024_2024_Algebra", "kind": "individual", "n": 3, "chars": 213, "tags": ["表示论"], "d": 2.29, "text": ". Let k be an imperfect field of characteristic p > 0. Let a ∈k \\ kp.\n(1) Show that the polynomial Xp −a ∈k[X] is irreducible.\n(2) Let A = k[X]/(Xp2 −aXp). Compute Ared, the quotient of A by its nilpotent radical."}, {"year": "2024", "subject": "Algebra & Number Theory", "paper": "2024_2024_Algebra", "kind": "individual", "n": 4, "chars": 594, "tags": ["Galois/域扩张", "环与模", "数论"], "d": 3.78, "text": ". Let k be a field of character p > 0 and consider k(t) ⊂k((t)).\n(1) Show that the field extension k((t))/k(t) is transcendental, i.e., k((t)) contains at least one\ntranscendental element over k(t). (Hint: don't spend too much time on this question.)\n1\n\n \n(2) Let α ∈k[[t]] which is transcendental over k(t), and write β = αp ∈k[[t]]. Let K = k(t, β)\nand L = k(t, α): both are subfields of k((t)). Let A = k[[t]] ∩k(t, β). Determine the integral\nclosure B of A in L, and show that A and B are two discrete valuation rings.\n(3) Is B finitely generated over A as a module? Justify your assertion."}, {"year": "2024", "subject": "Algebra & Number Theory", "paper": "2024_2024_Algebra", "kind": "individual", "n": 5, "chars": 746, "tags": ["环与模", "数论"], "d": 3.87, "text": ". Let p be a prime number. Consider Zp (resp. Qp) the ring of p-adic integers (resp.\nfield of p-adic numbers). Clearly Z ⊂Zp.\n(1) Show that the set Z is dense in Zp, and deduce that a map f : Z →Qp can be extended to\na continuous function on Zp if and only if f is uniformly continuous, i.e., for any ϵ >
