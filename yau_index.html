nthe unit normal vector to the face Fi is ni, the area of Fi is Ai, 1 ≤i ≤k.\n• Show that\n(3)\nA1n1 + A2n2 + · · · Aknk = 0,\n• Given k unit vectors {n1, n2, · · · , nk} which can not be contained in any half\nspace, and k real positive numbers {A1, A2, · · · , Ak}, Ai > 0, and satisfying\nthe condition (3), show that there exists a convex polyhedron P, whose face\nnormals are ni's, face areas are Ai's."}, {"year": "2015", "subject": "Geometry & Topology", "paper": "2015_geometry2015_individual", "kind": "individual", "n": 1, "chars": 128, "tags": ["微分流形/形式"], "d": 1.19, "text": "Let n, m be positive integers. Show that the product of spheres Sn × Sm has trivial\ntangent bundle if and only if n or m is odd."}, {"year": "2015", "subject": "Geometry & Topology", "paper": "2015_geometry2015_individual", "kind": "individual", "n": 2, "chars": 118, "tags": ["微分流形/形式", "代数几何"], "d": 1.38, "text": "Show that there does not exist a compact three-dimensional manifold M whose\nboundary is the real projective space RP2."}, {"year": "2015", "subject": "Geometry & Topology", "paper": "2015_geometry2015_individual", "kind": "individual", "n": 3, "chars": 251, "tags": ["微分流形/形式"], "d": 1.4, "text": "Let M n be a smooth manifold without boundary and X a smooth vector field on\nM. If X does not vanish at p ∈M, show that there exists a local coordinate chart\n(U; x1, . . . , xn) centered at p such that in U the vector field X takes the form X =\n∂\n∂x1."}, {"year": "2015", "subject": "Geometry & Topology", "paper": "2015_geometry2015_individual", "kind": "individual", "n": 4, "chars": 129, "tags": ["微分几何"], "d": 1.17, "text": "Let M →R3 be a compact simply-connected closed surface. Prove that if M has\nconstant mean curvature, then M is a standard sphere."}, {"year": "2015", "subject": "Geometry & Topology", "paper": "2015_geometry2015_individual", "kind": "individual", "n": 5, "chars": 181, "tags": ["微分几何", "微分流形/形式", "经典场论/相对论"], "d": 1.72, "text": "Let M be an n-dimensional compact Riemannian manifold with diameter π/c and\nRicci curvature ≥(n −1)c2 > 0. Show that M is isometric to the standard n-sphere\nin Rn+1 with radius 1/c."}, {"year": "2015", "subject": "Geometry & Topology", "paper": "2015_geometry2015_individual", "kind": "individual", "n": 6, "chars": 181, "tags": ["微分几何", "微分流形/形式"], "d": 1.51, "text": "Suppose (M, g) is a Riemannian manifold and p ∈M. Show that the second-order\nTaylor series of g in normal coordinates centered at p is\ngij(x) = δij −1\n3\n∑\nk,l\nRikljxkxl + O(|x|3).\n1"}, {"year": "2015", "subject": "Probability & Statistics", "paper": "2015_probability2015_individual", "kind": "individual", "n": 1, "chars": 297, "tags": ["概率论"], "d": 1.84, "text": ". (a) Let X and Y be two random variables with zero means, variance 1,\nand correlation ρ. Prove that\nE[max{X2, Y 2}] ≤1 +\n√\n1 −ρ2.\n(b) Let X and Y have a bivariate normal distribution with zero means, variances\nσ2 and τ 2, respectively, and correlation ρ. Find the conditional expectation E(X|Y )."}, {"year": "2015", "subject": "Probability & Statistics", "paper": "2015_probability2015_individual", "kind": "individual", "n": 2, "chars": 102, "tags": [], "d": 1.11, "text": ". We flip a fair coin until heads turns out twice consecutively. What is the\nexpected number of flips?"}, {"year": "2015", "subject": "Probability & Statistics", "paper": "2015_probability2015_individual", "kind": "individual", "n": 3, "chars": 297, "tags": [], "d": 2.49, "text": ". Let (Xn, n ≥1) be a sequence of independent Gaussian variables, with\nrespective mean µn, and variance σ2\nn.\n(a) Prove that if ∑\nn X2\nn converges in L1, then ∑\nn X2\nn converges in Lp, for every\np ∈[1, ∞).\n(b) Assume that µn = 0, for every n. Prove that if ∑\nn σ2\nn = ∞, then\nP(\n∑\nn\nX2\nn = ∞) = 1."}, {"year": "2015", "subject": "Probability & Statistics", "paper": "2015_probability2015_individual", "kind": "individual", "n": 4, "chars": 367, "tags": ["数理统计"], "d": 2.87, "text": ".\nLet X1, . . . , Xn be a random sample of size n from the exponential\ndistribution with pdf f(x; θ) = θ−1 exp(−x/θ) for x, θ > 0, zero elsewhere.\nLet\nY1 = min{X1, . . . , Xn}. Consider an estimator nY1.\n(a) Show this estimate is unbiased.\n(b) Prove or disprove: This estimate is a consistent estimator.\n(c) Prove or disprove: This estimate is an efficient estimator."}, {"year": "2015", "subject": "Probability & Statistics", "paper": "2015_probability2015_individual", "kind": "individual", "n": 5, "chars": 418, "tags": ["概率论", "数理统计"], "d": 2.62, "text": ". Let the independent normal random variables Y1, . . . , Yn have, respec-\ntively, the probability density functions N(µ, γ2x2\ni ), i = 1, . . . , n, where the given\nx1, . . . , xn are not all equal and no one of which is zero.\n(a) Construct a confidence interval for γ with significance level 1 −α.\n(b) Discuss the test of the hypothesis H0 : γ = 1, µ unspecified, against all alternatives\nH1 : γ ̸= 1, µ unspecified."}, {"year": "2015", "subject": "Algebra & Number Theory", "paper": "2015_team_algebra2015", "kind": "team", "n": 1, "chars": 335, "tags": ["线性代数/矩阵"], "d": 1.49, "text": ". (20pt) Let V = Rn be an Euclidean space equipped with usual inner\nproduct, and g an orthogonal matrix acting on V .\nFor a ∈V , let sa denote the\nreflection\nsa(x) := x −2(x, a)\n(a, a)a,\n∀x ∈V.\n(1.1) (10pt) For a = (g −1)b ̸= 0, show that\nker(sag −1) = ker(g −1) ⊕Rb.\n(1.2) (10pt) Show that g is a product of dim[(g −1)V ] reflections."}, {"year": "2015", "subject": "Algebra & Number Theory", "paper": "2015_team_algebra2015", "kind": "team", "n": 2, "chars": 1020, "tags": ["群论", "线性代数/矩阵", "表示论", "数论", "范畴/同调代数"], "d": 3.85, "text": ". (20pt) Let p and q be two distinct prime numbers. Let G be a non-abelian\nfinite group satisfying the following conditions:\n1. all nontrivial elements have order either p or q;\n2. The q-Sylow subgroup Hq is normal and is a nontrivial abelian group.\nShow in steps the following statement:\nThe group G is of the form (Z/pZ) ⋉(Z/qZ)n, where the action of 1 ∈Z/pZ on\n(Z/qZ)n ≃Fn\nq is given by a matrix M(1) ∈GLn(Fq) whose eigenvalues are all\nprimitive p-th roots of unities.\n(2.1) (5pt) Let Hp denote a p-Sylow subgroup of G. Show that its inclusion into G\ninduces an isomorphism Hp ∼= G/Hq, and that G ≃Hp ⋉Hq.\n(2.2) (5pt) Let M : Hp−→Aut(Hq) ≃GLn(Fq) be the homomorphism induced from\nthe conjugations. Show that for each 1 ̸= a ∈Hp, M(a) is semisimple whose\neigenvalues are all primitive p-th roots of unities. In particular M is injective.\n(2.3) (5pt) Show that if two nontrivial elements a, b ∈Hp commute with each other,\nthen a = bn for some n ∈N, and that Hp ≃Z/pZ.\n(2.4) (5pt) Complete the solution of the problem.\n1"}, {"year": "2015", "subject": "Algebra & Number Theory", "paper": "2015_team_algebra2015", "kind": "team", "n": 3, "chars": 132, "tags": [], "d": 1.16, "text": ". (20pt) Let ζ be a root of unity satisfying an equation ζ = 1 + Nη for an\ninteger N ≥3 and an algebraic integer η. Show that ζ = 1."}, {"year": "2015", "subject": "Algebra & Number Theory", "paper": "2015_team_algebra2015", "kind": "team", "n": 4, "chars": 307, "tags": ["群论", "环与模", "表示论"], "d": 1.96, "text": ". (20pt) Let G be a finite group and (π, V ) a finite dimensional CG-module.\nFor n ≥0, let C[V ]n be the space of homogeneous polynomial functions on V of degree\nn. For a simple G-representation ρ, denote by an(ρ) the multiplicity of ρ in C[V ]n.\nShow that\nX\nn≥0\nan(ρ)tn = 1\n|G|\nX\ng∈G\nχρ(g)\ndet(idV −π(g)t)."}, {"year": "2015", "subject": "Algebra & Number Theory", "paper": "2015_team_algebra2015", "kind": "team", "n": 5, "chars": 439, "tags": ["线性代数/矩阵"], "d": 2.59, "text": ". (20pt) Let A be an n × n complex matrix considered as an operator on\nV = (Cn, (·, ·)) with standard hermitian form. Let A∗= ¯At be the hermitian transpose\nof A:\n(Ax, y) = (x, A∗y),\n∀x, y ∈Cn.\n(5.1) (5pt) For any λ ∈C, show the identity:\nker(A −λ)⊥= (A∗−¯λ)V.\n(5.2) (15pt) Show the equivalence of the following two statements:\n(a) A commutes with A∗;\n(b) there is a unitary matrix U (in the sense U ∗= U −1), such that UAU −1 is\ndiagonal."}, {"year": "2015", "subject": "Algebra & Number Theory", "paper": "2015_team_algebra2015", "kind": "team", "n": 6, "chars": 387, "tags": ["Galois/域扩张", "群论", "表示论", "经典场论/相对论"], "d": 3.67, "text": ". (20pt) Consider the polynomial f(x) = x5 −80x + 5.\n(6.1) (5pt) Show that f is irreducible over Q;\n(6.2) (15 pt) Show in steps that the split field K of f has Galois group G := Gal(K/Q)\nisomorphic to S5, the symmetric group of 5 letters.\n(a) (5pt) f = 0 has exactly two complex roots;\n(b) (5pt) G can be embedded into S5 with image containing cycles (12345) and\n(12);\n(c) (5pt) G ≃S5.\n2"}, {"year": "2015", "subject": "Analysis & PDE", "paper": "2015_team_analysis2015", "kind": "team", "n": 1, "chars": 132, "tags": [], "d": 1.26, "text": "Let ϕ ∈C([a, b], R). Suppose for every function h ∈C1([a, b], R), h(a) = h(b) = 0,\nwe have\n∫b\na\nϕ(x)h(x)dx = 0.\nProve that ϕ(x) = 0."}, {"year": "2015", "subject": "Analysis & PDE", "paper": "2015_team_analysis2015", "kind": "team", "n": 2, "chars": 111, "tags": ["实分析/测度"], "d": 1.21, "text": "Let f be a Lebesgue integrable function over [a, b + δ], δ > 0, prove that\nlim\nh→0+\n∫b\na\n|f(x + h) −f(x)|dx →0."}, {"year": "2015", "subject": "Analysis & PDE", "paper": "2015_team_analysis2015", "kind": "team", "n": 3, "chars": 406, "tags": [], "d": 1.74, "text": "Let L(q, q\n′, t) be a function of (q, q\n′, t) ∈TU × R, U is an open domain in Rn. Let\nγ : [a, b] →U be a curve in U. Define a functional S(γ) =\n∫b\na L(γ(t), γ\n′(t), t)dt. We say\nthat γ is an extremal if for every smooth variation of γ, ϕ(t, s), s ∈(−δ, δ), ϕ(t, 0) =\nγ(t), ϕs = ϕ(t, s), we have dS(ϕs)\nds\n|s=0 = 0. Prove that every extremal γ satisfies the\nEuler-Lagrange equation:\nd\ndt( ∂L\n∂q′ ) = ∂L\n∂q ."}, {"year": "2015", "subject": "Analysis & PDE", "paper": "2015_team_analysis2015", "kind": "team", "n": 4, "chars": 142, "tags": ["复分析"], "d": 2.21, "text": "Let f : U →U be a holomorphic function with U a bounded domain in the complex\nplane. Assuming 0 ∈U, f(0) = 0, f\n′(0) = 1, prove that f(z) = z."}, {"year": "2015", "subject": "Analysis & PDE", "paper": "2015_team_analysis2015", "kind": "team", "n": 5, "chars": 343, "tags": ["泛函分析"], "d": 1.47, "text": "Let T : H1 →H2 be a bounded operator of Hilbert spaces H1, H2. Let S : H1 →H2\nbe a compact operator, that is, for every bounded sequence {vn} ∈H1, Svn has a con-\nverging subsequence. Show that Coker(T + S) = H2/Im(T + S) is finite dimensional\nand Im(T + S) is closed in H2. (Hint: Consider equivalent statements in terms of\nadjoint operators.)"}, {"year": "2015", "subject": "Analysis & PDE", "paper": "2015_team_analysis2015", "kind": "team", "n": 6, "chars": 416, "tags": ["调和/位势"], "d": 1.73, "text": "Let u ∈C2(¯Ω), Ω⊂Rd is a bounded domain with a smooth boundary.\n1) Let u be a solution of the equation ∆u = f, u|∂Ω= 0, f ∈L2(Ω). Prove that there\nis a constant C depends only Ωsuch that\n∫\nΩ\n(Σn\nj=1( ∂u\n∂xj\n)2 + u2)dx ≤C\n∫\nΩ\nf 2(x)dx.\n2) Let {un} be a sequence of harmonic functions on Ω, such that ||un||L2(Ω) ≤M <\n∞, for a constant M independent of n. Prove that there is a converging subsequence\n{unk} in L2(Ω).\n1"}, {"year": "2015", "subject": "Computational & Applied", "paper": "2015_team_applied2015", "kind": "team", "n": 1, "chars": 756, "tags": ["偏微分方程"], "d": 2.77, "text": ". Consider the elliptic interface problem\n(a(x)ux)x = f, x ∈(0, 1)\nwith the Dirichlet boundary condition\nu(0) = u(1) = 0.\nHere, f is a smooth function, the elliptic coefficient a(x) is discontinuous across an\ninterface point ξ, that is,\na(x) =\n{\na0\nfor 0 < x < ξ\na1\nfor ξ < x < 1,\na0, a1 > 0 are positive constants, and 0 < ξ < 1 is an interface point. Across the\ninterface, we need to impose two jump conditions\nu(ξ−) = u(ξ+), a(ξ−)ux(ξ−) = a(ξ+)ux(ξ+).\nQuestion:\n1. (25%) Design a numerical method to solve this problem. The method should\nbe at least first order. It is better to be high order (if your method is first order,\nyou get 20% points).\n2. (75%) Prove your accuracy and convergence arguments (if your method is first\norder, you get 60% points)."}, {"year": "2015", "subject": "Computational & Applied", "paper": "2015_team_applied2015", "kind": "team", "n": 2, "chars": 612, "tags": ["微分几何"], "d": 1.75, "text": ". Let G be graph of a social network, where for each pair of members there\nis either no connection, or a positive or a negative one.\nAn unbalanced cycle in G is a a cycle which have odd number of negative edges.\nTraversing along such a cycle with social rules such as friend of enemy are enemy would\nresult in having a negative relation of one with himself!\nA resigning in G at a vertex v of G is to switch the type (positive or negative) of all\nedges incident to v.\nQuestion: Show that one can switch all edge of G into positive edges using a sequence\nresigning if and only if there is no unbalanced cycle in G."}, {"year": "2015", "subject": "Computational & Applied", "paper": "2015_team_applied2015", "kind": "team", "n": 3, "chars": 670, "tags": [], "d": 2.26, "text": ". We consider particles which are able to produce new particles of like kind.\nA single particle forms the original, or zero, generation. Every particle has probability\npk (k = 0, 1, 2, . . . ) of creating exactly k new particles; the direct descendants of the\nnth generation form the (n + 1)st generation. The particles of each generation act\nindependently of each other.\n1\n\n \n2\nAssume 0 < p0 < 1. Let P(x) = ∑\nk≥0 pkxk and µ = P ′(1) = ∑\nk≥0 kpk be the\nexpected number of direct descendants of one particle. Prove that if µ > 1, then the\nprobability xn that the process terminates at or before the nth generation tends to the\nunique root σ ∈(0, 1) of equation σ = P(σ)."}, {"year": "2015", "subject": "Computational & Applied", "paper": "2015_team_applied2015", "kind": "team", "n": 4, "chars": 790, "tags": ["经典场论/相对论"], "d": 2.01, "text": ". (Isopermetric inequality). Consider a closed plane curve described by a\nparametric equation (x(t), y(t)), 0 ≤t ≤T with parameter t oriented counterclockwise\nand (x(0), y(0)) = (x(T), y(T)).\n(a): Show that the total length of the curve is given by\nL =\n∫T\n0\n√\n(x′(t))2 + (y′(t))2) dt\n(b): Show that the total area enclosed by the curve is given by\nA = 1\n2\n∫T\n0\n(\nx(t)y′(t) −y(t)x′(t)\n)\ndt\n(c): The classical iso-perimetric inequality states that for closed plane curves\nwith a fixed length L, circles have the largest enclosed area A. Formulate this\nquestion into a variational problem.\n(d): Derive the Euler-Lagrange equation for the variational problem in (c).\n(e): Show that there are two constants x0 and y0 such that\n(x(t) −x0)2 + (y(t) −y0)2 ≡r2\nwhere r = L/(2π). Explain your result."}, {"year": "2015", "subject": "Computational & Applied", "paper": "2015_team_applied2015", "kind": "team", "n": 5, "chars": 464, "tags": ["线性代数/矩阵", "科学计算/大规模"], "d": 3.62, "text": ". Let A ∈Rn×m with rank r < min(m, n). Let A = UΣV T be the SVD of\nA, with singular values σ1 ≥σ2 ≥· · · ≥σr > 0.\n(a) Show that, for every ϵ > 0, there is a full rank matrix Aϵ ∈Rn×m such that\n||A −Aϵ||2 = ϵ.\n(b) Let Ak = UΣkV T where Σk = diag(σ1, . . . , σk, 0, . . . , 0) and 1 ≤k ≤r −1.\nShow that rank(Ak) = k and\nσk+1 = ||A −Ak||2 = min {||A −B||2\n|\nrank(B) ≤k}\n(c) Assume that r = min(m, n). Let B ∈Rn×m and assume that ||A −B||2 < σr.\nShow that rank(B) = r."}, {"year": "2015", "subject": "Geometry & Topology", "paper": "2015_team_geometry2015", "kind": "team", "n": 1, "chars": 254, "tags": ["群论", "线性代数/矩阵", "代数拓扑", "微分流形/形式"], "d": 2.57, "text": "Let SO(3) be the set of all 3 × 3 real matrices A with determinant 1 and satisfying\ntAA = I, where I is the identity matrix and tA is the transpose of A. Show that SO(3)\nis a smooth manifold, and find its fundamental group. You need to prove your claims."}, {"year": "2015", "subject": "Geometry & Topology", "paper": "2015_team_geometry2015", "kind": "team", "n": 2, "chars": 230, "tags": ["范畴/同调代数", "代数拓扑"], "d": 1.59, "text": "Let X be a topological space. The suspension S(X) of X is the space obtained from\nX ×[0, 1] by contracting X ×{0} to a point and contracting X ×{1} to another point.\nDescribe the relation between the homology groups of X and S(X)."}, {"year": "2015", "subject": "Geometry & Topology", "paper": "2015_team_geometry2015", "kind": "team", "n": 3, "chars": 235, "tags": ["微分流形/形式"], "d": 1.34, "text": "Let F : M →N be a smooth map between two manifolds. Let X1, X2 be smooth\nvector fields on M and let Y1, Y2 be smooth vector fields on N. Prove that if Y1 = F∗X1\nand Y2 = F∗X2, then F∗[X1, X2] = [Y1, Y2], where [ , ] is the Lie bracket."}, {"year": "2015", "subject": "Geometry & Topology", "paper": "2015_team_geometry2015", "kind": "team", "n": 4, "chars": 226, "tags": ["微分几何"], "d": 1.29, "text": "Let M1 and M2 be two compact convex closed surfaces in R3, and f : M1 →M2 a\ndiffeomerphism such that M1 and M2 have the same inner normal vectors and Gauss\ncurvatures at the corresponding points. Prove that f is a translation."}, {"year": "2015", "subject": "Geometry & Topology", "paper": "2015_team_geometry2015", "kind": "team", "n": 5, "chars": 66, "tags": [], "d": 1.07, "text": "Prove the second Bianchi identity:\nRijkl,h + Rijlh,k + Rijhk,l = 0"}, {"year": "2015", "subject": "Geometry & Topology", "paper": "2015_team_geometry2015", "kind": "team", "n": 6, "chars": 523, "tags": ["微分几何", "微分流形/形式"], "d": 2.75, "text": "Let M1, M2 be two complete n-dimensional Riemannian manifolds and γi : [0, a] →\nMi are two arc length parametrized geodesics. Let ρi be the distance function to γi(0)\non Mi. Assume that γi(a) is within the cut locus of γi(0) and for any 0 ≤t ≤a we\nhave the inequality of sectional curvatures\nK1(X1, ∂\n∂γ1\n) ≥K2(X2, ∂\n∂γ2\n),\nwhere Xi ∈Tγi(t)Mi is any unit vector orthogonal to the tangent\n∂\n∂γi.\nThen\nHess(ρ1)( e\nX1, e\nX1) ≤Hess(ρ2)( e\nX2, e\nX2),\nwhere e\nXi ∈Tγi(a)Mi is any unit vector orthogonal to the tangent\n∂\n∂γi(a).\n1"}, {"year": "2015", "subject": "Probability & Statistics", "paper": "2015_team_probability2015", "kind": "team", "n": 1, "chars": 493, "tags": [], "d": 1.52, "text": ". One hundred passengers board a plane with exactly 100 seats. The first\npassenger takes a seat at random. The second passenger takes his own seat if it is\navailable, otherwise he takes at random a seat among the available ones. The third\npassenger takes his own seat if it is available, otherwise he takes at random a seat\namong the available ones.\nThis process continues until all the 100 passengers have\nboarded the plane. What is the probability that the last passenger takes his own seat?"}, {"year": "2015", "subject": "Probability & Statistics", "paper": "2015_team_probability2015", "kind": "team", "n": 2, "chars": 287, "tags": ["概率论"], "d": 1.38, "text": ". Assume a sequence of random variables Xn converges in distribution to a\nrandom variable X. Let {Nt, t ≥0} be a set of positive integer-valued random variables,\nwhich is independent of (Xn) and converges in probability to ∞as t →∞. Prove that\nXNt converges in distribution to X as t →∞."}, {"year": "2015", "subject": "Probability & Statistics", "paper": "2015_team_probability2015", "kind": "team", "n": 3, "chars": 302, "tags": ["概率论"], "d": 1.31, "text": ". Suppose T1, T2, . . . , Tn is a sequence of independent, identically distributed\nrandom variables with the exponential distribution of the density function\np(x) =\n{\ne−x,\nx ≥0;\n0,\nx < 0.\nLet Sn = T1 + T2 + · · · + Tn. Find the distribution of the random vector\nVn =\n{ T1\nSn\n, T2\nSn\n, · · · , Tn\nSn\n}\n."}, {"year": "2015", "subject": "Probability & Statistics", "paper": "2015_team_probability2015", "kind": "team", "n": 4, "chars": 299, "tags": [], "d": 1.34, "text": ". Suppose that X and Z are jointly normal with mean zero and standard\ndeviation 1.\nFor a strictly monotonic function f(·), cov(X, Z) = 0 if and only if\ncov(X, f(Z)) = 0, provided the latter covariance exists. Hint: Z can be expressed\nas Z = ρX + ε where X and ε are independent and ε ∼N(0,\n√\n1 −ρ2)."}, {"year": "2015", "subject": "Probability & Statistics", "paper": "2015_team_probability2015", "kind": "team", "n": 5, "chars": 390, "tags": [], "d": 1.42, "text": ". Consider the following penalized least-squares problem (Lasso):\n1\n2∥Y −Xβ∥2 + λ∥β∥1\nLet bβ be a minimizer and ∆= bβ −β∗for any given β∗. If λ > 2∥XT(Y −Xβ∗)∥∞,\nshow that\n1. ∥Y −XT bβ∥2 −∥Y −XTβ∗∥2 > −λ∥∆∥1.\n\n \n2. ∥∆Sc∥1 ≤3∥∆S∥1, where S = {j : β∗\nj ̸= 0} is the support of the vector β∗, Sc is\nits complement set, ∆S is the subvector of ∆restricted on the set S, and ∥∆S∥1\nis its L1-norm."}, {"year": "2016", "subject": "Analysis & PDE", "paper": "2016_2016_team", "kind": "team", "n": 1, "chars": 360, "tags": ["优化/线性规划"], "d": 1.68, "text": "Let D ⊂Rd, d ≥2 be a compact convex set with smooth boundary ∂D so that the\norigin belongs to the interior of D. For every x ∈∂D let α(x) ∈(0, ∞) be the angle\nbetween the position vector x of the outer normal vector n(x). Let ωd be the surface\narea of the unit sphere in Rd. Compute:\n1\nωd\n∫\n∂D\ncos(α(x))\n|x|d−1\ndσ(x)\nwhere dσ denotes the surface measure on ∂D."}, {"year": "2016", "subject": "Analysis & PDE", "paper": "2016_2016_team", "kind": "team", "n": 2, "chars": 296, "tags": ["实分析/测度"], "d": 2.55, "text": "Let p > 0 and suppose fn, f ∈Lp[0, 1] and ||fn −f||p = (\n∫1\n0 |fn(x)−f(x)|pdx)\n1\np →0\nas n →∞.\na) Show that for every ϵ > 0,\nlim\nn→∞m({x ∈[0, 1]||fn(x) −f(x)| > ϵ}) = 0.\nHere m is the Lebesgue measure.\nb) Show that there exists a subsequence fnj such that fnj(x) →f(x) for almost\nevery x ∈[0, 1]."}, {"year": "2016", "subject": "Analysis & PDE", "paper": "2016_2016_team", "kind": "team", "n": 3, "chars": 348, "tags": ["复分析"], "d": 1.5, "text": "1) Let f be a holomorphic function on the unit disk D = {z ∈C||z| < 1} except 0.\nAssume f ∈L2(D), i.e.\n∫\nD |f(z)|2dzd¯z < ∞, then 0 is a removable singularity.\n2) Let fn be a sequence of holomorphic functions over a domain Ω⊂C converging\nto f uniformly on any compact subset of Ω, does the sequence of its derivatives f\n′\nn also\nhave this property?"}, {"year": "2016", "subject": "Analysis & PDE", "paper": "2016_2016_team", "kind": "team", "n": 4, "chars": 302, "tags": ["群论", "线性代数/矩阵", "复分析"], "d": 1.91, "text": "Consider the torus T 2 = C/Λ, Λ = {m+in|m, n ∈Z}, i.e. z1, z2 ∈C are equivalent\nif and only if there are integers m, n such that z2 = z1 + m + in and T 2 are the space\nof equivalent classes. Show that the group of holomorphic automorphisms of T 2 is\nSL(2, Z) of 2 x 2 integer matrices of determinant 1."}, {"year": "2016", "subject": "Analysis & PDE", "paper": "2016_2016_team", "kind": "team", "n": 5, "chars": 244, "tags": ["线性代数/矩阵", "泛函分析"], "d": 1.57, "text": "Let {en} be an orth-normal basis of l2 of square integrable functions over a circle.\nLet A : l2 →l2, Ae1 = 0, Aen = en−1\nn−1 , n > 1 be a linear operator. Show that A is an\ncompact operator and A has no eigenvectors. What are the spectrum of A?"}, {"year": "2016", "subject": "Analysis & PDE", "paper": "2016_2016_team", "kind": "team", "n": 6, "chars": 526, "tags": ["线性代数/矩阵"], "d": 1.74, "text": "If M = [0, 1] is the unit interval, the heat kernel on M can be written\np(x, y, t) = Σkϕk(x)ϕk(y)eλkt,\nwhere {λk} is an enumeration of the eigenvalues of the ∆=\nd2\ndx2 on M and {ϕk} are\nthe corresponding eigenfunctions which vanish on ∂M.\n1\n\n \n2\ni) Calculate {λk} and the corresponding eigenfunctions.\nii) Prove that |p(x, y, t)| ≤Ct−1/2, for all x, y, and 0 < t < 1.\niii) What is the exponential rate of decay of p(x, y, t) as t →∞, i.e. compute:\nlim\nt→∞log(p(x, y, t)).\n\n \nS.-T. Yau College Student Mathematics Contests 2016"}, {"year": "2016", "subject": "Probability & Statistics", "paper": "2016_2016_team", "kind": "team", "n": 1, "chars": 275, "tags": ["概率论"], "d": 1.32, "text": ". For a random walk process on the complete infinite binary tree (see Fig\n1.) starting from root (i.e. level 0), we assume that the object moves to the neighbor\nnodes with equal probability. Let Xn denote the level number at time = n. Please\nprove that\nEXn ≤1/3n + 4/3\nFig 1."}, {"year": "2016", "subject": "Probability & Statistics", "paper": "2016_2016_team", "kind": "team", "n": 2, "chars": 1052, "tags": ["概率论", "数理统计"], "d": 2.69, "text": ". The goal is to show the concentration inequality for the median of mean\nestimator. We divide the problem into three simple steps.\n1. Let X be a random variable with EX = µ < ∞and Var(X) = σ2 < ∞. Suppose\nwe have m i.i.d. random samples {Xi}m\ni=1. Let ˆµm =\n1\nm\nPm\ni=1 Xi from X. Show\nthat\nP\n |bµm −µ| ≥2σ\nr\n1\nm\n\u0001\n≤1\n4.\n2. Given k i.i.d. Bernoulli random variables {Bj}k\nj=1 with EBj = p < 1\n2. Use the\nmoment generating function of Bj, i.e., E(exp(tBj)), to show that\nP\n 1\nk\nk\nX\nj=1\nBj ≥1\n2\n\u0001\n≤(4p(1 −p))\nk\n2 .\n3. Suppose we have n i.i.d. random samples {Xi}n\ni=1 from a population with mean\nµ and variance σ2. For any positive integer k, we randomly and uniformly divide\nall the samples into k subsamples, each having size m = n/k (for simplicity,\nwe assume n is always divisible by k). Let bµj be the sample average of the jth\n\n \nsubsample and em be the median of {bµj}k\nj=1. Apply the previous two results to\nshow that\nP\n\u0010\n| em −µ| ≥2σ\nr\nk\nn\n\u0011\n≤\n √\n3\n2\n\u0001k.\nHint: Consider the Bernoulli random variable Bj = 1{|bµj −µ| ≥2σ\nq\nk\nn} for\nj = 1, ..., k."}, {"year": "2016", "subject": "Probability & Statistics", "paper": "2016_2016_team", "kind": "team", "n": 3, "chars": 588, "tags": ["概率论"], "d": 2.25, "text": ". (a) Let N ≥2 be an integer, and let X be a random variable taking\nvalues in {0, 1, 2, . . .} such that P{X ≡k (mod N)} =\n1\nN for all k ∈{0, 1, . . . , N −1}.\nCompute E(ei(2πm)X/N) (with i = √−1) for all integers m ≥1.\n(b) A game for N players (numbered as 0, 1, 2, . . ., N −1) is as follows: Each player\nindependently shows a random number of fingers (uniformly chosen from {0, 1, 2, 3, 4, 5});\nif S denotes the total number of fingers shown, then the player number S mod N is de-\nclared to be the winner of the game.\nFind all N such that the players have equal chance to win the game."}, {"year": "2016", "subject": "Probability & Statistics", "paper": "2016_2016_team", "kind": "team", "n": 4, "chars": 178, "tags": ["概率论"], "d": 1.25, "text": ". Let X1, X2, . . . be independent and identically distributed real-valued\nrandom variables.\nProve or disprove:\nIf lim supn→∞\n|Xn|\nn\n≤1 almost surely, then\nP∞\nn=1 P(|Xn| ≥n) < ∞."}, {"year": "2016", "subject": "Probability & Statistics", "paper": "2016_2016_team", "kind": "team", "n": 5, "chars": 271, "tags": [], "d": 1.26, "text": ". Choose, at random, 2016 points on the circle x2 + y2 = 1. Interpret them\nas cuts that divide the circle into 2016 arcs. Compute the expected length of the arc\nthat contains the point (1, 0). How about the variance.\n\n \nS.-T. Yau College Student Mathematics Contests 2016"}, {"year": "2016", "subject": "Geometry & Topology", "paper": "2016_2016_team", "kind": "team", "n": 2, "chars": 284, "tags": ["范畴/同调代数", "代数拓扑", "微分流形/形式"], "d": 1.91, "text": "Show that CP2n does not cover any manifold except itself.\nLet X be a topological space and p ∈X. The reduced suspension ΣX of X is the\nspace obtained from X × [0, 1] by contracting (X × {0, 1}) ∪({p} × [0, 1]) to a point.\nDescribe the relation between the homology groups of X and ΣX."}, {"year": "2016", "subject": "Geometry & Topology", "paper": "2016_2016_team", "kind": "team", "n": 3, "chars": 67, "tags": ["微分流形/形式"], "d": 1.06, "text": "State and prove the Frobenius Theorem on a differentiable manifold."}, {"year": "2016", "subject": "Geometry & Topology", "paper": "2016_2016_team", "kind": "team", "n": 4, "chars": 73, "tags": ["微分几何"], "d": 1.08, "text": "Show that all geodesics on the sphere Sn are precisely the great circles."}, {"year": "2016", "subject": "Geometry & Topology", "paper": "2016_2016_team", "kind": "team", "n": 5, "chars": 252, "tags": ["微分几何", "微分流形/形式"], "d": 1.7, "text": "Let M be an n-dimensional Riemannian manifold. Denote by R and KM the cur-\nvature tensor and sectional curvature of M. If a ≤KM ≤b at a point x ∈M, then, at\nthis point,\nR(e1, e2, e3, e4) ≤2\n3(b −a)\nfor all orthonormal four-frames {e1, e2, e3, e4} ⊂TxM."}, {"year": "2016", "subject": "Geometry & Topology", "paper": "2016_2016_team", "kind": "team", "n": 6, "chars": 229, "tags": ["微分几何"], "d": 1.27, "text": "Let M be a closed minimal hypersurface with constant scalar curvature in Sn+1.\nDenote by S the squared length of the second fundamental form of M. Show that\nS = 0, or S ≥n.\n1\n\n \nS.-T. Yau College Student Mathematics Contests 2016"}, {"year": "2016", "subject": "Algebra & Number Theory", "paper": "2016_2016_team", "kind": "team", "n": 1, "chars": 233, "tags": ["线性代数/矩阵", "经典场论/相对论"], "d": 1.52, "text": "(20 points). Find all real orthogonal 2×2 matrices k with the following\nproperty: There is an upper triangular 2 × 2 real matrix b with all diagonal entries\nbeing positive numbers such that kb is a positive definite symmetric matrix."}, {"year": "2016", "subject": "Algebra & Number Theory", "paper": "2016_2016_team", "kind": "team", "n": 2, "chars": 464, "tags": [], "d": 3.31, "text": "(20 points). For x ∈Z and k ≥0, define the binomial coefficients\n x\nk\n!\n= x(x −1) · · · (x −k + 1)\nk!\n,\n x\n0\n!\n= 1.\n(a) (6 points) Show that x ∈Z =⇒\n\u0010x\nk\n\u0011\n∈Z.\n(b) (6 points) Show that every function f : Z≥0 →Z can be expressed as f(x) =\nP∞\nk=0 ak\n\u0010x\nk\n\u0011\n, where ak ∈Z are uniquely determined by f.\n(c) (8 points) Define\nφk(x) =\n x + ⌊k/2⌋\nk\n!\n.\nShow that every function f : Z →Z can be expressed as f(x) = P∞\nk=0 akφk(x),\nwhere ak ∈Z are uniquely determined by f."}, {"year": "2016", "subject": "Algebra & Number Theory", "paper": "2016_2016_team", "kind": "team", "n": 3, "chars": 392, "tags": ["Galois/域扩张", "群论"], "d": 2.69, "text": "(20 points). Let K be the splitting field of the polynomial\nx4 −x2 −1.\n(a) (10 points) Show that the Galois group of K over Q is isomorphic to the\ndihedral group D4. Here we adopt the convention that D4 is the group of\nsymmetries of a square and has order 8.\n(b) (10 points) Determine the lattice of subfields of K: Find all subfields of K\nand describe the partial order induced by inclusion."}, {"year": "2016", "subject": "Algebra & Number Theory", "paper": "2016_2016_team", "kind": "team", "n": 4, "chars": 978, "tags": ["群论", "环与模", "表示论", "辛几何/力学", "经典场论/相对论"], "d": 4.58, "text": "(20 points). Let G be a (not necessarily finite) group and let F be a\nfield of characteristic ̸= 2. Let V ̸= 0 be an indecomposable finite-dimensional\nlinear representation of G over F. Let R = EndF(V )G be the ring of G-equivariant\nendomorphisms of V .\n(a) (5 points) Prove the following form of Fitting's lemma: Every element of R is\neither invertible or nilpotent.\n(b) (5 points) Deduce that the set I ⊆R of non-invertible elements is a two-sided\nideal and the quotient R/I is a division algebra over F.\n(c) (5 points) We say that V is orthogonal if there exists a G-invariant nonde-\ngenerate symmetric bilinear form on V . We say that V is symplectic if there\nexists a G-invariant nondegenerate alternating bilinear form on V . Deduce\nthat if there exists a G-invariant nondegenerate bilinear form on V , then V is\northogonal or symplectic.\nPage 1 of 2\n\n \n(d) (5 points) Assume that F is algebraically closed. Deduce from (b) that V\ncannot be both orthogonal and symplectic."}, {"year": "2016", "subject": "Algebra & Number Theory", "paper": "2016_2016_team", "kind": "team", "n": 5, "chars": 521, "tags": ["群论"], "d": 3.04, "text": "(20 points).\n(a) (5 points) Let G be a finite group. Let x1, . . . , xh be representatives of the con-\njugacy classes of G. Let ni = #CentG(xi) be the cardinality of the centralizer\nof xi. Prove the identity\n1 =\nh\nX\ni=1\n1\nni\n.\n(b) (10 points) Deduce that for any integer h ≥1, there exist only finitely many\nisomorphism classes of finite groups with exactly h conjugacy classes.\n(c) (5 points) Find all the finite groups with exactly 3 conjugacy classes.\nPage 2 of 2\n\n \nS.-T. Yau College Student Mathematics Contests 2016"}, {"year": "2016", "subject": "Computational & Applied", "paper": "2016_2016_team", "kind": "team", "n": 1, "chars": 984, "tags": ["偏微分方程", "代数几何"], "d": 3.87, "text": ". For solving the following partial differential equation\n(1)\nut + ux = 0,\n−∞≤x ≤∞\nwith compactly supported initial condition, we consider the following one-step, three-\npoint scheme on a uniform mesh xj = j∆x with spatial mesh size ∆x:\n(2)\nun+1\nj\n= aun\nj + bun\nj−1 + cun\nj−2,\nj = · · · , −1, 0, 1, · · ·\nwhere a, b, c are constants which may depend on the mesh ratio λ = ∆t\n∆x. Here ∆t is\nthe time step, and un\nj approximates the exact solution at u(xj, tn) with tn = n∆t.\n(1) Find the constants a, b, c such that the scheme (2) is second order accurate.\n(2) Find the CFL number λ0 such that the scheme (2), with the constants deter-\nmined by the step above, is stable in L2 under the time step restriction λ ≤λ0.\n(3) If the PDE (1) is defined on (0, ∞) with an initial condition compactly sup-\nported in (0, ∞) and a boundary condition u(0, t) = g(t), how would you modify\nthe scheme (2) so that it can be applied? Can you prove the stability and ac-\ncuracy of your modified scheme?"}, {"year": "2016", "subject": "Computational & Applied", "paper": "2016_2016_team", "kind": "team", "n": 2, "chars": 810, "tags": ["调和/位势", "经典场论/相对论"], "d": 3.86, "text": ". Inverse problem. Answer the famous Mark Kac's equation: \"can you\nhear the shape of drum?\" for the special case.\nConsider the one-dimensional oscillator ¨x = −u′(x) with symmetric potential u(−x) =\nu(x), u(0) = u′(0) = 0, u′(x) > 0 for x > 0, limx→∞u(x) = ∞. Denote the inverse\nfunction of y = u(x), x ≥0 as x = u−1(y) = φ(y).\n(a) For any solution x(t), show there is a conservation of energy\n˙x2(t)\n2\n+ u(x(t)) ≡e\nwhere e is a constant.\n(b) For any energy e > 0, find a periodic solution with total energy e. Show that the\nperiod is given by\nP(e) = 2\n√\n2\nZ xmax\n0\ndx\np\ne −u(x)\n,\nxmax = φ(e) > 0 .\n(c) Show that\nφ(z) =\n1\n2π\n√\n2\nZ z\n0\nP(e) de\n√z −e .\n(d) In the case of iso-chronous P(e) ≡2π, show that φ(z) =\n√\n2z. Then you have\nu(x) = 1\n2x2, x(t) = a cos(t) + b sin(t), the famous harmonic oscillator.\n1\n\n \n2"}, {"year": "2016", "subject": "Computational & Applied", "paper": "2016_2016_team", "kind": "team", "n": 3, "chars": 511, "tags": ["线性代数/矩阵"], "d": 1.86, "text": ". The following statement informally means that if a system of homoge-\nneous equations with integer coefficients has a nontrivial solution then it has an integer\nsolutions with reasonably small components. It is required in many applications.\nLet A = (aij)m,n\ni,j=1 be an m × n matrix of rank r ≤n −1 with integer entries of size at\nmost H, that is,\n|aij| ≤H,\n1 ≤i ≤m, 1 ≤j ≤n.\nProve that there is an integer non-zero vector x = (x1, . . . , xn) ∈Zn such that Ax = 0\nand\n∥x∥∞≤(2nH)n−1\nwhere ∥x∥∞= max1≤i≤n |xi|."}, {"year": "2016", "subject": "Computational & Applied", "paper": "2016_2016_team", "kind": "team", "n": 4, "chars": 919, "tags": ["线性代数/矩阵", "代数几何"], "d": 3.93, "text": ". This problem considers an iterative scheme\nxk+1 = xk + βkpk\nfor the linear system Ax = b, where A ∈Rn×n is a given n×n non-singular matrix and\nb ∈Rn is a given vector. In the above scheme, xk denotes the approximate solution at\nthe k-th iteration, βk is a scalar and pk ∈Rn is a search direction. If xk is given, the\nabove scheme will determine xk+1 so that the residual rk+1 := b−Axk+1 is the smallest\npossible with respect to the 2-norm.\n(1) Determine βk.\n(2) Prove that the residual rk+1 is orthogonal to Apk with respect to the usual\ninner-product.\n(3) Prove that the residuals satisfy\n∥rk+1∥≤∥rk∥sin(α)\nwhere α is the angle between rk and Apk, and ∥· ∥denotes the 2-norm.\n(4) Assume that the inner product of rk and Apk is non-zero. Will the above scheme\nalways converge?\n(5) Assume that A is positive definite. We take the search direction pk = rk. Show\nthat the above scheme converges for any initial guess x0."}, {"year": "2016", "subject": "Computational & Applied", "paper": "2016_2016_team", "kind": "team", "n": 5, "chars": 533, "tags": [], "d": 3.31, "text": ". Let f : Rn →R be convex and in C1. Suppose f has a local minimum\nx∗.\n(1) Must this local minimum x∗be a global minimum?\n(2) Consider the following backward gradient method: starting from any x0 ∈Rn,\ndefine\nxk = xk−1 −t∇f(xk),\nk ≥1,\nwhere t > 0 is a fixed step size. Do you need any condition on t to guarantee\n{f(xk)} converge? Prove your convergence argument, if {f(xk)} converges.\n(3) Suppose f is strongly convex, that is, ∃m > 0 such that ⟨∇f(x)−∇f(y), x−y⟩≥\nm∥x −y∥2. Under this additional condition, show that {xk} converges."}, {"year": "2016", "subject": "Algebra & Number Theory", "paper": "2016_algebra2016_individual", "kind": "individual", "n": 1, "chars": 772, "tags": ["经典场论/相对论"], "d": 3.73, "text": "(20 points). Let E be a linear space over R, of finite dimension n ≥2,\nequipped with a positive definite symmetric bilinear form ⟨· , · ⟩. Let u1, u2, . . . , un\nbe a basis of E. Let v1, v2, . . . , vn be the dual basis, that is,\n⟨ui, vj⟩=\n\n\n\n1\nif i = j,\n0\nif i ̸= j,\nfor all i, j = 1, 2, . . . , n.\n(a) (8 points) Assume that ⟨ui, uj⟩≤0 for all 1 ≤i < j ≤n. Show that there\nis an orthogonal basis u′\n1, u′\n2, . . . , u′\nn of E such that u′\ni is a non-negative linear\ncombination of u1, u2, . . . , ui, for all i = 1, 2, . . . , n.\n(b) (6 points) With the same assumption as in Part (a), show that ⟨vi, vj⟩≥0 for\nall 1 ≤i < j ≤n.\n(c) (6 points) Assume that n ≥3. Show that the condition ⟨ui, uj⟩≥0 for all\n1 ≤i < j ≤n does not imply that ⟨vi, vj⟩≤0 for all 1 ≤i < j ≤n."}, {"year": "2016", "subject": "Algebra & Number Theory", "paper": "2016_algebra2016_individual", "kind": "individual", "n": 2, "chars": 471, "tags": ["群论", "数论"], "d": 3.44, "text": "(20 points). Let d ≥1 and n ≥1 be integers.\n(a) (5 points) Show that there are only finitely many subgroups G ⊆Zd of index n.\nLet fd(n) denote the number of such subgroups.\n(b) (5 points) Let gd(n) denote the number of subgroups H ⊆Zd of index n\nsuch that the quotient group is cyclic. Show that fd(mn) = fd(m)fd(n) and\ngd(mn) = gd(m)gd(n) for coprime positive integers m and n.\n(c) (5 points) Compute gd(pr) for every prime power pr, r ≥1.\n(d) (5 points) Compute f2(20)."}, {"year": "2016", "subject": "Algebra & Number Theory", "paper": "2016_algebra2016_individual", "kind": "individual", "n": 3, "chars": 732, "tags": ["环与模", "线性代数/矩阵"], "d": 3.9, "text": "(20 points). Let A be a complex m × m matrix. Assume that there\nexists an integer N ≥0 such that tn = tr(An) is an algebraic integer for all n ≥N.\nThe goal of this problem is to show that the eigenvalues a1, . . . , am of A are algebraic\nintegers.\n(a) (10 points) Show that there exist algebraic numbers bij ∈C, 1 ≤i, j ≤m such\nthat\nan\ni =\nm\nX\nj=1\nbijtn+j−1\nfor all n ≥0 and all 1 ≤i ≤m.\nIn particular, a1, . . . , am are algebraic\nnumbers.\n(b) (8 points) Let R be the ring of all algebraic integers in C and let K be the\nfield of all algebraic numbers in C. Show that for a ∈K, if R[a] is contained\nin a finitely-generated R-submodule of K, then a ∈R.\n(c) (2 points) Conclude that a1, . . . , am are algebraic integers.\nPage 1 of 2"}, {"year": "2016", "subject": "Algebra & Number Theory", "paper": "2016_algebra2016_individual", "kind": "individual", "n": 4, "chars": 643, "tags": ["群论"], "d": 3.28, "text": "(20 points). Let E be a Euclidean plane. For each line l in E, write\nsl ∈Iso(E) for the reflection with respect to l, where Iso(E) denotes the group of\ndistance-preserving bijections from E to itself.\n(a) (6 points) Let l1 and l2 be two distinct lines in E. Find the necessary and\nsufficient condition that sl1 and sl2 generate a finite group.\n(b) (7 points) Let l1, l2 and l3 be three pairwise distinct lines in E. Assume that\nsl1, sl2 and sl3 generate a finite group. Show that l1, l2, l3 intersect at a point.\n(c) (7 points) Let G be a finite subgroup of Iso(E) generated by reflections. Show\nthat G is generated by at most two reflections."}, {"year": "2016", "subject": "Algebra & Number Theory", "paper": "2016_algebra2016_individual", "kind": "individual", "n": 5, "chars": 719, "tags": ["群论"], "d": 3.51, "text": "(20 points). Let G be a finite group of order 2nm where n ≥1 and\nm is an odd integer. Assume that G has an element of order 2n. The goal of this\nproblem is to show that G has a normal subgroup of order m.\n(a) (5 points) Show that if M is a normal subgroup of G of order m, then M is\nthe only subgroup of G of order m.\n(b) (5 points) Let N be a normal subgroup of G and let P be a 2-Sylow subgroup\nof G. Show that P ∩N is a 2-Sylow subgroup of N.\n(c) (5 points) Show that the homomorphism G →{±1} carrying g to sgn(lg) is\nsurjective. Here sgn(lg) denotes the sign of the permutation lg : G →G given\nby left multiplication by g.\n(d) (5 points) Deduce by induction on n that G has a normal subgroup of order m.\nPage 2 of 2"}, {"year": "2016", "subject": "Analysis & PDE", "paper": "2016_analysis2016_individual", "kind": "individual", "n": 1, "chars": 166, "tags": ["实分析/测度"], "d": 1.28, "text": "Suppose that F is continuous on [a, b], F\n′(x) exists for every x ∈(a, b), F\n′(x) is\nintegrable. Prove that F is absolutely continuous and\nF(b) −F(a) =\n∫b\na\nF\n′(x)dx."}, {"year": "2016", "subject": "Analysis & PDE", "paper": "2016_analysis2016_individual", "kind": "individual", "n": 2, "chars": 192, "tags": [], "d": 1.31, "text": "Suppose that f is integrable on Rn, let Kδ(x) = δ−n\n2 e\n−π|x|2\nδ\nfor each δ > 0. Prove\nthat the convolution\n(f ∗Kδ)(x) =\n∫\nRn f(x −y)Kδ(y)dy\nis integrable and ||(f ∗Kδ) −f||L1(Rn) →0, as δ →0."}, {"year": "2016", "subject": "Analysis & PDE", "paper": "2016_analysis2016_individual", "kind": "individual", "n": 3, "chars": 483, "tags": [], "d": 1.74, "text": "Prove that a bounded function on interval I = [a, b] is Riemann integrable if and\nonly if its set of discontinuities has measure zero. You may prove this by the following\nsteps.\nDefine I(c, r) = (c −r, c + r), osc(f, c, r) = supx,y∈J∩I(c,r) |f(x) −f(y)|, osc(f, c) =\nlimr→0 osc(f, r, c).\n1) f is continuous at c ∈J if and only if osc(f, c) = 0.\n2) For arbitrary ϵ > 0, {c ∈J|osc(f, c) ≥ϵ} is compact.\n3) If the set of discontinuities of f has measure 0, then f is Riemann integrable."}, {"year": "2016", "subject": "Analysis & PDE", "paper": "2016_analysis2016_individual", "kind": "individual", "n": 4, "chars": 154, "tags": [], "d": 1.22, "text": "1) Let f be the Rukowski map: w = 1\n2(z + 1\nz). Show that it maps {z ∈¯C||z| > 1}\nto ¯C/[−1, 1], ¯C = C ∪{∞}.\n2) Compute the integral:\n∫∞\n0\nlog x\nx2 −1dx."}, {"year": "2016", "subject": "Analysis & PDE", "paper": "2016_analysis2016_individual", "kind": "individual", "n": 5, "chars": 182, "tags": ["复分析"], "d": 1.26, "text": "Let f be a doubly periodic meromorphic function over the complex plane, i.e. f(z +\n1) = f(z), f(z + i) = f(z), z ∈C, prove that the number of zeros and the number of\npoles are equal."}, {"year": "2016", "subject": "Analysis & PDE", "paper": "2016_analysis2016_individual", "kind": "individual", "n": 6, "chars": 148, "tags": ["泛函分析"], "d": 1.18, "text": "Let A be a bounded self-adjoint operator over a complex Hilbert space. Prove that\nthe spectrum of A is a bounded closed subset of the real line R.\n1"}, {"year": "2016", "subject": "Computational & Applied", "paper": "2016_applied2016_individual", "kind": "individual", "n": 1, "chars": 350, "tags": ["偏微分方程", "代数几何"], "d": 2.64, "text": ". Consider the implicit leapfrog scheme\nun+1\nm\n−un−1\nm\n2k\n+ a\nµ\n1 + h2\n6 δ2\n¶−1\nδ0un\nm = f n\nm\nfor the one-way wave equation\nut + aux = f.\nHere δ2 is the central second difference operator, and δ0 is the central first difference\noperator.\n(1) show that the scheme is of order (2, 4).\n(2) show that the scheme is stable if and only if |ak\nh | <\n1\n√\n3."}, {"year": "2016", "subject": "Computational & Applied", "paper": "2016_applied2016_individual", "kind": "individual", "n": 2, "chars": 1063, "tags": [], "d": 3.82, "text": ". A simple version of an enzyme-mediate chemical reaction process is given\nby\nS + E\nk1\n←→\nk2 C\nk3\n−→P + E\nwhere S is the substrate reactant and P is the concentration of the desired product.\nAn enzyme (or catalyst) E is a compound whose special property is that it allows for\nintermediate reaction steps that lead to a the overall reaction,\nS −→P.\nAssume the initial conditions\nS(0) = S0,\nE(0) = E0,\nC(0) = 0,\nP(0) = 0;\nk1, k2, k3 are reaction rate constants.\n(a) Convert the chemical reaction equation into a system of rate equations (ODEs) for\nS(T), E(T), C(T), and P(T) where T is the dimensional time. Nondimensionalize\nthe equations using the scalings\nT = t/(k1E0),\nS(T) = S0s(t),\nP(T) = S0p(t),\nE(T) = E0s(t),\nC(T) = E0c(t),\nϵ = E0\nS0\n≪1,\nλ =\nk2\nk1S0\n,\nµ = k2 + k3\nk1S0\n.\n(b) Use the expansions s(t) = s0(t)+ϵs1(t)+O(ϵ2), c(t) = c0(t)+ϵc1(t)+O(ϵ2), etc to\ndetermine the equations for the leading order slow solution. Show that s0(t) and\np0(t) satisfies the following Michaelis-Menten equations\n˙s0(t) = −(µ −λ)\ns0\nµ + s0\n,\n˙p0(t) = (µ −λ)\ns0\nµ + s0\n.\n1\n\n \n2"}, {"year": "2016", "subject": "Computational & Applied", "paper": "2016_applied2016_individual", "kind": "individual", "n": 3, "chars": 1471, "tags": ["线性代数/矩阵"], "d": 3.07, "text": ". We say that a vector u = (u1, . . . , un) ∈Nn is multiplicatively dependent\nif there is a non-zero vector k = (k1, . . . , kn) ∈Zn for which\n(1)\nuk1\n1 · · · ukn\nn = 1.\nThis notion plays a very important role in many number theoretic algorithms, such\nas factorisation and primality testing. It also (in a more general form) appears in\nsome questions in algebraic dynamics. However the algorithm to decide whether u\nis multiplicatively dependent is not immediately obvious.\nThe following statement\ninformally means that if u is multiplicatively dependent the exponents k1, . . . , kn can\nbe chosen to be reasonably small. Prove that if u = (u1, . . . , un) ∈Nn is multiplicatively\ndependent with ∥u∥∞≤H where ∥u∥∞= max1≤i≤n |ui|, then there is a non-zero vector\nk = (k1, . . . , kn) ∈Zn with\n∥k∥∞≤\nµ2n log H\nlog 2\n¶n−1\n(and hence for a fixed n it can be found in polynomial time of order (log H)n(n−1)).\nComment: To solve this problem, you can use the following statement (without\nproof) which informally means that if a system of homogeneous equations with integer\ncoefficients has a nontrivial solution then it has an integer solutions with reasonably\nsmall components. It is required in many applications.\nLet A = (aij)m,n\ni,j=1 be an m × n matrix of rank r ≤n −1 with integer entries of size at\nmost H, that is,\n|aij| ≤H,\n1 ≤i ≤m, 1 ≤j ≤n.\nThen there is an integer non-zero vector x = (x1, . . . , xn) ∈Zn such that Ax = 0 and\n∥x∥∞≤(2nH)n−1\nwhere ∥x∥∞= max1≤i≤n |xi|."}, {"year": "2016", "subject": "Computational & Applied", "paper": "2016_applied2016_individual", "kind": "individual", "n": 4, "chars": 945, "tags": ["线性代数/矩阵", "经典场论/相对论"], "d": 3.82, "text": ". Consider a symmetric matrix An×n, and let λi be a simple eigenvalue of\nA with\n|λj −λi| = O(1),\nj ̸= i.\nIn inverse iteration of compute eigenvalue and eigenvector, one needs to solve the\nfollowing linear system\n(A −µI)yk+1 = xk,\nwhere µ is an approximation of eigenvalue λi, ∥xk∥= 1and obtain\nxk+1 =\nyk+1\n∥yk+1∥.\nHowever, for µ close to λi, A −µI has a very small eigenvalue and the linear system\nwill be ill-conditioned. So there may be large error in the numerical solution to the\nlinear system, denoted by ˜yk+1. Even though we may get large error in ˜yk+1, the ˜xk+1\nwe get from ˜xk+1 =\n˜yk+1\n∥˜yk+1∥is accurate.\n\n \n3\n(1) ˜yk+1 satisfies\n(A −µI + δA)˜yk+1 = xk,\nwhere ∥δA∥= O(ϵ) and ϵ is the machine precision. Show that\n(A −λi) ˜yk+1\n∥˜yk+1∥∥≤|µ −λi| + ∥δA∥+\n1\n∥˜yk+1∥.\n(2) Let αi = xt\nkqi, where qi is the normalized eigenvector corresponding to λi. Show\nthat\n∥˜yk+1∥≥\n|αi|\n|µ −λi| + ∥δA∥.\n(3) Conclude that\n∥xk+1 −(±)qi∥= O(|λi −µ| + ϵ)."}, {"year": "2016", "subject": "Computational & Applied", "paper": "2016_applied2016_individual", "kind": "individual", "n": 5, "chars": 363, "tags": ["线性代数/矩阵"], "d": 3.27, "text": ". A function f : Rn →R in C2 is called strongly convex if its Hessian\nmatrix satisfies ∇2f ⪰mI for some m > 0. Show that the following statements are\nequivalent:\n(a) f is strongly convex, i.e. ∇2f(x) ⪰mI for all x ∈Rn;\n(b) For any t ∈[0, 1], any x, y ∈R,\nf(tx + (1 −t)y) ≤tf(x) + (1 −t)f(y) −m\n2 t(1 −t)∥x −y∥2;\n(c) ⟨∇f(x) −∇f(y), x −y⟩≥m∥x −y∥2 for any x, y ∈Rn."}, {"year": "2016", "subject": "Geometry & Topology", "paper": "2016_geometry2016_individual", "kind": "individual", "n": 1, "chars": 142, "tags": ["代数拓扑", "微分流形/形式"], "d": 1.48, "text": "Let M be a compact odd-dimensional manifold with boundary ∂M. Show that the\nEuler characteristics of M and ∂M are related by:\nχ(M) = 1\n2χ(∂M)."}, {"year": "2016", "subject": "Geometry & Topology", "paper": "2016_geometry2016_individual", "kind": "individual", "n": 2, "chars": 177, "tags": ["范畴/同调代数", "代数拓扑", "微分流形/形式"], "d": 1.76, "text": "Compute the de Rham cohomology of a punctured two-dimensional torus T 2 −{p},\nwhere p ∈T 2. If T 2 = R2/Z2 with coordinates (x, y) ∈R2, then is the volume form\nω = dx ∧dy exact?"}, {"year": "2016", "subject": "Geometry & Topology", "paper": "2016_geometry2016_individual", "kind": "individual", "n": 3, "chars": 317, "tags": ["微分几何"], "d": 1.48, "text": "Let M n →Rn+1 be a closed oriented hypersurface. The r-th mean curvature of M n\nis defined by\nHr :=\n1\n¡n\nr\n¢\nX\ni1<i2···<ir\nλi1λi2 · · · λir,\n(1 ≤r ≤n)\nwhere λi (i = 1, · · · , n) are principal curvatures of M n. Prove that if all of λi are\npositive and Hr =constant for a certain r, then M n is a hypersphere in Rn+1."}, {"year": "2016", "subject": "Geometry & Topology", "paper": "2016_geometry2016_individual", "kind": "individual", "n": 4, "chars": 71, "tags": ["微分流形/形式"], "d": 1.07, "text": "State and prove the cut-offfunction lemma on a differentiable manifold."}, {"year": "2016", "subject": "Geometry & Topology", "paper": "2016_geometry2016_individual", "kind": "individual", "n": 5, "chars": 120, "tags": ["微分几何", "微分流形/形式"], "d": 1.38, "text": "Let M be a compact Riemannian manifold without boundary. Show that if M has\npositive Ricci curvature, then H1(M, R) = 0."}, {"year": "2016", "subject": "Geometry & Topology", "paper": "2016_geometry2016_individual", "kind": "individual", "n": 6, "chars": 169, "tags": ["线性代数/矩阵"], "d": 1.19, "text": "Let M be an orientable, closed and embedded minimal hypersurface in Sn+1. Denote\nby λ1 the first eigenvalue for the Laplace-Beltrami operator on M. Prove that λ1 ≥n/2.\n1"}, {"year": "2016", "subject": "Probability & Statistics", "paper": "2016_probability2016_individual", "kind": "individual", "n": 1, "chars": 402, "tags": ["概率论"], "d": 1.48, "text": ". A random walker moves on the lattice Z2 according to the following rule:\nin the first step it moves to one of its neighbors with probability 1/4, and then in step\nn > 1 it moves to one of the neighbors that it didn't visit in the step n −1 with equal\nprobability. Let T be the time when the random walker steps on a site that it already\nvisited. Please show that the expectation of T is less than 35."}, {"year": "2016", "subject": "Probability & Statistics", "paper": "2016_probability2016_individual", "kind": "individual", "n": 2, "chars": 221, "tags": ["线性代数/矩阵", "概率论"], "d": 1.65, "text": ". Let X be a N × N random matrix with i.i.d. random entries, and\nP(X11 = 1) = P(X11 = −1) = 1/2\nDefine\n∥X∥op =\nsup\nv∈CN:∥v∥2=1\n∥Xv∥2\nPlease show that for any fixed δ > 0,\nlim\nN→∞P(∥X∥op ≥N 1/2+δ) = 0\nHint: ∥X∥2\nop ≤tr|X|2"}, {"year": "2016", "subject": "Probability & Statistics", "paper": "2016_probability2016_individual", "kind": "individual", "n": 3, "chars": 254, "tags": [], "d": 1.32, "text": ". Suppose that 2016 balls are put into 2016 boxes with each ball indepen-\ndently being put into box i with probability\n1\n3×1008 for i ≤1008 and\n2\n3×1008 for i > 1008.\nLet T be the number of boxes containing exactly 2 balls. Please find the variance of T."}, {"year": "2016", "subject": "Probability & Statistics", "paper": "2016_probability2016_individual", "kind": "individual", "n": 4, "chars": 160, "tags": ["概率论"], "d": 1.23, "text": ". Let b > a > 0 be real numbers. Let X be a random variable taking values\nin [a, b], and let Y = 1\nX . Determine the set of all possible values of E(X) × E(Y )."}, {"year": "2016", "subject": "Probability & Statistics", "paper": "2016_probability2016_individual", "kind": "individual", "n": 5, "chars": 226, "tags": ["概率论"], "d": 1.31, "text": ". Let X1, X2, . . . be independent and identically distributed real-valued\nrandom variables such that E(X1) = −1. Let Sn = X1 + · · · + Xn for all n ≥1, and let\nT be the total number of n ≥1 satisfying Sn ≥0. Compute P(T = ∞)."}, {"year": "2017", "subject": "Analysis & PDE", "paper": "2017_2017_team", "kind": "team", "n": 1, "chars": 165, "tags": [], "d": 1.22, "text": "Suppose that f is an integrable function on the circle with ˆf(n) =\n1\n2π\nR 2π\n0\nf(x)e−inxdx =\n0, for all n ∈Z. Then f(θ) = 0 whenever f is continuous at the point θ."}, {"year": "2017", "subject": "Analysis & PDE", "paper": "2017_2017_team", "kind": "team", "n": 2, "chars": 263, "tags": ["实分析/测度"], "d": 1.5, "text": "Let F be continuous on [a, b]. Show that:\n1) Suppose (D+F)(x) = lim suph→0,h>0\nF(x+h)−F(x)\nh\n> 0 for every x ∈[a, b). Then F\nis increasing on [a, b].\n2) If F\n′(x) exists for every x ∈(a, b) and |F\n′(x)| ≤M, then |F(x)−F(y)| ≤M|x−y|\nand F is absolutely continuous."}, {"year": "2017", "subject": "Analysis & PDE", "paper": "2017_2017_team", "kind": "team", "n": 3, "chars": 192, "tags": ["复分析"], "d": 1.21, "text": "Let f(z) be holomorphic for |z| < 1 and assume |f(z)| < 1, if |z| < 1. If α and β\nare such that |α| < 1, |β| < 1, α ̸= β, and f(α) = f(β) = 0, then\n|f(z)| ≤| z −α\n1 −¯αz\nz −β\n1 −¯βz|, |z| < 1."}, {"year": "2017", "subject": "Analysis & PDE", "paper": "2017_2017_team", "kind": "team", "n": 4, "chars": 229, "tags": [], "d": 1.32, "text": "Show that a single-valued analytic branch of\n√\n1 −z2 can be defined in any region\nsuch that the points ±1 are in the same component of the complement. What are the\npossible values of\nR\ndz\n√\n1−z2 over a closed curve in the region?"}, {"year": "2017", "subject": "Analysis & PDE", "paper": "2017_2017_team", "kind": "team", "n": 5, "chars": 194, "tags": ["偏微分方程", "经典场论/相对论"], "d": 1.42, "text": "In Rn, consider the Laplace equation\nu11 + u22 + ... + unn = 0.\nShow that the equation is invariant under orthogonal transformation. Find all rota-\ntionally symmetric solutions to this equation."}, {"year": "2017", "subject": "Analysis & PDE", "paper": "2017_2017_team", "kind": "team", "n": 6, "chars": 328, "tags": ["泛函分析"], "d": 1.47, "text": "Let A be an operator over the function space C[a, b] defined as:\n(Af)(x) =\nZ b\na\nK(x, y)f(y)dy,\nwhere K(x, y) is continuous over [a, b] × [a, b] except at several curves defined by y =\nφk(x), x ∈[a, b], k = 1, ..., n with φk continuous. Show that A is a compact operator.\n1\n\n \nS.-T. Yau College Student Mathematics Contests 2017"}, {"year": "2017", "subject": "Probability & Statistics", "paper": "2017_2017_team", "kind": "team", "n": 1, "chars": 472, "tags": [], "d": 1.62, "text": ". Let µn be the uniform probability measure on the n-dimensional cube\n[−1, 1]n.\nLet H ∈Rn be the hyperplane orthogonal to the principal diagonal, i.e.,\nH = (1, · · · , 1)⊥. For any r > 0, we further define\nAH, r := {x ∈[−1, 1]n, dist(x, H) ≤r},\nwhere dist(x, H) represents the distance from the point x to the hyperplane H. Show\nthat for any constant ε > 0, the following two estimates hold for all sufficiently large n\n1 :\nµn¡\nAH, nε¢\n≥1 −n−2ε,\n2 :\nµn¡\nAH, nε¢\n≥1 −e−nε/2"}, {"year": "2017", "subject": "Probability & Statistics", "paper": "2017_2017_team", "kind": "team", "n": 2, "chars": 183, "tags": ["概率论"], "d": 1.24, "text": ".\nLet X1, X2, . . . be positive random variables.\nWe assume that Xn\nconverges to 0 in probability, and that limn→∞E(Xn) = 2. Prove that limn→∞E(|Xn −\n1|) exists and compute its value."}, {"year": "2017", "subject": "Probability & Statistics", "paper": "2017_2017_team", "kind": "team", "n": 3, "chars": 568, "tags": [], "d": 1.68, "text": ". There are n people playing a game. Initially everybody had one dollar at\nhand. During each round of the game, we randomly pick two people and they will toss\na fair coin, to decide who wins this round of the game. The loser will submit one dollar\n(note: just one, not all of his money) to the winner. Assume that a person who had no\nmoney at hand will be immediately driven out of the game. The game stops until all\nmoney is at the hand of only one person. Calculate the average number of rounds that\nthe game plays.\nNote: In each round only two players are involved."}, {"year": "2017", "subject": "Probability & Statistics", "paper": "2017_2017_team", "kind": "team", "n": 4, "chars": 291, "tags": ["概率论"], "d": 1.49, "text": ".\nLet {Xn}n∈N and {X′\nn}n∈N be two independent simple random walks on Zd such\nthat X0 = X′\n0 = 0. Here simple walk means if x, y ∈Zd and ∥x −y∥= 1, then\nP(Xn+1 = y|Xn = x) = (2d)−1\nLet I = {(s, t) : Xs = X′\nt}. Prove that |I| < ∞a.s.\nHint: You can first prove that\nP(Xn = 0) = O(n−d/2),\nn →∞"}, {"year": "2017", "subject": "Probability & Statistics", "paper": "2017_2017_team", "kind": "team", "n": 5, "chars": 534, "tags": ["概率论", "数理统计"], "d": 3.38, "text": ". Suppose X1, . . . , Xn are i.i.d. Poisson variables with mean λ and we are\ninterested in estimating p = Pλ(Xi = 0) = e−λ.\n1\n\n \n(a) One estimator for p is the proportion of zeros in the sample, ˜p = #{i ≤n : Xi =\n0}/n. Determine limiting distribution for √n(˜p −p).\n(b) Another estimator would be the maximum likelihood estimator ˆp. Give a formula\nfor ˆp and determine limiting distribution for √n(ˆp −p).\n(c) Find the asymptotic relative efficiency of ˜p with respect to ˆp.\n2\n\n \nS.-T. Yau College Student Mathematics Contests 2017"}, {"year": "2017", "subject": "Geometry & Topology", "paper": "2017_2017_team", "kind": "team", "n": 1, "chars": 208, "tags": ["群论", "代数拓扑"], "d": 1.55, "text": "Consider the space X = M1 ∪M2, where M1 and M2 are M¨obius bands and\nM1 ∩M2 = ∂M1 = ∂M2.\nHere a M¨obius band is the quotient space ([−1, 1] ×\n[−1, 1])/((1, y) ∼(−1, −y)). Determine the fundamental group of X."}, {"year": "2017", "subject": "Geometry & Topology", "paper": "2017_2017_team", "kind": "team", "n": 2, "chars": 204, "tags": ["范畴/同调代数", "代数拓扑"], "d": 1.64, "text": "If f : X →X is a self-map, then the \"mapping torus of f\" is the quotient\nTf := (X × [0, 1])/(x, 0) ∼(f(x), 1),\n∀x ∈X.\nFor n ∈Z, let fn be a degree n map on S3. Compute the integral homology groups of\nTfn."}, {"year": "2017", "subject": "Geometry & Topology", "paper": "2017_2017_team", "kind": "team", "n": 3, "chars": 418, "tags": ["微分几何"], "d": 1.54, "text": "Let C be a regular curve on a smooth surface S in R3. Denote by I = Edu2 +\n2Fdudv + Gdv2 and II = Ldu2 + 2Mdudv + Ndv2 the first and second fundamental\nforms of S, respectively. Assume that the equation of C is given by u = u(s), v = v(s),\nwhere s is the arc-length parameter of C. Show that geodesic torsion along the curve\nC satisfies\nτg =\n1\n√\nEG −F 2\n\f\f\f\f\f\f\f\f\n\u0012dv\nds\n\u00132\n−du\nds\ndv\nds\n\u0012du\nds\n\u00132\nE\nF\nG\nL\nM\nN\n\f\f\f\f\f\f\f\f\n."}, {"year": "2017", "subject": "Geometry & Topology", "paper": "2017_2017_team", "kind": "team", "n": 4, "chars": 234, "tags": [], "d": 1.38, "text": "Let {ei}i=1,...,n be a basis of a vector space V . Denote by {ωi}i=1,...,n the dual basis\nof {ei}i=1,...,n. Show that the set\n{ωi1 ∧· · · ∧ωir | 1 ≤i1 < i2 < · · · < ir ≤n}\nis a basis of Vr V ∗, where r is a positive integer and r ≤n."}, {"year": "2017", "subject": "Geometry & Topology", "paper": "2017_2017_team", "kind": "team", "n": 5, "chars": 193, "tags": ["微分几何"], "d": 1.22, "text": "Let M →Rn+1 be a compact closed hypersurface in the (n + 1)-dimensional Eu-\nclidean space Rn+1. Prove that M is a hypersphere if M has constant scalar curvature\nand nonnegative Ricci curvature."}, {"year": "2017", "subject": "Geometry & Topology", "paper": "2017_2017_team", "kind": "team", "n": 6, "chars": 185, "tags": ["微分几何", "微分流形/形式"], "d": 1.43, "text": "On a Riemannian manifold, if f is a smooth function such that |gradf| = 1. Show\nthat the integral curves of gradf are geodesics.\n1\n\n \nS.-T. Yau College Student Mathematics Contests 2017"}, {"year": "2017", "subject": "Algebra & Number Theory", "paper": "2017_2017_team", "kind": "team", "n": 1, "chars": 338, "tags": ["群论"], "d": 2.46, "text": "(20 points). Let G be a group and let g ∈G be an element of finite\norder n. Suppose that n is the product of two positive integers r and s which are\ncoprime to each other.\n(a) (10 points) Show that there is a pair (g1, g2) of elements of G such that gr\n1 = 1,\ngs\n2 = 1 and g1g2 = g2g1 = g.\n(b) (10 points) Show that such a pair is unique."}, {"year": "2017", "subject": "Algebra & Number Theory", "paper": "2017_2017_team", "kind": "team", "n": 2, "chars": 256, "tags": ["线性代数/矩阵", "数论"], "d": 2.59, "text": "(20 points). Let p > 2 be a prime number and let T be a linear operator\nof order p on an n-dimensional vector space V over Q.\n(a) (8 points) Show that the trace tr(T) of T on V is an integer in Z.\n(b) (12 points) Show that tr(T) is congruent to n modulo p."}, {"year": "2017", "subject": "Algebra & Number Theory", "paper": "2017_2017_team", "kind": "team", "n": 3, "chars": 330, "tags": ["线性代数/矩阵", "微分流形/形式"], "d": 1.82, "text": "(20 points). Let g be a finite dimensional Lie algebra over C. For each\nx ∈g, define a linear map\nadx : g →g,\ny 7→[x, y].\nPut\nn(x) := the dimension of the kernel of the operator (adx)dim g.\nThe rank of g is defined to be\nrank(g) := min{n(x) | x ∈g}.\nShow that\n{x ∈g | n(x) > rank(g)}\nis the zero set of a polynomial function on g."}, {"year": "2017", "subject": "Algebra & Number Theory", "paper": "2017_2017_team", "kind": "team", "n": 4, "chars": 528, "tags": ["Galois/域扩张", "表示论", "数论"], "d": 3.76, "text": "(20 points). Let p be a prime number and let K = Fp(T) be the field\nof rational functions over Fp. Consider the polynomials\nf(X) = Xp −TX −T,\ng(X) = Xp−1 −T.\n(a) (5 points) Show that f and g are irreducible and separable over K.\n(b) (5 points) Let M be the splitting field of g over K. Show that Gal(M/K) is\nisomorphic to F×\np .\n(c) (10 points) Let L be the splitting field of f over K. Show that g splits in L\nand Gal(L/K) is isomorphic to the semidirect product G = Fp ⋊F×\np , where\nF×\np acts on Fp by homotheties.\nPage 1 of 2"}, {"year": "2017", "subject": "Algebra & Number Theory", "paper": "2017_2017_team", "kind": "team", "n": 5, "chars": 447, "tags": [], "d": 2.62, "text": "(20 points). Let a and b be a pair of coprime positive integers. Let\nN(a, b) be the set of nonnegative integral linear combinations of a and b:\nN(a, b) := {N ∈Z | N = ax + by for some x, y ∈Z≥0}.\n(a) (7 points) Show that every integer N satisfying N ≥a(b−1) belongs to N(a, b).\n(b) (13 points) Show that there are exactly (a −1)(b −1)/2 positive integers not\nbelonging to N(a, b).\nPage 2 of 2\n\n \nS.-T. Yau College Student Mathematics Contests 2017"}, {"year": "2017", "subject": "Computational & Applied", "paper": "2017_2017_team", "kind": "team", "n": 1, "chars": 924, "tags": [], "d": 2.18, "text": "Given an integer parameter K, one can test whether for a vector ⃗u = (u1, . . . , un) ∈\nNn there is non-zero vector ⃗k = (k1, . . . , kn) ∈Zn with\n∥⃗k∥∞≤K and uk1\n1 · · · ukn\nn = 1,\nwhere ∥⃗k∥∞= max1≤i≤n |ki| in about O((2K + 1)n) arithmetic operations with inte-\ngers having about O(nK log(∥⃗u∥∞+1)) bits via testing all possible combinations of the\nexponents (ordered lexicographically) and direct computation.\nAssuming that the memory is essentially unlimited, suggest a better algorithm which\nuses about O((2K + 1)n/2) arithmetic operations with integers of the same size as\nabove.\nHints: (i) Use the divide-and-conquer strategy; (ii) Recall that a list L of M real\nnumbers can be sorted via O(M log M) comparisons; (iii) A sorted list L of M real\nnumbers can be searched for x ∈L via O(log M) comparisons; (iv) To decide whether\na/b > c/d for two rational numbers with b, d > 0 we simply compare the products ad\nand bc."}, {"year": "2017", "subject": "Computational & Applied", "paper": "2017_2017_team", "kind": "team", "n": 2, "chars": 826, "tags": ["代数几何"], "d": 3.52, "text": "We have the following partial differential equation\n(1)\nut = H(u)xx,\n0 ≤x < 1\nwith an initial condition u(x, 0) = f(x) and periodic boundary condition. Here 0 ≤\nH′(u) ≤d. Consider the following one-step, three-point scheme on a uniform mesh\nxj = j∆x with spatial mesh size ∆x:\n(2)\nun+1\nj\n= un\nj + aH(un\nj−1) + bH(un\nj ) + cH(un\nj+1),\nwhere a, b, c are constants which may depend on the mesh ratio µ =\n∆t\n∆x2, ∆t is the\ntime step, and un\nj approximates the exact solution at u(xj, tn) with tn = n∆t.\n(1) Find the constants a, b, c such that the scheme (2) is second order accurate.\n(2) Find the CFL number µ0 such that the scheme (2), with the constants deter-\nmined by Step 1 above, is stable under the time step restriction µ ≤µ0. Please\nspecify which norm you are using for stability, and prove this stability result.\n1\n\n \n2"}, {"year": "2017", "subject": "Computational & Applied", "paper": "2017_2017_team", "kind": "team", "n": 3, "chars": 998, "tags": ["代数几何"], "d": 3.19, "text": "Consider the problem describing projectile motion on the surface of the Earth,\nwritten in physical variables as follows:\nd2y\ndt2 = −\nGM\n(R + y)2,\ny(0) = 3m,\ny′(0) = −V m/sec\nLet y(t) = L˜y(˜t) and t = T˜t. Consider two out of the following four cases:\n(a): R = O(1), V →∞, M = O(1): the fast projectile limit\n(b): R = O(1), V = O(1), M →∞: the dense Earth limit\n(c): R = O(1), V = O(1), M →0: the light Earth limit\n(d): R →0, V = O(1), M = O(1): the small Earth limit (two possible scalings,\ndetermine both)\nIn each case:\n• Choose your scalings for L, T to normalize as many terms as possible. Pick your\nscalings so that the time it takes for the projectile to fall to ˜y = 0 is ˜t = O(1).\n• Write the scaled (normalized) problem, identify all remaining dimensionless\nparameters.\n• Identify a limiting small parameter and the leading order problem.\nNote: DO NOT solve-out the problems, just write them!\nHint: If any scaled coefficients blow-up in the leading order problem, the scaling is\nnot good."}, {"year": "2017", "subject": "Computational & Applied", "paper": "2017_2017_team", "kind": "team", "n": 4, "chars": 1482, "tags": ["数值分析"], "d": 4.36, "text": "Let f be an arbitrary function in Cn(R). Given n distinct points x1, x2, · · · , xn ∈R\nand an extra point x0 ∈R, we want to approximate f ′(x0) using a linear combina-\ntion of the function values at x1, x2, · · · , xn, i.e. we want to compute the coefficients\nc1, c2, · · · , cn such that\nf ′(x0) ≈c1f(x1) + c2f(x2) + · · · + cnf(xn)\nin some sense.\n(a) Consider the undetermined coefficients method. You use Taylor expansion to\nexpand each f(xi), i = 1, 2, · · · , n about the point x0,\nf(xi) =\nn−1\nX\nk=0\n1\nk!f (k)(x0)(xi −x0)k + 1\nn!f (n)(ξi)(xi −x0)n,\nξi ∈[x0, xi] or [xi, x0],\nand choose the coefficients so that the resulting approximation is as accurate\nas possible. This gives you the linear system\n1\nk!\nn\nX\ni=1\nci(xi −x0)k = δk,1,\nk = 0, 1, · · · , n −1,\nwhere δk,1 = 1 if k = 1; otherwise δk,1 = 0. Explain why this linear system\nis nonsingular. Then use this method to solve the case when n = 3, x1 = x0,\nx2 = x0 + h, x3 = x0 + 2h for some constant h.\n\n \n3\n(b) You can also make use of interpolation method. Consider the n-point interpo-\nlating polynomial\np(x) =\nn\nX\ni=1\n³\nn\nY\nj=1,j̸=i\nx −xj\nxi −xj\n´\nf(xi),\nand the approximation is given by\nf ′(x0) ≈p′(x0).\nThis gives the coefficients as\nci =\n³\nn\nY\nj=1,j̸=i\nx −xj\nxi −xj\n´′¯¯¯\nx=x0.\nShow that the approximation of this method is exact if f is a polynomial of\ndegree no more than n −1.\n(c) Show that the two methods given in (a) and (b) are essentially the same, i.e.\nthe coefficients obtained in (a) and (b) are the same."}, {"year": "2017", "subject": "Computational & Applied", "paper": "2017_2017_team", "kind": "team", "n": 5, "chars": 140, "tags": [], "d": 1.13, "text": "Let\nA =\n\n\n2\n−1\n−1\n2\n−1\n...\n−1\n2\n−1\n−1\nγ\n\n\nFind A−1 explicitly. Show that all entries of A−1 are nonnegative if and only if γ ≥1."}, {"year": "2017", "subject": "Algebra & Number Theory", "paper": "2017_algebra2017_individual", "kind": "individual", "n": 1, "chars": 446, "tags": ["群论", "环与模", "数论"], "d": 3.54, "text": "(20 points). Let Qp denote the field of p-adic numbers and let Zp denote\nthe ring of p-adic integers (p is a prime number).\n(a) (5 points) Show that for every integer k ≥0, (p−kZp)/Zp ∼= Z/pkZ as abelian\ngroups.\n(b) (5 points) Determine the endomorphism ring of the abelian group (p−kZp)/Zp\n(k ≥0).\n(c) (5 points) Determine the endomorphism ring of the abelian group Qp/Zp.\n(d) (5 points) Determine the endomorphism ring of the abelian group Q/Z."}, {"year": "2017", "subject": "Algebra & Number Theory", "paper": "2017_algebra2017_individual", "kind": "individual", "n": 2, "chars": 298, "tags": ["群论"], "d": 2.45, "text": "(20 points). Let A be a finite abelian group and let φ : A →A be an\nendomorphism. Put\nAnil := {x ∈A | φk(x) = 0 for some k ≥1}.\n(a) (15 points) Show that there is a subgroup A0 of A such that φ restricts to an\nautomorphism of A0 and A = A0 ⊕Anil.\n(b) (5 points) Show that such a subgroup is unique."}, {"year": "2017", "subject": "Algebra & Number Theory", "paper": "2017_algebra2017_individual", "kind": "individual", "n": 3, "chars": 446, "tags": ["Galois/域扩张"], "d": 3.13, "text": "(20 points). Let L/F be a Galois field extension, not necessarily finite.\nLet x ∈L.\n(a) (6 points) Show that the set P of subextensions of L/F not containing x has\na maximal element E. Let K/E be a nontrivial finite extension contained in\nL. Show that x ∈K.\n(b) (6 points) Let K′ be the Galois closure of K/E in L. Show that there exists\ng ∈G = Gal(K′/E) such that gx ̸= x.\n(c) (8 points) Deduce that K/E is a cyclic Galois extension.\nPage 1 of 2"}, {"year": "2017", "subject": "Algebra & Number Theory", "paper": "2017_algebra2017_individual", "kind": "individual", "n": 4, "chars": 584, "tags": ["数论"], "d": 2.83, "text": "(20 points). The goal of this problem is to prove the Chevalley-Warning\ntheorem. Let p be a prime number and q a power of p.\n(a) (8 points) Let 0 ≤a < q −1 be an integer. Show that S(Xa) := P\nx∈Fq xa\nequals 0. Here we adopt the convention x0 = 1 in Fq even for x = 0.\n(b) (12 points) Let f1, . . . , fm ∈Fq[X1, . . . , Xn] be polynomials in n variables\nsatisfying\nm\nX\ni=1\ndeg(fi) < n.\nShow that P = Qm\ni=1(1 −f q−1\ni\n) satisfies\nS(P) :=\nX\n(x1,...,xn)∈Fnq\nP(x1, . . . , xn) = 0.\nDeduce that p divides the cardinality of the set\nV = {(x1, . . . , xn) ∈Fn\nq | fi(x1, . . . , xn) = 0\n∀i}."}, {"year": "2017", "subject": "Algebra & Number Theory", "paper": "2017_algebra2017_individual", "kind": "individual", "n": 5, "chars": 574, "tags": ["群论", "线性代数/矩阵"], "d": 3.01, "text": "(20 points). In this problem, all matrices are n×n with complex entries.\nLet U and V be matrices such that UV ̸= V U. Assume that U is diagonalizable\nand commutes with V UV −1.\n(a) (10 points) For λ, µ ∈C, let\nEλ,µ = {x ∈Cn | Ux = λx,\nV UV −1x = µx}.\nShow that there exist couples (λ1, µ1) ̸= (λ2, µ2), satisfying λi ̸= µi and\nEλi,µi ̸= 0 for i = 1, 2.\n(b) (10 points) For a matrix A, we define N(A) := tr(A∗A), where A∗= ¯AT is\nthe conjugate transpose of A. Assume that U and V are unitary (namely,\nU ∗U = V ∗V is the identity matrix). Deduce that N(1 + V ) ≥4.\nPage 2 of 2"}, {"year": "2017", "subject": "Analysis & PDE", "paper": "2017_analysis2017_individual", "kind": "individual", "n": 1, "chars": 141, "tags": [], "d": 1.21, "text": "Suppose f is integrable on [−π, π], prove that Σ∞\nn=−∞anr|n|einx tends to f(x) for a.e.\nx, as r →1, r < 1. Here an =\n1\n2π\nR π\n−π f(x)e−inxdx."}, {"year": "2017", "subject": "Analysis & PDE", "paper": "2017_analysis2017_individual", "kind": "individual", "n": 2, "chars": 575, "tags": ["泛函分析"], "d": 2.81, "text": "Let H be a Hilbert space equipped with an inner product (.,.) and a norm ||.|| =\n(., .)\n1\n2. A sequence {fk} is converge to f ∈H if ||fk −f|| →0. A sequence {fk} ⊂H\nis said converge weakly to f ∈H if (fk, g) →(f, g) for any g ∈H. Prove the following\nstatements:\na) {fk} converges to f if and only if ||fk|| →||f|| and {fk} converges weakly to f.\nb) If H is a finite dimensional Hilbert space, then the weak convergence implies con-\nvergence. Give a counter example to show that weak convergence does not necessarily\nimply convergence in an infinite dimensional Hilbert space."}, {"year": "2017", "subject": "Analysis & PDE", "paper": "2017_analysis2017_individual", "kind": "individual", "n": 3, "chars": 115, "tags": ["复分析"], "d": 1.18, "text": "Let f : C/{0} →C be a holomorphic function and\n|f(z)| ≤|z|2 +\n1\n|z|1/2,\nfor z near 0. Determine all such functions."}, {"year": "2017", "subject": "Analysis & PDE", "paper": "2017_analysis2017_individual", "kind": "individual", "n": 4, "chars": 98, "tags": ["复分析"], "d": 1.16, "text": "Find a conformal mapping which maps the region {z||z −i| <\n√\n2, |z + i| <\n√\n2}\nonto the unit disk."}, {"year": "2017", "subject": "Analysis & PDE", "paper": "2017_analysis2017_individual", "kind": "individual", "n": 5, "chars": 212, "tags": ["调和/位势"], "d": 1.31, "text": "If E is a compact set in a region Ω, prove that there exists a constant M > 0,\ndepending only on E and Ω, such that every positive harmonic function u(z) in Ω\nsatisfies u(z2) ≤Mu(z1) for any two points z1, z2 ∈E."}, {"year": "2017", "subject": "Analysis & PDE", "paper": "2017_analysis2017_individual", "kind": "individual", "n": 6, "chars": 558, "tags": ["泛函分析"], "d": 2.0, "text": "1) For any bounded domain Ω⊂Rn, there exists a smallest constant C(Ω), such\nthat\nZ\nΩ\n|u|2dx ≤C(Ω)\nZ\nΩ\nΣn\ni=1| ∂u\n∂xi\n|2dx\nfor every function u ∈H1\n0(Ω) = C∞\n0 (Ω) ⊂H1(Ω), where C∞\n0 (Ω) is the space of\nsmooth functions over Ωand vanishing on boundary of Ωand H1(Ω) is the Banach\nspace of functions u ∈L2(Ω), ∇u ∈L2(Ω)⊗n with the norm:\n||u||2\nH1(Ω) = ||u||2\nL2(Ω) + ||∇u||2\nL2(Ω)⊗n\n=\nZ\nΩ\n(|u|2 + Σn\ni=1| ∂u\n∂xi\n|2)dx.\nH1\n0(Ω) is the completion of C∞(Ω) in H1(Ω) with the above norm.\n2) Let Π = {(x, y)|0 < x < a, 0 < y < b}, show that C(Π) ≥\na2b2\nπ2(a2+b2).\n1"}, {"year": "2017", "subject": "Computational & Applied", "paper": "2017_applied2017_individual", "kind": "individual", "n": 1, "chars": 168, "tags": [], "d": 1.19, "text": "The Chebyshev polynomial of the first kind is defined on [−1, 1] by\nTn(x) = cos(n arccos x).\nProve: The envelope for the extremals of Tn+1(x) −Tn−1(x) forms an ellipse."}, {"year": "2017", "subject": "Computational & Applied", "paper": "2017_applied2017_individual", "kind": "individual", "n": 2, "chars": 453, "tags": [], "d": 2.54, "text": "Consider a fixed point iteration\nxn = g(xn−1),\nwhere g : R →R is a smooth function. Suppose this fixed point method does converge\nto a fixed point x∗. The Steffensen algorithm is an acceleration method to find x∗\nwhich reads\nˆxn = xn−2 −\n(xn−1 −xn−2)2\nxn −2xn−1 + xn−2\n.\nor\nxn+1 = G(xn)\nwhere\nG(x) = x −\n(g(x) −x)2\ng(g(x)) −2g(x) + x.\n(a) Show that the Steffensen algorithm {xk} converges quadratically.\n(b) Can you extend this method to two dimensions?"}, {"year": "2017", "subject": "Computational & Applied", "paper": "2017_applied2017_individual", "kind": "individual", "n": 3, "chars": 589, "tags": [], "d": 2.29, "text": "We consider a piecewise smooth function\nf(x) =\n½\nf1(x),\nx ≤0,\nf2(x),\nx > 0\nwhere f1(x) is a C∞function on (−∞, 0] and f2(x) is a C∞function on [0, ∞), but\nf1(0) ̸= f2(0). Suppose p(x) is a k-th degree polynomial (k ≥1) interpolating f(x) at\nk + 1 equally-spaced grid points xj, j = 0, 1, 2, · · · , k with xi < 0 < xi+1 for some i\nbetween 0 and k −1. Prove that, when the grid size h = xj+1 −xj is small enough,\np′(x) ̸= 0 for xi ≤0 ≤xi+1, that is, p(x) is monotone in the interval [xi, xi+1]. (Hint:\nfirst prove the case when f1(x) = c1, f2(x) = c2 and c1 ̸= c2 are two constants.)\n1\n\n \n2"}, {"year": "2017", "subject": "Computational & Applied", "paper": "2017_applied2017_individual", "kind": "individual", "n": 4, "chars": 1229, "tags": ["线性代数/矩阵", "代数几何", "经典场论/相对论"], "d": 4.46, "text": "Let b ∈Rn. Suppose A ∈Mn×n(R) and B ∈Mn×n(R) are two n × n matrices. Let\nA to be non-singular.\n(a) Consider the iterative scheme: Axk+1 = b −Bxk.\nState and prove the necessary and sufficient condition for the iterative scheme to\nconverge.\n(b) Suppose the spectral radius of A−1B satisfies ρ(A−1B) = 0. Prove that the iterative\nscheme converges in n iterations.\n(c) Consider the following iterative scheme:\nx(k+1) = ω1x(k) + ω2(c1 −Mx(k)) + ω3(c2 −Mx(k)) + ... + ωk(ck−1 −Mx(k))\nwhere M is symmetric and positive definite, ω1 > 1, ω2, ..., ωk > 0 and c1, ..., ck−1 ∈\nRn. Deduce from (a) that the iterative scheme converges if and only if all eigen-\nvalues of M (denote it as λ(M)) satisfies:\n(ω1 −1)/(\nk\nX\ni=2\nωi) < λ(M) < (ω1 + 1)/(\nk\nX\ni=2\nωi).\n(d) Let A be non-singular. Now, consider the following system of iterative scheme (*):\nAx(k+1)\n1\n= b1 −Bx(k)\n2 ,\nAx(k+1)\n2\n= b2 −Bx(k)\n1\nFind and prove the necessary and sufficient condition for the iterative scheme (*)\nto converge.\nFor the iterative scheme (**):\nAx(k+1)\n1\n= b1 −Bx(k)\n2 ,\nAx(k+1)\n2\n= b2 −Bx(k+1)\n1\nFind and prove the necessary and sufficient condition for the iterative scheme (**)\nto converge. Compare the rate of convergence of the iterative schemes (*) and (**)."}, {"year": "2017", "subject": "Computational & Applied", "paper": "2017_applied2017_individual", "kind": "individual", "n": 5, "chars": 1365, "tags": ["数论", "偏微分方程", "代数几何", "数值分析"], "d": 4.78, "text": "Consider the differential equation\n−u′′ + αu = f, x ∈(0, 1).\nHere, prime denotes for d/dx and α is a constant. We consider a mixed boundary\ncondition\nu(0) = 0, u′(1) −bu(0) = 0.\nThis equation is approximated by a standard finite difference method:\n−Uj−1 + 2Uj −Uj+1\nh2\n+ αUj = fj, j = 1, ..., N −1.\nHere, N is the number of grid points, h = 1/N is the mesh size, Uj is the approximate\nsolution at xj := jh, and fj = f(xj). The noundary condition is approximated by\nU0 = 0, UN −UN−1\nh\n−bUN = 0.\n\n \n3\nThe resulting linear system is AU = F with\n\n\nβ\n−1\n0\n· · ·\n−1\nβ\n−1\n· · ·\n...\n−1\nβ\n−1\n0\n−1\n1 −bh\n\n\n\n\nU1\nU2...\nUN−1\nUN\n\n\n=\n\n\nh2f1\nh2f2\n...\nh2fN−1\n0\n\n\nwhere β = 2 + αh2.\nut + aux = 0, a > 0.\nWe discretize this PDE by For solving the following partial differential equation\n(1)\nut + f(u)x = 0,\n0 ≤x ≤1\nwhere f ′(u) ≥0, with periodic boundary condition, we can use the following semi-\ndiscrete upwind scheme\n(2)\nd\ndtuj + f(uj) −f(uj−1)\n∆x\n= 0,\nj = 1, 2, · · · , N,\nwith periodic boundary condition\n(3)\nu0 = uN,\nwhere uj = uj(t) approximates u(
